<script type="text/plain" id="content-security">
## ১. Security Basics

### Web security কী? কেন গুরুত্বপূর্ণ?
Web application কে অননুমোদিত access, data চুরি, নষ্ট করা বা সেবা বন্ধ করে দেওয়া থেকে রক্ষা করার অনুশীলন। একটি ভুলে user এর ব্যক্তিগত data ফাঁস, আর্থিক ক্ষতি, আইনি সমস্যা ও বিশ্বাস হারানো হতে পারে।

নিরাপত্তা শুধু backend এর কাজ নয়। Frontend, backend, database, infrastructure ও process সব স্তরে লাগে।

### CIA triad কী?
নিরাপত্তার তিনটি মূল লক্ষ্য:

- **Confidentiality** (গোপনীয়তা): শুধু অনুমোদিত ব্যক্তি data দেখতে পারবে (encryption, access control)
- **Integrity** (অখণ্ডতা): data অননুমোদিতভাবে বদলানো যাবে না (hash, signature, validation)
- **Availability** (প্রাপ্যতা): সেবা প্রয়োজনের সময় পাওয়া যাবে (DDoS সুরক্ষা, backup, redundancy)

### Vulnerability, threat, risk আর exploit এর পার্থক্য কী?
- **Vulnerability**: system এর দুর্বলতা (যেমন SQL injection এর সুযোগ)
- **Threat**: সেই দুর্বলতা কাজে লাগাতে পারে এমন কিছু/কেউ (আক্রমণকারী)
- **Exploit**: দুর্বলতা কাজে লাগানোর পদ্ধতি/code
- **Risk**: ক্ষতির সম্ভাবনা × প্রভাব

### OWASP কী? OWASP Top 10 কী?
OWASP (Open Worldwide Application Security Project) একটি অলাভজনক সংস্থা। **OWASP Top 10** হলো web application এর সবচেয়ে গুরুতর ও সাধারণ নিরাপত্তা ঝুঁকির তালিকা, যা সবার জানা দরকার।

২০২১ সংস্করণ (সবচেয়ে সুপরিচিত):

- **A01 Broken Access Control**: অনুমতির ভুল ব্যবস্থা (IDOR, অন্যের data দেখা)
- **A02 Cryptographic Failures**: দুর্বল বা অনুপস্থিত এনক্রিপশন, সংবেদনশীল data ফাঁস
- **A03 Injection**: SQL/NoSQL/command injection, XSS
- **A04 Insecure Design**: ডিজাইন স্তরের ত্রুটি
- **A05 Security Misconfiguration**: ভুল/ডিফল্ট কনফিগারেশন
- **A06 Vulnerable and Outdated Components**: পুরোনো, দুর্বল library
- **A07 Identification and Authentication Failures**: দুর্বল login ও session
- **A08 Software and Data Integrity Failures**: যাচাই ছাড়া update/dependency/CI আস্থা
- **A09 Security Logging and Monitoring Failures**: log ও নজরদারি অভাব
- **A10 Server-Side Request Forgery (SSRF)**

OWASP এর নতুন (২০২৫) সংস্করণ প্রকাশিত হয়েছে এবং তালিকায় কিছু পরিবর্তন এসেছে, তাই interview এর আগে owasp.org এ দেখে নিন।

### Defense in depth কী?
একাধিক স্তরের সুরক্ষা, যাতে একটি ভেঙে গেলেও বাকিগুলো রক্ষা করে। উদাহরণ: client validation + server validation + parameterized query + database এ least privilege user + WAF + monitoring। একটি মাত্র ঢালের উপর ভরসা করবেন না।

### Least privilege নীতি কী?
প্রতিটি user, service ও process কে কাজের জন্য **ন্যূনতম দরকারি অনুমতি** দেওয়া। যেমন app এর database user কে `DROP TABLE` এর অধিকার না দেওয়া, প্রতিটি microservice কে শুধু নিজের দরকারি resource এ access। ক্ষতি সীমিত রাখে।

### "Never trust the client" মানে কী?
Browser এ যা কিছু চলে, user তা বদলাতে বা বাদ দিতে পারে (DevTools, curl, Postman)। তাই client এর validation, লুকানো button, hidden field, আসা দাম বা role কখনো বিশ্বাস করা যাবে না। **সব গুরুত্বপূর্ণ যাচাই server এ।** Client validation শুধু user experience এর জন্য।

### Security through obscurity কেন যথেষ্ট নয়?
কিছু লুকিয়ে রাখা (যেমন `/secret-admin` URL) নিরাপত্তা নয়, কারণ আক্রমণকারী তা খুঁজে পেতে পারে। আসল সুরক্ষা authentication ও authorization। লুকানো বাড়তি স্তর হতে পারে, কিন্তু একমাত্র ভরসা নয়।

### Threat modeling ও STRIDE কী?
Feature বানানোর আগে "কী ভুল হতে পারে?" নিয়ে পরিকল্পিত ভাবনা। **STRIDE**:

- **S**poofing (ভুয়া পরিচয়)
- **T**ampering (data বদলানো)
- **R**epudiation (অস্বীকার করা, log লাগে)
- **I**nformation disclosure (data ফাঁস)
- **D**enial of service
- **E**levation of privilege (অনুমতি বাড়িয়ে নেওয়া)

### Zero trust কী?
"কাউকে স্বাভাবিকভাবে বিশ্বাস করো না, প্রতিটি request যাচাই করো", এমনকি ভেতরের network থেকেও। প্রতিবার পরিচয় ও অনুমতি যাচাই, ন্যূনতম access, সব কিছুর নজরদারি।

### Shift-left security ও DevSecOps কী?
নিরাপত্তাকে একদম শেষে না ভেবে development এর **শুরু থেকেই** (design, code, CI/CD) যুক্ত করা। CI pipeline এ স্বয়ংক্রিয় নিরাপত্তা পরীক্ষা (dependency scan, SAST, secret scan) থাকলে একে DevSecOps বলে।

## ২. Frontend Security

### XSS (Cross-Site Scripting) কী? কত ধরনের?
আক্রমণকারী পেজে ক্ষতিকর JavaScript ঢুকিয়ে দেয়, যা ভুক্তভোগীর browser এ চলে। এটি দিয়ে token/cookie চুরি, ভুয়া form দেখানো, user এর হয়ে কাজ করা সম্ভব।

- **Stored XSS**: ক্ষতিকর script database এ সংরক্ষিত হয় (comment, profile)। সবচেয়ে বিপজ্জনক।
- **Reflected XSS**: script URL/request এ থাকে, response এ সরাসরি ফিরে আসে (search query)।
- **DOM-based XSS**: server এর বদলে client এর JS ই অনিরাপদভাবে DOM এ বসায় (`innerHTML`, `location.hash`)।

### XSS কীভাবে প্রতিরোধ করবে?
- User input **output এ escape** করা (HTML context অনুযায়ী)
- `innerHTML`, `document.write`, `eval` এড়ানো, `textContent` ব্যবহার
- HTML দেখাতে হলে **sanitize** (`DOMPurify`)
- **Content Security Policy (CSP)** header
- Token `HttpOnly` cookie তে (XSS হলেও চুরি যায় না)
- `dangerouslySetInnerHTML` এড়ানো বা sanitize করে ব্যবহার
- Framework এর auto-escaping এর উপর ভরসা, কিন্তু তার বাইরের পথ (নিচে) সাবধানে
- Library ও dependency আপডেট রাখা

### React কি XSS থেকে নিজে নিজে রক্ষা করে? কোথায় ঝুঁকি থেকে যায়?
React `{}` এর ভেতরের মান **স্বয়ংক্রিয়ভাবে escape** করে, তাই সাধারণ ক্ষেত্রে নিরাপদ। ঝুঁকি থাকে:

- `dangerouslySetInnerHTML` (raw HTML বসায়)
- `href={userInput}` এ `javascript:alert(1)` ধরনের URL
- সরাসরি DOM (`ref.current.innerHTML`)
- `eval`/`new Function`
- Server থেকে আসা JSON কে `<script>` এ বসানো (SSR)
- তৃতীয় পক্ষের library বা সংক্রামিত script

```jsx
// বিপজ্জনক
<div dangerouslySetInnerHTML={{ __html: userComment }} />
<a href={userUrl}>link</a>            // userUrl = "javascript:..." হতে পারে

// নিরাপদ
import DOMPurify from "dompurify";
<div dangerouslySetInnerHTML={{ __html: DOMPurify.sanitize(userComment) }} />
const safe = /^https?:\/\//.test(userUrl) ? userUrl : "#";
```

### Content Security Policy (CSP) কী?
HTTP header যা browser কে বলে কোন উৎস (source) থেকে script, style, image লোড করা যাবে। ক্ষতিকর inline script চালানো বা অচেনা domain এ data পাঠানো আটকায়। XSS এর **দ্বিতীয় প্রতিরক্ষা স্তর**।

```
Content-Security-Policy:
  default-src 'self';
  script-src 'self' 'nonce-abc123';
  style-src 'self' 'unsafe-inline';
  img-src 'self' data: https:;
  object-src 'none';
  base-uri 'self';
  frame-ancestors 'none';
```

- `'unsafe-inline'`/`'unsafe-eval'` এড়ান, বদলে **nonce** বা hash
- প্রথমে `Content-Security-Policy-Report-Only` এ চালিয়ে দেখুন কী ভাঙছে
- Next.js এ middleware এ প্রতি request এ nonce তৈরি করা যায়

### CSRF (Cross-Site Request Forgery) কী? কীভাবে ঠেকাবে?
User login থাকা অবস্থায় অন্য ক্ষতিকর site থেকে তার নামে request পাঠানো, কারণ browser cookie নিজে থেকে জুড়ে দেয়।

প্রতিরোধ:

- **`SameSite=Lax/Strict`** cookie (প্রধান ঢাল)
- **CSRF token** (synchronizer বা double-submit cookie)
- `Origin`/`Referer` header যাচাই
- State বদলানো কাজে `GET` ব্যবহার না করা
- Custom header (যেমন `X-Requested-With`) চাওয়া, যা cross-site form পাঠাতে পারে না

`Authorization: Bearer` header এ token থাকলে CSRF সাধারণত সমস্যা নয় (browser নিজে header জোড়ে না), কিন্তু তখন XSS এ token চুরির ঝুঁকি থাকে।

### Clickjacking কী? কীভাবে ঠেকাবে?
ক্ষতিকর site আপনার পেজকে স্বচ্ছ `iframe` এ লুকিয়ে রেখে user কে ভুল জায়গায় click করায় (যেমন "Delete account" এ)। প্রতিরোধ: `Content-Security-Policy: frame-ancestors 'none'` (বা `'self'`) এবং পুরোনো browser এর জন্য `X-Frame-Options: DENY`।

### Frontend এ API key বা secret রাখা যায় কি?
**না।** Browser এ যা পাঠানো হয় (JS bundle, `NEXT_PUBLIC_*`, `VITE_*` env) সবই public, যে কেউ দেখতে পারে। গোপন key (database, payment secret, third-party secret) কখনো frontend এ নয়।

- গোপন key এর কাজ **backend (API route/Server Action)** দিয়ে proxy করুন
- Public key (যেমন Stripe publishable, Google Maps) হলে **domain/IP/API restriction** দিন
- Git এ `.env` commit করবেন না

### Source map production এ কেন সমস্যা হতে পারে?
Source map আপনার আসল source code (কমেন্ট, logic, কখনো key) আক্রমণকারীকে সহজে দেখিয়ে দেয়। Production এ public source map বন্ধ রাখুন, বা error tracking (Sentry) এ private ভাবে upload করুন।

### Third-party script ও npm package নিরাপত্তা (supply chain) কীভাবে নিশ্চিত করবে?
- `npm audit`, Dependabot/Renovate দিয়ে দুর্বলতা নজরদারি
- **Lockfile** commit এবং CI তে `npm ci`
- অপরিচিত বা অচল (unmaintained) package এড়ানো, নাম ভুল করানো (typosquatting) থেকে সাবধান
- `postinstall` script এর ঝুঁকি, প্রয়োজনে `--ignore-scripts`
- CDN এর script এ **Subresource Integrity (SRI)**
- তৃতীয় পক্ষের analytics/chat script সীমিত রাখা, CSP দিয়ে সীমানা
- npm ও GitHub account এ 2FA

সাম্প্রতিক বছরগুলোতে npm এ বড় supply-chain আক্রমণ ঘটেছে, তাই এটি আজ গুরুত্বপূর্ণ প্রশ্ন।

### Subresource Integrity (SRI) কী?
CDN থেকে আনা script/style এ `integrity` hash দিলে browser file টি বদলে গেছে কিনা যাচাই করে, বদলালে লোড করে না।

```html
<link rel="stylesheet" href="https://cdn.example.com/lib.css"
      integrity="sha384-..." crossorigin="anonymous">
<!-- script tag এও একই: src, integrity, crossorigin attribute -->
```

### Open redirect কী? কীভাবে এড়াবে?
`/login?returnTo=https://evil.com` এ login এর পর user কে বাইরের ক্ষতিকর site এ পাঠিয়ে দেওয়া, যা phishing এ ব্যবহার হয়। প্রতিরোধ: redirect শুধু নিজের site এর **relative path** এ অনুমোদন, বা allowlist।

```js
function safeReturnTo(url) {
  return url && url.startsWith("/") && !url.startsWith("//") ? url : "/";
}
```

### `target="_blank"` এ `rel="noopener noreferrer"` কেন?
`noopener` ছাড়া নতুন tab এর পেজ `window.opener` দিয়ে মূল tab এর location বদলে দিতে পারত (tabnabbing)। আধুনিক browser এ `_blank` এ `noopener` ডিফল্ট ধরা হয়, তবু লেখা ভালো অভ্যাস। `noreferrer` Referer header ও লুকায়।

### Same-Origin Policy কী? CORS কীভাবে সম্পর্কিত?
**Same-Origin Policy**: এক origin (protocol + domain + port) এর script অন্য origin এর data পড়তে পারে না, browser এ বাধ্যতামূলক। **CORS** হলো server কে নিয়ন্ত্রিতভাবে এই নিয়ম শিথিল করার উপায় (`Access-Control-Allow-Origin`)।

গুরুত্বপূর্ণ: CORS শুধু **browser** এ প্রযোজ্য। এটা server কে সুরক্ষা দেয় না (curl/Postman এর উপর কোনো প্রভাব নেই), তাই authentication ও authorization লাগবেই।

### `postMessage` ও `iframe` নিরাপদে কীভাবে ব্যবহার করবে?
- `postMessage` এ পাঠানোর সময় নির্দিষ্ট `targetOrigin` (`"*"` নয়)
- গ্রহণের সময় `event.origin` যাচাই
- অবিশ্বাস্য content `iframe sandbox` attribute দিয়ে সীমিত করা
- প্রয়োজনের বেশি অনুমতি (`allow-scripts allow-same-origin` একসাথে) এড়ানো

### Client-side validation ও server-side validation এর ভূমিকা কী?
- **Client**: দ্রুত feedback, ভালো UX। কিন্তু নিরাপত্তা নয়, কারণ সহজে এড়ানো যায়।
- **Server**: আসল সুরক্ষা। সব input আবার যাচাই (type, দৈর্ঘ্য, ফরম্যাট, পরিসর)।

দুটোই দরকার, কিন্তু শুধু server টি নিরাপত্তা দেয়।

### Frontend এ authentication token সংরক্ষণ নিয়ে সংক্ষেপে কী বলবে?
সংবেদনশীল token `HttpOnly, Secure, SameSite` cookie তে রাখা সবচেয়ে নিরাপদ, কারণ `localStorage` এ XSS হলে সহজে চুরি যায়। (বিস্তারিত "Authentication ও Authorization" tab এ।)

### HTTPS, HSTS ও mixed content কী?
- **HTTPS**: যোগাযোগ এনক্রিপ্টেড (TLS)। man-in-the-middle ঠেকায়।
- **HSTS** (`Strict-Transport-Security`): browser কে বলে এই site এ সবসময় HTTPS ব্যবহার করতে, downgrade আক্রমণ আটকায়।
- **Mixed content**: HTTPS পেজে HTTP resource (script/image) লোড করা। browser ব্লক করে বা সতর্ক করে।

### কোন security header গুলো frontend/web server এ দেবে?
- `Content-Security-Policy`: script/resource এর উৎস সীমিত (XSS)
- `Strict-Transport-Security`: সবসময় HTTPS
- `X-Content-Type-Options: nosniff`: MIME type অনুমান বন্ধ
- `X-Frame-Options: DENY` / CSP `frame-ancestors`: clickjacking
- `Referrer-Policy: strict-origin-when-cross-origin`: Referer এ কতটা URL যাবে
- `Permissions-Policy`: camera, mic, geolocation ইত্যাদি সীমিত
- `Cross-Origin-Opener-Policy` / `Cross-Origin-Resource-Policy`: cross-origin আইসোলেশন

```js
// next.config.js
module.exports = {
  async headers() {
    return [{
      source: "/(.*)",
      headers: [
        { key: "Strict-Transport-Security", value: "max-age=63072000; includeSubDomains; preload" },
        { key: "X-Content-Type-Options", value: "nosniff" },
        { key: "X-Frame-Options", value: "DENY" },
        { key: "Referrer-Policy", value: "strict-origin-when-cross-origin" },
        { key: "Permissions-Policy", value: "camera=(), microphone=(), geolocation=()" },
      ],
    }];
  },
};
```

### Next.js এ নিরাপত্তা সংক্রান্ত বিশেষ বিষয় কী কী?
- `NEXT_PUBLIC_` env browser এ যায়, secret এ ব্যবহার করবেন না
- **Server Action public POST endpoint**, ভেতরে auth ও validation লাগে
- Middleware একমাত্র সুরক্ষা নয় (সময়ে সময়ে framework এ দুর্বলতা ধরা পড়ে, যেমন middleware bypass), তাই data এর কাছে যাচাই (Data Access Layer)
- `server-only` package দিয়ে secret code client bundle থেকে দূরে রাখা
- `dangerouslySetInnerHTML` ও `next/image` এর `remotePatterns` সীমিত রাখা
- Framework ও dependency নিয়মিত আপডেট

### Prototype pollution কী?
আক্রমণকারী `__proto__` বা `constructor.prototype` এ property বসিয়ে সব object এ অনাকাঙ্ক্ষিত মান ঢুকিয়ে দেয়। সাধারণত অনিরাপদ deep merge/clone বা `Object.assign` ধরনের কাজে হয়। প্রতিরোধ: user input থেকে আসা key যাচাই (`__proto__`, `constructor`, `prototype` বাদ), `Object.create(null)`, `Map` ব্যবহার, library আপডেট (lodash পুরোনো version)।

### File upload এর ক্ষেত্রে frontend এ কী করা যায়? (এবং সীমাবদ্ধতা)
- File type ও size আগে যাচাই করে দ্রুত feedback দেওয়া (`accept`, `file.size`)
- Preview এর সময় `URL.createObjectURL` ও পরে `revokeObjectURL`

এগুলো শুধু UX। আসল সুরক্ষা server এ (পরের সেকশনে)। Client এর MIME type/extension বিশ্বাসযোগ্য নয়।

### Sensitive data URL, log বা browser storage এ রাখলে কী সমস্যা?
- URL এ (token, password, personal data) browser history, server log, Referer header ও share করা লিংকে ফাঁস হয়
- Console log এ থেকে গেলে শেয়ার করা screenshot এ ফাঁস
- `localStorage`/`sessionStorage` এ থাকলে XSS এ চুরি

সংবেদনশীল data URL এ রাখবেন না, `POST` body বা cookie ব্যবহার করুন।

### Bot ও spam থেকে form কীভাবে বাঁচাবে?
CAPTCHA/Turnstile/reCAPTCHA, honeypot field, rate limiting, email verification, ও server এ validation। শুধু frontend এ CAPTCHA যথেষ্ট নয়, token server এ যাচাই করতে হয়।

## ৩. Backend Security

### SQL injection কী? কীভাবে প্রতিরোধ করবে?
User input কে সরাসরি SQL string এ জুড়ে দিলে আক্রমণকারী নিজের SQL চালিয়ে দিতে পারে (data চুরি, মোছা, login bypass)।

```js
// বিপজ্জনক
db.query(`SELECT * FROM users WHERE email = '${email}'`);
// email = ' OR '1'='1  হলে সব user বেরিয়ে আসে

// নিরাপদ: parameterized query
db.query("SELECT * FROM users WHERE email = $1", [email]);
```

প্রতিরোধ: সবসময় **parameterized query/prepared statement**, ORM (raw query তে সাবধান), input validation, database user এর least privilege, ত্রুটি বার্তায় SQL না দেখানো।

### NoSQL injection কী?
MongoDB তে input এর বদলে operator পাঠানো, যেমন login body তে `{ "email": "a@b.com", "password": { "$ne": null } }` পাঠিয়ে password যাচাই এড়ানো।

প্রতিরোধ: input এর **type যাচাই** (string কিনা, `zod`), `express-mongo-sanitize`, `$where` এড়ানো, ORM/ODM schema ব্যবহার।

### Command injection ও path traversal কী?
- **Command injection**: user input দিয়ে system command চালানো (`exec("convert " + filename)`)। প্রতিরোধ: `exec` এড়ানো, `execFile`/`spawn` এ argument array, input allowlist।
- **Path traversal**: `../../etc/passwd` দিয়ে সীমার বাইরের ফাইল পড়া। প্রতিরোধ: path normalize করে নির্দিষ্ট folder এর ভেতরে কিনা যাচাই, ফাইলের নাম allowlist।

```js
const path = require("path");
const base = path.resolve("uploads");
const target = path.resolve(base, userFile);
if (!target.startsWith(base + path.sep)) throw new Error("Invalid path");
```

### Input validation ও sanitization এর পার্থক্য কী? কীভাবে করবে?
- **Validation**: input আমাদের নিয়ম মানছে কিনা যাচাই (type, দৈর্ঘ্য, ফরম্যাট), না মানলে প্রত্যাখ্যান
- **Sanitization**: input থেকে ক্ষতিকর অংশ সরানো/বদলানো
- **Output encoding**: output এর context অনুযায়ী escape

**Allowlist** (যা অনুমোদিত শুধু তাই) নীতি, denylist এর চেয়ে নিরাপদ। Schema validation: `zod`, `joi`, `class-validator`।

```js
import { z } from "zod";
const schema = z.object({
  email: z.string().email().max(254),
  age: z.number().int().min(0).max(120),
});
const result = schema.safeParse(req.body);
if (!result.success) return res.status(400).json(result.error.flatten());
```

### Mass assignment কী? কীভাবে এড়াবে?
Request body সরাসরি model এ সেট করে ফেলা, ফলে user এমন field ও বদলাতে পারে যা তার বদলানোর কথা নয় (`role: "admin"`, `isPaid: true`)।

```js
// বিপজ্জনক
await User.create(req.body);                // body তে role: "admin" থাকতে পারে

// নিরাপদ: শুধু অনুমোদিত field
const { name, email, password } = req.body;
await User.create({ name, email, password });
```

প্রতিরোধ: allowlist field, schema validation (`zod` strict), DTO ব্যবহার।

### Broken Access Control ও IDOR কী? (OWASP এর #১)
User এমন resource/কাজে ঢুকতে পারে যার অনুমতি তার নেই। IDOR (BOLA): `/orders/123` কে `/orders/124` করে অন্যের order দেখা।

প্রতিরোধ: প্রতিটি request এ **server এ authorization ও ownership যাচাই** (`WHERE id = ? AND user_id = ?`), default deny, role/permission কেন্দ্রীভূত, শুধু UI লুকানো যথেষ্ট নয়।

### SSRF (Server-Side Request Forgery) কী?
Server কে দিয়ে আক্রমণকারীর পছন্দের URL এ request করানো (যেমন "image URL থেকে import" feature)। এর মাধ্যমে ভেতরের network (`http://localhost`, `http://169.254.169.254` cloud metadata) এ ঢুকে secret চুরি সম্ভব।

প্রতিরোধ:

- URL এর **allowlist** (শুধু নির্দিষ্ট domain)
- Private/internal IP ব্লক (`127.0.0.1`, `10.x`, `169.254.x`)
- Redirect অনুসরণ বন্ধ বা যাচাই
- Cloud এ IMDSv2, ন্যূনতম IAM অনুমতি
- Server এর network থেকে ভেতরের সেবায় সীমিত access

### Rate limiting ও DDoS/brute force সুরক্ষা কীভাবে করবে?
- API/login এ rate limit (প্রতি IP/user/key এ), Redis দিয়ে বিতরণকৃত
- Exponential backoff, সাময়িক lockout, CAPTCHA
- Request body আকার ও timeout সীমিত
- CDN/WAF (Cloudflare, AWS WAF) ও caching
- Autoscaling, load balancer
- ব্যয়বহুল endpoint (search, export, password reset) এ কড়া সীমা

```js
import rateLimit from "express-rate-limit";
app.use("/api/auth/login", rateLimit({ windowMs: 15 * 60 * 1000, max: 5 }));
app.use("/api", rateLimit({ windowMs: 60 * 1000, max: 100 }));
```

### Secret (API key, password, token) কীভাবে নিরাপদে সামলাবে?
- Code ও Git এ কখনো নয় (`.env` কে `.gitignore` এ)
- Environment variable বা **secret manager** (AWS Secrets Manager, Vault, Doppler)
- Environment ভেদে আলাদা secret, নিয়মিত **rotate**
- ফাঁস হলে সাথে সাথে বাতিল ও নতুন তৈরি (Git history থেকে মুছলেও আগে চুরি হয়ে থাকতে পারে)
- CI এ secret scan (`gitleaks`, GitHub secret scanning)
- Log এ secret প্রিন্ট না করা

### Security header ও `helmet` কী? Express এ নিরাপত্তা middleware সাজাও
`helmet` Express এ নিরাপদ HTTP header স্বয়ংক্রিয়ভাবে বসায় (CSP, HSTS, `nosniff` ইত্যাদি)।

```js
import express from "express";
import helmet from "helmet";
import cors from "cors";
import rateLimit from "express-rate-limit";
import hpp from "hpp";
import cookieParser from "cookie-parser";

const app = express();
app.disable("x-powered-by");                          // framework গোপন
app.use(helmet());
app.use(cors({ origin: ["https://app.example.com"], credentials: true }));
app.use(express.json({ limit: "10kb" }));             // বড় body আটকানো
app.use(hpp());                                       // HTTP parameter pollution
app.use(cookieParser());
app.use("/api", rateLimit({ windowMs: 60_000, max: 100 }));
```

### CORS ঠিকভাবে কীভাবে কনফিগার করবে? সাধারণ ভুল কী?
শুধু বিশ্বস্ত origin allowlist এ রাখুন।

সাধারণ ভুল:

- `Access-Control-Allow-Origin: *` সংবেদনশীল API তে
- Request এর `Origin` header হুবহু ফেরত দেওয়া (সবাইকে অনুমতি)
- `credentials: true` এর সাথে অতিরিক্ত উদার নীতি
- CORS কে নিরাপত্তার ব্যবস্থা মনে করা (এটা শুধু browser এর নিয়ম)

### File upload নিরাপদ করবে কীভাবে? (backend)
- **ফাইলের ধরন যাচাই** magic bytes/content দেখে, শুধু extension বা `Content-Type` নয়
- **আকার সীমা**, ফাইলের সংখ্যা সীমা
- **নাম বদলে random** করা (path traversal ও overwrite এড়াতে)
- **Web root এর বাইরে** বা object storage (S3) এ রাখা, কখনো execute হতে না দেওয়া
- Malware scan (ClamAV), ছবি re-encode
- আলাদা domain থেকে পরিবেশন, `Content-Disposition`/`nosniff`
- Private ফাইলে signed URL ও অ্যাক্সেস নিয়ন্ত্রণ

### Webhook নিরাপদ করবে কীভাবে? (signature verification)
Webhook endpoint public, তাই কে পাঠাল যাচাই করতে **HMAC signature** মিলিয়ে দেখুন, আর **constant-time** তুলনা করুন (timing attack এড়াতে)। Raw body দিয়ে hash করতে হয়, parsed JSON দিয়ে নয়।

```js
import crypto from "crypto";

function verifySignature(rawBody, receivedSig, secret) {
  const expected = crypto.createHmac("sha256", secret).update(rawBody).digest("hex");
  const a = Buffer.from(expected);
  const b = Buffer.from(receivedSig);
  return a.length === b.length && crypto.timingSafeEqual(a, b);
}
```
সাথে timestamp যাচাই (replay আটকাতে) ও event id দিয়ে idempotency।

### Timing attack কী?
তুলনায় কত সময় লাগছে মেপে গোপন মান অনুমান করা (যেমন `===` দিয়ে token তুলনায় প্রথম অমিল পর্যন্ত যে সময়)। প্রতিরোধ: `crypto.timingSafeEqual` (সমান দৈর্ঘ্যের buffer এ), এবং password এর জন্য bcrypt/argon2 এর নিজস্ব তুলনা।

### ReDoS (Regex DoS) কী?
জটিল/অসতর্ক regex এ বিশেষ input দিলে ক্ষমতা ঘাতীয় হারে বাড়ে (catastrophic backtracking), ফলে server এর CPU আটকে যায় (Node এর event loop আটকে)। প্রতিরোধ: সরল regex, input দৈর্ঘ্য সীমা, নিরাপদ engine (`re2`), user input থেকে regex বানাবেন না।

### Error handling এ নিরাপত্তার দিক কী?
- Production এ stack trace, SQL, file path ব্যবহারকারীকে দেখাবেন না
- সাধারণ বার্তা ফেরত দিন, বিস্তারিত শুধু log এ
- Login এ "email ভুল" ও "password ভুল" আলাদা না বলে একই বার্তা (user enumeration আটকাতে)
- `NODE_ENV=production`, debug mode বন্ধ

```js
app.use((err, req, res, next) => {
  console.error(err);                                   // বিস্তারিত log এ
  res.status(500).json({ message: "Something went wrong" });   // user কে সাধারণ বার্তা
});
```

### Logging ও monitoring এ নিরাপত্তার দিক কী?
- নিরাপত্তা ঘটনা log করুন: login ব্যর্থতা, অনুমতি অস্বীকার, admin কাজ
- **Secret/password/token/card number log এ লিখবেন না**
- Log কে কেন্দ্রীভূত রাখুন (ELK, Datadog), অননুমোদিত পরিবর্তন থেকে সুরক্ষিত
- সন্দেহজনক আচরণে alert (অনেক ব্যর্থ login, অস্বাভাবিক traffic)
- Audit log: কে, কখন, কী করল

### Dependency vulnerability কীভাবে সামলাবে? (backend)
- `npm audit`/`npm audit fix`, Snyk, Dependabot, Renovate
- Lockfile ও `npm ci`
- ন্যূনতম dependency রাখা, অব্যবহৃত সরানো
- Production dependency নিয়মিত আপডেট, গুরুতর CVE তে দ্রুত patch
- Docker image ও scan করা (Trivy)

### Deserialization ও `eval` কেন বিপজ্জনক?
অবিশ্বাস্য data কে object এ রূপান্তর করার সময় (`unserialize`, YAML load, `eval`) আক্রমণকারী code চালানোর সুযোগ পেতে পারে। `JSON.parse` তুলনামূলক নিরাপদ, কিন্তু `eval`, `new Function`, `vm` এ user input কখনো নয়।

### Security misconfiguration কী? উদাহরণ দাও
ভুল বা ডিফল্ট সেটিং থেকে সৃষ্ট দুর্বলতা:

- ডিফল্ট user/password বদলানো হয়নি
- Debug mode/verbose error production এ চালু
- অপ্রয়োজনীয় port/সেবা খোলা, database public internet এ
- S3 bucket public
- Directory listing চালু, `.env`/`.git` public
- নিরাপত্তা header নেই, CORS অতি-উদার
- ক্লাউডে অতিরিক্ত IAM অনুমতি

### Docker ও container নিরাপত্তা (backend/DevOps)
- **Non-root user** দিয়ে container চালানো
- ছোট base image (`alpine`/`distroless`), শুধু দরকারি জিনিস
- Image এ secret না রাখা (build arg বা layer এ থেকে যায়), runtime এ secret manager
- Image scan (Trivy), version pin
- Read-only filesystem, অপ্রয়োজনীয় capability বাদ
- `.dockerignore` এ `.env`, `.git`

### Cloud নিরাপত্তার মৌলিক বিষয় কী?
- **IAM least privilege**, root account এ MFA ও ব্যবহার এড়ানো
- Storage bucket ডিফল্টে private
- Security group/firewall এ শুধু দরকারি port
- Database public এ নয়, private subnet এ
- Secret manager, key rotation
- Logging (CloudTrail), alert
- Encryption at rest ও in transit

### Encryption at rest ও in transit কী?
- **In transit**: network এ যাওয়ার সময় (TLS/HTTPS, database সংযোগে `sslmode=require`)
- **At rest**: disk/database/backup এ সংরক্ষিত অবস্থায় (disk encryption, KMS)

দুটোই দরকার। গোপন data এর জন্য application level এ field encryption ও করা যায়।

### API security এর জন্য কী কী করবে? (OWASP API Top 10)
২০২৩ OWASP API Security Top 10 এর সার:

- **API1 BOLA** (object level authorization), ownership যাচাই
- **API2 Broken Authentication**
- **API3 Broken Object Property Level Authorization** (অতিরিক্ত field ফাঁস বা mass assignment)
- **API4 Unrestricted Resource Consumption** (rate limit, pagination সীমা, payload সীমা)
- **API5 Broken Function Level Authorization** (admin endpoint সুরক্ষা)
- **API6 Unrestricted Access to Sensitive Business Flows** (bot দিয়ে কেনা/অপব্যবহার)
- **API7 SSRF**
- **API8 Security Misconfiguration**
- **API9 Improper Inventory Management** (পুরোনো/অজানা API version খোলা)
- **API10 Unsafe Consumption of APIs** (তৃতীয় পক্ষের API এর response অন্ধভাবে বিশ্বাস)

ব্যবহারিক: response এ শুধু দরকারি field (DTO), pagination সীমা (`limit` সর্বোচ্চ), অচেনা field প্রত্যাখ্যান, API key/token ও ছোট মেয়াদ।

### GraphQL এ বিশেষ নিরাপত্তা বিষয় কী?
Query depth/complexity সীমা (DoS), introspection production এ বন্ধ বা সীমিত, প্রতিটি resolver এ authorization, rate limiting, batching আক্রমণ সীমা, input validation।

## ৪. Authentication ও Session এর নিরাপত্তা (সংক্ষেপে)

### Password নিরাপদে সংরক্ষণ (সংক্ষেপে)
`argon2id`/`bcrypt` দিয়ে salt সহ hash। কখনো plain text, MD5 বা SHA1 নয়। (বিস্তারিত "Authentication ও Authorization" tab এ।)

### Session ও cookie নিরাপত্তা (সংক্ষেপে)
`HttpOnly`, `Secure`, `SameSite`, ছোট মেয়াদ, login এর পর session id নতুন, logout এ server এ বাতিল, MFA, rate limiting।

### JWT নিয়ে নিরাপত্তার মূল কথা (সংক্ষেপে)
Algorithm চাপিয়ে verify, ছোট মেয়াদ, secret শক্তিশালী, payload এ গোপন কিছু নয়, refresh token rotation, সংরক্ষণ cookie তে।

## ৫. Security Testing ও Process

### SAST, DAST, SCA আর IAST এর পার্থক্য কী?
- **SAST** (Static): source code বিশ্লেষণ করে দুর্বলতা খোঁজে (code না চালিয়ে)। উদাহরণ: SonarQube, Semgrep, CodeQL।
- **DAST** (Dynamic): চলমান application এ বাইরে থেকে আক্রমণ চালিয়ে পরীক্ষা। উদাহরণ: OWASP ZAP, Burp Suite।
- **SCA** (Software Composition Analysis): dependency এর জানা দুর্বলতা খোঁজে। উদাহরণ: `npm audit`, Snyk, Dependabot।
- **IAST**: চলমান app এর ভেতর থেকে পরীক্ষা (SAST + DAST এর সমন্বয়)।

### Penetration testing আর vulnerability scanning এর পার্থক্য কী?
- **Vulnerability scan**: স্বয়ংক্রিয় tool দিয়ে জানা দুর্বলতার তালিকা, দ্রুত ও নিয়মিত
- **Penetration test**: বিশেষজ্ঞ বাস্তব আক্রমণকারীর মতো দুর্বলতা কাজে লাগিয়ে দেখে কতটা ক্ষতি সম্ভব, গভীর কিন্তু ধীর

### CI/CD pipeline এ কী কী নিরাপত্তা পরীক্ষা রাখবে?
- Dependency scan (`npm audit`, Snyk)
- Secret scan (`gitleaks`)
- SAST (Semgrep/CodeQL)
- Container image scan (Trivy)
- Lint ও type check
- Branch protection, code review বাধ্যতামূলক
- Secret CI এর secret store এ, লগে প্রিন্ট না হওয়া

### Security incident হলে কী করবে? (Incident response)
ধাপ: **প্রস্তুতি → শনাক্ত → আটকানো (contain) → নির্মূল (eradicate) → পুনরুদ্ধার → শিক্ষা (post-mortem)**।

বাস্তবে: ক্ষতিগ্রস্ত সিস্টেম বিচ্ছিন্ন, ফাঁস হওয়া secret/token বাতিল ও নতুন তৈরি, কারণ খুঁজে বন্ধ করা, ব্যবহারকারী ও কর্তৃপক্ষকে (আইন অনুযায়ী) জানানো, log সংরক্ষণ, ঘটনা থেকে শিক্ষা নিয়ে প্রক্রিয়া ঠিক করা।

### Security headers আর web security কীভাবে পরীক্ষা করবে?
securityheaders.com, Mozilla Observatory, Lighthouse (best practices), OWASP ZAP, browser DevTools এর Network tab, `npm audit`, Burp Suite। CSP নতুন বসালে Report-Only mode এ আগে দেখুন।

### Responsible disclosure ও bug bounty কী?
নিরাপত্তা গবেষক দুর্বলতা পেলে প্রকাশ্যে না এনে সংস্থাকে আগে জানান (responsible disclosure)। অনেক কোম্পানি bug bounty (পুরস্কার) চালায় (HackerOne, Bugcrowd)। `security.txt` ফাইলে যোগাযোগের তথ্য দেওয়া যায়।

## ৬. Scenario ও কোডে দুর্বলতা খুঁজে বের করা

### How would you secure a REST API? (সংক্ষিপ্ত checklist)
- HTTPS ও HSTS
- Authentication (ছোট মেয়াদের token) ও প্রতিটি endpoint এ authorization (ownership সহ)
- Input validation (schema), parameterized query
- Rate limiting, request আকার ও timeout সীমা
- Response এ শুধু দরকারি field, pagination সীমা
- Security header (helmet), সঠিক CORS
- Secret manager, error এ তথ্য ফাঁস নয়
- Logging/monitoring, audit log
- Dependency scan ও আপডেট
- API versioning ও পুরোনো endpoint বন্ধ

### কীভাবে একটি E-commerce checkout নিরাপদ রাখবে?
- **দাম কখনো client থেকে নেবেন না**, server এ product id থেকে দাম নতুন করে হিসাব
- Card data নিজের server এ নয়: PCI-compliant provider (Stripe/SSLCommerz এর hosted fields/redirect)
- Payment confirmation **webhook এর signature যাচাই করে**, client এর "success" এ ভরসা নয়
- Order/payment এ **idempotency key**, stock এর atomic আপডেট
- Rate limit, fraud/bot যাচাই
- HTTPS, CSRF সুরক্ষা, ownership check (অন্যের order দেখা যাবে না)
- Audit log

### Token চুরি/ফাঁস হলে কী করবে?
- ওই token/session ও refresh token সাথে সাথে বাতিল (denylist/token version)
- সংশ্লিষ্ট user এর সব session বন্ধ, password reset বাধ্য
- কীভাবে ফাঁস হলো খোঁজা (XSS, log, URL, device)
- Secret/key ফাঁস হলে rotate
- ক্ষতির পরিধি দেখে ব্যবহারকারীকে জানানো, log পরীক্ষা

### DDoS থেকে কীভাবে বাঁচাবে?
- CDN ও WAF (Cloudflare, AWS Shield/WAF)
- Rate limiting ও connection limit
- Caching (দামী query/পেজ cache)
- Autoscaling ও load balancer
- ব্যয়বহুল endpoint এ কড়া সীমা, timeout
- Bot শনাক্ত (CAPTCHA, fingerprint)
- Origin server এর IP লুকানো (শুধু CDN থেকে অনুমোদন)

### নিচের code এ কী দুর্বলতা আছে? (SQL Injection)
```js
app.get("/user", async (req, res) => {
  const rows = await db.query(`SELECT * FROM users WHERE id = ${req.query.id}`);
  res.json(rows);
});
```
উত্তর: **SQL injection** (`id=1 OR 1=1`)। এছাড়া কোনো authentication/authorization নেই, আর `SELECT *` সংবেদনশীল ফিল্ড (password hash) ও ফেরত দিতে পারে। ঠিক রূপ: parameterized query `WHERE id = $1`, auth middleware, শুধু দরকারি column।

### নিচের code এ কী দুর্বলতা আছে? (IDOR)
```js
app.get("/api/orders/:id", requireAuth, async (req, res) => {
  const order = await Order.findById(req.params.id);
  res.json(order);
});
```
উত্তর: **IDOR/BOLA**: login করা যেকোনো user অন্যের order দেখতে পারে। ঠিক রূপ: `Order.findOne({ _id: req.params.id, userId: req.user.id })` এবং না পেলে `404`।

### নিচের code এ কী দুর্বলতা আছে? (XSS)
```jsx
function Comment({ html }) {
  return <div dangerouslySetInnerHTML={{ __html: html }} />;
}
```
উত্তর: **stored/reflected XSS**। `html` এ `<img src=x onerror=alert(1)>` এর মতো কিছু থাকলে চলবে। ঠিক রূপ: সাধারণ text হলে `{text}` দিয়ে দেখান, HTML দরকার হলে `DOMPurify.sanitize(html)`, সাথে CSP।

### নিচের code এ কী দুর্বলতা আছে? (Mass assignment ও hardcoded secret)
```js
const JWT_SECRET = "mysecret123";
app.post("/register", async (req, res) => {
  const user = await User.create(req.body);
  res.json({ token: jwt.sign({ id: user.id }, JWT_SECRET) });
});
```
উত্তর: (১) secret code এ hardcoded ও দুর্বল, env/secret manager এ শক্তিশালী secret; (২) `req.body` সরাসরি, তাই `role: "admin"` পাঠানো যায় (mass assignment), শুধু অনুমোদিত field নিন; (৩) token এ মেয়াদ (`expiresIn`) নেই; (৪) password hash করা হচ্ছে না, input validation নেই।

### নিচের CORS কনফিগারেশনে কী ভুল?
```js
app.use(cors({ origin: true, credentials: true }));
```
উত্তর: `origin: true` প্রতিটি request এর `Origin` হুবহু ফেরত দেয়, অর্থাৎ **যেকোনো site** cookie সহ আপনার API ডাকতে পারে (credentials সহ), যা বিপজ্জনক। ঠিক রূপ: নির্দিষ্ট allowlist (`origin: ["https://app.example.com"]`)।

### নিচের login code এ কী সমস্যা?
```js
const user = await User.findOne({ email });
if (!user) return res.status(404).json({ message: "Email not found" });
if (user.password !== password) return res.status(401).json({ message: "Wrong password" });
```
উত্তর: (১) password plain text এ সংরক্ষিত ও সরাসরি তুলনা (hash `bcrypt.compare` লাগবে), (২) আলাদা বার্তা দেওয়ায় আক্রমণকারী কোন email নিবন্ধিত তা জেনে নিতে পারে (user enumeration), একই বার্তা দিন, (৩) rate limit নেই (brute force), (৪) timing পার্থক্য।

### নিচের redirect এ কী সমস্যা?
```js
app.get("/go", (req, res) => res.redirect(req.query.url));
```
উত্তর: **Open redirect**। `/go?url=https://evil.com` দিয়ে phishing লিংক বিশ্বাসযোগ্য মনে করানো যায়। ঠিক রূপ: শুধু নিজের site এর relative path বা allowlist domain এ অনুমোদন।

### নিচের file serving এ কী সমস্যা?
```js
app.get("/download", (req, res) => res.sendFile("/var/uploads/" + req.query.name));
```
উত্তর: **Path traversal** (`name=../../etc/passwd`)। ঠিক রূপ: `path.resolve` দিয়ে normalize ও base folder এর ভেতরে কিনা যাচাই, ফাইলের নাম allowlist বা id দিয়ে খোঁজা, ownership check।

## ৭. Live Coding

### Express এ নিরাপদ API এর minimal setup
```js
import express from "express";
import helmet from "helmet";
import cors from "cors";
import rateLimit from "express-rate-limit";
import { z } from "zod";
import bcrypt from "bcrypt";
import jwt from "jsonwebtoken";

const app = express();
app.disable("x-powered-by");
app.use(helmet());

app.use(express.json({ limit: "10kb" }));

const loginSchema = z.object({
  email: z.string().email().max(254),
  password: z.string().min(8).max(128),
});

app.post("/api/auth/login",
  rateLimit({ windowMs: 15 * 60_000, max: 5 }),
  async (req, res) => {
    const parsed = loginSchema.safeParse(req.body);
    if (!parsed.success) return res.status(400).json({ message: "Invalid input" });

    const { email, password } = parsed.data;
    const user = await db.user.findUnique({ where: { email } });
    const ok = user && (await bcrypt.compare(password, user.passwordHash));
    if (!ok) return res.status(401).json({ message: "Invalid credentials" });  // একই বার্তা

    const token = jwt.sign({ sub: user.id, role: user.role }, process.env.JWT_SECRET, { expiresIn: "15m" });
    res.cookie("access_token", token, { httpOnly: true, secure: true, sameSite: "strict", maxAge: 15 * 60_000 });
    res.json({ ok: true });
  }
);

app.use((err, req, res, next) => {            // কেন্দ্রীয় error handler
  console.error(err);
  res.status(500).json({ message: "Something went wrong" });
});

### Next.js এ CSP nonce সহ middleware
```ts
// middleware.ts
import { NextResponse, type NextRequest } from "next/server";

export function middleware(req: NextRequest) {
  const nonce = Buffer.from(crypto.randomUUID()).toString("base64");
  const csp = [
    "default-src 'self'",
    `script-src 'self' 'nonce-${nonce}' 'strict-dynamic'`,
    "style-src 'self' 'unsafe-inline'",
    "img-src 'self' blob: data:",
    "object-src 'none'",
    "base-uri 'self'",
    "frame-ancestors 'none'",
  ].join("; ");

  const headers = new Headers(req.headers);
  headers.set("x-nonce", nonce);
  headers.set("Content-Security-Policy", csp);

  const res = NextResponse.next({ request: { headers } });
  res.headers.set("Content-Security-Policy", csp);
  return res;
}
```

### Multer দিয়ে নিরাপদ file upload
```js
import multer from "multer";
import crypto from "crypto";
import path from "path";
import { fileTypeFromBuffer } from "file-type";

const upload = multer({
  storage: multer.memoryStorage(),
  limits: { fileSize: 2 * 1024 * 1024, files: 1 },        // ২MB
});

app.post("/api/upload", requireAuth, upload.single("file"), async (req, res) => {
  if (!req.file) return res.status(400).json({ message: "No file" });

  const type = await fileTypeFromBuffer(req.file.buffer);   // magic bytes দেখে
  const allowed = ["image/png", "image/jpeg", "image/webp"];
  if (!type || !allowed.includes(type.mime))
    return res.status(400).json({ message: "Invalid file type" });

  const name = crypto.randomUUID() + "." + type.ext;        // random নাম
  await storage.put(name, req.file.buffer);                 // S3/বাইরের storage, web root নয়
  res.status(201).json({ name });
});
```

### SSRF থেকে বাঁচতে URL যাচাই
```js
import { URL } from "url";
import dns from "dns/promises";
import net from "net";

const ALLOWED_HOSTS = new Set(["images.example.com"]);

function isPrivateIp(ip) {
  return /^(10\.|127\.|192\.168\.|169\.254\.|172\.(1[6-9]|2\d|3[01])\.)/.test(ip) || ip === "::1";
}

async function safeFetch(rawUrl) {
  const url = new URL(rawUrl);
  if (!["https:"].includes(url.protocol)) throw new Error("Only https");
  if (!ALLOWED_HOSTS.has(url.hostname)) throw new Error("Host not allowed");
  const { address } = await dns.lookup(url.hostname);
  if (net.isIP(address) && isPrivateIp(address)) throw new Error("Private IP blocked");
  return fetch(url, { redirect: "error" });                 // redirect অনুসরণ বন্ধ
}
```
(এটি সরলীকৃত উদাহরণ। DNS rebinding এর মতো আক্রমণ ঠেকাতে সংযোগের সময় ও IP যাচাই লাগে।)

### CSRF token (double submit) এর সহজ উদাহরণ
```js
// Server: token তৈরি করে cookie ও response এ পাঠানো
app.get("/api/csrf", (req, res) => {
  const token = crypto.randomBytes(32).toString("hex");
  res.cookie("csrf", token, { sameSite: "strict", secure: true });   // JS পড়তে পারবে
  res.json({ token });
});

// Client: প্রতিটি state বদলানো request এ header এ পাঠানো
api.defaults.headers.common["X-CSRF-Token"] = token;

// Server middleware: cookie ও header মেলানো
const csrfCheck = (req, res, next) => {
  const ok = req.cookies.csrf && req.cookies.csrf === req.get("X-CSRF-Token");
  return ok ? next() : res.status(403).json({ message: "CSRF check failed" });
};
```
বাস্তবে `SameSite` cookie ও library (`csrf-csrf`, framework এর built-in) ব্যবহার করা ভালো।

<script>
function initTab(raw, root, prefix) {
  const app = root.querySelector(".app");
  const statsEl = root.querySelector(".stats");
  const emptyEl = root.querySelector(".empty");
  const searchEl = root.querySelector(".search");

  // ---------- storage helpers (may be blocked) ----------
  const storeKey = prefix === "js" ? "js-qa-known" : "qa-known-" + prefix;
  function load() { try { return JSON.parse(localStorage.getItem(storeKey) || "{}"); } catch (e) { return {}; } }
  function save(v) { try { localStorage.setItem(storeKey, JSON.stringify(v)); } catch (e) {} }
  let known = load();

  // ---------- parse content ----------
  const sections = [];
  let sec = null, item = null;
  raw.split("\n").forEach(function (line) {
    if (line.startsWith("## ")) {
      sec = { title: line.slice(3).trim(), items: [] };
      sections.push(sec); item = null;
    } else if (line.startsWith("### ")) {
      item = { q: line.slice(4).trim(), lines: [] };
      sec.items.push(item);
    } else if (item) {
      item.lines.push(line);
    }
  });

  // ---------- tiny markdown renderer ----------
  function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  function inline(s) {
    return esc(s)
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  }
  function render(lines) {
    let html = "", para = [], list = [], code = null;
    function flushPara() { if (para.length) { html += "<p>" + para.join("<br>") + "</p>"; para = []; } }
    function flushList() { if (list.length) { html += "<ul>" + list.map(function (l) { return "<li>" + l + "</li>"; }).join("") + "</ul>"; list = []; } }
    lines.forEach(function (line) {
      if (line.startsWith("```")) {
        if (code === null) { flushPara(); flushList(); code = []; }
        else { html += "<pre><code>" + esc(code.join("\n")) + "</code></pre>"; code = null; }
        return;
      }
      if (code !== null) { code.push(line); return; }
      if (line.trim() === "") { flushPara(); flushList(); return; }
      if (line.startsWith("- ")) { flushPara(); list.push(inline(line.slice(2))); return; }
      flushList(); para.push(inline(line));
    });
    flushPara(); flushList();
    return html;
  }

  // ---------- build DOM ----------
  let counter = 0;
  const all = [];
  sections.forEach(function (s, si) {
    const secEl = document.createElement("section");
    secEl.id = "sec-" + si;
    const h = document.createElement("h2");
    h.textContent = s.title;
    secEl.appendChild(h);
    s.items.forEach(function (it) {
      counter++;
      const id = "q" + counter;
      const d = document.createElement("details");
      if (known[id]) d.classList.add("done");
      const sm = document.createElement("summary");
      sm.innerHTML =
        '<span class="num">' + counter + '.</span>' +
        '<span class="qtext"></span>' +
        '<label class="known"><input type="checkbox"' + (known[id] ? " checked" : "") + '>জানি</label>';
      sm.querySelector(".qtext").textContent = it.q;
      const label = sm.querySelector(".known");
      label.addEventListener("click", function (e) { e.stopPropagation(); });
      sm.querySelector("input").addEventListener("change", function (e) {
        if (e.target.checked) { known[id] = 1; d.classList.add("done"); }
        else { delete known[id]; d.classList.remove("done"); }
        save(known); updateStats();
      });
      const ans = document.createElement("div");
      ans.className = "ans";
      ans.innerHTML = render(it.lines);
      d.appendChild(sm); d.appendChild(ans);
      secEl.appendChild(d);
      all.push({ el: d, sec: secEl, id: id, text: (it.q + " " + it.lines.join(" ")).toLowerCase(), q: it.q, qEl: sm.querySelector(".qtext") });
    });
    app.appendChild(secEl);

  });

  // ---------- section number shortcuts (শুধু Database tab) ----------
  const JUMP = { db: [10, 9, 8, 7, 6, 5, 4, 3, 1] };
  if (JUMP[prefix]) {
    const bn = "০১২৩৪৫৬৭৮৯";
    const secIndex = {};
    sections.forEach(function (s, si) {
      const m = s.title.match(/^([০-৯]+)\./);
      if (!m) return;
      const n = parseInt(m[1].split("").map(function (c) { return bn.indexOf(c); }).join(""), 10);
      if (!(n in secIndex)) secIndex[n] = si;
    });
    const row = document.createElement("div");
    row.className = "row chips";
    JUMP[prefix].forEach(function (n) {
      if (!(n in secIndex)) return;
      const b = document.createElement("button");
      b.className = "chip";
      b.textContent = n;
      b.title = sections[secIndex[n]].title;
      b.addEventListener("click", function () {
        const el = root.querySelector("#sec-" + secIndex[n]);
        if (el.style.display === "none") { searchEl.value = ""; applySearch(); }
        el.scrollIntoView({ behavior: "smooth", block: "start" });
      });
      row.appendChild(b);
    });
    statsEl.parentNode.insertBefore(row, statsEl);
  }

  // ---------- stats ----------
  function updateStats() {
    const doneCount = Object.keys(known).length;
    const visible = all.filter(function (a) { return a.el.style.display !== "none"; }).length;
    statsEl.textContent = "মোট " + all.length + " টি প্রশ্ন · দেখাচ্ছে " + visible + " · জানা আছে " + doneCount;
  }

  // ---------- search ----------
  function highlight(el, text, term) {
    if (!term) { el.textContent = text; return; }
    const i = text.toLowerCase().indexOf(term);
    if (i < 0) { el.textContent = text; return; }
    el.textContent = "";
    el.appendChild(document.createTextNode(text.slice(0, i)));
    const m = document.createElement("mark");
    m.textContent = text.slice(i, i + term.length);
    el.appendChild(m);
    el.appendChild(document.createTextNode(text.slice(i + term.length)));
  }
  function applySearch() {
    const term = searchEl.value.trim().toLowerCase();
    let shown = 0;
    all.forEach(function (a) {
      const ok = !term || a.text.indexOf(term) !== -1;
      a.el.style.display = ok ? "" : "none";
      highlight(a.qEl, a.q, term);
      if (ok) shown++;
    });
    root.querySelectorAll("section").forEach(function (s) {
      const any = Array.prototype.some.call(s.querySelectorAll("details"), function (d) { return d.style.display !== "none"; });
      s.style.display = any ? "" : "none";
    });
    emptyEl.style.display = shown ? "none" : "block";
    updateStats();
  }
  searchEl.addEventListener("input", applySearch);

  root.querySelector(".expand").addEventListener("click", function () {
    all.forEach(function (a) { if (a.el.style.display !== "none") a.el.open = true; });
  });
  root.querySelector(".collapse").addEventListener("click", function () {
    all.forEach(function (a) { a.el.open = false; });
  });

  updateStats();
  return all.length;
}
