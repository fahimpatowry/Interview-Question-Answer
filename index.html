## ১৩. Interview Q&A (নিজের নোট থেকে)

### When would you choose SSR over SSG?
যখন page এর content ঘন ঘন বদলায় এবং **প্রতিটি request এ সর্বশেষ data** দেখাতে হয়, অথবা content ব্যবহারকারী অনুযায়ী আলাদা (personalized) হয়।

- **সুবিধা**: সবসময় fresh data, CSR এর চেয়ে ভালো SEO, server-side resource (DB, secret) এ নিরাপদ access
- **অসুবিধা**: SSG এর চেয়ে ধীর, প্রতি request এ server কে কাজ করতে হয়

**Interview answer:** "I choose SSR when the page requires fresh, request-time data or personalized content, such as dashboards, booking systems, or mortgage applications. I choose SSG when the content is mostly static and SEO is important, such as blogs, landing pages, or documentation sites. If the content changes occasionally, I would use ISR to get the benefits of both SSR and SSG."

### Difference between App Router and Pages Router?
**Pages Router (পুরোনো পদ্ধতি):**

- `pages/` directory ব্যবহার করে
- File-based routing (`pages/about.js` → `/about`)
- Data fetching: `getServerSideProps`, `getStaticProps`, `getInitialProps`
- Built-in layout system নেই (`_app.tsx` দিয়ে সামলাতে হয়)
- Server ও client এর স্পষ্ট ভাগ নেই

**App Router (নতুন পদ্ধতি, Next.js 13+):**

- `app/` directory ব্যবহার করে
- default এ **React Server Components**
- Nested layout (`layout.tsx`)
- `loading.tsx`, `error.tsx` দিয়ে loading/error UI
- সরাসরি `fetch` দিয়ে data আনা (`getServerSideProps` লাগে না)
- Server Actions built-in
- Streaming ও Suspense সাপোর্ট
- Server ও Client component এর স্পষ্ট ভাগ, ভালো performance

### Can Server Components use `useState`?
না। Server Component server এ চলে, browser এ নয়। তাই এতে browser এর memory নেই, user interaction এ re-render হয় না এবং client-side state সাপোর্ট করে না।

**Interview answer:** "No, Server Components cannot use useState because they run on the server and don't support client-side interactivity. State and hooks like useState are only available in Client Components marked with `use client`."

### How does ISR work in App Router?
Route level এ `export const revalidate = 60` দিয়ে অথবা `fetch` এর ভেতরে `next: { revalidate: 60 }` দিয়ে। Next.js cache করা static page পরিবেশন করে এবং revalidation সময় পার হলে **background এ** নতুন করে তৈরি করে। ফলে page দ্রুত থাকে আবার নির্দিষ্ট সময় পর আপডেটও হয়।

```tsx
export const revalidate = 60; // route level

await fetch(url, { next: { revalidate: 60 } }); // fetch level
```

**Interview answer:** "In App Router, ISR works by using revalidate either at the route level or inside fetch. Next.js serves a cached static page and regenerates it in the background after the revalidation period, allowing pages to stay fast while updating periodically."

### What are Server Actions?
Server এ চলা async function, `"use server"` দিয়ে চিহ্নিত। Form submit, data create/update/delete এর মতো কাজ React component থেকে সরাসরি করা যায়, অনেক ক্ষেত্রে আলাদা API route না লিখেই।

**Interview answer:** "Server Actions are server-side functions in Next.js that run on the server using `use server`. They allow us to handle operations like form submissions, data creation, updates, and deletions directly from React components without creating separate API routes."

**বাংলায়:** Server Actions হলো Next.js এর server-side function, যা `"use server"` ব্যবহার করে server এ execute হয়। এগুলোর মাধ্যমে React Component থেকে সরাসরি form submission, data create, update, delete এবং অন্যান্য server-side operation করা যায়, অনেক ক্ষেত্রে আলাদা API Route তৈরি না করেই।

**১. সরাসরি Database call (full-stack Next.js):**
```tsx
"use server";
export async function createProduct(data) {
  await db.product.create({ data });
}
```

**২. বাইরের backend API call (.NET, Node.js, Java):**
```tsx
"use server";
export async function createProduct(data) {
  await fetch("https://api.company.com/products", {
    method: "POST",
    body: JSON.stringify(data),
  });
}
```

**৩. Server-side business logic:**
```tsx
"use server";
export async function calculateDiscount(price: number) {
  return price * 0.9;
}
```

**Server Actions এর নিরাপত্তা সুবিধা:**

- Server এর code (secret, DB logic) client এ যায় না
- আলাদা করে API route বানিয়ে URL ছড়িয়ে দিতে হয় না
- অভ্যন্তরীণ কাজের জন্য সহজ ও কম boilerplate
- Server context (cookies, headers, session) সরাসরি পাওয়া যায়

**একটি গুরুত্বপূর্ণ সংশোধন:** আগের নোটে "No public endpoint exposure" লেখা ছিল, সেটা **সঠিক নয়**। Server Action আসলে পর্দার আড়ালে একটি **public POST endpoint** হয়ে যায়, যা বাইরে থেকে ডাকা সম্ভব। তাই এর ভেতরে সবসময় **authentication, authorization ও input validation** করতে হবে। Interview এ বলুন: "code client এ যায় না, কিন্তু endpoint public, তাই auth check লাগে।"

**Interview answer:** "Server Actions are server-side functions in Next.js App Router that can be called directly from components or forms without creating API routes. They reduce boilerplate and simplify data mutations. Although the code isn't shipped to the client, each action is still a public endpoint, so I always validate input and check authentication inside it. Compared to API routes, they are easier for internal application logic, while API routes are better for public or external APIs."

### How do you protect a route?
স্তরে স্তরে সুরক্ষা (layered protection):

- **Middleware**: unauthorized request কে অনেক আগেই আটকে `/login` এ redirect করে
- **Server Component**: session না থাকলে `redirect()` করে
- **Server Action/Route Handler এর ভেতরে**: আসল authorization যাচাই (এটাই চূড়ান্ত)

শুধু middleware এর উপর নির্ভর করবেন না, কারণ আসল সুরক্ষা data এর কাছেই হওয়া উচিত।

**Interview answer:** "Route protection in Next.js can be done using middleware to block unauthorized access early, server components to redirect unauthenticated users, and server-side checks in actions or API routes. The best practice is layered protection: middleware plus server-side validation to ensure security."

### Where do you store tokens?
**HTTP-only cookie** তে। এটা JavaScript দিয়ে পড়া যায় না, তাই XSS আক্রমণ থেকে সুরক্ষিত। `localStorage`/`sessionStorage` সহজ কিন্তু কম নিরাপদ, সংবেদনশীল token এর জন্য এড়িয়ে চলুন। সাথে `Secure` ও `SameSite` flag দিন (CSRF এর জন্য)।

**Interview answer:** "The best place to store authentication tokens is in HTTP-only cookies because they are not accessible via JavaScript, making them secure against XSS attacks. localStorage and sessionStorage are easier but less secure and should generally be avoided for sensitive tokens."

### Difference between Middleware and API Routes?
- **Middleware**: request page বা API route এ পৌঁছানোর **আগে** আটকায়। Authentication, redirect, rewrite, request validation এ ব্যবহার হয়। হালকা ও দ্রুত হতে হয়।
- **API Routes (Route Handlers)**: backend endpoint, যেখানে server-side logic চলে। Database operation, তৃতীয় পক্ষের API integration, CRUD, JSON response ফেরত দেওয়া।

**Interview answer:** "Middleware is used to intercept requests before they reach pages or API routes. It is commonly used for authentication, redirects, rewrites, and request validation. API Routes are backend endpoints used to execute server-side logic such as database operations, third-party API integrations, and CRUD functionality. They return data like JSON to the client."

### What happens during Next.js build?
`next build` এ ধাপগুলো:

- Configuration load (`next.config.js`, env)
- Code compile (SWC দিয়ে TypeScript/JavaScript)
- Type checking
- Linting (ESLint)। কিছু নতুন version এ build এর সাথে lint আর চলে না, version অনুযায়ী দেখে নিন
- Route analysis (কোনটা static, কোনটা dynamic)
- Static Site Generation (যেসব page static হতে পারে সেগুলো আগে থেকে তৈরি)
- Server bundle তৈরি (dynamic page এর জন্য)
- Optimization: code splitting, tree shaking, minification
- Build output `.next` ফোল্ডারে, যা `next start` চালায়

**Interview answer:** "When we run next build, Next.js creates an optimized production build of the application. It compiles TypeScript and JavaScript using SWC, performs type checking and linting, analyzes routes, generates static pages where possible, creates server-side bundles for dynamic pages, performs code splitting and tree shaking, minifies assets, and stores the final production output in the .next folder. This build is then served by next start in production."

### How do you optimize images in Next.js?
- সাধারণ `<img>` এর বদলে **`next/image`** ব্যবহার করি
- Automatic lazy loading, responsive image, আধুনিক format (WebP, AVIF)
- **`sizes`** attribute দিই যাতে browser উপযুক্ত আকারের ছবি নামায়
- Above-the-fold ছবিতে **`priority`** দিই
- বাইরের ছবির জন্য `remotePatterns` config করি
- Upload এর আগে ছবি compress করি
- Lighthouse ও Core Web Vitals দিয়ে মাপি

### Next.js Image Loading Performance Optimization
- LCP ছবিতে `priority` (নতুন version এ `preload` আসছে, docs দেখুন), বাকিগুলো lazy
- `width`/`height` বা `fill` দিন, layout shift (CLS) এড়াতে
- `sizes` দিন, ছোট screen এ বড় ছবি এড়াতে
- `placeholder="blur"` দিন, load এর আগে blur দেখাতে
- Icon এর জন্য SVG
- CDN ও `minimumCacheTTL` দিয়ে cache
- Lighthouse এ LCP/CLS মাপুন

```tsx
<Image
  src="/hero.jpg"
  alt="Hero"
  width={1200}
  height={600}
  sizes="(max-width: 768px) 100vw, 50vw"
  priority
  placeholder="blur"
/>
```

### When would you choose Next.js over React + Vite?
যখন app এ এমন production feature লাগে যা শুধু client-side SPA দেয় না:

- **SEO** দরকার
- SSR, SSG বা ISR দরকার
- দ্রুত initial load ও ভালো Core Web Vitals দরকার
- Built-in routing
- Middleware (auth, redirect, request handling)
- Image optimization ও caching
- বড় scale এর app যেখানে framework এর নিয়ম ও কাঠামো সাহায্য করে
- Backend feature দরকার (API routes, Server Actions)

**Interview answer:** "I choose Next.js over React + Vite when the application needs production-level features beyond a client-side SPA, such as SEO, SSR/SSG/ISR, fast initial load, built-in routing, middleware, image optimization, caching, and backend features like API routes or server actions."

### Why choose React for an admin panel?
Admin panel সাধারণত ভেতরের ব্যবহারের জন্য, data-heavy SPA। এতে SSR বা SEO লাগে না।

- হালকা ও সহজ
- SEO দরকার নেই
- Data-heavy UI (table, chart, form)
- Rendering এর ভিন্ন ভিন্ন কৌশল লাগে না
- Caching এর বিশেষ চাহিদা নেই (React Query দিয়েই চলে)
- System এর উপর পূর্ণ নিয়ন্ত্রণ

**Interview answer:** "I choose React (with Vite) for admin panels because admin applications are typically internal, data-driven SPAs where we don't need server-side rendering or SEO. Vite keeps the setup light, and we keep full control of the architecture."

### Explain SSR, CSR, SSG, and ISR.
**CSR (Client-Side Rendering):** Browser প্রায় ফাঁকা HTML পায়, তারপর JavaScript client এ UI বানায়।

- Rendering browser এ হয়, প্রথম load ধীর, পরে navigation দ্রুত
- React SPA তে প্রচলিত
- SEO এর জন্য ভালো নয়

**SSR (Server-Side Rendering):** প্রতি request এ server এ page render হয়ে পূর্ণ HTML browser এ যায়।

- প্রতি request এ HTML তৈরি
- দ্রুত প্রথম দেখা, ভালো SEO
- Server load বেশি
- ব্যবহার: dynamic page

**SSG (Static Site Generation):** Build এর সময় page আগে থেকে তৈরি হয়ে static HTML হিসেবে পরিবেশিত হয়।

- অত্যন্ত দ্রুত, খুব ভালো SEO
- Runtime এ server rendering নেই
- ব্যবহার: blog, documentation, marketing page

**ISR (Incremental Static Regeneration):** SSG এর মতো static page, কিন্তু পুরো app আবার build না করেই deploy এর পর background এ আপডেট করা যায়।

- আগে থেকে তৈরি, background এ পুনরায় তৈরি হতে পারে
- SSG এর গতি আর SSR এর তাজা data দুটোই
- ব্যবহার: e-commerce product page, dynamic content site

### What are React Server Components?
RSC হলো এমন component যা **শুধু server এ চলে** এবং তার আউটপুট (পূর্ব-তৈরি UI) client এ পাঠায়, ভারী JavaScript নয়।

**Server Components:**

- শুধু server এ চলে
- Browser এ JavaScript পাঠায় না
- `useState`, `useEffect` ব্যবহার করা যায় না
- Browser API (`window`, `localStorage`) নেই
- সরাসরি database/backend service এ access করা যায়
- Bundle ছোট, performance ভালো
- Next.js App Router এ default

**Client Components:**

- Browser এ চলে, JavaScript bundle client এ যায়
- `useState`, `useEffect` ব্যবহার করা যায়
- Browser API ব্যবহার করা যায়
- Interactivity (click, form, animation) দেয়
- Next.js এ `"use client"` লিখতে হয়

### What can and cannot be used inside a Server Component?
**ব্যবহার করতে পারবেন:**

- `async/await` (data fetching)
- সরাসরি database query (Prisma, Sequelize ইত্যাদি)
- Backend API (`fetch`)
- Server-side library (`fs`, `path` ইত্যাদি)
- Environment variable (`process.env`)
- অন্য Server Component
- সাধারণ JS/TS logic ও JSX

**ব্যবহার করতে পারবেন না:**

- `useState`, `useEffect`, `useReducer`
- Event handler (`onClick`, `onChange` ইত্যাদি)
- Browser API (`window`, `document`, `localStorage`)
- Browser runtime লাগে এমন hook
- DOM নির্ভর client-only library (যেমন কিছু chart library)
- Stateful UI logic

### How does Next.js improve SEO?
Next.js এ clean routing, image optimization ও metadata support আছে। এছাড়া এটি SSR ও SSG ব্যবহার করে, ফলে browser ও search engine দুটোই আগে থেকে সম্পূর্ণ HTML পেয়ে যায়। এতে page দ্রুত load হয়, সহজে crawl করা যায় এবং ভালোভাবে index হয়।

**Interview answer:** "Next.js improves SEO with server-rendered and statically generated HTML, a metadata API, clean file-based routing, image optimization, and good Core Web Vitals, so search engines can crawl and index the full content easily."

### How would you structure a large Next.js application?
বড় application এ file এর ধরন অনুযায়ী না, **feature-based modular architecture** অনুসরণ করি।

- `features/`: business logic (auth, products, dashboard)
- `shared/`: পুনঃব্যবহারযোগ্য UI (button, input, modal)
- `services/`: API call ও backend যোগাযোগ
- `hooks/`: পুনঃব্যবহারযোগ্য logic
- `store/`: state management (Redux, Zustand)
- `lib/`: utility (helper, auth logic, DB config)

```
src/
  app/            (routes, layouts)
  features/
    auth/         (components, hooks, actions, types)
    products/
  shared/ui/
  services/
  hooks/
  store/
  lib/
```

### How would you optimize a slow Next.js page?
প্রথমে bottleneck কোথায় তা বিশ্লেষণ করি (Lighthouse, React Profiler, Network tab, bundle analyzer)। তারপর:

- Rendering strategy উন্নত করা (SSR, SSG ঠিকভাবে ব্যবহার)
- Data fetching ও caching optimize করা
- Client-side JavaScript কমানো, client code যতটা সম্ভব server এ সরানো
- Code splitting ও image optimization
- Re-render কমানো (`useCallback`, `useMemo`, `React.memo`)
- অপ্রয়োজনীয় package সরানো
- বড় list এ pagination/virtualization
- শুধু প্রয়োজনীয় data ও component লোড করা
- Pages Router হলে App Router এ migrate করা

### What is Streaming in Next.js?
Server পুরো page তৈরি হওয়ার অপেক্ষা না করে ছোট ছোট অংশে (chunk) HTML browser এ পাঠায়। ধীর অংশ `<Suspense fallback>` এ মুড়ে দিলে বাকি page আগে দেখা যায় এবং ধীর অংশ তৈরি হলে পরে জুড়ে যায়। `loading.tsx` আসলে automatic Suspense boundary।

**Interview answer:** "Streaming in Next.js is a rendering technique where the server sends the page to the browser in small chunks instead of waiting for the entire page to be ready. Slow parts are wrapped in Suspense, so users see the rest of the page sooner."

### How do you prevent duplicate API calls?
পরিস্থিতি অনুযায়ী বিভিন্ন কৌশল:

- **TanStack Query বা SWR**: built-in request deduplication ও caching
- **Button disable** (request চলার সময়): form submit এ বারবার click আটকাতে
- **Debouncing**: search এর API তে
- **AbortController**: পুরোনো request বাতিল করতে, race condition এড়াতে
- **Server Component এ data fetch**: client এ duplicate request কমে, এবং একই render এ একই `fetch` একবারই চলে (request memoization)
- **`useEffect` ও callback ঠিকমতো memoize**: অপ্রয়োজনীয় re-render বা refetch আটকাতে

**Interview answer:** "I prevent duplicate API calls using different strategies depending on the situation. For data fetching I use TanStack Query or SWR, which provide request deduplication and caching. For user actions like form submission, I disable the button while the request is in flight. For search I use debouncing and AbortController to cancel stale requests. In the Next.js App Router, I fetch in Server Components where possible, and I memoize callbacks and effects correctly to avoid unnecessary re-renders and refetches. These reduce server load and avoid race conditions."

### How do you optimize API requests?
- Pagination / Infinite scrolling
- Lazy loading
- Prefetching
- Request batching (অনেক ছোট request কে একসাথে)
- Payload ছোট করা (দরকারি field ই আনা, compression)
- স্বাধীন request parallel চালানো (`Promise.all`)
- TanStack Query বা SWR (caching ও deduplication)
- Loading এর সময় button disable
- Search এ debounce
- `AbortController` দিয়ে চলমান request বাতিল
- Server Component এ API call
- অপ্রয়োজনীয় re-render বা refetch আটকাতে `useEffect` ও callback ঠিক রাখা

### Explain caching strategies in frontend applications.
Next.js এ কয়েকটি caching স্তর আছে: Request Memoization, Data Cache, Full Route Cache, Router Cache, এবং CDN caching।

- আধা-static content (product list, blog): `revalidate` ব্যবহার
- Dynamic content (user dashboard): `cache: "no-store"`
- Mutation এর পর পুরোনো cache মুছতে: `revalidatePath` / `revalidateTag`

এতে performance ও data freshness এর ভারসাম্য থাকে এবং অপ্রয়োজনীয় API call ও server load কমে।

**Interview answer:** "Next.js provides several caching layers including Request Memoization, Data Cache, Full Route Cache, Router Cache, and CDN caching. For data fetching, I typically use revalidate for semi-static content such as product listings or blogs, and cache: 'no-store' for dynamic content like user dashboards. When data changes due to mutations, I use revalidatePath or revalidateTag to invalidate stale cache. This allows me to balance performance and data freshness while minimizing unnecessary API calls and server load."

(Version সতর্কতা: Next.js 15 থেকে `fetch` default এ cache হয় না। আপনার version এর আচরণ docs এ দেখে নিন।)

### Next.js এ page এর ধরন কী কী? (Static, Dynamic, Partial)
**Static page**: build এর সময় একবার তৈরি, সবার জন্য একই HTML, CDN থেকে যায়। সবচেয়ে দ্রুত। Blog, landing page।

**Dynamic page**: প্রতি request এ server এ তৈরি (SSR)। `cookies()`, `headers()`, `searchParams`, বা `cache: "no-store"` ব্যবহার করলে হয়। Dashboard, cart।

**Partial page (Partial Prerendering, PPR)**: একই page এ static shell আর dynamic অংশ। Static অংশ সাথে সাথে যায়, dynamic অংশ `<Suspense>` এর ভেতরে পরে stream হয়।

```tsx
export default function Product() {
  return (
    <>
      <ProductInfo />                     {/* static, সাথে সাথে দেখা যায় */}
      <Suspense fallback={<p>Loading...</p>}>
        <CartButton />                    {/* dynamic, cookies() ব্যবহার করে */}
      </Suspense>
    </>
  );
}
```

**Interview answer:** "A static page is generated at build time and served from a CDN. A dynamic page is rendered on every request. With partial prerendering, a single page has a static shell that arrives instantly, while dynamic parts are streamed in through Suspense, so we get SSG's speed and SSR's freshness." (PPR setup Next.js version অনুযায়ী আলাদা, docs দেখে নিন।)

## ১. Database Basics (সাধারণ ধারণা)

### SQL আর NoSQL database এর পার্থক্য কী? কখন কোনটা?
- **SQL (relational)**: table, row, column, নির্দিষ্ট schema। Table এর মধ্যে relation (foreign key) ও JOIN। উদাহরণ: PostgreSQL, MySQL।
- **NoSQL**: নমনীয় schema, বিভিন্ন model (document, key-value, column, graph)। সহজে horizontal scale করা যায়। উদাহরণ: MongoDB (document), Redis (key-value), Cassandra (column), Neo4j (graph)।

কখন কোনটা:

- Data এর structure নির্দিষ্ট, relation বেশি, transaction ও consistency জরুরি (payment, order, inventory): **SQL**
- Schema প্রায়ই বদলায়, নেস্টেড/অর্ধ-structured data, দ্রুত iterate, বিশাল scale (log, catalog, content): **NoSQL**

"কোনটা ভালো" নয়, প্রয়োজন অনুযায়ী বেছে নিতে হয়। অনেক সময় দুটোই একসাথে ব্যবহার হয়।

### ACID কী?
Transaction এর চারটি নিশ্চয়তা:

- **Atomicity**: transaction এর সব কাজ হয় পুরোটা সফল হবে, নয়তো কিছুই হবে না
- **Consistency**: transaction শেষে database বৈধ অবস্থায় (constraint মেনে) থাকে
- **Isolation**: একসাথে চলা transaction গুলো একে অপরকে বিঘ্নিত করে না
- **Durability**: commit হয়ে গেলে crash হলেও data হারায় না (disk/WAL এ লেখা)

উদাহরণ: ব্যাংকে A থেকে B কে টাকা পাঠানো। A থেকে কাটা আর B তে যোগ হওয়া, দুটো একসাথে ঘটতে হবে।

### BASE কী? ACID এর সাথে পার্থক্য কী?
BASE হলো অনেক NoSQL এর দর্শন:

- **B**asically **A**vailable: সবসময় সাড়া দেওয়ার চেষ্টা করে
- **S**oft state: state সময়ের সাথে বদলাতে পারে
- **E**ventually consistent: কিছুক্ষণ পর সব node এ data মিলে যায়

ACID কঠোর consistency দেয়, BASE availability ও scale কে অগ্রাধিকার দেয়। (তবে MongoDB এখন multi-document ACID transaction ও দেয়।)

### CAP theorem কী?
Distributed system এ তিনটির মধ্যে একসাথে সর্বোচ্চ দুটি পাওয়া যায়:

- **Consistency**: সব node একই data দেখে
- **Availability**: প্রতিটি request এর সাড়া মেলে
- **Partition tolerance**: network ভেঙে গেলেও system চলে

Network partition এড়ানো যায় না, তাই বাস্তবে **CP** (consistency ধরে রাখে, কিছু request ফেরত দেয় না) অথবা **AP** (available থাকে, কিন্তু পুরোনো data দিতে পারে) বেছে নিতে হয়।

### Normalization কী? 1NF, 2NF, 3NF কী?
Data এর duplication কমাতে ও anomaly (insert/update/delete সমস্যা) এড়াতে table ভাঙার পদ্ধতি।

- **1NF**: প্রতিটি column এ একটি মাত্র atomic value (কমা দিয়ে একাধিক value নয়), duplicate row নয়
- **2NF**: 1NF + কোনো non-key column কেবল composite key এর **অংশের** উপর নির্ভর করবে না
- **3NF**: 2NF + কোনো non-key column আরেকটি non-key column এর উপর নির্ভর করবে না (transitive dependency নয়)

উদাহরণ: `orders` table এ `customer_name` সরাসরি রাখলে ওই customer এর নাম বদলাতে অনেক row বদলাতে হয়। `customers` table আলাদা করে `customer_id` রাখুন।

### Denormalization কী? কখন করে?
ইচ্ছা করে কিছু data duplicate করা, যাতে JOIN কম লাগে এবং read দ্রুত হয়। যেমন order এ `total_price` সংরক্ষণ করা বা post এ `comment_count` রাখা।

করবেন যখন read অনেক বেশি, JOIN ধীর, আর সামান্য duplication মেনে নেওয়া যায়। ঝুঁকি: data একসাথে update না হলে অসঙ্গতি (inconsistency) হয়।

### Primary key, foreign key, unique key আর candidate key কী?
- **Primary key**: প্রতিটি row কে একক ভাবে চেনার column। `NULL` ও duplicate হতে পারে না। Table এ একটাই।
- **Foreign key**: অন্য table এর primary key কে নির্দেশ করে, referential integrity বজায় রাখে।
- **Unique key**: duplicate আটকায়, `NULL` অনুমোদিত (database ভেদে)। একাধিক থাকতে পারে।
- **Candidate key**: যেসব column primary key হওয়ার যোগ্য।

### Index কী? কীভাবে কাজ করে? সুবিধা ও অসুবিধা কী?
Index হলো আলাদা data structure (সাধারণত **B-tree**) যা কোনো column এর মান অনুযায়ী সাজানো থাকে। ফলে পুরো table scan না করে দ্রুত row খুঁজে পাওয়া যায়, যেমন বইয়ের শেষের সূচি।

সুবিধা: `WHERE`, `JOIN`, `ORDER BY` দ্রুত হয়।

অসুবিধা:

- Extra storage নেয়
- `INSERT/UPDATE/DELETE` ধীর হয় (index ও আপডেট করতে হয়)
- অনেক index দিলে write এর খরচ বাড়ে

যে column এ বেশি query হয় ও selectivity ভালো (অনেক আলাদা মান), সেখানে index দিন।

### Transaction কী? `BEGIN`, `COMMIT`, `ROLLBACK` কী?
Transaction হলো একগুচ্ছ operation যা একটি unit হিসেবে চলে।

```sql
BEGIN;
UPDATE accounts SET balance = balance - 500 WHERE id = 1;
UPDATE accounts SET balance = balance + 500 WHERE id = 2;
COMMIT;      -- স্থায়ী করা
-- সমস্যা হলে: ROLLBACK;  (সব বাতিল)
```

### Isolation level গুলো কী কী? Dirty read, non-repeatable read, phantom read কী?
**সমস্যা:**

- **Dirty read**: অন্য transaction এর uncommitted data পড়া
- **Non-repeatable read**: একই row দুইবার পড়লে মান আলাদা (মাঝে অন্য transaction commit করেছে)
- **Phantom read**: একই query দুইবার চালালে row এর সংখ্যা আলাদা (নতুন row ঢুকেছে)

**Level (নিচ থেকে উপরে):**

- Read Uncommitted
- Read Committed (PostgreSQL এর default)
- Repeatable Read (MySQL InnoDB এর default)
- Serializable (সবচেয়ে কঠোর, ধীর)

উপরের level এ consistency বেশি, কিন্তু concurrency ও performance কমে।

### Deadlock কী? কীভাবে এড়াবে?
দুটি transaction একে অপরের lock করা resource এর জন্য অপেক্ষা করতে থাকলে কেউ এগোতে পারে না, একে deadlock বলে। Database সাধারণত একটিকে নিজে abort করে।

এড়ানোর উপায়:

- সবসময় একই ক্রমে row/table lock করা
- Transaction ছোট ও দ্রুত রাখা
- অপ্রয়োজনে বেশি row lock না করা
- Deadlock এ retry logic রাখা

### Replication, sharding আর partitioning এর পার্থক্য কী?
- **Replication**: একই data এর কপি একাধিক server এ। Read scale, high availability ও backup এর জন্য।
- **Partitioning**: একটি বড় table কে একই database এর ভেতরে ছোট ছোট অংশে ভাগ করা (যেমন তারিখ অনুযায়ী)। Query ও maintenance দ্রুত হয়।
- **Sharding**: data কে একাধিক আলাদা server এ ভাগ করে রাখা (horizontal scaling)। প্রতিটি server একটি অংশ রাখে। Write scale এর জন্য।

### Scaling কী? কেন দরকার?
Scaling মানে system এর **load (ব্যবহারকারী, request, data) বাড়লেও** যেন সে ঠিকমতো ও দ্রুত চলে সেই সক্ষমতা বাড়ানো।

শুরুতে কয়েকজন user থাকলে একটি server ও একটি database যথেষ্ট। User হাজার বা লাখে পৌঁছালে:

- Response ধীর হয়ে যায়
- CPU, memory বা disk ভরে যায়
- Database এর connection ও query এ চাপ পড়ে
- Server crash করতে পারে

তখন scaling দরকার হয়, যাতে বাড়তি চাপ সামলানো যায় এবং system সবসময় available থাকে।

Scaling এর দুটি মূল ধরন: **vertical** (একটি মেশিন শক্তিশালী করা) এবং **horizontal** (আরও মেশিন যোগ করা)। নিচের প্রশ্নে বিস্তারিত।

Database এ scaling এর সাধারণ ধাপ:

- আগে query ও index optimize করা (সবচেয়ে সস্তা)
- Caching (Redis)
- Vertical scaling
- Read replica (read ভাগ করা)
- Partitioning ও sharding (write ভাগ করা)

**Interview answer:** "Scaling is the ability of a system to handle increased load, such as more users, requests, or data, without degrading performance. It can be done vertically by adding more resources to a single machine, or horizontally by adding more machines. For databases I usually start with query and index optimization and caching, then add read replicas, and use sharding only when necessary."

### Vertical আর horizontal scaling কী?
- **Vertical**: server এর CPU/RAM/disk বাড়ানো। সহজ, কিন্তু সীমা আছে ও ব্যয়বহুল।
- **Horizontal**: আরও server যোগ করা (replication, sharding)। বেশি scale হয় কিন্তু জটিল।

### N+1 query সমস্যা কী? কীভাবে সমাধান করবে?
একটি query দিয়ে N টি item আনার পর প্রতিটি item এর related data আনতে আলাদা করে আরও N টি query চালানো। মোট N+1 টি query।

```js
// N+1 সমস্যা
const posts = await Post.find();
for (const p of posts) {
  p.author = await User.findById(p.authorId); // প্রতিবার আলাদা query
}
```

সমাধান: JOIN বা `$lookup`, ORM এর eager loading (`include`/`populate`), `WHERE id IN (...)` দিয়ে একসাথে আনা, DataLoader (GraphQL এ)।

### Connection pooling কী? কেন দরকার?
প্রতিটি request এর জন্য নতুন database connection খোলা ধীর ও ব্যয়বহুল। Pool আগে থেকে কিছু connection খুলে রাখে এবং request এ ধার দেয়, কাজ শেষে ফেরত নেয়। Database এর সর্বোচ্চ connection সীমাও সুরক্ষিত থাকে।

Node.js এ `pg.Pool`, Mongoose/MongoDB driver এর নিজস্ব pool আছে। PostgreSQL এর জন্য অনেক connection হলে PgBouncer ব্যবহার হয়।

### ORM কী? ORM vs raw SQL
ORM (Object-Relational Mapper) হলো code এর object কে database table এর সাথে map করার library। উদাহরণ: Prisma, Sequelize, TypeORM, Drizzle, Mongoose (ODM)।

- ORM: দ্রুত লেখা, type safety, migration, SQL injection থেকে সুরক্ষা। জটিল query তে ধীর বা অদক্ষ SQL তৈরি করতে পারে।
- Raw SQL: পূর্ণ নিয়ন্ত্রণ ও performance, কিন্তু বেশি code ও injection এর ঝুঁকি (parameterize না করলে)।

বাস্তবে সহজ কাজে ORM, জটিল/ভারী query তে raw SQL।

### Database caching কী? Redis কীভাবে সাহায্য করে?
বারবার একই data আনা ঠেকাতে স্থায়ী database এর সামনে দ্রুত memory-ভিত্তিক cache (Redis, Memcached) রাখা হয়।

- Cache hit: Redis থেকে সাথে সাথে data
- Cache miss: database থেকে এনে Redis এ রাখা (TTL সহ)
- সবচেয়ে কঠিন অংশ হলো cache invalidation (data বদলালে cache মুছে ফেলা বা update করা)

### Backup আর recovery কীভাবে করবে?
- নিয়মিত full backup ও incremental/WAL archive
- Point-in-time recovery (PITR): নির্দিষ্ট সময়ে ফিরে যাওয়া
- Backup restore করে test করা (না করলে backup ব্যবহারযোগ্য কিনা জানা যায় না)
- Replica দিয়ে high availability, কিন্তু replica কোনোভাবেই backup এর বিকল্প নয়
- PostgreSQL এ `pg_dump`/`pg_basebackup`, MongoDB তে `mongodump` ও Atlas snapshot

## ২. SQL ও PostgreSQL

### JOIN এর ধরনগুলো কী কী?
- **INNER JOIN**: দুই table এ মিল আছে এমন row
- **LEFT JOIN**: বাম table এর সব row, ডান এ মিল না থাকলে `NULL`
- **RIGHT JOIN**: ডান table এর সব row, বামে মিল না থাকলে `NULL`
- **FULL OUTER JOIN**: দুই পাশেরই সব row
- **CROSS JOIN**: সব সম্ভাব্য জোড়া (cartesian product)
- **SELF JOIN**: একই table কে নিজের সাথে join

```sql
SELECT u.name, o.total
FROM users u
LEFT JOIN orders o ON o.user_id = u.id;
```

### `WHERE` আর `HAVING` এর পার্থক্য কী?
- `WHERE`: group করার **আগে** row filter করে। Aggregate function ব্যবহার করা যায় না।
- `HAVING`: group করার **পরে** group filter করে। Aggregate function ব্যবহার করা যায়।

```sql
SELECT dept, COUNT(*) AS cnt
FROM employees
WHERE active = true        -- আগে row ছাঁটা
GROUP BY dept
HAVING COUNT(*) > 5;       -- পরে group ছাঁটা
```

### `GROUP BY` কীভাবে কাজ করে? SQL query এর execution order কী?
`GROUP BY` একই মানের row গুলো জড়ো করে aggregate (`COUNT`, `SUM`, `AVG`, `MIN`, `MAX`) চালায়।

Query লেখার ক্রম আর চলার ক্রম আলাদা। চলার ক্রম:

- `FROM` / `JOIN`
- `WHERE`
- `GROUP BY`
- `HAVING`
- `SELECT`
- `DISTINCT`
- `ORDER BY`
- `LIMIT`

এ কারণেই `WHERE` এ `SELECT` এর alias ব্যবহার করা যায় না।

### `UNION` আর `UNION ALL` এর পার্থক্য কী?
`UNION` দুটি query এর ফল জুড়ে **duplicate সরিয়ে দেয়** (তাই ধীর)। `UNION ALL` duplicate সহ সব রাখে (দ্রুত)। Duplicate সরানোর দরকার না থাকলে `UNION ALL` ব্যবহার করুন।

### `DELETE`, `TRUNCATE` আর `DROP` এর পার্থক্য কী?
- `DELETE`: `WHERE` দিয়ে নির্দিষ্ট row মোছে, row ধরে ধরে। ধীর, trigger চলে, rollback করা যায়।
- `TRUNCATE`: table এর সব row একসাথে মোছে। দ্রুত, `WHERE` নেই। PostgreSQL এ transaction এর ভেতরে rollback করা যায়।
- `DROP`: table এর structure সহ পুরোটাই মুছে ফেলে।

### Primary key এর জন্য `SERIAL`, `IDENTITY` আর `UUID` এর তুলনা
- `SERIAL`: পুরোনো পদ্ধতি, sequence এর shortcut
- `GENERATED ALWAYS AS IDENTITY`: আধুনিক ও SQL standard অনুযায়ী, PostgreSQL এ এটাই প্রস্তাবিত
- `UUID`: globally unique, আন্দাজ করা কঠিন (URL এ id দেখানোর জন্য নিরাপদ), distributed system এ ভালো। কিন্তু বেশি জায়গা নেয় এবং random UUID এ index fragmentation হয়। UUIDv7 (সময় অনুযায়ী ক্রমিক) এ এই সমস্যা কম।

### Subquery আর JOIN এর মধ্যে কোনটা ভালো?
অনেক ক্ষেত্রে optimizer দুটোকে একই রকম plan এ বদলে দেয়। সাধারণ নিয়ম:

- Related table এর column ও দরকার হলে **JOIN**
- শুধু অস্তিত্ব দেখতে হলে `EXISTS`
- `IN (subquery)` বড় result এ ধীর হতে পারে, `EXISTS` প্রায়ই ভালো
- নিশ্চিত হতে `EXPLAIN ANALYZE` দিয়ে মাপুন

### CTE (`WITH`) কী? Recursive CTE কী?
CTE হলো query এর ভেতরে নাম দেওয়া অস্থায়ী result, যা query কে পরিষ্কার ও পড়ার যোগ্য করে।

```sql
WITH recent AS (
  SELECT * FROM orders WHERE created_at > now() - interval '7 days'
)
SELECT user_id, SUM(total) FROM recent GROUP BY user_id;
```

**Recursive CTE** hierarchical data (category tree, org chart) এর জন্য:

```sql
WITH RECURSIVE tree AS (
  SELECT id, name, parent_id FROM categories WHERE parent_id IS NULL
  UNION ALL
  SELECT c.id, c.name, c.parent_id
  FROM categories c JOIN tree t ON c.parent_id = t.id
)
SELECT * FROM tree;
```

### Window function কী? `ROW_NUMBER`, `RANK`, `DENSE_RANK` এর পার্থক্য কী?
Window function row গুলোকে group এ না ভেঙেই একটি "window" এর উপর হিসাব করে। প্রতিটি row আলাদা থাকে।

- `ROW_NUMBER()`: প্রতিটি row এ ক্রমিক নম্বর (1, 2, 3, 4), সমান মানেও আলাদা নম্বর
- `RANK()`: সমান মানে একই rank, পরের rank এ ফাঁক থাকে (1, 2, 2, 4)
- `DENSE_RANK()`: সমান মানে একই rank, ফাঁক থাকে না (1, 2, 2, 3)
- অন্যান্য: `LAG`, `LEAD`, `SUM() OVER`, `NTILE`

```sql
SELECT name, dept, salary,
       RANK() OVER (PARTITION BY dept ORDER BY salary DESC) AS r
FROM employees;
```

### View আর materialized view এর পার্থক্য কী?
- **View**: সংরক্ষিত query। প্রতিবার ব্যবহারে query আবার চলে, data সংরক্ষণ হয় না।
- **Materialized view**: query এর **ফলাফল** সংরক্ষণ করে। দ্রুত পড়া যায়, কিন্তু পুরোনো হতে পারে। `REFRESH MATERIALIZED VIEW` দিয়ে নতুন করতে হয়। ভারী report এর জন্য ভালো।

### PostgreSQL এ কী কী ধরনের index আছে?
- **B-tree** (default): `=`, `<`, `>`, `BETWEEN`, `ORDER BY` এ কাজ করে
- **Hash**: শুধু `=` তুলনায়
- **GIN**: array, `jsonb`, full-text search এ (একটি value এ অনেক key থাকলে)
- **GiST**: geometry/geo data, range type, nearest-neighbor
- **BRIN**: খুব বড় table যেখানে data স্বাভাবিকভাবে সাজানো (যেমন time-series), খুব ছোট index
- **SP-GiST**: বিশেষ ধরনের partitioned data এর জন্য

### Composite index আর partial index কী?
- **Composite (multi-column)**: একাধিক column এ একটি index। **Column এর ক্রম গুরুত্বপূর্ণ**। `(a, b)` index `WHERE a = ?` ও `WHERE a = ? AND b = ?` এ কাজ করে, কিন্তু শুধু `WHERE b = ?` এ সাধারণত কাজে লাগে না (leftmost prefix নিয়ম)।
- **Partial index**: শুধু শর্ত মেলা row এর উপর index। ছোট ও দ্রুত।

```sql
CREATE INDEX idx_orders_user_date ON orders (user_id, created_at DESC);
CREATE INDEX idx_active_users ON users (email) WHERE deleted_at IS NULL;
```

### `EXPLAIN` আর `EXPLAIN ANALYZE` কী? Slow query কীভাবে খুঁজবে ও ঠিক করবে?
- `EXPLAIN`: query plan দেখায় (আসলে না চালিয়ে আনুমানিক)।
- `EXPLAIN ANALYZE`: query সত্যিই চালিয়ে আসল সময় ও row এর সংখ্যা দেখায়।

কী দেখবেন:

- **Seq Scan** (পুরো table পড়া) বড় table এ থাকলে index দরকার হতে পারে
- **Index Scan / Index Only Scan** ভালো লক্ষণ
- Estimated rows আর actual rows এর বড় পার্থক্য (statistics পুরোনো, `ANALYZE` চালান)
- খুব ধীর নোড কোনটি (actual time)

ধাপ: slow query log/`pg_stat_statements` দিয়ে ধীর query খুঁজুন, `EXPLAIN ANALYZE` চালান, ঠিক index দিন, `SELECT *` এড়ান, N+1 ঠিক করুন, আবার মাপুন।

### MVCC কী? PostgreSQL এ কীভাবে কাজ করে?
MVCC (Multi-Version Concurrency Control): প্রতিটি update এ পুরোনো row মুছে ফেলার বদলে একটি **নতুন version** তৈরি হয়। প্রতিটি transaction তার শুরুর snapshot অনুযায়ী উপযুক্ত version দেখে।

ফল: **reader writer কে আটকায় না, writer reader কে আটকায় না**। উচ্চ concurrency এ ভালো। দাম: পুরোনো version (dead tuple) জমে যায়।

### `VACUUM` কী? কেন দরকার?
MVCC এর কারণে update/delete এ dead tuple জমে table ফুলে যায় (bloat)। `VACUUM` এই dead row এর জায়গা পুনরায় ব্যবহারযোগ্য করে। `autovacuum` নিজে নিজে এটা চালায়। `VACUUM FULL` table পুনর্লিখন করে ডিস্ক ফেরত দেয়, কিন্তু table lock করে। `ANALYZE` query planner এর statistics আপডেট করে।

### `JSON` আর `JSONB` এর পার্থক্য কী? PostgreSQL এ JSON কীভাবে query করে?
- `JSON`: text হিসেবে হুবহু সংরক্ষণ করে (whitespace ও key এর ক্রম সহ), index করা যায় না
- `JSONB`: binary format, দ্রুত query, **GIN index** দেওয়া যায়, duplicate key বাদ যায়। সাধারণত `JSONB` ই ব্যবহার করুন।

```sql
SELECT data->>'name' FROM users;                 -- text আকারে
SELECT * FROM users WHERE data @> '{"role":"admin"}';  -- contains
CREATE INDEX idx_data ON users USING GIN (data);
```

### Pagination: `OFFSET` আর keyset (cursor) pagination এর পার্থক্য
- `LIMIT/OFFSET`: সহজ, কিন্তু offset বড় হলে ধীর (database কে আগের সব row পড়ে বাদ দিতে হয়) এবং page বদলের সময় data insert হলে row বাদ/duplicate হতে পারে।
- **Keyset**: শেষ দেখা item এর মান ধরে পরের অংশ আনা। index এর কারণে দ্রুত ও স্থিতিশীল।

```sql
-- offset
SELECT * FROM posts ORDER BY id LIMIT 20 OFFSET 10000;
-- keyset
SELECT * FROM posts WHERE id > 10000 ORDER BY id LIMIT 20;
```

### Upsert কী? PostgreSQL এ কীভাবে করে?
Row না থাকলে insert, থাকলে update। PostgreSQL এ `ON CONFLICT`:

```sql
INSERT INTO users (email, name)
VALUES ('a@b.com', 'Rahim')
ON CONFLICT (email)
DO UPDATE SET name = EXCLUDED.name;
-- বা কিছু না করতে: ON CONFLICT DO NOTHING
```

### Constraint গুলো কী কী?
`NOT NULL`, `UNIQUE`, `PRIMARY KEY`, `FOREIGN KEY`, `CHECK` (শর্ত যাচাই), `DEFAULT`। Application এ validation থাকলেও database এ constraint রাখুন, কারণ এটাই শেষ রক্ষাকবচ।

```sql
CREATE TABLE orders (
  id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
  user_id BIGINT NOT NULL REFERENCES users(id) ON DELETE CASCADE,
  total NUMERIC(10,2) CHECK (total >= 0),
  status TEXT NOT NULL DEFAULT 'pending'
);
```

### Trigger আর stored procedure/function কী?
- **Trigger**: কোনো ঘটনায় (`INSERT/UPDATE/DELETE`) স্বয়ংক্রিয়ভাবে চলা function (audit log, `updated_at` আপডেট)
- **Stored procedure/function**: database এর ভেতরে সংরক্ষিত logic, বারবার ডাকা যায়

সাবধান: বেশি logic database এ রাখলে test, version control ও debug কঠিন হয়। জটিল business logic সাধারণত application এ রাখা হয়।

### PostgreSQL এ full-text search কীভাবে হয়?
`tsvector` (document) ও `tsquery` (প্রশ্ন) দিয়ে। `GIN` index দিলে দ্রুত হয়।

```sql
SELECT * FROM articles
WHERE to_tsvector('english', title || ' ' || body) @@ plainto_tsquery('english', 'database index');
```

বাংলা ভাষা বা উন্নত search এ Elasticsearch/Meilisearch বেশি উপযুক্ত।

### PostgreSQL আর MySQL এর মূল পার্থক্য কী?
- PostgreSQL: বেশি standard মেনে চলে, উন্নত feature (JSONB, CTE, window function, array, custom type, extension যেমন PostGIS), জটিল query তে শক্তিশালী
- MySQL: সহজ, read-heavy web app এ জনপ্রিয় ও দ্রুত, ব্যাপক hosting সুবিধা
- Transaction/locking: দুটোই MVCC, default isolation আলাদা (PG: Read Committed, MySQL: Repeatable Read)

## ৩. MongoDB

### MongoDB কী? Document database বলতে কী বোঝায়?
MongoDB একটি NoSQL **document database**। Data JSON-এর মতো **document** (BSON format) আকারে থাকে, নির্দিষ্ট schema বাধ্যতামূলক নয়। একই collection এর document গুলোর structure আলাদা হতে পারে। Nested object ও array সরাসরি রাখা যায়।

```js
{
  _id: ObjectId("..."),
  name: "Rahim",
  age: 28,
  address: { city: "Dhaka", zip: "1207" },
  skills: ["js", "react", "node"]
}
```

### SQL এর সাথে MongoDB এর শব্দ মিলাও (table, row, column, join)
- Database → Database
- Table → **Collection**
- Row → **Document**
- Column → **Field**
- Primary key → `_id`
- JOIN → `$lookup` বা embedding
- Index → Index

### BSON কী? JSON থেকে কীভাবে আলাদা?
BSON হলো binary JSON। JSON এর চেয়ে বেশি data type সাপোর্ট করে (`Date`, `ObjectId`, `Decimal128`, `Binary`, `Int32/64`), এবং scan করা দ্রুত। MongoDB এ document BSON এ সংরক্ষিত হয়।

### `ObjectId` কী? এর গঠন কেমন?
`_id` এর default মান। ১২ byte এর unique id:

- ৪ byte: তৈরির সময় (timestamp)
- ৫ byte: random মান (machine/process সম্পর্কিত)
- ৩ byte: ক্রমিক counter

তাই এটি প্রায় সময়ের ক্রম অনুযায়ী সাজানো ও আলাদা server এ তৈরি হলেও unique থাকে। `_id` থেকে তৈরির সময় বের করা যায়: `id.getTimestamp()`।

### MongoDB এর CRUD operation গুলো দেখাও
```js
// Create
db.users.insertOne({ name: "Rahim", age: 28 });
db.users.insertMany([{ name: "A" }, { name: "B" }]);

// Read
db.users.find({ age: { $gt: 25 } }, { name: 1, _id: 0 }).sort({ age: -1 }).limit(10);
db.users.findOne({ name: "Rahim" });

// Update
db.users.updateOne({ name: "Rahim" }, { $set: { age: 29 }, $inc: { logins: 1 } });
db.users.updateMany({}, { $set: { active: true } });

// Delete
db.users.deleteOne({ name: "Rahim" });
db.users.deleteMany({ active: false });
```

### MongoDB এর common query ও update operator গুলো কী?
- তুলনা: `$eq`, `$ne`, `$gt`, `$gte`, `$lt`, `$lte`, `$in`, `$nin`
- যুক্তি: `$and`, `$or`, `$not`, `$nor`
- Element: `$exists`, `$type`
- Array: `$all`, `$elemMatch`, `$size`
- Update: `$set`, `$unset`, `$inc`, `$push`, `$pull`, `$addToSet`, `$rename`

### Embedding আর referencing এর পার্থক্য কী? কখন কোনটা?
- **Embedding**: সম্পর্কিত data একই document এর ভেতরে রাখা। এক query তে সব পাওয়া যায়, কিন্তু document বড় হতে পারে এবং duplication হয়।
- **Referencing**: অন্য document এর `_id` রাখা (SQL এর foreign key এর মতো)। Data আলাদা, কিন্তু একাধিক query/`$lookup` লাগে।

Embed করুন যখন: data একসাথে পড়া হয়, "এক থেকে কয়েক" সম্পর্ক, ছোট ও সীমিত data (যেমন user এর address)।

Reference করুন যখন: "এক থেকে অনেক" বা "অনেক থেকে অনেক", data অসীম বাড়তে পারে (যেমন post এর হাজার হাজার comment), আলাদাভাবে ব্যবহার হয়।

নিয়ম: **যেভাবে data পড়বেন সেই access pattern অনুযায়ী schema বানান।** Document এর সীমা 16MB।

### MongoDB এ index কীভাবে কাজ করে? কী কী ধরনের index আছে?
SQL এর মতোই index query কে collection scan (`COLLSCAN`) এর বদলে index scan (`IXSCAN`) এ দ্রুত করে।

ধরন: single field, **compound**, multikey (array এর উপর), text, geospatial (`2dsphere`), hashed, **TTL**, unique, partial, sparse।

```js
db.users.createIndex({ email: 1 }, { unique: true });
db.orders.createIndex({ userId: 1, createdAt: -1 });
db.sessions.createIndex({ createdAt: 1 }, { expireAfterSeconds: 3600 }); // TTL
```

### Compound index এ ESR rule কী?
Compound index এর field ক্রম সাজানোর নিয়ম:

- **E**quality (সমান `=` দিয়ে filter) আগে
- **S**ort (যে field দিয়ে sort) তারপর
- **R**ange (`$gt`, `$lt`, `$in` range) শেষে

এতে index পুরোপুরি ব্যবহৃত হয় এবং in-memory sort এড়ানো যায়।

### `explain()` দিয়ে query কীভাবে বিশ্লেষণ করবে?
```js
db.orders.find({ userId: 5 }).explain("executionStats");
```

দেখবেন:

- `stage`: `COLLSCAN` (খারাপ, পুরো collection) নাকি `IXSCAN` (ভালো)
- `totalDocsExamined` এর সাথে `nReturned` এর অনুপাত (যত কাছাকাছি তত ভালো)
- `executionTimeMillis`
- "covered query" হলে `totalDocsExamined` 0 (index থেকেই উত্তর)

### Aggregation pipeline কী? প্রধান stage গুলো কী কী?
Document গুলো একটির পর একটি stage এর ভেতর দিয়ে গিয়ে রূপান্তরিত হয়, যেমন SQL এর `WHERE + GROUP BY + JOIN + ORDER BY` একসাথে।

প্রধান stage: `$match` (filter), `$group`, `$project`, `$sort`, `$limit`, `$skip`, `$lookup` (join), `$unwind` (array ভাঙা), `$addFields`, `$facet`, `$count`।

```js
db.orders.aggregate([
  { $match: { status: "paid" } },
  { $group: { _id: "$userId", total: { $sum: "$amount" }, count: { $sum: 1 } } },
  { $sort: { total: -1 } },
  { $limit: 5 },
]);
```

Performance এর জন্য `$match` ও `$limit` যতটা সম্ভব আগে রাখুন, যাতে index ব্যবহার হয় ও পরের stage এ কম data যায়।

### `$lookup` কী? এটা SQL এর JOIN এর মতো কি?
`$lookup` হলো aggregation এ **left outer join**: অন্য collection থেকে মিল থাকা document এনে একটি array field এ বসায়।

```js
db.orders.aggregate([
  { $lookup: { from: "users", localField: "userId", foreignField: "_id", as: "user" } },
  { $unwind: "$user" },
]);
```

কিন্তু SQL JOIN এর মতো এত দক্ষ নয়, বেশি ব্যবহার করলে ধীর হয়। বারবার `$lookup` লাগলে বুঝতে হবে data embed করা উচিত ছিল।

### MongoDB তে transaction আছে কি? কীভাবে কাজ করে?
হ্যাঁ। MongoDB 4.0 থেকে replica set এ এবং 4.2 থেকে sharded cluster এও **multi-document ACID transaction** আছে।

- **একটি document এর** operation সবসময়ই atomic। তাই ভালো schema design এ (embedding) অনেক সময় transaction লাগেই না।
- Multi-document transaction এ বাড়তি overhead আছে, তাই শুধু প্রয়োজনে ব্যবহার করুন।

```js
const session = await mongoose.startSession();
await session.withTransaction(async () => {
  await Account.updateOne({ _id: a }, { $inc: { balance: -100 } }, { session });
  await Account.updateOne({ _id: b }, { $inc: { balance: 100 } }, { session });
});
session.endSession();
```

### Replica set কী?
একাধিক MongoDB server এর গ্রুপ যেখানে একটি **primary** (সব write এখানে) ও কয়েকটি **secondary** (primary এর কপি) থাকে। Primary নষ্ট হলে secondary দের মধ্যে **election** হয়ে নতুন primary নির্বাচিত হয় (automatic failover)। উদ্দেশ্য: high availability ও redundancy, এবং চাইলে secondary থেকে read।

### Sharding কী? Shard key কীভাবে বেছে নেবে?
Data কে একাধিক shard (আলাদা server/replica set) এ ভাগ করা (horizontal scaling)। `mongos` router query কে সঠিক shard এ পাঠায়, config server metadata রাখে।

Shard key বাছাইয়ের নিয়ম:

- **High cardinality** (অনেক আলাদা মান)
- সমানভাবে বণ্টন হবে (hot spot হবে না)
- Query তে প্রায়ই ব্যবহার হবে (targeted query)
- ক্রমাগত বাড়তে থাকা মান (যেমন timestamp, auto-increment) সরাসরি ranged key হিসেবে দিলে সব write এক shard এ যায়, তাই **hashed** key বিবেচনা করুন

### Write concern আর read concern কী?
- **Write concern** (`w`): write সফল ধরা হবে কতগুলো node এ লেখার পর। `w: 1` শুধু primary, `w: "majority"` বেশিরভাগ node, যা সবচেয়ে নিরাপদ।
- **Read concern**: কেমন data পড়বে (`local`, `majority`, `snapshot`), অর্থাৎ rollback হয়ে যেতে পারে এমন data পড়বে কিনা।

### MongoDB তে pagination কীভাবে করবে?
- `skip().limit()`: সহজ কিন্তু বড় skip এ ধীর (SQL এর OFFSET এর মতোই)
- **Range/cursor based**: শেষ `_id` ধরে পরের অংশ

```js
// skip/limit
db.posts.find().sort({ _id: 1 }).skip(1000).limit(20);
// range based (দ্রুত)
db.posts.find({ _id: { $gt: lastId } }).sort({ _id: 1 }).limit(20);
```

### `countDocuments` আর `estimatedDocumentCount` এর পার্থক্য কী?
- `countDocuments(filter)`: filter অনুযায়ী সঠিক গণনা, ধীর হতে পারে
- `estimatedDocumentCount()`: collection metadata থেকে আনুমানিক মোট সংখ্যা, খুব দ্রুত কিন্তু filter নেওয়া যায় না

### MongoDB তে schema validation কীভাবে করবে?
Collection level এ `$jsonSchema` validator দিয়ে (database স্তরে নিয়ম), অথবা application স্তরে Mongoose schema দিয়ে।

```js
db.createCollection("users", {
  validator: { $jsonSchema: {
    bsonType: "object",
    required: ["email"],
    properties: { email: { bsonType: "string" }, age: { bsonType: "int", minimum: 0 } },
  } },
});
```

### MongoDB কখন ব্যবহার করবে, কখন করবে না?
ব্যবহার করুন: schema বদলায়, nested/hierarchical data, content management, catalog, log/event data, দ্রুত prototype, horizontal scale দরকার।

এড়ান: অনেক complex JOIN ও relation, কঠোর multi-table transaction (financial ledger), জটিল reporting/analytics যেখানে SQL এর শক্তি বেশি কাজে আসে।

## ৪. Node.js এর সাথে Database

### Node.js এ PostgreSQL কীভাবে ব্যবহার করে? (`pg` ও connection pool)
```js
import pg from "pg";
const pool = new pg.Pool({ connectionString: process.env.DATABASE_URL, max: 10 });

export async function getUser(id) {
  const { rows } = await pool.query("SELECT * FROM users WHERE id = $1", [id]);
  return rows[0];
}
```

প্রতিটি request এ নতুন `Client` না খুলে একটি `Pool` শেয়ার করুন।

### SQL injection কী? কীভাবে প্রতিরোধ করবে?
User input কে সরাসরি SQL string এ জুড়ে দিলে আক্রমণকারী নিজের SQL ঢুকিয়ে দিতে পারে।

```js
// ভুল (বিপজ্জনক)
pool.query(`SELECT * FROM users WHERE email = '${email}'`);
// email = ' OR '1'='1  হলে সব user বেরিয়ে যায়

// ঠিক: parameterized query
pool.query("SELECT * FROM users WHERE email = $1", [email]);
```

প্রতিরোধ: সবসময় parameterized query/prepared statement, ORM ব্যবহার, input validate করা, database user এর ন্যূনতম অনুমতি। MongoDB তেও **NoSQL injection** আছে (`{ $ne: null }` পাঠিয়ে login bypass)। তাই input এর type যাচাই করুন, `express-mongo-sanitize` ব্যবহার করুন।

### Node এ PostgreSQL transaction কীভাবে করবে?
Transaction এ **একই connection** ব্যবহার করতে হয়, তাই pool থেকে `client` নিতে হয়।

```js
const client = await pool.connect();
try {
  await client.query("BEGIN");
  await client.query("UPDATE accounts SET balance = balance - $1 WHERE id = $2", [100, 1]);
  await client.query("UPDATE accounts SET balance = balance + $1 WHERE id = $2", [100, 2]);
  await client.query("COMMIT");
} catch (e) {
  await client.query("ROLLBACK");
  throw e;
} finally {
  client.release(); // pool এ ফেরত দিন
}
```

### Mongoose কী? Schema ও model কীভাবে বানায়?
Mongoose হলো MongoDB এর ODM। Schema দিয়ে structure, validation ও default নির্ধারণ করা যায়।

```js
import mongoose from "mongoose";

const userSchema = new mongoose.Schema({
  name: { type: String, required: true, trim: true },
  email: { type: String, required: true, unique: true, lowercase: true },
  age: { type: Number, min: 0 },
  posts: [{ type: mongoose.Schema.Types.ObjectId, ref: "Post" }],
}, { timestamps: true });

export const User = mongoose.model("User", userSchema);
await mongoose.connect(process.env.MONGO_URI);
```

### Mongoose এ `populate` কী? `lean()` কী?
- `populate()`: referenced document এর আসল data এনে বসায় (JOIN এর মতো, ভেতরে আলাদা query চালায়)
- `lean()`: Mongoose document এর বদলে সাধারণ JS object return করে। দ্রুত ও কম memory, কিন্তু `save()`, virtual ইত্যাদি পাওয়া যায় না। শুধু পড়ার জন্য ভালো।

```js
const posts = await Post.find().populate("author", "name email").lean();
```

### Mongoose middleware (hooks) কী?
Schema এ `pre`/`post` hook। যেমন save এর আগে password hash:

```js
userSchema.pre("save", async function (next) {
  if (!this.isModified("password")) return next();
  this.password = await bcrypt.hash(this.password, 10);
  next();
});
```

### Migration কী? কীভাবে করে?
Database schema বদলের ধারাবাহিক, version-controlled script। SQL এ Prisma Migrate, Knex, TypeORM migration, Flyway ব্যবহার হয়। Production এ নিরাপদ migration এর নিয়ম:

- ছোট ও backward-compatible ধাপে করুন (আগে column যোগ, code deploy, তারপর পুরোনোটি সরান)
- বড় table এ index `CREATE INDEX CONCURRENTLY` দিয়ে দিন (lock এড়াতে)
- আগে staging এ test করুন, backup রাখুন

MongoDB schema-less, তবে data migration প্রায়ই লাগে (`migrate-mongo`)।

### Node এ database error কীভাবে handle করবে?
- Unique constraint violation (PG error code `23505`, Mongo `11000`) আলাদা করে ধরে "আগে থেকেই আছে" বার্তা দিন
- Connection error এ retry/backoff ও health check
- `try/catch` ও centralized error handler
- ভেতরের error message (SQL, stack) ব্যবহারকারীকে দেখাবেন না, শুধু log করুন

## ৫. Query লেখার অনুশীলন

### দ্বিতীয় সর্বোচ্চ salary বের করো
```sql
-- ১. subquery
SELECT MAX(salary) FROM employees
WHERE salary < (SELECT MAX(salary) FROM employees);

-- ২. DENSE_RANK (N তম salary এর জন্য সাধারণ রূপ)
SELECT salary FROM (
  SELECT salary, DENSE_RANK() OVER (ORDER BY salary DESC) AS r
  FROM employees
) t WHERE r = 2 LIMIT 1;

-- ৩. OFFSET
SELECT DISTINCT salary FROM employees ORDER BY salary DESC OFFSET 1 LIMIT 1;
```

### Duplicate email খুঁজে বের করো এবং একটি রেখে বাকি মুছে ফেলো
```sql
-- খুঁজে বের করা
SELECT email, COUNT(*) FROM users
GROUP BY email HAVING COUNT(*) > 1;

-- মোছা (সবচেয়ে ছোট id রেখে)
DELETE FROM users a
USING users b
WHERE a.id > b.id AND a.email = b.email;
```

### প্রতিটি department এর শীর্ষ ৩ জন বেশি salary পাওয়া employee
```sql
SELECT * FROM (
  SELECT name, dept, salary,
         ROW_NUMBER() OVER (PARTITION BY dept ORDER BY salary DESC) AS rn
  FROM employees
) t
WHERE rn <= 3;
```

### যেসব user কোনো order করেনি তাদের খুঁজে বের করো
```sql
-- LEFT JOIN
SELECT u.* FROM users u
LEFT JOIN orders o ON o.user_id = u.id
WHERE o.id IS NULL;

-- NOT EXISTS (প্রায়ই ভালো)
SELECT u.* FROM users u
WHERE NOT EXISTS (SELECT 1 FROM orders o WHERE o.user_id = u.id);
```

### Manager এর চেয়ে বেশি salary পাওয়া employee (self join)
```sql
SELECT e.name
FROM employees e
JOIN employees m ON e.manager_id = m.id
WHERE e.salary > m.salary;
```

### মাসিক revenue ও running total
```sql
SELECT date_trunc('month', created_at) AS month,
       SUM(total) AS revenue,
       SUM(SUM(total)) OVER (ORDER BY date_trunc('month', created_at)) AS running_total
FROM orders
GROUP BY 1
ORDER BY 1;
```

### প্রতিটি user এর মোট order সংখ্যা ও মোট খরচ (শুধু যাদের ৩টির বেশি order)
```sql
SELECT u.id, u.name, COUNT(o.id) AS orders, SUM(o.total) AS spent
FROM users u
JOIN orders o ON o.user_id = u.id
GROUP BY u.id, u.name
HAVING COUNT(o.id) > 3
ORDER BY spent DESC;
```

### MongoDB: প্রতিটি user এর মোট খরচ ও user এর নামসহ শীর্ষ ৫ জন
```js
db.orders.aggregate([
  { $match: { status: "paid" } },
  { $group: { _id: "$userId", spent: { $sum: "$amount" } } },
  { $sort: { spent: -1 } },
  { $limit: 5 },
  { $lookup: { from: "users", localField: "_id", foreignField: "_id", as: "user" } },
  { $unwind: "$user" },
  { $project: { _id: 0, name: "$user.name", spent: 1 } },
]);
```

### MongoDB: কোনো order নেই এমন user খুঁজে বের করো
```js
db.users.aggregate([
  { $lookup: { from: "orders", localField: "_id", foreignField: "userId", as: "orders" } },
  { $match: { orders: { $size: 0 } } },
]);
```

### MongoDB: array তে tag আছে এমন post ও তাদের tag এর গণনা
```js
// "node" tag আছে এমন post
db.posts.find({ tags: "node" });

// প্রতিটি tag কতবার এসেছে
db.posts.aggregate([
  { $unwind: "$tags" },
  { $group: { _id: "$tags", count: { $sum: 1 } } },
  { $sort: { count: -1 } },
]);
```

## ৬. Scenario ও System Design

### E-commerce এর জন্য database schema ডিজাইন করো (PostgreSQL)
মূল table:

- `users (id, email, name, created_at)`
- `products (id, name, price, stock, category_id)`
- `categories (id, name, parent_id)`
- `orders (id, user_id, status, total, created_at)`
- `order_items (id, order_id, product_id, quantity, unit_price)`
- `addresses (id, user_id, ...)`, `payments (id, order_id, status, ...)`

গুরুত্বপূর্ণ সিদ্ধান্ত:

- `order_items` এ `unit_price` সংরক্ষণ করুন, কারণ পরে product এর দাম বদলালেও পুরোনো order এর দাম অপরিবর্তিত থাকতে হবে (ইচ্ছাকৃত denormalization)
- Order তৈরি ও stock কমানো **একটি transaction** এ
- Index: `orders(user_id, created_at)`, `order_items(order_id)`, `products(category_id)`
- Money এর জন্য `NUMERIC` ব্যবহার করুন, `FLOAT` নয়

### Chat application এর জন্য MongoDB তে schema কেমন করবে?
- `conversations { _id, members: [userId], lastMessage, updatedAt }`
- `messages { _id, conversationId, senderId, text, createdAt }`

Message গুলো conversation এর ভেতরে embed না করে **আলাদা collection** এ রাখুন, কারণ message সংখ্যা অসীম বাড়তে পারে (16MB সীমা)। Index: `messages` এ `{ conversationId: 1, createdAt: -1 }`। Pagination এ cursor (`createdAt`/`_id`) ব্যবহার করুন।

### একটি query ধীর চলছে। কী কী ধাপে সমস্যা খুঁজবে?
- ধীর query শনাক্ত (slow query log, `pg_stat_statements`, MongoDB profiler)
- `EXPLAIN ANALYZE` / `explain("executionStats")` দিয়ে plan দেখুন
- Full scan (`Seq Scan`/`COLLSCAN`) হলে উপযুক্ত index যোগ করুন (composite এ ক্রম ঠিক রাখুন)
- `SELECT *` এড়ান, শুধু দরকারি column আনুন
- N+1 ও অপ্রয়োজনীয় JOIN ঠিক করুন
- Pagination এ offset এর বদলে keyset
- Statistics পুরোনো হলে `ANALYZE`
- তারপরও ধীর হলে cache (Redis), read replica, materialized view বিবেচনা করুন
- পরিবর্তনের আগে ও পরে মেপে দেখুন

### Read বেশি এমন application এ database কীভাবে scale করবে?
- আগে query ও index optimize করুন (সবচেয়ে সস্তা সমাধান)
- Redis দিয়ে caching
- Read replica যোগ করে read ভাগ করা (replication lag মাথায় রাখুন)
- Connection pooling (PgBouncer)
- Materialized view/pre-computed data
- সবশেষে sharding (জটিলতা অনেক বেশি, তাই শেষ ভরসা)

### Zero-downtime এ database column বদলাবে কীভাবে? (যেমন column এর নাম পরিবর্তন)
একবারে rename না করে ধাপে ধাপে (expand and contract):

- নতুন column যোগ করুন
- Application এ দুই column এই লিখুন (dual write)
- পুরোনো data নতুন column এ backfill করুন (ছোট batch এ)
- Application কে নতুন column থেকে পড়ানো শুরু করুন
- পুরোনো column এ লেখা বন্ধ করে সরিয়ে ফেলুন

সরাসরি `RENAME` করলে পুরোনো code চলা সার্ভারগুলো ভেঙে যায়।

### কখন PostgreSQL আর কখন MongoDB বেছে নেবে? (সংক্ষিপ্ত সিদ্ধান্ত গাইড)
- Relation অনেক, transaction ও data integrity জরুরি, জটিল report: **PostgreSQL**
- Schema নমনীয়, nested document, দ্রুত পরিবর্তন, বিশাল write scale: **MongoDB**
- দ্বিধায় থাকলে PostgreSQL ভালো ডিফল্ট, কারণ `JSONB` দিয়ে সে অনেক document-style কাজও করতে পারে
- একটি system এ দুটো মিশিয়েও ব্যবহার করা যায় (যেমন order PostgreSQL এ, activity log MongoDB তে)

<script>
function initTab(raw, root, prefix) {
  const app = root.querySelector(".app");
  const chipsEl = root.querySelector(".chips");
  const statsEl = root.querySelector(".stats");
  const emptyEl = root.querySelector(".empty");
  const searchEl = root.querySelector(".search");

  // ---------- storage helpers (may be blocked) ----------
  const storeKey = prefix === "js" ? "js-qa-known" : "qa-known-" + prefix;
  function load() { try { return JSON.parse(localStorage.getItem(storeKey) || "{}"); } catch (e) { return {}; } }
  function save(v) { try { localStorage.setItem(storeKey, JSON.stringify(v)); } catch (e) {} }
  let known = load();

  // ---------- parse content ----------
  const sections = [];
  let sec = null, item = null;
  raw.split("\n").forEach(function (line) {
    if (line.startsWith("## ")) {
      sec = { title: line.slice(3).trim(), items: [] };
      sections.push(sec); item = null;
    } else if (line.startsWith("### ")) {
      item = { q: line.slice(4).trim(), lines: [] };
      sec.items.push(item);
    } else if (item) {
      item.lines.push(line);
    }
  });

  // ---------- tiny markdown renderer ----------
  function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  function inline(s) {
    return esc(s)
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  }
  function render(lines) {
    let html = "", para = [], list = [], code = null;
    function flushPara() { if (para.length) { html += "<p>" + para.join("<br>") + "</p>"; para = []; } }
    function flushList() { if (list.length) { html += "<ul>" + list.map(function (l) { return "<li>" + l + "</li>"; }).join("") + "</ul>"; list = []; } }
    lines.forEach(function (line) {
      if (line.startsWith("```")) {
        if (code === null) { flushPara(); flushList(); code = []; }
        else { html += "<pre><code>" + esc(code.join("\n")) + "</code></pre>"; code = null; }
        return;
      }
      if (code !== null) { code.push(line); return; }
      if (line.trim() === "") { flushPara(); flushList(); return; }
      if (line.startsWith("- ")) { flushPara(); list.push(inline(line.slice(2))); return; }
      flushList(); para.push(inline(line));
    });
    flushPara(); flushList();
    return html;
  }

  // ---------- build DOM ----------
  let counter = 0;
  const all = [];
  sections.forEach(function (s, si) {
    const secEl = document.createElement("section");
    secEl.id = "sec-" + si;
    const h = document.createElement("h2");
    h.textContent = s.title;
    secEl.appendChild(h);
    s.items.forEach(function (it) {
      counter++;
      const id = "q" + counter;
      const d = document.createElement("details");
      if (known[id]) d.classList.add("done");
      const sm = document.createElement("summary");
      sm.innerHTML =
        '<span class="num">' + counter + '.</span>' +
        '<span class="qtext"></span>' +
        '<label class="known"><input type="checkbox"' + (known[id] ? " checked" : "") + '>জানি</label>';
      sm.querySelector(".qtext").textContent = it.q;
      const label = sm.querySelector(".known");
      label.addEventListener("click", function (e) { e.stopPropagation(); });
      sm.querySelector("input").addEventListener("change", function (e) {
        if (e.target.checked) { known[id] = 1; d.classList.add("done"); }
        else { delete known[id]; d.classList.remove("done"); }
        save(known); updateStats();
      });
      const ans = document.createElement("div");
      ans.className = "ans";
      ans.innerHTML = render(it.lines);
      d.appendChild(sm); d.appendChild(ans);
      secEl.appendChild(d);
      all.push({ el: d, sec: secEl, id: id, text: (it.q + " " + it.lines.join(" ")).toLowerCase(), q: it.q, qEl: sm.querySelector(".qtext") });
    });
    app.appendChild(secEl);

    const chip = document.createElement("button");
    chip.className = "chip";
    chip.textContent = s.title.replace(/^[০-৯0-9]+\.\s*/, "");
    chip.addEventListener("click", function () {
      secEl.scrollIntoView({ behavior: "smooth", block: "start" });
    });
    chipsEl.appendChild(chip);
  });

  // ---------- stats ----------
  function updateStats() {
    const doneCount = Object.keys(known).length;
    const visible = all.filter(function (a) { return a.el.style.display !== "none"; }).length;
    statsEl.textContent = "মোট " + all.length + " টি প্রশ্ন · দেখাচ্ছে " + visible + " · জানা আছে " + doneCount;
  }

  // ---------- search ----------
  function highlight(el, text, term) {
    if (!term) { el.textContent = text; return; }
    const i = text.toLowerCase().indexOf(term);
    if (i < 0) { el.textContent = text; return; }
    el.textContent = "";
    el.appendChild(document.createTextNode(text.slice(0, i)));
    const m = document.createElement("mark");
    m.textContent = text.slice(i, i + term.length);
    el.appendChild(m);
    el.appendChild(document.createTextNode(text.slice(i + term.length)));
  }
  function applySearch() {
    const term = searchEl.value.trim().toLowerCase();
    let shown = 0;
    all.forEach(function (a) {
      const ok = !term || a.text.indexOf(term) !== -1;
      a.el.style.display = ok ? "" : "none";
      highlight(a.qEl, a.q, term);
      if (ok) shown++;
    });
    root.querySelectorAll("section").forEach(function (s) {
      const any = Array.prototype.some.call(s.querySelectorAll("details"), function (d) { return d.style.display !== "none"; });
      s.style.display = any ? "" : "none";
    });
    emptyEl.style.display = shown ? "none" : "block";
    updateStats();
  }
  searchEl.addEventListener("input", applySearch);

  root.querySelector(".expand").addEventListener("click", function () {
    all.forEach(function (a) { if (a.el.style.display !== "none") a.el.open = true; });
  });
  root.querySelector(".collapse").addEventListener("click", function () {
    all.forEach(function (a) { a.el.open = false; });
  });

  updateStats();
  return all.length;
}

(function () {
  const TABS = [
    { id: "js", label: "JavaScript", icon: "JS", src: "content-js",
      title: "JavaScript Interview Q&amp;A", ph: "প্রশ্ন খুঁজুন... (যেমন: closure, event loop)" },
    { id: "react", label: "React", icon: "Re", src: "content-react",
      title: "React Interview Q&amp;A", ph: "প্রশ্ন খুঁজুন... (যেমন: useEffect, memo, context)" },
    { id: "class", label: "React Class Component", icon: "Cl", src: "content-class",
      title: "React Class Component Q&amp;A", ph: "প্রশ্ন খুঁজুন... (যেমন: lifecycle, setState, this)" },
    { id: "next", label: "Next.js (App Router, Pages Router)", icon: "Nx", src: "content-next",
      title: "Next.js Q&amp;A: App Router ও Pages Router", ph: "প্রশ্ন খুঁজুন... (যেমন: SSR, ISR, server component, middleware)" },
    { id: "db", label: "Database (SQL, PostgreSQL, MongoDB)", icon: "DB", src: "content-db",
      title: "Database Q&amp;A: General, PostgreSQL, MongoDB", ph: "প্রশ্ন খুঁজুন... (যেমন: index, join, ACID, aggregation)" }
  ];
  const side = document.getElementById("side");
  const main = document.getElementById("main");
  const btns = {}, panels = {};

  TABS.forEach(function (t) {
    const panel = document.createElement("div");
    panel.className = "panel";
    panel.hidden = true;
    panel.innerHTML =
      '<h1>' + t.title + '</h1>' +
      '<p class="sub">প্রশ্নে ক্লিক করলে উত্তর খুলবে। উত্তর বাংলায়।</p>' +
      '<div class="toolbar">' +
        '<div class="row">' +
          '<input type="search" class="search" placeholder="' + t.ph + '">' +
          '<button class="expand">সব খুলুন</button>' +
          '<button class="collapse">সব বন্ধ করুন</button>' +
        '</div>' +
        '<div class="row chips"></div>' +
        '<div class="stats"></div>' +
      '</div>' +
      '<div class="app"></div>' +
      '<div class="empty">কিছু পাওয়া যায়নি।</div>';
    main.appendChild(panel);
    const n = initTab(document.getElementById(t.src).textContent, panel, t.id);

    const b = document.createElement("button");
    b.className = "tab";
    b.innerHTML = '<span class="ico">' + t.icon + '</span><span class="lbl">' + t.label + '</span><span class="cnt">' + n + '</span>';
    b.addEventListener("click", function () { show(t.id); });
    side.appendChild(b);
    btns[t.id] = b; panels[t.id] = panel;
  });

  function show(id) {
    if (!panels[id]) id = TABS[0].id;
    TABS.forEach(function (t) {
      panels[t.id].hidden = t.id !== id;
      btns[t.id].classList.toggle("on", t.id === id);
    });
    window.scrollTo(0, 0);
    try { localStorage.setItem("qa-active-tab", id); } catch (e) {}
    try { history.replaceState(null, "", "#" + id); } catch (e) {}
  }

  let start = location.hash.replace("#", "");
  if (!panels[start]) { try { start = localStorage.getItem("qa-active-tab") || ""; } catch (e) { start = ""; } }
  show(start);
})();
</script>
