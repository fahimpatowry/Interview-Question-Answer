## ১. Authentication ও Authorization Basics

### What is Authentication? (Authentication কী?)
Authentication হলো **পরিচয় যাচাই** করার প্রক্রিয়া, অর্থাৎ "তুমি কে?"।

উদাহরণ:

- Email + password দিয়ে login
- Google দিয়ে login (social login)
- OTP verification
- Fingerprint/face, passkey

**Interview answer:** "Authentication is the process of verifying identity."

### What is Authorization? (Authorization কী?)
Authorization হলো login এর **পরে অনুমতি (permission) যাচাই** করা, অর্থাৎ "তুমি কী করতে পারো?"।

উদাহরণ: সাধারণ user শুধু নিজের order দেখতে পারে, admin সব user এর data দেখতে ও মুছতে পারে।

**Interview answer:** "Authorization is the process of checking permissions after login."

### Authentication vs Authorization (পার্থক্য)
- **উদ্দেশ্য**: Authentication পরিচয় যাচাই করে, Authorization অনুমতি যাচাই করে
- **প্রশ্ন**: "Who are you?" বনাম "What can you do?"
- **ক্রম**: Authentication আগে, Authorization তার পরে
- **ভিত্তি**: Authentication এর ভিত্তি credential (password, OTP, OAuth), Authorization এর ভিত্তি role, policy, permission
- **ব্যর্থ হলে**: Authentication ব্যর্থ হলে login করা যায় না (`401 Unauthorized`), Authorization ব্যর্থ হলে access denied (`403 Forbidden`)

### 401 আর 403 এর পার্থক্য কী?
- **401 Unauthorized**: পরিচয় প্রমাণিত নয় (login করেননি, token নেই বা মেয়াদ শেষ/অবৈধ)। আসলে "unauthenticated" বোঝায়।
- **403 Forbidden**: পরিচয় জানা আছে, কিন্তু এই কাজের অনুমতি নেই।

Frontend এ 401 এ সাধারণত token refresh বা login এ পাঠানো হয়, 403 এ "অনুমতি নেই" বার্তা দেখানো হয়।

### Identification, Authentication, Authorization ও Accounting (AAA) কী?
- **Identification**: "আমি X" দাবি করা (username)
- **Authentication**: সেই দাবির প্রমাণ (password)
- **Authorization**: কী করতে দেওয়া হবে
- **Accounting/Auditing**: কে কখন কী করল তার রেকর্ড (audit log)

### Authentication এর পদ্ধতিগুলো কী কী?
- **Something you know**: password, PIN
- **Something you have**: OTP (phone), hardware key, authenticator app
- **Something you are**: fingerprint, face
- সাথে: social login (OAuth/OIDC), magic link, passkey (WebAuthn), SSO

দুটি ভিন্ন ধরন মেলালে এটি **Multi-Factor Authentication (MFA)**।

## ২. Session, Token ও Stateless Authentication

### What is stateless authentication? (Stateless authentication কী?)
Stateless authentication এমন পদ্ধতি যেখানে server user এর কোনো **session তথ্য নিজের কাছে সংরক্ষণ করে না**। বদলে প্রয়োজনীয় সব authentication data প্রতিটি request এর সাথে পাঠানো হয় (সাধারণত JWT এর মতো token এ)।

Server শুধু token এর signature যাচাই করে সিদ্ধান্ত নেয়।

### Session-based (stateful) আর token-based (stateless) authentication এর পার্থক্য কী?
- **Session-based (stateful)**: login এ server একটি session তৈরি করে (memory/Redis/DB তে) এবং `session id` cookie তে পাঠায়। প্রতি request এ server সেই id দিয়ে session খোঁজে। সহজে বাতিল (revoke) করা যায়। কিন্তু server এ store লাগে ও scale এ shared store (Redis) দরকার।
- **Token-based (stateless, JWT)**: user এর তথ্য signed token এ থাকে, server কিছু সংরক্ষণ করে না। Scale ও microservice এ সহজ। কিন্তু token মেয়াদের আগে বাতিল করা কঠিন।

কোনটা ভালো তা প্রয়োজনের উপর: সহজ web app এ session চমৎকার, অনেক service/mobile app এ JWT সুবিধাজনক।

### Explain JWT authentication. (JWT authentication ব্যাখ্যা করো)
JWT মানে **JSON Web Token**। JWT authentication হলো একটি stateless authentication ব্যবস্থা যেখানে server কোনো session data সংরক্ষণ করে না। বদলে user এর পরিচয় সংক্রান্ত সব তথ্য একটি **signed token** এর ভেতরেই থাকে।

এর ৩টি অংশ: **Header, Payload, Signature** (`xxxxx.yyyyy.zzzzz`)।

**সুবিধা:**

- Stateless (session storage লাগে না)
- Scalable (microservices এ ভালো কাজ করে)
- দ্রুত authentication
- বিভিন্ন domain/platform এ কাজ করে (API, mobile app)

**Interview answer:** "JWT means JSON Web Token. JWT authentication is a stateless authentication mechanism where the server does not store session data. Instead, all user identity information is stored inside a signed token. It has three parts: header, payload, and signature."

### Login থেকে protected API পর্যন্ত JWT এর flow কী?
```
১. User email + password পাঠায়
২. Server যাচাই করে, JWT তৈরি করে (secret দিয়ে sign)
৩. Client token সংরক্ষণ করে (cookie)
৪. প্রতিটি request এ token যায় (Authorization: Bearer <token> বা cookie)
৫. Server signature ও মেয়াদ যাচাই করে, payload থেকে user জানে
৬. বৈধ হলে data দেয়, নইলে 401
```

### JWT এর header, payload ও signature কী কী?
- **Header**: algorithm ও type (`{ "alg": "HS256", "typ": "JWT" }`)
- **Payload**: claim (দাবি) যেমন `sub` (user id), `role`, `iat` (কখন তৈরি), `exp` (মেয়াদ শেষ)
- **Signature**: header + payload কে secret/private key দিয়ে sign করা ফল। এটা tamper আটকায়।

প্রতিটি অংশ **Base64URL** এ এনকোড করা।

**গুরুত্বপূর্ণ:** Payload **এনক্রিপ্ট করা নয়**, শুধু এনকোড। যে কেউ ডিকোড করে পড়তে পারে। তাই payload এ password, সংবেদনশীল তথ্য রাখবেন না। Signature শুধু নিশ্চিত করে যে data বদলানো হয়নি (integrity), গোপন রাখে না।

### JWT এর সাধারণ claim গুলো কী কী?
- `sub` (subject): user id
- `iat`: তৈরির সময়
- `exp`: মেয়াদ শেষের সময়
- `nbf`: এর আগে বৈধ নয়
- `iss` (issuer): কে issue করল
- `aud` (audience): কার জন্য
- `jti`: token এর unique id (বাতিল তালিকার জন্য কাজে লাগে)

### HS256 আর RS256 এর পার্থক্য কী?
- **HS256 (HMAC, symmetric)**: sign ও verify একই secret দিয়ে। সহজ, কিন্তু যে verify করবে তার কাছেও secret থাকতে হয়।
- **RS256/ES256 (asymmetric)**: **private key** দিয়ে sign, **public key** দিয়ে verify। Microservice এ ভালো: শুধু auth service এর কাছে private key, বাকিরা public key দিয়ে যাচাই করতে পারে।

### JWT এর অসুবিধা ও সীমাবদ্ধতা কী?
- **বাতিল করা কঠিন**: stateless হওয়ায় মেয়াদ শেষের আগে logout বা ব্যবহারকারী নিষিদ্ধ করা সহজ নয়
- Token চুরি হলে মেয়াদ পর্যন্ত চোর ব্যবহার করতে পারে
- Payload পড়া যায় (গোপন তথ্য রাখা যাবে না)
- Token বড় হলে প্রতি request এ বাড়তি size
- Permission বদলালেও পুরোনো token এ পুরোনো role থাকে (মেয়াদ পর্যন্ত)

### JWT বাতিল (revoke) করার উপায় কী?
- **ছোট মেয়াদ** (access token ৫-১৫ মিনিট), আর লম্বা মেয়াদের **refresh token** server এ সংরক্ষিত/নিয়ন্ত্রিত
- **Denylist/blocklist** (Redis এ `jti` রেখে বাতিল token আটকানো)
- **Token versioning**: user এ `tokenVersion` রেখে, বদলালে পুরোনো token অবৈধ
- Password বদল/logout এ refresh token মুছে ফেলা
- সংবেদনশীল কাজে আবার server এ যাচাই

### JWT এর নিরাপত্তা সংক্রান্ত সাধারণ ভুল কী কী?
- `alg: none` গ্রহণ করা বা algorithm যাচাই না করা (সবসময় নির্দিষ্ট algorithm চাপিয়ে verify করুন)
- Secret দুর্বল বা code এ hardcode
- মেয়াদ (`exp`) না দেওয়া বা অনেক লম্বা মেয়াদ
- `localStorage` এ token রাখা (XSS এ চুরি যায়)
- Payload এ সংবেদনশীল data
- `iss`/`aud` যাচাই না করা
- Verify না করে শুধু decode করে ভরসা করা

### Access token আর refresh token এর পার্থক্য কী?
- **Access token**: API access এর জন্য, **ছোট মেয়াদ** (৫-১৫ মিনিট)। চুরি হলে ক্ষতির সময় সীমিত।
- **Refresh token**: শুধু নতুন access token পেতে, **লম্বা মেয়াদ** (৭-৩০ দিন)। নিরাপদে (HttpOnly cookie) রাখা হয়, শুধু refresh endpoint এ যায়।

এতে সুবিধা: ঘন ঘন login করতে হয় না, আবার access token চুরি হলেও দ্রুত মেয়াদ শেষ।

## ৩. Cookie, Storage ও নিরাপত্তা

### Token কোথায় সংরক্ষণ করবে? (Cookie vs localStorage)
- **HttpOnly cookie** (সবচেয়ে নিরাপদ পরামর্শ): JavaScript পড়তে পারে না, তাই XSS এ চুরি হয় না। `Secure` ও `SameSite` সহ দিন।
- **localStorage/sessionStorage**: সহজ, কিন্তু যেকোনো XSS script সহজে token পড়ে নিতে পারে।
- **Memory (JS variable)**: reload এ হারায়, কিন্তু XSS এর ঝুঁকি কম। Access token এর জন্য, আর refresh token cookie তে, এমন সমন্বয় অনেকে ব্যবহার করে।

**Interview answer:** "I store tokens in HTTP-only, Secure, SameSite cookies because they cannot be accessed by JavaScript, which protects against XSS token theft. localStorage is easier but exposes tokens to any injected script."

### Cookie এর `HttpOnly`, `Secure`, `SameSite` flag গুলো কী?
- **`HttpOnly`**: `document.cookie` থেকে JS পড়তে পারে না (XSS এ চুরি আটকায়)
- **`Secure`**: শুধু HTTPS এ পাঠায়
- **`SameSite`**: অন্য site থেকে request এ cookie পাঠানো নিয়ন্ত্রণ করে। `Strict` (কখনো না), `Lax` (শুধু নিরাপদ top-level navigation), `None` (সবসময়, `Secure` লাগে)। CSRF এর বিরুদ্ধে প্রধান ঢাল।
- `Path`, `Domain`, `Max-Age/Expires`: সীমানা ও মেয়াদ

### XSS আর CSRF কী? Authentication এর সাথে সম্পর্ক কী?
- **XSS**: আক্রমণকারী পেজে ক্ষতিকর script ঢুকিয়ে দেয়, যা token চুরি বা user এর হয়ে কাজ করতে পারে। প্রতিরোধ: input/output escape, CSP, `HttpOnly` cookie, `dangerouslySetInnerHTML` এড়ানো।
- **CSRF**: user login থাকা অবস্থায় অন্য site থেকে তার নামে request পাঠানো (cookie নিজে থেকে যায়)। প্রতিরোধ: `SameSite` cookie, CSRF token, `Origin` যাচাই।

Cookie ভিত্তিক auth এ CSRF এর ঝুঁকি আছে, আর `Authorization` header এ (localStorage) token থাকলে XSS এর ঝুঁকি বেশি।

### CORS এর সাথে credentials (cookie) পাঠানোর নিয়ম কী?
Cross-origin request এ cookie পাঠাতে:

- Client এ `credentials: "include"` (fetch) বা `withCredentials: true` (Axios)
- Server এ `Access-Control-Allow-Credentials: true` এবং **নির্দিষ্ট origin** (`*` চলে না)
- Cookie তে `SameSite=None; Secure` (যদি আলাদা site হয়)

### Session fixation কী? কীভাবে ঠেকাবে?
আক্রমণকারী আগে থেকে একটি session id ঠিক করে ভুক্তভোগীকে ব্যবহার করতে বাধ্য করে, তারপর ভুক্তভোগী login করলে সেই id দিয়ে ঢুকে পড়ে। প্রতিরোধ: **login এর পর নতুন session id তৈরি করা** (regenerate)।

## ৪. Token Refresh ও Session Expiration

### How would you handle token refresh? (Token refresh কীভাবে সামলাবে?)
Next.js বা React app এ token refresh সাধারণত frontend ও backend দুটো মিলে হয়।

- **Backend**: refresh token validate করে নতুন access token তৈরি করে।
- **Frontend**: expired access token এ `401` পেলে স্বয়ংক্রিয়ভাবে refresh endpoint call করে নতুন token নেয় এবং **ব্যর্থ হওয়া request আবার চালায়** (retry)।
- নিরাপত্তার জন্য refresh token সাধারণত **secure HttpOnly cookie** তে রাখা হয়।
- Next.js middleware দিয়ে route protect করা যায়, তবে মূল refresh logic সাধারণত frontend এর **API interceptor** ও backend এর **authentication endpoint** এ থাকে।

### Axios interceptor দিয়ে token refresh (একসাথে অনেক 401 হলে একবারই refresh) কীভাবে করবে?
```js
let refreshPromise = null;

api.interceptors.response.use(
  (res) => res,
  async (error) => {
    const original = error.config;
    if (error.response?.status === 401 && !original._retry) {
      original._retry = true;                      // অনন্ত loop আটকাতে
      if (!refreshPromise) {
        refreshPromise = axios
          .post("/api/auth/refresh", null, { withCredentials: true })
          .finally(() => { refreshPromise = null; });
      }
      try {
        const { data } = await refreshPromise;     // সবাই একই refresh এর ফলের অপেক্ষা করে
        setAccessToken(data.accessToken);
        original.headers.Authorization = `Bearer ${data.accessToken}`;
        return api(original);                      // আগের request আবার
      } catch (e) {
        logout();                                  // refresh ব্যর্থ, login এ পাঠাও
        return Promise.reject(e);
      }
    }
    return Promise.reject(error);
  }
);
```

### Refresh token rotation আর reuse detection কী?
প্রতিবার refresh করার সময় **নতুন refresh token** দেওয়া হয় এবং পুরোনোটি বাতিল হয়। কেউ আগের (বাতিল) token আবার ব্যবহার করলে বোঝা যায় token চুরি হয়েছে (reuse detection), তখন ওই token এর পুরো "পরিবার" বাতিল করে user কে আবার login করানো হয়। এতে চুরি হওয়া refresh token এর ক্ষতি সীমিত থাকে।

### How do you handle session expiration? (Session expiration কীভাবে সামলাবে?)
Session মেয়াদ শেষ হওয়ার সময় যেন user এর কাজ নষ্ট না হয় এবং নিরাপত্তাও ঠিক থাকে, সেদিকে খেয়াল রাখি।

**Server দিক:**

- Session/token এ **মেয়াদ** রাখা (access token ছোট, refresh token লম্বা, বা session TTL)
- **Sliding expiration** (কাজ করলে মেয়াদ বাড়ে) এবং **absolute expiration** (যাই হোক সর্বোচ্চ সময় শেষ হলে আবার login), সংবেদনশীল system এ idle timeout
- মেয়াদ শেষ হলে `401` ফেরত দেওয়া

**Client দিক:**

- Axios/fetch interceptor এ `401` ধরা, আগে নীরবে refresh চেষ্টা করা (silent refresh), ব্যর্থ হলে logout ও login পেজে পাঠানো
- Login এ পাঠানোর সময় **বর্তমান URL মনে রাখা** (`?returnTo=...`) যাতে login এর পর সেখানেই ফেরা যায়
- ফর্ম/অসংরক্ষিত কাজ থাকলে সতর্কবার্তা বা modal ("Session expired, please login again")
- Logout এ সব client state/cache পরিষ্কার (store reset, React Query cache clear)
- **একাধিক tab এ sync**: `BroadcastChannel` বা `storage` event দিয়ে এক tab এ logout হলে অন্যগুলোও logout
- মেয়াদ শেষ হওয়ার আগে (`exp` পড়ে) সক্রিয়ভাবে refresh করা যায় (proactive refresh)

**Next.js এ:** middleware/server component এ মেয়াদ যাচাই করে মেয়াদ শেষ হলে `/login?returnTo=...` এ redirect, NextAuth এ `session.maxAge` ও `updateAge` ও callback দিয়ে।

### Silent refresh আর proactive refresh এর পার্থক্য কী?
- **Reactive (401 পাওয়ার পর)**: request ব্যর্থ হলে refresh করে retry। সহজ, কিন্তু একটি request বাড়তি ঘুরে আসে।
- **Proactive (আগে থেকে)**: `exp` এর কিছু আগে timer দিয়ে refresh করা। ব্যবহারকারী ধীরতা টের পায় না, কিন্তু জটিলতা বেশি।

### Logout কীভাবে সঠিকভাবে করবে?
- Server এ session/refresh token বাতিল (database/Redis থেকে মোছা), cookie মুছে ফেলা (`Max-Age=0`)
- Client এ access token, state ও cache পরিষ্কার
- **সব device থেকে logout** দরকার হলে ওই user এর সব refresh token/session বাতিল
- Stateless JWT এ শুধু client এ token মুছলে চুরি হওয়া token মেয়াদ পর্যন্ত বৈধ থাকে, তাই ছোট মেয়াদ ও denylist
- অন্য tab এ জানানো

## ৫. OAuth 2.0, OIDC ও Social Login

### OAuth 2.0 কী? OIDC কী? পার্থক্য কী?
- **OAuth 2.0**: **authorization** এর framework। তৃতীয় পক্ষের app কে আপনার পাসওয়ার্ড না দিয়ে আপনার data তে সীমিত access দেওয়া ("এই app কে আমার Google Calendar পড়তে দাও")।
- **OpenID Connect (OIDC)**: OAuth 2.0 এর উপরে **authentication** স্তর। `id_token` (JWT) দিয়ে ব্যবহারকারী কে তা জানায়। "Login with Google" আসলে OIDC।

সহজ কথা: OAuth হলো "কী করতে দেবে", OIDC হলো "তুমি কে"।

### "Login with Google" কীভাবে কাজ করে? (Authorization Code flow with PKCE)
```
১. User "Login with Google" এ ক্লিক করে
২. App user কে Google এ পাঠায় (client_id, redirect_uri, scope, state, code_challenge)
৩. User Google এ login ও সম্মতি দেয়
৪. Google একটি একবারের authorization code সহ app এ ফেরত পাঠায়
৫. App (server) সেই code ও code_verifier দিয়ে Google থেকে token নেয়
৬. App id_token থেকে user এর তথ্য জেনে নিজের session তৈরি করে
```

- **`state`** parameter CSRF আটকায়
- **PKCE** code চুরি আটকায় (বিশেষ করে SPA/mobile)
- Implicit flow এখন নিরুৎসাহিত

### OAuth এর scope কী?
App কতটুকু access চাচ্ছে তার সীমা (যেমন `email`, `profile`, `calendar.read`)। সবসময় **ন্যূনতম দরকারি scope** চান (least privilege)।

### SSO (Single Sign-On) কী?
একবার login করে একাধিক application/সেবায় ঢোকা। প্রযুক্তি: OIDC, SAML। প্রতিষ্ঠানে (Okta, Azure AD, Keycloak, Google Workspace) প্রচলিত। সুবিধা: একটি জায়গায় পরিচয় ব্যবস্থাপনা, সহজ onboarding/offboarding।

## ৬. NextAuth (Auth.js)

### What is NextAuth? How does it work? (NextAuth কী? কীভাবে কাজ করে?)
NextAuth (এখন **Auth.js**) হলো Next.js এর জন্য authentication library। এটি **OAuth** ও **credentials** login সামলায়, **JWT অথবা database strategy** দিয়ে session পরিচালনা করে, এবং নিরাপদ **HTTP-only cookie** এর মাধ্যমে ব্যবহারকারীর authentication স্বয়ংক্রিয়ভাবে বজায় রাখে।

**Interview answer:** "NextAuth is an authentication library for Next.js that handles OAuth and credentials login, manages sessions using either JWT or database strategy, and automatically maintains user authentication through secure HTTP-only cookies."

**ভেতরের কাজ (সংক্ষেপে):**

- `/api/auth/*` এ route handler (signin, callback, session, signout, csrf)
- Provider (Google, GitHub, Credentials) সেট করা হয়
- Login সফল হলে session তৈরি, cookie তে রাখা
- Server এ session পড়া (`auth()`/`getServerSession`), client এ `useSession`
- Built-in CSRF সুরক্ষা

### NextAuth এ JWT strategy আর database strategy এর পার্থক্য কী?
- **JWT strategy** (database adapter না থাকলে default): session তথ্য **এনক্রিপ্ট করা JWT** আকারে cookie তে। Database লাগে না, দ্রুত, edge এ ভালো। বাতিল করা কঠিন।
- **Database strategy** (adapter লাগে, যেমন Prisma): session database এ, cookie তে শুধু session id। সহজে বাতিল ও সব session দেখা যায়, কিন্তু প্রতি request এ database।

Credentials provider সাধারণত JWT strategy এর সাথে কাজ করে।

### NextAuth এর callbacks (`jwt`, `session`, `signIn`) কী? Role কীভাবে session এ আনবে?
- `signIn`: login অনুমোদন করবে কিনা
- `jwt`: token তৈরি/আপডেটের সময় চলে, এখানে `role` যোগ করা যায়
- `session`: client/server এ যে session পাবেন তা গঠন করে

```ts
callbacks: {
  jwt({ token, user }) {
    if (user) token.role = user.role;          // প্রথম login এ
    return token;
  },
  session({ session, token }) {
    session.user.role = token.role as string;  // session এ দেখানো
    return session;
  },
},
```

### NextAuth কনফিগারেশন (Auth.js v5) এর উদাহরণ দাও
```ts
// auth.ts
import NextAuth from "next-auth";
import Google from "next-auth/providers/google";
import Credentials from "next-auth/providers/credentials";
import bcrypt from "bcryptjs";

export const { handlers, auth, signIn, signOut } = NextAuth({
  session: { strategy: "jwt", maxAge: 60 * 60 * 24 },
  providers: [
    Google,
    Credentials({
      authorize: async (credentials) => {
        const user = await db.user.findUnique({ where: { email: String(credentials.email) } });
        if (!user) return null;
        const ok = await bcrypt.compare(String(credentials.password), user.passwordHash);
        return ok ? { id: user.id, email: user.email, role: user.role } : null;
      },
    }),
  ],
  callbacks: {
    jwt({ token, user }) { if (user) token.role = (user as any).role; return token; },
    session({ session, token }) { (session.user as any).role = token.role; return session; },
  },
});

// app/api/auth/[...nextauth]/route.ts
export const { GET, POST } = handlers;

// Server Component এ
const session = await auth();
if (!session) redirect("/login");
```

(NextAuth v4 এ `getServerSession(authOptions)`, v5/Auth.js এ `auth()`। Version অনুযায়ী API আলাদা, তাই docs দেখে নিন।)

### NextAuth এর Credentials provider নিয়ে কোন সতর্কতা আছে?
- নিজে password hash যাচাই করতে হয় (`bcrypt`/`argon2`)
- সাধারণত শুধু JWT strategy তে কাজ করে
- Brute force ঠেকাতে rate limiting নিজেকেই বানাতে হয়
- Social login/OAuth ও magic link সাধারণত বেশি নিরাপদ ও সহজ

## ৭. Authorization ও RBAC

### What is RBAC? (RBAC কী?)
RBAC (Role-Based Access Control) এ user কে **role** (admin, manager, user) দেওয়া হয়, আর প্রতিটি role এর কিছু **permission** থাকে। User এর role দেখে অনুমতি ঠিক হয়। সহজ ও ব্যাপক প্রচলিত।

### How would you implement RBAC? (RBAC কীভাবে বাস্তবায়ন করবে?)
Frontend এ RBAC এর জন্য আমি route সুরক্ষা **middleware** দিয়ে করি এবং UI permission **কেন্দ্রীভূত (centralized) permission configuration** দিয়ে সামলাই।

Next.js এ middleware দিয়ে অননুমোদিত user দের `/admin` এর মতো সুরক্ষিত route এ ঢুকতে আটকাই। তারপর menu, button ও page action এর জন্য array বা object দিয়ে **role-permission mapping** রাখি। User এর role অনুযায়ী UI element গতিশীলভাবে দেখাই বা লুকাই।

এতে permission logic এক জায়গায় থাকে ও maintain করা সহজ। তবে **backend এও সবসময় permission যাচাই করি**, কারণ frontend এর check শুধু user experience এর জন্য।

সংক্ষেপে:

- Route এর জন্য middleware
- Navigation এর জন্য array mapping
- সাধারণ function ও dynamic UI

### Role-permission mapping ও `can()` helper কীভাবে লিখবে?
```ts
// permissions.ts (এক জায়গায়)
export const PERMISSIONS = {
  admin:   ["user:read", "user:write", "user:delete", "report:read"],
  manager: ["user:read", "report:read"],
  user:    [],
} as const;

export type Role = keyof typeof PERMISSIONS;
export const can = (role: Role | undefined, perm: string) =>
  !!role && (PERMISSIONS[role] as readonly string[]).includes(perm);

// navigation config
export const NAV = [
  { label: "Dashboard", href: "/dashboard", roles: ["admin", "manager", "user"] },
  { label: "Users",     href: "/admin/users", roles: ["admin"] },
  { label: "Reports",   href: "/reports", roles: ["admin", "manager"] },
];
const visible = NAV.filter((n) => n.roles.includes(user.role));

// component
{can(user.role, "user:delete") && <button>Delete</button>}
```

### RBAC আর ABAC আর ACL এর পার্থক্য কী?
- **RBAC**: role ভিত্তিক (admin/user)। সহজ।
- **ABAC** (Attribute-Based): user, resource ও পরিবেশের attribute ভিত্তিক নিয়ম ("নিজের department এর document, অফিস সময়ে")। বেশি নমনীয়, জটিল।
- **ACL** (Access Control List): প্রতিটি resource এর জন্য আলাদা তালিকা কে কী করতে পারবে।

বেশিরভাগ app এ RBAC যথেষ্ট, ownership (নিজের data) এর জন্য সাথে ownership check যোগ করা হয়। জটিল নিয়মে CASL, OPA বা policy engine।

### Frontend এ permission check ও backend এ কেন দুটোই দরকার?
Frontend এর check **শুধু user experience** (লুকানো বাটন)। যেকোনো user browser এ কোড বদলাতে বা সরাসরি API call করতে পারে। তাই **আসল authorization সবসময় backend এ** (প্রতিটি request এ)। Frontend ও backend এর permission list sync রাখুন।

### IDOR (BOLA) কী? কীভাবে ঠেকাবে?
Insecure Direct Object Reference: user অন্যের id বদলে (`/orders/123` → `/orders/124`) অন্যের data দেখতে পায় কারণ server শুধু login দেখেছে, মালিকানা (ownership) দেখেনি।

প্রতিরোধ: প্রতিটি resource access এ "এই user কি এর মালিক বা অনুমতিপ্রাপ্ত?" যাচাই (`WHERE id = ? AND user_id = ?`), id আন্দাজযোগ্য না করা (UUID), তবে শুধু UUID যথেষ্ট নয়।

### Backend এ role ভিত্তিক middleware (Express) কীভাবে লিখবে?
```js
const requireAuth = (req, res, next) => {
  const token = req.headers.authorization?.split(" ")[1] ?? req.cookies.access_token;
  if (!token) return res.status(401).json({ message: "Unauthorized" });
  try {
    req.user = jwt.verify(token, process.env.ACCESS_SECRET, { algorithms: ["HS256"] });
    next();
  } catch {
    res.status(401).json({ message: "Invalid or expired token" });
  }
};

const requireRole = (...roles) => (req, res, next) =>
  roles.includes(req.user.role) ? next() : res.status(403).json({ message: "Forbidden" });

app.delete("/api/users/:id", requireAuth, requireRole("admin"), deleteUser);
```

## ৮. Route ও Page সুরক্ষা (Next.js ও React)

### How do you protect a route? (Route কীভাবে সুরক্ষিত করবে?)
স্তরে স্তরে সুরক্ষা (layered protection):

- **Middleware**: অননুমোদিত request কে আগেই আটকে `/login` এ পাঠায়
- **Server Component/Layout**: session না থাকলে `redirect()`
- **Server Action/Route Handler এর ভেতরে**: আসল authorization যাচাই (এটাই চূড়ান্ত)
- Backend API এ প্রতিটি request এ token ও permission যাচাই

শুধু middleware এর উপর নির্ভর করবেন না।

### How do you protect SSR pages? (SSR page কীভাবে সুরক্ষিত করবে?)
SSR page সুরক্ষিত করতে আমি page render করার **আগেই server এ authentication check** করি।

- **Pages Router এ**: `getServerSideProps` এ cookie থেকে session/token যাচাই করে অননুমোদিত user কে login এ redirect করি।
- **App Router এ**: Server Component এ `getServerSession`/`auth()` অথবা middleware দিয়ে authentication enforce করি।

এতে সুরক্ষিত content কখনো unauthenticated user এর কাছে পাঠানোই হয় না, নিরাপত্তা ও user experience দুটোই ভালো হয়।

```tsx
// Pages Router
export async function getServerSideProps({ req }) {
  const session = await getSession({ req });          // বা token যাচাই
  if (!session) return { redirect: { destination: "/login", permanent: false } };
  return { props: { user: session.user } };
}

// App Router
export default async function AdminPage() {
  const session = await auth();
  if (!session) redirect("/login");
  if (session.user.role !== "admin") redirect("/403");
  return <AdminDashboard />;
}
```

### Next.js middleware দিয়ে route protect (JWT যাচাই সহ) কীভাবে করবে?
```ts
// middleware.ts
import { NextResponse, type NextRequest } from "next/server";
import { jwtVerify } from "jose";                     // Edge এ চলে (jsonwebtoken চলে না)

const secret = new TextEncoder().encode(process.env.JWT_SECRET);

export async function middleware(req: NextRequest) {
  const { pathname } = req.nextUrl;
  const token = req.cookies.get("session")?.value;

  if (pathname.startsWith("/admin") || pathname.startsWith("/dashboard")) {
    if (!token) return NextResponse.redirect(new URL(`/login?returnTo=${pathname}`, req.url));
    try {
      const { payload } = await jwtVerify(token, secret);
      if (pathname.startsWith("/admin") && payload.role !== "admin")
        return NextResponse.redirect(new URL("/403", req.url));
    } catch {
      return NextResponse.redirect(new URL("/login", req.url));
    }
  }
  return NextResponse.next();
}
export const config = { matcher: ["/admin/:path*", "/dashboard/:path*"] };
```

### Middleware কি একমাত্র সুরক্ষা হতে পারে? (Next.js এ বিশেষ সতর্কতা)
না। Middleware দ্রুত প্রথম ফিল্টার, কিন্তু একমাত্র সুরক্ষা নয়:

- ২০২৫ সালে Next.js middleware এড়িয়ে যাওয়ার একটি নিরাপত্তা দুর্বলতা (CVE-2025-29927) ধরা পড়েছিল (ঠিক করা version এ upgrade করা জরুরি)
- Middleware Edge runtime এ চলে, সীমিত API
- Matcher ভুল হলে কিছু route বাদ পড়ে যায়

তাই Next.js এর নির্দেশনা অনুযায়ী data এর কাছাকাছি (**Data Access Layer**) যাচাই করুন: Server Component, Server Action, Route Handler ও backend এ।

### Data Access Layer (DAL) pattern কী?
সব session ও permission যাচাই এক জায়গার (একটি `dal.ts`) function এ রাখা, আর data আনার প্রতিটি জায়গা সেই function ডাকে। এতে কেউ ভুলে check বাদ দিতে পারে না।

```ts
// lib/dal.ts
import "server-only";
import { cache } from "react";

export const verifySession = cache(async () => {
  const session = await auth();
  if (!session) redirect("/login");
  return session;
});

export async function getAllUsers() {
  const session = await verifySession();
  if (session.user.role !== "admin") throw new Error("Forbidden");
  return db.user.findMany();
}
```

### Server Action কীভাবে সুরক্ষিত করবে?
Server Action আসলে একটি **public POST endpoint**। তাই প্রতিটির ভেতরে নিজেই authentication ও authorization যাচাই করুন এবং input validate করুন (`zod`)। "UI তে বাটন লুকানো আছে" নিরাপত্তা নয়।

```ts
"use server";
export async function deleteUser(id: string) {
  const session = await verifySession();
  if (session.user.role !== "admin") throw new Error("Forbidden");
  await db.user.delete({ where: { id } });
}
```

### React SPA (Vite) এ protected route কীভাবে বানাবে?
```jsx
function ProtectedRoute({ roles, children }) {
  const { user, loading } = useAuth();
  const location = useLocation();

  if (loading) return <Spinner />;                       // reload এ flicker এড়াতে
  if (!user) return <Navigate to="/login" state={{ from: location }} replace />;
  if (roles && !roles.includes(user.role)) return <Navigate to="/403" replace />;
  return children;
}

<Route path="/admin" element={<ProtectedRoute roles={["admin"]}><Admin /></ProtectedRoute>} />
```
এটা শুধু UX। আসল সুরক্ষা backend এ। Reload এ `loading` অবস্থা দরকার, নইলে মুহূর্তের জন্য login পেজ ঝলকায়।

### Login এর পর আগের পেজে ফেরত (returnTo/callbackUrl) কীভাবে করবে?
Login এ পাঠানোর সময় বর্তমান URL query তে (`/login?returnTo=/admin/users`) বা state এ রাখুন। Login সফল হলে সেখানে পাঠান। **Open redirect** এড়াতে `returnTo` শুধু নিজের site এর relative path কিনা যাচাই করুন (বাইরের URL এ পাঠাবেন না)।

## ৯. Admin Panel ও সামগ্রিক নিরাপত্তা

### How would you secure an Admin Panel? (Admin Panel কীভাবে সিকিউর করবে?)
একটি Admin Panel সিকিউর করতে আমি authentication এবং authorization দুটোই ব্যবহার করব।

প্রথমে নিশ্চিত করব যে শুধু authenticated (login করা) user রাই application এ access করতে পারবে। এরপর **RBAC** implement করব, যাতে শুধু admin role এর user রাই admin route ও feature access করতে পারে।

Frontend এ middleware দিয়ে route protect করব এবং অননুমোদিত menu বা action লুকিয়ে রাখব। Backend এ প্রতিটি API request যাচাই করব যে user এর সঠিক permission আছে কিনা।

এছাড়া:

- Authentication এর জন্য secure **HTTP-only cookie**
- **HTTPS**
- সঠিক **input validation**
- প্রয়োজনে **CSRF protection**
- সংবেদনশীল কাজের জন্য **audit logging**

### Admin Panel এর জন্য অতিরিক্ত নিরাপত্তা checklist কী?
- **MFA** (TOTP/passkey) বাধ্যতামূলক
- Rate limiting ও brute force সুরক্ষা, সন্দেহজনক login এ lockout/CAPTCHA
- Admin URL আড়াল নয়, আসল সুরক্ষা auth (security through obscurity নয়)
- IP allowlist/VPN (সম্ভব হলে)
- ছোট session মেয়াদ ও idle timeout
- Least privilege: সবাই super admin নয়, আলাদা role
- সব admin কাজের audit log (কে, কী, কখন)
- Sensitive action (মুছে ফেলা, role বদল) এ আবার password/MFA চাওয়া (re-authentication)
- Security header (CSP, `X-Frame-Options`, HSTS)
- Dependency ও framework নিয়মিত আপডেট

### Rate limiting ও brute force সুরক্ষা কীভাবে করবে?
- Login endpoint এ সীমা (যেমন প্রতি IP/account এ ৫ বার/১৫ মিনিট), `express-rate-limit`, Redis দিয়ে
- ধাপে ধাপে বাড়তে থাকা বিলম্ব (exponential backoff) বা সাময়িক lockout
- ব্যর্থ চেষ্টার পর CAPTCHA
- সব ক্ষেত্রে একই বার্তা ("email বা password ভুল"), account আছে কিনা না জানানো
- সন্দেহজনক চেষ্টা log ও alert

## ১০. Password, MFA ও Credential

### Password database এ কীভাবে সংরক্ষণ করবে?
কখনো plain text বা reversible encryption নয়। **ধীর, salted hash** ব্যবহার করুন: **argon2id** (প্রস্তাবিত) বা **bcrypt** (cost 10-12)। প্রতিটি password এর জন্য আলাদা **salt** (এসব library নিজে দেয়)। MD5/SHA1/সাধারণ SHA256 নয়, কারণ সেগুলো খুব দ্রুত তাই brute force সহজ।

```js
import bcrypt from "bcrypt";
const hash = await bcrypt.hash(password, 12);
const ok = await bcrypt.compare(password, hash);
```

### Hashing, encryption আর encoding এর পার্থক্য কী?
- **Hashing**: একমুখী, ফেরানো যায় না। Password এর জন্য।
- **Encryption**: key দিয়ে ফেরানো যায়। গোপন data সংরক্ষণ/পাঠানোর জন্য।
- **Encoding** (Base64): শুধু রূপ বদল, কোনো নিরাপত্তা নেই। JWT payload শুধু encoded।

### Salt আর pepper কী?
- **Salt**: প্রতিটি password এ আলাদা random মান, যাতে একই password এর hash আলাদা হয় ও rainbow table কাজ না করে। Hash এর সাথে database এ থাকে।
- **Pepper**: সব password এর জন্য একটি গোপন মান, database এর বাইরে (secret manager) রাখা হয়। Database চুরি হলেও বাড়তি সুরক্ষা।

### Forgot password flow কীভাবে নিরাপদে বানাবে?
- Random, অনুমান-অযোগ্য, **একবারের** token তৈরি, **ছোট মেয়াদ** (১৫-৬০ মিনিট)
- Database এ token এর **hash** রাখা (কাঁচা token নয়)
- Email এ লিংক পাঠানো, ব্যবহারের পর বাতিল
- "এই email এ account আছে কিনা" জানাবেন না (একই বার্তা সবসময়)
- Password বদলের পর সব session/refresh token বাতিল
- Rate limit

### MFA (multi-factor authentication) কী? ধরনগুলো কী?
দুই বা ততোধিক ভিন্ন ধরনের প্রমাণ।

- **TOTP** (Google Authenticator, Authy): সময় ভিত্তিক ৬ অংকের কোড। ভালো।
- **SMS/Email OTP**: সহজ, কিন্তু SIM swap এর ঝুঁকিতে দুর্বল
- **Push notification**
- **Hardware key / Passkey (WebAuthn)**: সবচেয়ে নিরাপদ, phishing প্রতিরোধী

### Passkey/WebAuthn কী?
Password এর বদলে public-key cryptography: device এ private key থাকে (fingerprint/face/PIN দিয়ে খোলে), server এ শুধু public key। Phishing প্রতিরোধী কারণ credential নির্দিষ্ট domain এর সাথে বাঁধা। ভবিষ্যতের password-less পদ্ধতি।

### OTP verification কীভাবে নিরাপদে বানাবে?
- Random, ছোট মেয়াদ (২-৫ মিনিট), একবারের ব্যবহার
- Database/Redis এ hash বা TTL সহ রাখা
- ভুল চেষ্টার সীমা (৩-৫ বার), পুনরায় পাঠানোতে rate limit
- দুই OTP এর মধ্যে সময়ের ফাঁক
- সংবেদনশীল ক্ষেত্রে SMS এর বদলে authenticator app

## ১১. Output ও Bug খুঁজে বের করা

### Q1: Login এর পরও cookie request এ যাচ্ছে না। কেন?
```js
axios.get("https://api.example.com/me")   // frontend: app.example.com
```
উত্তর: cross-origin এ cookie পাঠাতে `withCredentials: true` লাগে, server এ `Access-Control-Allow-Credentials: true` ও নির্দিষ্ট origin (`*` নয়), আর cookie তে ঠিক `SameSite`/`Secure`। এর যেকোনোটি বাদ পড়লে cookie যায় না।

### Q2: কেন এই ধরনের auth বিপজ্জনক?
```js
localStorage.setItem("token", jwt);
// পরে: axios.defaults.headers.Authorization = `Bearer ${localStorage.getItem("token")}`;
```
উত্তর: কোনো XSS (বা সংক্রামিত third-party script) `localStorage.getItem("token")` দিয়ে সহজে token চুরি করতে পারে। বিকল্প: `HttpOnly, Secure, SameSite` cookie।

### Q3: Token refresh এ অনন্ত loop হচ্ছে। কেন?
```js
if (error.response.status === 401) {
  await refresh();
  return api(error.config);   // retry
}
```
উত্তর: refresh নিজেই `401` দিলে (বা retry আবার `401` পেলে) আবার refresh, আবার retry... ক্রমাগত। সমাধান: `original._retry` flag, refresh endpoint কে interceptor থেকে বাদ দেওয়া, refresh ব্যর্থ হলে logout।

### Q4: একসাথে ৫টি request এ ৫ বার refresh call হচ্ছে। কেন, কীভাবে ঠিক করবে?
উত্তর: প্রতিটি `401` নিজে নিজে refresh চালাচ্ছে। একটি শেয়ার করা `refreshPromise` রাখুন যাতে সবাই একই চলমান refresh এর অপেক্ষা করে। (ব্যাখ্যা ও code উপরে।) Refresh token rotation থাকলে এই race এ বাকি requests বাতিল হয়ে logout ও হয়ে যেতে পারে।

### Q5: Admin পেজ browser এ লুকানো, কিন্তু user URL এ সরাসরি গিয়ে data দেখতে পাচ্ছে। কেন?
উত্তর: শুধু UI তে লুকানো হয়েছে, route ও API তে server-side যাচাই নেই। Middleware/Server Component এ role check ও **backend API এ** প্রতিটি request এ permission যাচাই করুন।

### Q6: Reload দিলে মুহূর্তের জন্য login পেজ দেখা যায়, তারপর dashboard। কেন?
উত্তর: Auth state (user) লোড হওয়ার আগেই `user = null` ধরে redirect হচ্ছে। `loading` state রাখুন এবং loading শেষ না হওয়া পর্যন্ত spinner দেখান। বা server এ session পড়ে প্রথম render এ-ই সঠিক UI পাঠান (Server Component)।

### Q7: JWT তে role বদলালাম, কিন্তু user এখনো পুরোনো permission পাচ্ছে। কেন?
উত্তর: JWT stateless, role token এ বসানো আছে, মেয়াদ শেষ না হওয়া পর্যন্ত পুরোনো। সমাধান: ছোট access token মেয়াদ, গুরুত্বপূর্ণ কাজে server এ role আবার পড়া, token version, বা role বদলালে refresh token বাতিল।

## ১২. Live Coding

### Express এ JWT login (cookie সহ) ও refresh endpoint
```js
import jwt from "jsonwebtoken";
import bcrypt from "bcrypt";

const ACCESS = process.env.ACCESS_SECRET;
const REFRESH = process.env.REFRESH_SECRET;

const signAccess = (u) => jwt.sign({ sub: u.id, role: u.role }, ACCESS, { expiresIn: "15m" });
const signRefresh = (u) => jwt.sign({ sub: u.id }, REFRESH, { expiresIn: "7d" });

const cookieOpts = {
  httpOnly: true,
  secure: process.env.NODE_ENV === "production",
  sameSite: "strict",
  path: "/api/auth",
  maxAge: 7 * 24 * 60 * 60 * 1000,
};

app.post("/api/auth/login", async (req, res) => {
  const { email, password } = req.body;
  const user = await User.findOne({ email });
  const ok = user && (await bcrypt.compare(password, user.passwordHash));
  if (!ok) return res.status(401).json({ message: "Invalid credentials" });   // একই বার্তা

  const refreshToken = signRefresh(user);
  await RefreshToken.create({ userId: user.id, tokenHash: hash(refreshToken) });  // server এ সংরক্ষণ
  res.cookie("refresh_token", refreshToken, cookieOpts);
  res.json({ accessToken: signAccess(user), user: { id: user.id, role: user.role } });
});

app.post("/api/auth/refresh", async (req, res) => {
  const token = req.cookies.refresh_token;
  if (!token) return res.status(401).end();
  try {
    const payload = jwt.verify(token, REFRESH);
    const stored = await RefreshToken.findOne({ userId: payload.sub, tokenHash: hash(token) });
    if (!stored) return res.status(401).end();                 // বাতিল বা reuse
    await stored.deleteOne();                                   // rotation: পুরোনোটি বাতিল
    const user = await User.findById(payload.sub);
    const newRefresh = signRefresh(user);
    await RefreshToken.create({ userId: user.id, tokenHash: hash(newRefresh) });
    res.cookie("refresh_token", newRefresh, cookieOpts);
    res.json({ accessToken: signAccess(user) });
  } catch {
    res.status(401).end();
  }
});

app.post("/api/auth/logout", async (req, res) => {
  const token = req.cookies.refresh_token;
  if (token) await RefreshToken.deleteOne({ tokenHash: hash(token) });
  res.clearCookie("refresh_token", { path: "/api/auth" });
  res.status(204).end();
});
```

### React এ Auth Context (login, logout, user লোড) বানাও
```jsx
const AuthContext = createContext(null);

export function AuthProvider({ children }) {
  const [user, setUser] = useState(null);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    api.get("/auth/me")                       // cookie/token দিয়ে বর্তমান user
      .then((r) => setUser(r.data))
      .catch(() => setUser(null))
      .finally(() => setLoading(false));
  }, []);

  const login = async (email, password) => {
    const { data } = await api.post("/auth/login", { email, password });
    setAccessToken(data.accessToken);
    setUser(data.user);
  };
  const logout = async () => {
    await api.post("/auth/logout");
    setAccessToken(null);
    setUser(null);
    queryClient.clear();                      // cache পরিষ্কার
  };

  const value = useMemo(() => ({ user, loading, login, logout }), [user, loading]);
  return <AuthContext.Provider value={value}>{children}</AuthContext.Provider>;
}
export const useAuth = () => {
  const ctx = useContext(AuthContext);
  if (!ctx) throw new Error("useAuth must be used inside AuthProvider");
  return ctx;
};
```

### Next.js Server Action এ login ও cookie সেট করা
```ts
"use server";
import { cookies } from "next/headers";
import { redirect } from "next/navigation";
import { SignJWT } from "jose";

export async function login(prev: unknown, formData: FormData) {
  const email = String(formData.get("email"));
  const password = String(formData.get("password"));
  const user = await verifyCredentials(email, password);
  if (!user) return { error: "Invalid credentials" };

  const token = await new SignJWT({ sub: user.id, role: user.role })
    .setProtectedHeader({ alg: "HS256" })
    .setExpirationTime("1h")
    .sign(new TextEncoder().encode(process.env.JWT_SECRET));

  (await cookies()).set("session", token, {
    httpOnly: true, secure: true, sameSite: "lax", path: "/", maxAge: 60 * 60,
  });
  redirect("/dashboard");
}
```

- ত্রুটি বার্তায় অতিরিক্ত তথ্য ফাঁস হচ্ছে না?

## ১. Database Basics (সাধারণ ধারণা)

### SQL আর NoSQL database এর পার্থক্য কী? কখন কোনটা?
- **SQL** হলো structured query language, যা relational database এ ব্যবহার হয়। যেমন PostgreSQL, MySQL।
- **NoSQL** হলো non-relational database। যেমন MongoDB।

পার্থক্য:

- **Data**: SQL এ structured data থাকে। NoSQL এ structured, semi-structured বা unstructured data থাকতে পারে।
- **Schema**: SQL এ schema fixed থাকে। NoSQL এ schema flexible।
- **Relation**: SQL এ table গুলো foreign key দিয়ে relation হয়। NoSQL এ embedding বা reference দিয়ে করা যায়।
- **Data রাখার আকার**: SQL এ data table, row, column আকারে থাকে। MongoDB তে data collection, document, field আকারে থাকে।

কখন কোনটা:

- Data এর structure নির্দিষ্ট, relation বেশি, transaction ও consistency জরুরি (payment, order, inventory): **SQL**
- Schema প্রায়ই বদলায়, nested বা semi-structured data, দ্রুত iterate ও বিশাল scale: **NoSQL**

### ACID কী?
ACID হলো database transaction এর ৪টি property।

- **Atomicity**: transaction এর সব কাজ হয় পুরোটা সফল হবে, নয়তো কিছুই হবে না
- **Consistency**: transaction শেষে database বৈধ অবস্থায় (constraint মেনে) থাকে
- **Isolation**: একসাথে চলা transaction গুলো একে অপরকে বিঘ্নিত করে না
- **Durability**: commit হয়ে গেলে crash হলেও data হারায় না (disk/WAL এ লেখা)

উদাহরণ: ব্যাংকে A থেকে B কে টাকা পাঠানো। A থেকে কাটা আর B তে যোগ হওয়া, দুটো একসাথে ঘটতে হবে।

### BASE কী? ACID এর সাথে পার্থক্য কী?
BASE হলো অনেক NoSQL এর দর্শন:

- **B**asically **A**vailable: সবসময় সাড়া দেওয়ার চেষ্টা করে
- **S**oft state: state সময়ের সাথে বদলাতে পারে
- **E**ventually consistent: কিছুক্ষণ পর সব node এ data মিলে যায়

ACID কঠোর consistency দেয়, BASE availability ও scale কে অগ্রাধিকার দেয়। (তবে MongoDB এখন multi-document ACID transaction ও দেয়।)

### CAP theorem কী?
CAP theorem হলো distributed system এর একটি theorem।

Distributed database এ একাধিক node/server থাকে। তাদের মধ্যে network communication এ সমস্যা (partition) হলে system কে **consistency** বা **availability** এর মধ্যে একটিকে বেছে নিতে হয়, অর্থাৎ trade-off মেনে চলতে হয়।

CAP এর তিনটি অংশ:

- **Consistency**: সব node একই data দেখে
- **Availability**: প্রতিটি request এর সাড়া মেলে
- **Partition tolerance**: network ভেঙে গেলেও system চলে

Network partition এড়ানো যায় না, তাই বাস্তবে **CP** (consistency রাখে, কিছু request ফেরত দেয় না) অথবা **AP** (available থাকে, কিন্তু পুরোনো data দিতে পারে) বেছে নিতে হয়।

### Normalization কী? 1NF, 2NF, 3NF কী?
Data এর duplication কমাতে ও anomaly (insert/update/delete সমস্যা) এড়াতে table ভাঙার পদ্ধতি।

- **1NF**: প্রতিটি column এ একটি মাত্র atomic value (কমা দিয়ে একাধিক value নয়), duplicate row নয়
- **2NF**: 1NF + কোনো non-key column কেবল composite key এর **অংশের** উপর নির্ভর করবে না
- **3NF**: 2NF + কোনো non-key column আরেকটি non-key column এর উপর নির্ভর করবে না (transitive dependency নয়)

উদাহরণ: `orders` table এ `customer_name` সরাসরি রাখলে ওই customer এর নাম বদলাতে অনেক row বদলাতে হয়। `customers` table আলাদা করে `customer_id` রাখুন।

### Denormalization কী? কখন করে?
ইচ্ছা করে কিছু data duplicate করা, যাতে JOIN কম লাগে এবং read দ্রুত হয়। যেমন order এ `total_price` সংরক্ষণ করা বা post এ `comment_count` রাখা।

করবেন যখন read অনেক বেশি, JOIN ধীর, আর সামান্য duplication মেনে নেওয়া যায়। ঝুঁকি: data একসাথে update না হলে অসঙ্গতি (inconsistency) হয়।

### Primary key, foreign key, unique key আর candidate key কী?
- **Primary key**: প্রতিটি row কে একক ভাবে চেনার column। `NULL` ও duplicate হতে পারে না। Table এ একটাই।
- **Foreign key**: অন্য table এর primary key কে নির্দেশ করে, referential integrity বজায় রাখে।
- **Unique key**: duplicate আটকায়, `NULL` অনুমোদিত (database ভেদে)। একাধিক থাকতে পারে।
- **Candidate key**: যেসব column primary key হওয়ার যোগ্য।

### Index কী? কীভাবে কাজ করে? সুবিধা ও অসুবিধা কী?
Index হলো আলাদা data structure (সাধারণত **B-tree**) যা কোনো column এর মান অনুযায়ী সাজানো থাকে। ফলে পুরো table scan না করে দ্রুত row খুঁজে পাওয়া যায়, যেমন বইয়ের শেষের সূচি।

সুবিধা: `WHERE`, `JOIN`, `ORDER BY` দ্রুত হয়।

অসুবিধা:

- Extra storage নেয়
- `INSERT/UPDATE/DELETE` ধীর হয় (index ও আপডেট করতে হয়)
- অনেক index দিলে write এর খরচ বাড়ে

যে column এ বেশি query হয় ও selectivity ভালো (অনেক আলাদা মান), সেখানে index দিন।

### Transaction কী? `BEGIN`, `COMMIT`, `ROLLBACK` কী?
Transaction হলো একগুচ্ছ operation যা একটি unit হিসেবে চলে।

```sql
BEGIN;
UPDATE accounts SET balance = balance - 500 WHERE id = 1;
UPDATE accounts SET balance = balance + 500 WHERE id = 2;
COMMIT;      -- স্থায়ী করা
-- সমস্যা হলে: ROLLBACK;  (সব বাতিল)
```

### Isolation level গুলো কী কী? Dirty read, non-repeatable read, phantom read কী?
**সমস্যা:**

- **Dirty read**: অন্য transaction এর uncommitted data পড়া
- **Non-repeatable read**: একই row দুইবার পড়লে মান আলাদা (মাঝে অন্য transaction commit করেছে)
- **Phantom read**: একই query দুইবার চালালে row এর সংখ্যা আলাদা (নতুন row ঢুকেছে)

**Level (নিচ থেকে উপরে):**

- Read Uncommitted
- Read Committed (PostgreSQL এর default)
- Repeatable Read (MySQL InnoDB এর default)
- Serializable (সবচেয়ে কঠোর, ধীর)

উপরের level এ consistency বেশি, কিন্তু concurrency ও performance কমে।

### Deadlock কী? কীভাবে এড়াবে?
দুটি transaction একে অপরের lock করা resource এর জন্য অপেক্ষা করতে থাকলে কেউ এগোতে পারে না, একে deadlock বলে। Database সাধারণত একটিকে নিজে abort করে।

এড়ানোর উপায়:

- সবসময় একই ক্রমে row/table lock করা
- Transaction ছোট ও দ্রুত রাখা
- অপ্রয়োজনে বেশি row lock না করা
- Deadlock এ retry logic রাখা

### Replication, sharding আর partitioning এর পার্থক্য কী?
- **Replication**: একই data এর কপি একাধিক server এ। Read scale, high availability ও backup এর জন্য।
- **Partitioning**: একটি বড় table কে একই database এর ভেতরে ছোট ছোট অংশে ভাগ করা (যেমন তারিখ অনুযায়ী)। Query ও maintenance দ্রুত হয়।
- **Sharding**: data কে একাধিক আলাদা server এ ভাগ করে রাখা (horizontal scaling)। প্রতিটি server একটি অংশ রাখে। Write scale এর জন্য।

### Scaling কী? কেন দরকার?
Scaling মানে system এর **load (ব্যবহারকারী, request, data) বাড়লেও** যেন সে ঠিকমতো ও দ্রুত চলে সেই সক্ষমতা বাড়ানো।

শুরুতে কয়েকজন user থাকলে একটি server ও একটি database যথেষ্ট। User হাজার বা লাখে পৌঁছালে:

- Response ধীর হয়ে যায়
- CPU, memory বা disk ভরে যায়
- Database এর connection ও query এ চাপ পড়ে
- Server crash করতে পারে

তখন scaling দরকার হয়, যাতে বাড়তি চাপ সামলানো যায় এবং system সবসময় available থাকে।

Scaling এর দুটি মূল ধরন: **vertical** (একটি মেশিন শক্তিশালী করা) এবং **horizontal** (আরও মেশিন যোগ করা)। নিচের প্রশ্নে বিস্তারিত।

Database এ scaling এর সাধারণ ধাপ:

- আগে query ও index optimize করা (সবচেয়ে সস্তা)
- Caching (Redis)
- Vertical scaling
- Read replica (read ভাগ করা)
- Partitioning ও sharding (write ভাগ করা)

**Interview answer:** "Scaling is the ability of a system to handle increased load, such as more users, requests, or data, without degrading performance. It can be done vertically by adding more resources to a single machine, or horizontally by adding more machines. For databases I usually start with query and index optimization and caching, then add read replicas, and use sharding only when necessary."

### Vertical আর horizontal scaling কী?
- **Vertical**: server এর CPU/RAM/disk বাড়ানো। সহজ, কিন্তু সীমা আছে ও ব্যয়বহুল।
- **Horizontal**: আরও server যোগ করা (replication, sharding)। বেশি scale হয় কিন্তু জটিল।

### N+1 query সমস্যা কী? কীভাবে সমাধান করবে?
একটি query দিয়ে N টি item আনার পর প্রতিটি item এর related data আনতে আলাদা করে আরও N টি query চালানো। মোট N+1 টি query।

```js
// N+1 সমস্যা
const posts = await Post.find();
for (const p of posts) {
  p.author = await User.findById(p.authorId); // প্রতিবার আলাদা query
}
```

সমাধান: JOIN বা `$lookup`, ORM এর eager loading (`include`/`populate`), `WHERE id IN (...)` দিয়ে একসাথে আনা, DataLoader (GraphQL এ)।

### Connection pooling কী? কেন দরকার?
প্রতিটি request এর জন্য নতুন database connection খোলা ধীর ও ব্যয়বহুল। Pool আগে থেকে কিছু connection খুলে রাখে এবং request এ ধার দেয়, কাজ শেষে ফেরত নেয়। Database এর সর্বোচ্চ connection সীমাও সুরক্ষিত থাকে।

Node.js এ `pg.Pool`, Mongoose/MongoDB driver এর নিজস্ব pool আছে। PostgreSQL এর জন্য অনেক connection হলে PgBouncer ব্যবহার হয়।

### ORM কী? ORM vs raw SQL
ORM (Object-Relational Mapper) হলো code এর object কে database table এর সাথে map করার library। উদাহরণ: Prisma, Sequelize, TypeORM, Drizzle, Mongoose (ODM)।

- ORM: দ্রুত লেখা, type safety, migration, SQL injection থেকে সুরক্ষা। জটিল query তে ধীর বা অদক্ষ SQL তৈরি করতে পারে।
- Raw SQL: পূর্ণ নিয়ন্ত্রণ ও performance, কিন্তু বেশি code ও injection এর ঝুঁকি (parameterize না করলে)।

বাস্তবে সহজ কাজে ORM, জটিল/ভারী query তে raw SQL।

### Database caching কী? Redis কীভাবে সাহায্য করে?
বারবার একই data আনা ঠেকাতে স্থায়ী database এর সামনে দ্রুত memory-ভিত্তিক cache (Redis, Memcached) রাখা হয়।

- Cache hit: Redis থেকে সাথে সাথে data
- Cache miss: database থেকে এনে Redis এ রাখা (TTL সহ)
- সবচেয়ে কঠিন অংশ হলো cache invalidation (data বদলালে cache মুছে ফেলা বা update করা)

### Backup আর recovery কীভাবে করবে?
- নিয়মিত full backup ও incremental/WAL archive
- Point-in-time recovery (PITR): নির্দিষ্ট সময়ে ফিরে যাওয়া
- Backup restore করে test করা (না করলে backup ব্যবহারযোগ্য কিনা জানা যায় না)
- Replica দিয়ে high availability, কিন্তু replica কোনোভাবেই backup এর বিকল্প নয়
- PostgreSQL এ `pg_dump`/`pg_basebackup`, MongoDB তে `mongodump` ও Atlas snapshot

## ২. Database Basics: আরও মৌলিক প্রশ্ন

### Database কী? DBMS কী? RDBMS কী?
- **Database**: সংগঠিতভাবে সংরক্ষিত data এর সংগ্রহ, যাতে সহজে খোঁজা, বদলানো ও পরিচালনা করা যায়।
- **DBMS** (Database Management System): database তৈরি, সংরক্ষণ, query ও নিরাপত্তা পরিচালনার software। উদাহরণ: MongoDB, MySQL, PostgreSQL, Oracle।
- **RDBMS** (Relational DBMS): data table (row ও column) আকারে রাখে এবং table গুলোর মধ্যে সম্পর্ক (primary/foreign key) থাকে। SQL ব্যবহার করে। উদাহরণ: PostgreSQL, MySQL, SQL Server, Oracle।

সহজ কথায়: database হলো data, DBMS হলো তা সামলানোর software।

### File system এর বদলে DBMS কেন ব্যবহার করি?
File system এ (সাধারণ file, Excel) সমস্যা: data duplication, একসাথে অনেক user এ গোলমাল, নিরাপত্তা দুর্বল, জটিল query কঠিন, crash এ data নষ্ট।

DBMS দেয়:

- Data redundancy ও inconsistency কম
- দ্রুত খোঁজা (index) ও জটিল query (SQL)
- একাধিক user এর একসাথে নিরাপদ access (transaction, concurrency)
- Constraint দিয়ে data integrity
- Backup, recovery ও নিরাপত্তা (অনুমতি ব্যবস্থা)

### Database, schema, table, row, column এর মধ্যে পার্থক্য কী?
- **Database**: সব কিছুর ধারক
- **Schema**: database এর ভেতরের কাঠামো বা namespace (table, view, function এর সংগ্রহ)। PostgreSQL এ একটি database এ একাধিক schema থাকতে পারে (`public` ডিফল্ট)।
- **Table**: data এর সারণি (যেমন `users`)
- **Row (record/tuple)**: table এর একটি এন্ট্রি
- **Column (field/attribute)**: table এর একটি তথ্যের ধরন (যেমন `email`)

### Entity, attribute, relation, tuple, degree ও cardinality কী?
- **Entity (সত্তা)**: এমন কোনো real-world object বা thing, যার information আমরা Database-এ store করতে চাই। যেমন Student, Order, Product। সাধারণত একটি Entity একটি table হয়।
- **Attribute (বৈশিষ্ট্য)**: Entity-এর বৈশিষ্ট্য বা properties। যেমন Student এর `name`, `age`, `email`। Table এ এগুলো column।
- **Relation (সম্পর্ক)**: Relational Database-এর context-এ Relation বলতে একটি **Table** কে বোঝায়। আবার ER Model-এ Relation বলতে Entity-গুলোর মধ্যে সম্পর্ক বোঝায় (যেমন Student ও Course এর মধ্যে enrolled সম্পর্ক)।
- **Tuple (সারি / Row)**: একটি Relation বা Table-এর একটি সম্পূর্ণ Row বা Record।
- **Degree (Attribute সংখ্যা)**: একটি Relation বা Table-এ মোট কতগুলো Attribute বা Column আছে।
- **Cardinality (Tuple সংখ্যা)**: Relational Database-এর context-এ একটি Table-এ মোট কতগুলো Tuple বা Row আছে।

উদাহরণ (`students` table):

```
id | name  | age     <- 3টি attribute (column)
1  | Rahim | 22      <- একটি tuple (row)
2  | Karim | 24
3  | Sumi  | 21
```

- Entity: Student
- Attributes: `id`, `name`, `age`
- Relation: `students` table
- Tuple: `(1, Rahim, 22)`
- Degree: **3** (column সংখ্যা)
- Cardinality: **3** (row সংখ্যা)

মনে রাখার উপায়: Degree = column গোনা, Cardinality = row গোনা।

বি.দ্র.: "Cardinality" শব্দটি তিন জায়গায় তিন অর্থে আসে।

- **Table এর ক্ষেত্রে**: row এর সংখ্যা (এখানে যা বলা হলো)
- **ER সম্পর্কের ক্ষেত্রে**: সম্পর্কের ধরন, যেমন one-to-one, one-to-many, many-to-many
- **Index এর ক্ষেত্রে**: কোনো column এ আলাদা (distinct) মানের সংখ্যা। বেশি হলে index বেশি কাজে লাগে।

### Data integrity কী? কত ধরনের?
Data Integrity হলো Database-এর data যেন accurate, consistent, reliable এবং valid থাকে, তা নিশ্চিত করার process।

সহজভাবে বললে, Database-এ যেন ভুল, duplicate, invalid বা inconsistent data store না হয়, সেটাই Data Integrity-এর উদ্দেশ্য।

- **Entity integrity**: প্রতিটি row আলাদা ও primary key `NULL` নয়
- **Referential integrity**: foreign key সবসময় বৈধ parent row কে নির্দেশ করবে
- **Domain integrity**: column এর মান বৈধ পরিসর/type এর ভেতরে (`CHECK`, data type, `NOT NULL`)
- **User-defined integrity**: ব্যবসায়িক নিয়ম (trigger/constraint দিয়ে)

### Super key, candidate key, composite key ও alternate key কী?
- **Super key**: যেকোনো column গুচ্ছ যা row কে একক ভাবে চেনায় (অতিরিক্ত column ও থাকতে পারে)
- **Candidate key**: ন্যূনতম super key (কোনো column বাদ দিলে আর unique থাকে না)
- **Primary key**: candidate key দের মধ্যে যেটিকে প্রধান বানানো হয়
- **Alternate key**: যেসব candidate key primary key হয়নি
- **Composite key**: একাধিক column মিলে গঠিত key (যেমন `(student_id, course_id)`)
- **Foreign key**: অন্য table এর primary key কে নির্দেশ করে

### ER diagram কী?
ER Diagram (Entity Relationship Diagram) হলো একটি visual representation, যা Database-এর Entity, Attribute এবং Entity-গুলোর মধ্যে Relationship দেখায়।

Database এর কাঠামো ছবির মাধ্যমে দেখানোর উপায়: entity (আয়তক্ষেত্র), attribute, এবং তাদের মধ্যে সম্পর্ক (one-to-one, one-to-many, many-to-many)। Table বানানোর আগে ডিজাইন বোঝাতে ও আলোচনা করতে কাজে লাগে (dbdiagram.io, draw.io, pgAdmin)।

### SQL কী? SQL, MySQL আর PostgreSQL এর পার্থক্য কী?
- **SQL** (Structured Query Language): relational database এর সাথে কথা বলার **ভাষা**
- **MySQL, PostgreSQL**: সেই ভাষা বুঝে এমন **database system (software)**

অর্থাৎ SQL হলো ভাষা, MySQL/PostgreSQL হলো তার implementation। প্রতিটির নিজস্ব কিছু অতিরিক্ত syntax ও feature আছে।

### SQL এর সাধারণ data type গুলো কী কী? `CHAR` আর `VARCHAR` এর পার্থক্য কী?
- সংখ্যা: `INT`, `BIGINT`, `NUMERIC/DECIMAL`, `FLOAT`
- Text: `CHAR`, `VARCHAR`, `TEXT`
- সত্য/মিথ্যা: `BOOLEAN`
- তারিখ/সময়: `DATE`, `TIME`, `TIMESTAMP`
- আরও: `UUID`, `JSON/JSONB`, `ARRAY` (PostgreSQL), `BYTEA` (binary)

`CHAR(n)` সবসময় নির্দিষ্ট n দৈর্ঘ্য (খালি জায়গা space দিয়ে ভরে)। `VARCHAR(n)` সর্বোচ্চ n পর্যন্ত পরিবর্তনশীল দৈর্ঘ্য। PostgreSQL এ `TEXT` ও `VARCHAR` এর কার্যকারিতা প্রায় একই।

### মৌলিক query এর অংশ গুলো কী কী? (`SELECT`, `WHERE`, `ORDER BY`, `LIMIT`, `LIKE`, `IN`, `BETWEEN`, alias)
```sql
SELECT name AS full_name, salary          -- AS দিয়ে alias
FROM employees
WHERE dept = 'IT'                          -- filter
  AND salary BETWEEN 30000 AND 80000       -- পরিসর (দুই প্রান্ত সহ)
  AND city IN ('Dhaka', 'Chattogram')      -- তালিকার যেকোনো একটি
  AND name LIKE 'R%'                       -- R দিয়ে শুরু (% = যেকোনো অক্ষর, _ = একটি অক্ষর)
ORDER BY salary DESC                       -- ASC (ডিফল্ট) বা DESC
LIMIT 10 OFFSET 0;                         -- প্রথম ১০টি
```

### Data redundancy ও anomaly (insert/update/delete) কী?
**Data Redundancy** হলো Database-এ একই data অপ্রয়োজনীয়ভাবে একাধিক জায়গায় store হওয়া।

**Database Anomaly** হলো poorly designed বা redundant Database-এর কারণে Insert, Update এবং Delete করার সময় যে সমস্যা তৈরি হয়।

Redundancy এর ফলে তিন ধরনের anomaly হয়:

- **Insert anomaly**: একটি তথ্য রাখতে গিয়ে অন্য অপ্রাসঙ্গিক তথ্য ও দিতে হয়
- **Update anomaly**: এক জায়গায় বদলালে অন্য কপিগুলো পুরোনো থেকে যায় (অসঙ্গতি)
- **Delete anomaly**: একটি row মুছলে অন্য প্রয়োজনীয় তথ্য ও হারিয়ে যায়

Normalization দিয়ে এগুলো কমানো হয়।

### Data dictionary/metadata কী?
**Data Dictionary** হলো Database-এর একটি centralized collection, যেখানে Database-এর structure এবং বিভিন্ন data সম্পর্কে বিস্তারিত information সংরক্ষিত থাকে।

সহজভাবে বললে, Database-এর কোন Table আছে, কোন Column আছে, Data Type কী, Primary Key কোনটি, Foreign Key কোনটি, এসব information Data Dictionary-তে থাকে।

**Metadata** হলো Data সম্পর্কে Data (Data about Data)।

অর্থাৎ, কোনো Data-এর বৈশিষ্ট্য বা description-কে Metadata বলে।

পার্থক্য:

- **Data Dictionary**: Database structure-এর বিস্তারিত documentation। Tables, Columns, Constraints ইত্যাদি সংরক্ষণ করে এবং Database structure বুঝতে সাহায্য করে।
- **Metadata**: Data সম্পর্কে information। Data Type, Size, Format, Source ইত্যাদি বর্ণনা করে এবং Data বুঝতে সাহায্য করে।

PostgreSQL এ এই তথ্য `information_schema` ও `pg_catalog` এ দেখা যায়:

```sql
SELECT table_name, column_name, data_type
FROM information_schema.columns
WHERE table_schema = 'public';
```

### DBMS এর ধরন (model) গুলো কী কী?
- **Hierarchical**: tree আকারে (parent-child), পুরোনো। Software: IBM Information Management System (IMS)
- **Network**: graph এর মতো, একাধিক parent। Software: IDMS
- **Relational**: table ও সম্পর্ক (সবচেয়ে প্রচলিত)। Software: PostgreSQL, MySQL, Microsoft SQL Server, Oracle Database, SQLite
- **NoSQL**: document, key-value, column-family, graph
- **Object-oriented**: object হিসেবে data সংরক্ষণ। Software: ObjectDB, db4o

NoSQL এর উদাহরণ:

- **Document**: MongoDB, CouchDB, Amazon DocumentDB
- **Key-value**: Redis, Amazon DynamoDB, Riak KV

### Database architecture: 1-tier, 2-tier আর 3-tier কী?
Database Architecture হলো Application, Database এবং User-এর মধ্যে কীভাবে communication ও interaction হবে, তার structural design।

**1-Tier Architecture**

- user সরাসরি database এ কাজ করে (একই মেশিনে)
- Example: SQLite Desktop Application, Local MS Access Database

**2-Tier Architecture**

- client application সরাসরি database server এর সাথে কথা বলে
- Example: ধরো, একটি Desktop Application আছে। Frontend: Java Swing, Database: MySQL Server।

**3-Tier Architecture**

তিনটি Layer হলো:

- **Presentation Layer (Frontend)**: user যা দেখে ও ব্যবহার করে
- **Application Layer (Backend)**: business logic
- **Database Layer**: data সংরক্ষণ

আজকের web app এ এটাই প্রচলিত (React → Node/Next.js API → database)। নিরাপত্তা ও scale ভালো, কারণ browser কখনো সরাসরি database ছোঁয় না।

### Database ভেতরে কীভাবে data সংরক্ষণ করে? (page, buffer pool)
Disk এ data একটি নির্দিষ্ট আকারের **page/block** (PostgreSQL এ ডিফল্ট ৮KB) এ ভাগ করে রাখা হয়। Query এর সময় প্রয়োজনীয় page disk থেকে memory র **buffer pool/cache** এ আনা হয়। Memory তে থাকা page পড়া disk এর চেয়ে বহুগুণ দ্রুত। তাই "cache hit ratio" গুরুত্বপূর্ণ, আর index আছে মানে কম page পড়তে হয়। Crash থেকে বাঁচতে পরিবর্তন আগে **WAL/journal** এ লেখা হয়।

### Cursor কী?
Database Cursor হলো একটি database object, যা Query-এর result set-এর records একবারে সব না নিয়ে একে একে (row by row) process করতে সাহায্য করে।

সহজভাবে বললে, অনেকগুলো Row-এর মধ্যে একটির পর একটি Row নিয়ে কাজ করার জন্য Cursor ব্যবহার করা হয়।

বড় result এ সব row একসাথে memory তে না এনে কাজ করতে এটি কাজে লাগে। সাধারণত set-based SQL (একটি query) cursor এর চেয়ে দ্রুত, তাই শুধু দরকারে ব্যবহার করুন। Node.js এ বড় result এর জন্য `pg-cursor`/stream ব্যবহার করা যায়।

## ৩. SQL ও PostgreSQL

### JOIN এর ধরনগুলো কী কী?
- **INNER JOIN**: দুই table এ মিল আছে এমন row
- **LEFT JOIN**: বাম table এর সব row, ডান এ মিল না থাকলে `NULL`
- **RIGHT JOIN**: ডান table এর সব row, বামে মিল না থাকলে `NULL`
- **FULL OUTER JOIN**: দুই পাশেরই সব row
- **CROSS JOIN**: সব সম্ভাব্য জোড়া (cartesian product)
- **SELF JOIN**: একই table কে নিজের সাথে join

```sql
SELECT u.name, o.total
FROM users u
LEFT JOIN orders o ON o.user_id = u.id;
```

### `WHERE` আর `HAVING` এর পার্থক্য কী?
- **কাজ**: `WHERE` Row filter করে, `HAVING` Group filter করে।
- **Execution**: `WHERE` Grouping-এর **আগে** চলে, `HAVING` Grouping-এর **পরে** চলে।
- **GROUP BY**: `WHERE` `GROUP BY` ছাড়াও ব্যবহার করা যায়। `HAVING` সাধারণত `GROUP BY`-এর সঙ্গে ব্যবহৃত হয়।
- **Aggregate Function**: `WHERE` এ সরাসরি ব্যবহার করা যায় না, `HAVING` এ ব্যবহার করা যায়।
- **Example**: `WHERE salary > 40000` এবং `HAVING AVG(salary) > 40000`

```sql
SELECT dept, COUNT(*) AS cnt
FROM employees
WHERE active = true        -- আগে row ছাঁটা
GROUP BY dept
HAVING COUNT(*) > 5;       -- পরে group ছাঁটা
```

### `GROUP BY` কীভাবে কাজ করে? SQL query এর execution order কী?
`GROUP BY` একই মানের row গুলো জড়ো করে aggregate (`COUNT`, `SUM`, `AVG`, `MIN`, `MAX`) চালায়।

Query লেখার ক্রম আর চলার ক্রম আলাদা। চলার ক্রম:

- `FROM` / `JOIN`
- `WHERE`
- `GROUP BY`
- `HAVING`
- `SELECT`
- `DISTINCT`
- `ORDER BY`
- `LIMIT`

এ কারণেই `WHERE` এ `SELECT` এর alias ব্যবহার করা যায় না।

### `UNION` আর `UNION ALL` এর পার্থক্য কী?
`UNION` দুটি query এর ফল জুড়ে **duplicate সরিয়ে দেয়** (তাই ধীর)। `UNION ALL` duplicate সহ সব রাখে (দ্রুত)। Duplicate সরানোর দরকার না থাকলে `UNION ALL` ব্যবহার করুন।

### `DELETE`, `TRUNCATE` আর `DROP` এর পার্থক্য কী?
**কাজ:**

- `DELETE`: নির্দিষ্ট (`WHERE` দিয়ে) বা সব row delete করে।
- `TRUNCATE`: একসাথে সব row remove করে।
- `DROP`: পুরো table ও data remove করে।

**Index এর ক্ষেত্রে:**

- `DELETE`: Structure থাকে, deleted row গুলোর entry remove হয়।
- `TRUNCATE`: Structure থাকে, সব entry remove হয়।
- `DROP`: Index structure সহ সব remove হয়।

মনে রাখবে:

- `DELETE` → Selected / All Rows Remove
- `TRUNCATE` → All Rows Remove
- `DROP` → Entire Table Remove

```sql
DELETE FROM orders WHERE status = 'cancelled';  -- নির্দিষ্ট row
DELETE FROM orders;                              -- সব row (ধীর)
TRUNCATE TABLE orders;                           -- সব row (দ্রুত)
DROP TABLE orders;                               -- table ই নেই
```

আরও যা জানা দরকার:

- **ধরন**: `DELETE` হলো DML। `TRUNCATE` ও `DROP` হলো DDL (বেশিরভাগ database এ)।
- **`WHERE`**: শুধু `DELETE` এ দেওয়া যায়। `TRUNCATE` ও `DROP` এ নেই।
- **গতি**: `DELETE` row ধরে ধরে মোছে ও প্রতিটির log রাখে, তাই বড় table এ ধীর। `TRUNCATE` একবারে পুরো storage খালি করে, তাই দ্রুত।
- **Trigger**: `DELETE` এ প্রতিটি row এর `ON DELETE` trigger চলে। `TRUNCATE` এ row-level delete trigger চলে না।
- **Rollback**: `DELETE` সব database এ rollback করা যায়। `TRUNCATE` PostgreSQL ও SQL Server এ transaction এর ভেতরে rollback করা যায়, কিন্তু MySQL ও Oracle এ করা যায় না (auto-commit হয়ে যায়)।
- **Auto-increment / identity**: `TRUNCATE` MySQL এ counter শূন্য থেকে শুরু করে। PostgreSQL এ ডিফল্টে করে না, `TRUNCATE ... RESTART IDENTITY` দিতে হয়। `DELETE` counter বদলায় না।
- **Foreign key**: অন্য table যদি এই table কে reference করে, `TRUNCATE` সরাসরি চলে না। `TRUNCATE ... CASCADE` লাগে (reference করা table এর data ও যায়)। `DROP` এও `CASCADE` লাগতে পারে।
- **PostgreSQL এ জায়গা**: `DELETE` এ row আসলে সরে না, "dead tuple" হিসেবে থাকে। `VACUUM` এর পরে জায়গা পুনরায় ব্যবহারযোগ্য হয় (bloat হতে পারে)। `TRUNCATE` সাথে সাথে জায়গা ফেরত দেয়।
- **Lock**: `TRUNCATE` পুরো table এ কড়া lock (`ACCESS EXCLUSIVE` in PostgreSQL) নেয়, তাই চলার সময় অন্য query আটকে যায়। `DELETE` এ row-level lock।
- **Interview tip**: সব row মুছতে চাইলে এবং trigger/rollback এর দরকার না থাকলে `TRUNCATE`। কিছু row মুছতে বা trigger চালাতে হলে `DELETE`। Table ই আর লাগবে না হলে `DROP`।

### Primary key এর জন্য `SERIAL`, `IDENTITY` আর `UUID` এর তুলনা
- `SERIAL`: পুরোনো পদ্ধতি, sequence এর shortcut
- `GENERATED ALWAYS AS IDENTITY`: আধুনিক ও SQL standard অনুযায়ী, PostgreSQL এ এটাই প্রস্তাবিত
- `UUID`: globally unique, আন্দাজ করা কঠিন (URL এ id দেখানোর জন্য নিরাপদ), distributed system এ ভালো। কিন্তু বেশি জায়গা নেয় এবং random UUID এ index fragmentation হয়। UUIDv7 (সময় অনুযায়ী ক্রমিক) এ এই সমস্যা কম।

### Subquery আর JOIN এর মধ্যে কোনটা ভালো?
অনেক ক্ষেত্রে optimizer দুটোকে একই রকম plan এ বদলে দেয়। সাধারণ নিয়ম:

- Related table এর column ও দরকার হলে **JOIN**
- শুধু অস্তিত্ব দেখতে হলে `EXISTS`
- `IN (subquery)` বড় result এ ধীর হতে পারে, `EXISTS` প্রায়ই ভালো
- নিশ্চিত হতে `EXPLAIN ANALYZE` দিয়ে মাপুন

### CTE (`WITH`) কী? Recursive CTE কী?
CTE হলো query এর ভেতরে নাম দেওয়া অস্থায়ী result, যা query কে পরিষ্কার ও পড়ার যোগ্য করে।

```sql
WITH recent AS (
  SELECT * FROM orders WHERE created_at > now() - interval '7 days'
)
SELECT user_id, SUM(total) FROM recent GROUP BY user_id;
```

**Recursive CTE** hierarchical data (category tree, org chart) এর জন্য:

```sql
WITH RECURSIVE tree AS (
  SELECT id, name, parent_id FROM categories WHERE parent_id IS NULL
  UNION ALL
  SELECT c.id, c.name, c.parent_id
  FROM categories c JOIN tree t ON c.parent_id = t.id
)
SELECT * FROM tree;
```

### Window function কী? `ROW_NUMBER`, `RANK`, `DENSE_RANK` এর পার্থক্য কী?
Window function row গুলোকে group এ না ভেঙেই একটি "window" এর উপর হিসাব করে। প্রতিটি row আলাদা থাকে।

- `ROW_NUMBER()`: প্রতিটি row এ ক্রমিক নম্বর (1, 2, 3, 4), সমান মানেও আলাদা নম্বর
- `RANK()`: সমান মানে একই rank, পরের rank এ ফাঁক থাকে (1, 2, 2, 4)
- `DENSE_RANK()`: সমান মানে একই rank, ফাঁক থাকে না (1, 2, 2, 3)
- অন্যান্য: `LAG`, `LEAD`, `SUM() OVER`, `NTILE`

```sql
SELECT name, dept, salary,
       RANK() OVER (PARTITION BY dept ORDER BY salary DESC) AS r
FROM employees;
```

### View আর materialized view এর পার্থক্য কী?
- **View**: সংরক্ষিত query। প্রতিবার ব্যবহারে query আবার চলে, data সংরক্ষণ হয় না।
- **Materialized view**: query এর **ফলাফল** সংরক্ষণ করে। দ্রুত পড়া যায়, কিন্তু পুরোনো হতে পারে। `REFRESH MATERIALIZED VIEW` দিয়ে নতুন করতে হয়। ভারী report এর জন্য ভালো।

### PostgreSQL এ কী কী ধরনের index আছে?
- **B-tree** (default): `=`, `<`, `>`, `BETWEEN`, `ORDER BY` এ কাজ করে
- **Hash**: শুধু `=` তুলনায়
- **GIN**: array, `jsonb`, full-text search এ (একটি value এ অনেক key থাকলে)
- **GiST**: geometry/geo data, range type, nearest-neighbor
- **BRIN**: খুব বড় table যেখানে data স্বাভাবিকভাবে সাজানো (যেমন time-series), খুব ছোট index
- **SP-GiST**: বিশেষ ধরনের partitioned data এর জন্য

### Composite index আর partial index কী?
- **Composite (multi-column)**: একাধিক column এ একটি index। **Column এর ক্রম গুরুত্বপূর্ণ**। `(a, b)` index `WHERE a = ?` ও `WHERE a = ? AND b = ?` এ কাজ করে, কিন্তু শুধু `WHERE b = ?` এ সাধারণত কাজে লাগে না (leftmost prefix নিয়ম)।
- **Partial index**: শুধু শর্ত মেলা row এর উপর index। ছোট ও দ্রুত।

```sql
CREATE INDEX idx_orders_user_date ON orders (user_id, created_at DESC);
CREATE INDEX idx_active_users ON users (email) WHERE deleted_at IS NULL;
```

### `EXPLAIN` আর `EXPLAIN ANALYZE` কী? Slow query কীভাবে খুঁজবে ও ঠিক করবে?
- `EXPLAIN`: query plan দেখায় (আসলে না চালিয়ে আনুমানিক)।
- `EXPLAIN ANALYZE`: query সত্যিই চালিয়ে আসল সময় ও row এর সংখ্যা দেখায়।

কী দেখবেন:

- **Seq Scan** (পুরো table পড়া) বড় table এ থাকলে index দরকার হতে পারে
- **Index Scan / Index Only Scan** ভালো লক্ষণ
- Estimated rows আর actual rows এর বড় পার্থক্য (statistics পুরোনো, `ANALYZE` চালান)
- খুব ধীর নোড কোনটি (actual time)

ধাপ: slow query log/`pg_stat_statements` দিয়ে ধীর query খুঁজুন, `EXPLAIN ANALYZE` চালান, ঠিক index দিন, `SELECT *` এড়ান, N+1 ঠিক করুন, আবার মাপুন।

### MVCC কী? PostgreSQL এ কীভাবে কাজ করে?
MVCC (Multi-Version Concurrency Control): প্রতিটি update এ পুরোনো row মুছে ফেলার বদলে একটি **নতুন version** তৈরি হয়। প্রতিটি transaction তার শুরুর snapshot অনুযায়ী উপযুক্ত version দেখে।

ফল: **reader writer কে আটকায় না, writer reader কে আটকায় না**। উচ্চ concurrency এ ভালো। দাম: পুরোনো version (dead tuple) জমে যায়।

### `VACUUM` কী? কেন দরকার?
MVCC এর কারণে update/delete এ dead tuple জমে table ফুলে যায় (bloat)। `VACUUM` এই dead row এর জায়গা পুনরায় ব্যবহারযোগ্য করে। `autovacuum` নিজে নিজে এটা চালায়। `VACUUM FULL` table পুনর্লিখন করে ডিস্ক ফেরত দেয়, কিন্তু table lock করে। `ANALYZE` query planner এর statistics আপডেট করে।

### `JSON` আর `JSONB` এর পার্থক্য কী? PostgreSQL এ JSON কীভাবে query করে?
- `JSON`: text হিসেবে হুবহু সংরক্ষণ করে (whitespace ও key এর ক্রম সহ), index করা যায় না
- `JSONB`: binary format, দ্রুত query, **GIN index** দেওয়া যায়, duplicate key বাদ যায়। সাধারণত `JSONB` ই ব্যবহার করুন।

```sql
SELECT data->>'name' FROM users;                 -- text আকারে
SELECT * FROM users WHERE data @> '{"role":"admin"}';  -- contains
CREATE INDEX idx_data ON users USING GIN (data);
```

### Pagination: `OFFSET` আর keyset (cursor) pagination এর পার্থক্য
- `LIMIT/OFFSET`: সহজ, কিন্তু offset বড় হলে ধীর (database কে আগের সব row পড়ে বাদ দিতে হয়) এবং page বদলের সময় data insert হলে row বাদ/duplicate হতে পারে।
- **Keyset**: শেষ দেখা item এর মান ধরে পরের অংশ আনা। index এর কারণে দ্রুত ও স্থিতিশীল।

```sql
-- offset
SELECT * FROM posts ORDER BY id LIMIT 20 OFFSET 10000;
-- keyset
SELECT * FROM posts WHERE id > 10000 ORDER BY id LIMIT 20;
```

### Upsert কী? PostgreSQL এ কীভাবে করে?
Row না থাকলে insert, থাকলে update। PostgreSQL এ `ON CONFLICT`:

```sql
INSERT INTO users (email, name)
VALUES ('a@b.com', 'Rahim')
ON CONFLICT (email)
DO UPDATE SET name = EXCLUDED.name;
-- বা কিছু না করতে: ON CONFLICT DO NOTHING
```

### Constraint গুলো কী কী?
`NOT NULL`, `UNIQUE`, `PRIMARY KEY`, `FOREIGN KEY`, `CHECK` (শর্ত যাচাই), `DEFAULT`। Application এ validation থাকলেও database এ constraint রাখুন, কারণ এটাই শেষ রক্ষাকবচ।

```sql
CREATE TABLE orders (
  id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
  user_id BIGINT NOT NULL REFERENCES users(id) ON DELETE CASCADE,
  total NUMERIC(10,2) CHECK (total >= 0),
  status TEXT NOT NULL DEFAULT 'pending'
);
```

### Trigger আর stored procedure/function কী?
- **Trigger**: কোনো ঘটনায় (`INSERT/UPDATE/DELETE`) স্বয়ংক্রিয়ভাবে চলা function (audit log, `updated_at` আপডেট)
- **Stored procedure/function**: database এর ভেতরে সংরক্ষিত logic, বারবার ডাকা যায়

সাবধান: বেশি logic database এ রাখলে test, version control ও debug কঠিন হয়। জটিল business logic সাধারণত application এ রাখা হয়।

### PostgreSQL এ full-text search কীভাবে হয়?
`tsvector` (document) ও `tsquery` (প্রশ্ন) দিয়ে। `GIN` index দিলে দ্রুত হয়।

```sql
SELECT * FROM articles
WHERE to_tsvector('english', title || ' ' || body) @@ plainto_tsquery('english', 'database index');
```

বাংলা ভাষা বা উন্নত search এ Elasticsearch/Meilisearch বেশি উপযুক্ত।

### PostgreSQL আর MySQL এর মূল পার্থক্য কী?
- PostgreSQL: বেশি standard মেনে চলে, উন্নত feature (JSONB, CTE, window function, array, custom type, extension যেমন PostGIS), জটিল query তে শক্তিশালী
- MySQL: সহজ, read-heavy web app এ জনপ্রিয় ও দ্রুত, ব্যাপক hosting সুবিধা
- Transaction/locking: দুটোই MVCC, default isolation আলাদা (PG: Read Committed, MySQL: Repeatable Read)

## ৪. MongoDB

### MongoDB কী? Document database বলতে কী বোঝায়?
MongoDB একটি NoSQL **document database**। Data JSON-এর মতো **document** (BSON format) আকারে থাকে, নির্দিষ্ট schema বাধ্যতামূলক নয়। একই collection এর document গুলোর structure আলাদা হতে পারে। Nested object ও array সরাসরি রাখা যায়।

```js
{
  _id: ObjectId("..."),
  name: "Rahim",
  age: 28,
  address: { city: "Dhaka", zip: "1207" },
  skills: ["js", "react", "node"]
}
```

### SQL এর সাথে MongoDB এর শব্দ মিলাও (table, row, column, join)
- Database → Database
- Table → **Collection**
- Row → **Document**
- Column → **Field**
- Primary key → `_id`
- JOIN → `$lookup` বা embedding
- Index → Index

### BSON কী? JSON থেকে কীভাবে আলাদা?
BSON হলো binary JSON। JSON এর চেয়ে বেশি data type সাপোর্ট করে (`Date`, `ObjectId`, `Decimal128`, `Binary`, `Int32/64`), এবং scan করা দ্রুত। MongoDB এ document BSON এ সংরক্ষিত হয়।

### `ObjectId` কী? এর গঠন কেমন?
`_id` এর default মান। ১২ byte এর unique id:

- ৪ byte: তৈরির সময় (timestamp)
- ৫ byte: random মান (machine/process সম্পর্কিত)
- ৩ byte: ক্রমিক counter

তাই এটি প্রায় সময়ের ক্রম অনুযায়ী সাজানো ও আলাদা server এ তৈরি হলেও unique থাকে। `_id` থেকে তৈরির সময় বের করা যায়: `id.getTimestamp()`।

### MongoDB এর CRUD operation গুলো দেখাও
```js
// Create
db.users.insertOne({ name: "Rahim", age: 28 });
db.users.insertMany([{ name: "A" }, { name: "B" }]);

// Read
db.users.find({ age: { $gt: 25 } }, { name: 1, _id: 0 }).sort({ age: -1 }).limit(10);
db.users.findOne({ name: "Rahim" });

// Update
db.users.updateOne({ name: "Rahim" }, { $set: { age: 29 }, $inc: { logins: 1 } });
db.users.updateMany({}, { $set: { active: true } });

// Delete
db.users.deleteOne({ name: "Rahim" });
db.users.deleteMany({ active: false });
```

### MongoDB এর common query ও update operator গুলো কী?
- তুলনা: `$eq`, `$ne`, `$gt`, `$gte`, `$lt`, `$lte`, `$in`, `$nin`
- যুক্তি: `$and`, `$or`, `$not`, `$nor`
- Element: `$exists`, `$type`
- Array: `$all`, `$elemMatch`, `$size`
- Update: `$set`, `$unset`, `$inc`, `$push`, `$pull`, `$addToSet`, `$rename`

### Embedding আর referencing এর পার্থক্য কী? কখন কোনটা?
- **Embedding**: সম্পর্কিত data একই document এর ভেতরে রাখা। এক query তে সব পাওয়া যায়, কিন্তু document বড় হতে পারে এবং duplication হয়।
- **Referencing**: অন্য document এর `_id` রাখা (SQL এর foreign key এর মতো)। Data আলাদা, কিন্তু একাধিক query/`$lookup` লাগে।

Embed করুন যখন: data একসাথে পড়া হয়, "এক থেকে কয়েক" সম্পর্ক, ছোট ও সীমিত data (যেমন user এর address)।

Reference করুন যখন: "এক থেকে অনেক" বা "অনেক থেকে অনেক", data অসীম বাড়তে পারে (যেমন post এর হাজার হাজার comment), আলাদাভাবে ব্যবহার হয়।

নিয়ম: **যেভাবে data পড়বেন সেই access pattern অনুযায়ী schema বানান।** Document এর সীমা 16MB।

### MongoDB এ index কীভাবে কাজ করে? কী কী ধরনের index আছে?
SQL এর মতোই index query কে collection scan (`COLLSCAN`) এর বদলে index scan (`IXSCAN`) এ দ্রুত করে।

ধরন: single field, **compound**, multikey (array এর উপর), text, geospatial (`2dsphere`), hashed, **TTL**, unique, partial, sparse।

```js
db.users.createIndex({ email: 1 }, { unique: true });
db.orders.createIndex({ userId: 1, createdAt: -1 });
db.sessions.createIndex({ createdAt: 1 }, { expireAfterSeconds: 3600 }); // TTL
```

### Compound index এ ESR rule কী?
Compound index এর field ক্রম সাজানোর নিয়ম:

- **E**quality (সমান `=` দিয়ে filter) আগে
- **S**ort (যে field দিয়ে sort) তারপর
- **R**ange (`$gt`, `$lt`, `$in` range) শেষে

এতে index পুরোপুরি ব্যবহৃত হয় এবং in-memory sort এড়ানো যায়।

### `explain()` দিয়ে query কীভাবে বিশ্লেষণ করবে?
```js
db.orders.find({ userId: 5 }).explain("executionStats");
```

দেখবেন:

- `stage`: `COLLSCAN` (খারাপ, পুরো collection) নাকি `IXSCAN` (ভালো)
- `totalDocsExamined` এর সাথে `nReturned` এর অনুপাত (যত কাছাকাছি তত ভালো)
- `executionTimeMillis`
- "covered query" হলে `totalDocsExamined` 0 (index থেকেই উত্তর)

### Aggregation pipeline কী? প্রধান stage গুলো কী কী?
Document গুলো একটির পর একটি stage এর ভেতর দিয়ে গিয়ে রূপান্তরিত হয়, যেমন SQL এর `WHERE + GROUP BY + JOIN + ORDER BY` একসাথে।

প্রধান stage: `$match` (filter), `$group`, `$project`, `$sort`, `$limit`, `$skip`, `$lookup` (join), `$unwind` (array ভাঙা), `$addFields`, `$facet`, `$count`।

```js
db.orders.aggregate([
  { $match: { status: "paid" } },
  { $group: { _id: "$userId", total: { $sum: "$amount" }, count: { $sum: 1 } } },
  { $sort: { total: -1 } },
  { $limit: 5 },
]);
```

Performance এর জন্য `$match` ও `$limit` যতটা সম্ভব আগে রাখুন, যাতে index ব্যবহার হয় ও পরের stage এ কম data যায়।

### `$lookup` কী? এটা SQL এর JOIN এর মতো কি?
`$lookup` হলো aggregation এ **left outer join**: অন্য collection থেকে মিল থাকা document এনে একটি array field এ বসায়।

```js
db.orders.aggregate([
  { $lookup: { from: "users", localField: "userId", foreignField: "_id", as: "user" } },
  { $unwind: "$user" },
]);
```

কিন্তু SQL JOIN এর মতো এত দক্ষ নয়, বেশি ব্যবহার করলে ধীর হয়। বারবার `$lookup` লাগলে বুঝতে হবে data embed করা উচিত ছিল।

### MongoDB তে transaction আছে কি? কীভাবে কাজ করে?
হ্যাঁ। MongoDB 4.0 থেকে replica set এ এবং 4.2 থেকে sharded cluster এও **multi-document ACID transaction** আছে।

- **একটি document এর** operation সবসময়ই atomic। তাই ভালো schema design এ (embedding) অনেক সময় transaction লাগেই না।
- Multi-document transaction এ বাড়তি overhead আছে, তাই শুধু প্রয়োজনে ব্যবহার করুন।

```js
const session = await mongoose.startSession();
await session.withTransaction(async () => {
  await Account.updateOne({ _id: a }, { $inc: { balance: -100 } }, { session });
  await Account.updateOne({ _id: b }, { $inc: { balance: 100 } }, { session });
});
session.endSession();
```

### Replica set কী?
একাধিক MongoDB server এর গ্রুপ যেখানে একটি **primary** (সব write এখানে) ও কয়েকটি **secondary** (primary এর কপি) থাকে। Primary নষ্ট হলে secondary দের মধ্যে **election** হয়ে নতুন primary নির্বাচিত হয় (automatic failover)। উদ্দেশ্য: high availability ও redundancy, এবং চাইলে secondary থেকে read।

### Sharding কী? Shard key কীভাবে বেছে নেবে?
Data কে একাধিক shard (আলাদা server/replica set) এ ভাগ করা (horizontal scaling)। `mongos` router query কে সঠিক shard এ পাঠায়, config server metadata রাখে।

Shard key বাছাইয়ের নিয়ম:

- **High cardinality** (অনেক আলাদা মান)
- সমানভাবে বণ্টন হবে (hot spot হবে না)
- Query তে প্রায়ই ব্যবহার হবে (targeted query)
- ক্রমাগত বাড়তে থাকা মান (যেমন timestamp, auto-increment) সরাসরি ranged key হিসেবে দিলে সব write এক shard এ যায়, তাই **hashed** key বিবেচনা করুন

### Write concern আর read concern কী?
- **Write concern** (`w`): write সফল ধরা হবে কতগুলো node এ লেখার পর। `w: 1` শুধু primary, `w: "majority"` বেশিরভাগ node, যা সবচেয়ে নিরাপদ।
- **Read concern**: কেমন data পড়বে (`local`, `majority`, `snapshot`), অর্থাৎ rollback হয়ে যেতে পারে এমন data পড়বে কিনা।

### MongoDB তে pagination কীভাবে করবে?
- `skip().limit()`: সহজ কিন্তু বড় skip এ ধীর (SQL এর OFFSET এর মতোই)
- **Range/cursor based**: শেষ `_id` ধরে পরের অংশ

```js
// skip/limit
db.posts.find().sort({ _id: 1 }).skip(1000).limit(20);
// range based (দ্রুত)
db.posts.find({ _id: { $gt: lastId } }).sort({ _id: 1 }).limit(20);
```

### `countDocuments` আর `estimatedDocumentCount` এর পার্থক্য কী?
- `countDocuments(filter)`: filter অনুযায়ী সঠিক গণনা, ধীর হতে পারে
- `estimatedDocumentCount()`: collection metadata থেকে আনুমানিক মোট সংখ্যা, খুব দ্রুত কিন্তু filter নেওয়া যায় না

### MongoDB তে schema validation কীভাবে করবে?
Collection level এ `$jsonSchema` validator দিয়ে (database স্তরে নিয়ম), অথবা application স্তরে Mongoose schema দিয়ে।

```js
db.createCollection("users", {
  validator: { $jsonSchema: {
    bsonType: "object",
    required: ["email"],
    properties: { email: { bsonType: "string" }, age: { bsonType: "int", minimum: 0 } },
  } },
});
```

### MongoDB কখন ব্যবহার করবে, কখন করবে না?
ব্যবহার করুন: schema বদলায়, nested/hierarchical data, content management, catalog, log/event data, দ্রুত prototype, horizontal scale দরকার।

এড়ান: অনেক complex JOIN ও relation, কঠোর multi-table transaction (financial ledger), জটিল reporting/analytics যেখানে SQL এর শক্তি বেশি কাজে আসে।

## ৫. Node.js এর সাথে Database

### Node.js এ PostgreSQL কীভাবে ব্যবহার করে? (`pg` ও connection pool)
```js
import pg from "pg";
const pool = new pg.Pool({ connectionString: process.env.DATABASE_URL, max: 10 });

export async function getUser(id) {
  const { rows } = await pool.query("SELECT * FROM users WHERE id = $1", [id]);
  return rows[0];
}
```

প্রতিটি request এ নতুন `Client` না খুলে একটি `Pool` শেয়ার করুন।

### SQL injection কী? কীভাবে প্রতিরোধ করবে?
User input কে সরাসরি SQL string এ জুড়ে দিলে আক্রমণকারী নিজের SQL ঢুকিয়ে দিতে পারে।

```js
// ভুল (বিপজ্জনক)
pool.query(`SELECT * FROM users WHERE email = '${email}'`);
// email = ' OR '1'='1  হলে সব user বেরিয়ে যায়

// ঠিক: parameterized query
pool.query("SELECT * FROM users WHERE email = $1", [email]);
```

প্রতিরোধ: সবসময় parameterized query/prepared statement, ORM ব্যবহার, input validate করা, database user এর ন্যূনতম অনুমতি। MongoDB তেও **NoSQL injection** আছে (`{ $ne: null }` পাঠিয়ে login bypass)। তাই input এর type যাচাই করুন, `express-mongo-sanitize` ব্যবহার করুন।

### Node এ PostgreSQL transaction কীভাবে করবে?
Transaction এ **একই connection** ব্যবহার করতে হয়, তাই pool থেকে `client` নিতে হয়।

```js
const client = await pool.connect();
try {
  await client.query("BEGIN");
  await client.query("UPDATE accounts SET balance = balance - $1 WHERE id = $2", [100, 1]);
  await client.query("UPDATE accounts SET balance = balance + $1 WHERE id = $2", [100, 2]);
  await client.query("COMMIT");
} catch (e) {
  await client.query("ROLLBACK");
  throw e;
} finally {
  client.release(); // pool এ ফেরত দিন
}
```

### Mongoose কী? Schema ও model কীভাবে বানায়?
Mongoose হলো MongoDB এর ODM। Schema দিয়ে structure, validation ও default নির্ধারণ করা যায়।

```js
import mongoose from "mongoose";

const userSchema = new mongoose.Schema({
  name: { type: String, required: true, trim: true },
  email: { type: String, required: true, unique: true, lowercase: true },
  age: { type: Number, min: 0 },
  posts: [{ type: mongoose.Schema.Types.ObjectId, ref: "Post" }],
}, { timestamps: true });

export const User = mongoose.model("User", userSchema);
await mongoose.connect(process.env.MONGO_URI);
```

### Mongoose এ `populate` কী? `lean()` কী?
- `populate()`: referenced document এর আসল data এনে বসায় (JOIN এর মতো, ভেতরে আলাদা query চালায়)
- `lean()`: Mongoose document এর বদলে সাধারণ JS object return করে। দ্রুত ও কম memory, কিন্তু `save()`, virtual ইত্যাদি পাওয়া যায় না। শুধু পড়ার জন্য ভালো।

```js
const posts = await Post.find().populate("author", "name email").lean();
```

### Mongoose middleware (hooks) কী?
Schema এ `pre`/`post` hook। যেমন save এর আগে password hash:

```js
userSchema.pre("save", async function (next) {
  if (!this.isModified("password")) return next();
  this.password = await bcrypt.hash(this.password, 10);
  next();
});
```

### Migration কী? কীভাবে করে?
Database schema বদলের ধারাবাহিক, version-controlled script। SQL এ Prisma Migrate, Knex, TypeORM migration, Flyway ব্যবহার হয়। Production এ নিরাপদ migration এর নিয়ম:

- ছোট ও backward-compatible ধাপে করুন (আগে column যোগ, code deploy, তারপর পুরোনোটি সরান)
- বড় table এ index `CREATE INDEX CONCURRENTLY` দিয়ে দিন (lock এড়াতে)
- আগে staging এ test করুন, backup রাখুন

MongoDB schema-less, তবে data migration প্রায়ই লাগে (`migrate-mongo`)।

### Node এ database error কীভাবে handle করবে?
- Unique constraint violation (PG error code `23505`, Mongo `11000`) আলাদা করে ধরে "আগে থেকেই আছে" বার্তা দিন
- Connection error এ retry/backoff ও health check
- `try/catch` ও centralized error handler
- ভেতরের error message (SQL, stack) ব্যবহারকারীকে দেখাবেন না, শুধু log করুন

## ৬. Scenario ও System Design

### E-commerce এর জন্য database schema ডিজাইন করো (PostgreSQL)
মূল table:

- `users (id, email, name, created_at)`
- `products (id, name, price, stock, category_id)`
- `categories (id, name, parent_id)`
- `orders (id, user_id, status, total, created_at)`
- `order_items (id, order_id, product_id, quantity, unit_price)`
- `addresses (id, user_id, ...)`, `payments (id, order_id, status, ...)`

গুরুত্বপূর্ণ সিদ্ধান্ত:

- `order_items` এ `unit_price` সংরক্ষণ করুন, কারণ পরে product এর দাম বদলালেও পুরোনো order এর দাম অপরিবর্তিত থাকতে হবে (ইচ্ছাকৃত denormalization)
- Order তৈরি ও stock কমানো **একটি transaction** এ
- Index: `orders(user_id, created_at)`, `order_items(order_id)`, `products(category_id)`
- Money এর জন্য `NUMERIC` ব্যবহার করুন, `FLOAT` নয়

### Chat application এর জন্য MongoDB তে schema কেমন করবে?
- `conversations { _id, members: [userId], lastMessage, updatedAt }`
- `messages { _id, conversationId, senderId, text, createdAt }`

Message গুলো conversation এর ভেতরে embed না করে **আলাদা collection** এ রাখুন, কারণ message সংখ্যা অসীম বাড়তে পারে (16MB সীমা)। Index: `messages` এ `{ conversationId: 1, createdAt: -1 }`। Pagination এ cursor (`createdAt`/`_id`) ব্যবহার করুন।

### একটি query ধীর চলছে। কী কী ধাপে সমস্যা খুঁজবে?
