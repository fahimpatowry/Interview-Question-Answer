## ১. Basics ও Data Types

### JS এ কয়টি data type আছে? Primitive আর non-primitive এর পার্থক্য কী?
JS এ মোট **৮টি** data type আছে।

- Primitive (৭টি): `string`, `number`, `boolean`, `undefined`, `null`, `symbol`, `bigint`
- Non-primitive (১টি): `object` (array, function, date, map, set সব object এর অন্তর্গত)

পার্থক্য:

- Primitive এর value সরাসরি stack এ থাকে এবং **immutable** (পরিবর্তন করা যায় না)। Copy করলে value কপি হয়।
- Non-primitive এর data heap এ থাকে, variable এ শুধু **reference** থাকে। Copy করলে reference কপি হয়, তাই একটা বদলালে অন্যটাও বদলে যায়।

```js
let a = 5; let b = a; b = 10;
console.log(a); // 5 (আলাদা কপি)

const o1 = { x: 1 }; const o2 = o1; o2.x = 99;
console.log(o1.x); // 99 (একই reference)
```

### Pass by value আর pass by reference কী?
- Primitive function এ পাঠালে **value এর কপি** যায়। ভেতরে বদলালে বাইরে কোনো পরিবর্তন হয় না।
- Object/array পাঠালে **reference এর কপি** যায়। ভেতরে property বদলালে বাইরের object ও বদলে যায়।

```js
function change(obj, num) { obj.x = 2; num = 20; }
const o = { x: 1 }; let n = 10;
change(o, n);
console.log(o.x, n); // 2 10
```

JS এ প্রযুক্তিগতভাবে সবসময় "pass by value", তবে object এর ক্ষেত্রে সেই value টা একটা reference।

### `undefined` আর `null` এর পার্থক্য কী?
- `undefined`: variable declare হয়েছে কিন্তু value দেওয়া হয়নি। JS নিজে এটা বসায়।
- `null`: আমরা ইচ্ছা করে "খালি/কোনো value নেই" বোঝাতে বসাই।

```js
let a;            // undefined
let b = null;     // null
console.log(typeof a, typeof b); // "undefined" "object"
console.log(null == undefined);  // true
console.log(null === undefined); // false
```

`typeof null === "object"` হলো JS এর একটি পুরোনো bug।

### `typeof` কী কী return করে? `typeof []`, `typeof null`, `typeof NaN` কী দেয়?
- `typeof []` → `"object"` (array check করতে `Array.isArray()` ব্যবহার করুন)
- `typeof null` → `"object"` (পুরোনো bug)
- `typeof NaN` → `"number"`
- `typeof function(){}` → `"function"`
- `typeof undefined` → `"undefined"`

### Truthy আর falsy value গুলো কী কী?
Falsy মাত্র ৮টি: `false`, `0`, `-0`, `0n`, `""`, `null`, `undefined`, `NaN`।

বাকি সবকিছু truthy। এমনকি `"0"`, `"false"`, `[]`, `{}` ও truthy।

```js
if ([]) console.log("empty array is truthy");
if (!"") console.log("empty string is falsy");
```

### `==` আর `===` এর পার্থক্য কী? Type coercion কী?
- `==` (loose equality) আগে type মিলিয়ে নেয় (coercion), তারপর তুলনা করে।
- `===` (strict equality) type ও value দুটোই মেলে কিনা দেখে, coercion করে না।

```js
console.log(1 == "1");   // true
console.log(1 === "1");  // false
console.log([] == false);// true
console.log(NaN === NaN);// false
```

Type coercion মানে JS নিজে নিজে এক type কে আরেক type এ রূপান্তর করা। সবসময় `===` ব্যবহার করাই ভালো। `NaN` check করতে `Number.isNaN()` ব্যবহার করুন।

### `var`, `let`, `const` এর পার্থক্য কী?
- `var`: function-scoped, redeclare করা যায়, hoist হয় এবং `undefined` দিয়ে initialize হয়।
- `let`: block-scoped, redeclare করা যায় না, reassign করা যায়। TDZ আছে।
- `const`: block-scoped, reassign করা যায় না, declare এর সময়ই value দিতে হয়। TDZ আছে।

```js
const arr = [1, 2];
arr.push(3);   // ঠিক আছে, ভেতরের মান বদলানো যায়
// arr = [];   // Error: reassign করা যায় না
```

`const` মানে binding অপরিবর্তনীয়, value নয়। Object ভেতরে বদলানো যায়।

### Hoisting কী? Temporal Dead Zone (TDZ) কী?
Hoisting মানে JS code চালানোর আগে declaration গুলোকে scope এর উপরে "তুলে নেয়"। আসলে compile এর সময় memory তে variable/function register হয়ে যায়।

- `var`: hoist হয় এবং `undefined` দিয়ে initialize হয়।
- `let`/`const`: hoist হয় কিন্তু initialize হয় না। Declaration লাইনে পৌঁছানোর আগের এই সময়টাকে **TDZ** বলে। এখানে access করলে `ReferenceError` হয়।
- Function declaration পুরোটাই hoist হয়, তাই declaration এর আগেই call করা যায়।

```js
sayHi();                 // কাজ করবে
function sayHi() { console.log("hi"); }

// sayHello();           // TypeError: sayHello is not a function
var sayHello = function () {};
```

### এই code এ `x` এ `undefined` আর `y` এ error কেন?
```js
console.log(x); // undefined
var x = 10;

console.log(y); // ReferenceError
let y = 20;
```

- `var x` hoist হয় এবং `undefined` দিয়ে initialize হয়ে যায়, তাই `undefined` print হয়।
- `let y` ও hoist হয়, কিন্তু `let y = 20` লাইনে পৌঁছানো পর্যন্ত TDZ এ থাকে। এই সময় access করলে `Cannot access 'y' before initialization` error আসে।

(Declaration ছাড়াই কোনো নাম ব্যবহার করলে "y is not defined" error আসে। TDZ এর error message আলাদা।)

### Object.freeze, Object.seal আর const এর পার্থক্য কী?
- `const`: variable reassign আটকায়, কিন্তু object এর ভেতরের property বদলানো যায়।
- `Object.seal(obj)`: নতুন property যোগ/মোছা যায় না, তবে আগের property এর value বদলানো যায়।
- `Object.freeze(obj)`: কিছুই বদলানো, যোগ বা মোছা যায় না। এটা **shallow**, nested object freeze হয় না।

```js
const o = Object.freeze({ a: 1, nested: { b: 2 } });
o.a = 5;          // কাজ করবে না
o.nested.b = 9;   // কাজ করবে (shallow)
```

### Optional chaining (`?.`) আর nullish coalescing (`??`) কী?
- `?.`: কোনো property বা method তে যাওয়ার আগে দেখে নেয় আগের অংশ `null/undefined` কিনা। হলে error না দিয়ে `undefined` return করে।
- `??`: বাম পাশ `null` বা `undefined` হলেই শুধু ডান পাশের value নেয়।

```js
const user = { profile: null };
console.log(user.profile?.name);  // undefined (error নয়)

const count = 0;
console.log(count || 10);  // 10  (0 falsy)
console.log(count ?? 10);  // 0   (0 null/undefined নয়)
```

`||` সব falsy value এ fallback দেয়, `??` শুধু `null/undefined` এ।

### Template literal, destructuring, spread আর rest operator কোথায় ব্যবহার হয়?
```js
// Template literal
const name = "Rahim";
console.log(`Hello ${name}`);

// Destructuring
const { a, b = 5 } = { a: 1 };
const [x, , z] = [1, 2, 3];

// Spread: ছড়িয়ে দেওয়া
const arr2 = [...[1, 2], 3];
const obj2 = { ...{ p: 1 }, q: 2 };

// Rest: জড়ো করা
function sum(...nums) { return nums.reduce((s, n) => s + n, 0); }
const { first, ...others } = { first: 1, m: 2, n: 3 };
```

Spread হলো ছড়িয়ে দেওয়া, rest হলো বাকিগুলো জড়ো করা। দুটোর চিহ্ন একই (`...`)।

### `for...in` আর `for...of` এর পার্থক্য কী?
- `for...in`: object এর **key (property name)** এর উপর loop করে, inherited enumerable property সহ। Array তে index string হিসেবে দেয়।
- `for...of`: **iterable** (array, string, Map, Set) এর **value** এর উপর loop করে।

```js
const arr = ["a", "b"];
for (const i in arr) console.log(i);  // "0" "1"
for (const v of arr) console.log(v);  // "a" "b"
```

Plain object এ `for...of` কাজ করে না, কারণ object iterable নয়।

## ২. Function

### Function declaration, function expression আর arrow function এর পার্থক্য কী?
- **Declaration**: `function foo() {}`। পুরোপুরি hoist হয়, declaration এর আগেও call করা যায়।
- **Expression**: `const foo = function() {}`। Hoist হয় না (variable এর নিয়ম অনুযায়ী)।
- **Arrow**: `const foo = () => {}`। ছোট syntax, নিজের `this`, `arguments` নেই, `new` দিয়ে call করা যায় না।

### Arrow function (`=>`) কী? এটা কোন সমস্যা সমাধান করে?
Arrow function ES6 এর ছোট syntax এর function। প্রধান সুবিধা হলো এর নিজের `this` নেই। এটা যেখানে লেখা হয়েছে সেই scope এর `this` ব্যবহার করে (lexical this)।

```js
function Timer() {
  this.sec = 0;
  setInterval(function () { this.sec++; }, 1000); // সমস্যা: this হারিয়ে যায়
  setInterval(() => { this.sec++; }, 1000);       // ঠিক: outer this পায়
}
```

যেখানে সাবধান থাকতে হবে: object method, constructor এবং `prototype` method এ arrow ব্যবহার করা উচিত নয়।

### Execution context কী? কীভাবে তৈরি হয়?
Execution context হলো যে পরিবেশে JS code চলে। এর তিনটি ধরন আছে:

- Global execution context (প্রোগ্রাম শুরুতে একটাই)
- Function execution context (প্রতিবার function call এ নতুন)
- Eval context (বিরল)

প্রতিটি context দুই ধাপে কাজ করে:

- **Creation phase**: variable/function memory তে register হয় (hoisting), `this` নির্ধারিত হয়, scope chain তৈরি হয়।
- **Execution phase**: লাইন ধরে code চলে এবং value assign হয়।

Context গুলো **call stack** এ জমা হয়। Function শেষ হলে stack থেকে সরে যায়।

### IIFE কী? কেন ব্যবহার করা হয়?
IIFE (Immediately Invoked Function Expression) হলো এমন function যা define করার সাথে সাথেই চলে।

```js
(function () {
  const secret = "hidden";
  console.log("চলছে");
})();
```

ব্যবহার: নিজস্ব scope তৈরি করে global variable দূষণ ঠেকানো, private variable রাখা, আগের যুগে module pattern বানানো। এখন `let/const` ও ES modules থাকায় কম লাগে।

### Higher-order function কী? উদাহরণ দাও।
যে function অন্য function কে argument হিসেবে নেয় অথবা function return করে, তাকে higher-order function বলে।

```js
// argument হিসেবে function নেয়
[1, 2, 3].map(n => n * 2);

// function return করে
const multiplier = (m) => (n) => n * m;
const double = multiplier(2);
console.log(double(5)); // 10
```

Built-in উদাহরণ: `map`, `filter`, `reduce`, `forEach`, `setTimeout`।

### Pure function আর side effect কী?
**Pure function**: একই input এ সবসময় একই output দেয় এবং বাইরের কোনো কিছু বদলায় না।

**Side effect**: function এর বাইরের কিছু পরিবর্তন করা (global variable বদলানো, API call, DOM বদলানো, console.log)।

```js
const add = (a, b) => a + b;                 // pure
let total = 0;
const addToTotal = (n) => { total += n; };   // impure
```

Pure function test করা সহজ এবং React/Redux এ জরুরি।

### Currying কী? `add(1)(2)(3)` কীভাবে লিখবে?
Currying হলো একাধিক argument এর function কে একটা একটা argument নেওয়া function এর chain এ ভাঙা।

```js
const add = a => b => c => a + b + c;
console.log(add(1)(2)(3)); // 6
```

উপকার: partial application (কিছু argument আগে ঠিক করে রাখা) এবং reuse।

### `call`, `apply` আর `bind` এর পার্থক্য কী?
তিনটিই function এর `this` ঠিক করে দেয়।

- `call(thisArg, a, b)`: সাথে সাথে function চালায়, argument আলাদা আলাদা দেয়।
- `apply(thisArg, [a, b])`: সাথে সাথে চালায়, argument array হিসেবে দেয়।
- `bind(thisArg, a)`: function চালায় না, নতুন একটি function return করে।

```js
function greet(g, p) { return `${g} ${this.name}${p}`; }
const u = { name: "Rahim" };
greet.call(u, "Hi", "!");
greet.apply(u, ["Hi", "!"]);
const fn = greet.bind(u, "Hi");
fn("!");
```

### Default parameter আর `arguments` object সম্পর্কে বলো।
Default parameter: argument না দিলে (বা `undefined` দিলে) একটি ডিফল্ট value ব্যবহার হয়।

```js
function hi(name = "Guest") { return `Hi ${name}`; }
hi();           // Hi Guest
hi(undefined);  // Hi Guest
hi(null);       // Hi null (null এ default কাজ করে না)
```

`arguments` হলো সাধারণ function এর ভেতরের array-like object, যেখানে পাঠানো সব argument থাকে। Arrow function এ এটা নেই। আধুনিক JS এ rest parameter (`...args`) ব্যবহার করা ভালো, কারণ এটা আসল array।

### Callback hell কী? কীভাবে সমাধান করবে?
Callback এর ভেতরে callback, তার ভেতরে আবার callback, এভাবে গভীর nesting হলে code পড়া ও maintain করা কঠিন হয়ে যায়। একে callback hell বা "pyramid of doom" বলে।

সমাধান:

- Promise chaining ব্যবহার করা
- `async/await` ব্যবহার করা
- ছোট named function এ ভাগ করা

```js
// async/await দিয়ে পরিষ্কার code
async function run() {
  const user = await getUser();
  const posts = await getPosts(user.id);
  return getComments(posts[0].id);
}
```

## ৩. Scope, Closure, this

### Lexical scope কী?
Lexical scope মানে একটি function কোথায় **লেখা হয়েছে** তার উপর নির্ভর করে সে কোন variable গুলো দেখতে পাবে, কোথা থেকে call হয়েছে তার উপর নয়। ভেতরের function বাইরের scope এর variable access করতে পারে, কিন্তু উল্টোটা পারে না। এই ধাপে ধাপে খোঁজাকে **scope chain** বলে।

### Closure কী? Practical use case বলো।
Closure হলো এমন function যে তার বাইরের (lexical) scope এর variable মনে রাখে, এমনকি বাইরের function শেষ হয়ে যাওয়ার পরেও।

```js
function counter() {
  let count = 0;               // private variable
  return () => ++count;
}
const inc = counter();
inc(); // 1
inc(); // 2
```

Use case:

- Private variable / data encapsulation
- Debounce, throttle, memoize
- `once` function (শুধু একবার চলে)
- Event handler এ state ধরে রাখা
- React hooks এর ভেতরেও closure কাজ করে

### Closure থেকে memory leak হতে পারে কি?
হ্যাঁ। Closure তার বাইরের scope এর variable গুলো ধরে রাখে, তাই closure বেঁচে থাকলে সেই variable গুলোও garbage collect হয় না।

```js
function setup() {
  const bigData = new Array(1e6).fill("x");
  return () => console.log(bigData.length); // bigData আটকে থাকবে
}
const fn = setup(); // fn থাকা পর্যন্ত bigData মেমরিতে
```

প্রতিকার: দরকার শেষ হলে reference `null` করা, event listener `removeEventListener` দিয়ে সরানো, বড় data closure এ না রাখা।

### Loop এ `setTimeout` এর closure সমস্যা কীভাবে ঠিক করবে?
```js
for (var i = 0; i < 3; i++) {
  setTimeout(() => console.log(i), 0);
}
// 3 3 3
```

`var` function-scoped, তাই সব callback একই `i` শেয়ার করে। Loop শেষে `i = 3`।

সমাধান:

```js
// ১. let ব্যবহার (প্রতি iteration এ নতুন binding)
for (let i = 0; i < 3; i++) setTimeout(() => console.log(i), 0);

// ২. IIFE দিয়ে value ধরে রাখা
for (var j = 0; j < 3; j++) {
  ((k) => setTimeout(() => console.log(k), 0))(j);
}
```

### `this` এর value কোন পরিস্থিতিতে কেমন হয়?
- Global (non-strict): `globalThis`/`window`। Strict mode এ `undefined`।
- Object method (`obj.fn()`): `obj`
- Plain function call (`fn()`): `undefined` (strict) বা global
- `call/apply/bind`: যেটা দেওয়া হয়
- `new Fn()`: নতুন তৈরি object
- Arrow function: নিজের `this` নেই, outer scope এরটা নেয়
- DOM event handler (সাধারণ function): যে element এ event হয়েছে

```js
const obj = {
  name: "A",
  regular() { return this.name; },
  arrow: () => this.name,
};
const fn = obj.regular;
obj.regular(); // "A"
obj.arrow();   // undefined
fn();          // undefined (this হারিয়ে গেছে)
```

### Arrow function এ `this` কেন আলাদা?
Arrow function নিজের `this` তৈরি করে না। সে যেখানে লেখা হয়েছে সেই scope এর `this` কে হুবহু ব্যবহার করে (lexical this)। তাই `call/bind` দিয়েও arrow function এর `this` বদলানো যায় না। এজন্য callback এর ভেতরে `this` ধরে রাখতে arrow খুব কাজে লাগে।

## ৪. Async, Promise, Event Loop

### Synchronous আর asynchronous code এর পার্থক্য কী?
- **Synchronous**: code লাইন ধরে একটার পর একটা চলে। একটা শেষ না হলে পরেরটা শুরু হয় না (blocking)।
- **Asynchronous**: সময়সাপেক্ষ কাজ (network, timer, file) পেছনে চলে, ততক্ষণে বাকি code চলতে থাকে। কাজ শেষ হলে callback/promise এর মাধ্যমে ফল আসে।

JS single-threaded, তাই async না থাকলে একটা ধীর কাজে পুরো UI আটকে যেত।

### `fetch` তো আগে থেকেই async, তাহলে `async/await` কেন লাগে?
`fetch` async ঠিকই, কিন্তু সে **Promise** return করে, ফল সাথে সাথে দেয় না। Promise এর ফল পেতে `.then()` chain করতে হয়, যা বড় হলে পড়তে কঠিন।

`async/await` হলো Promise এর উপরের **syntactic sugar**। এতে async code দেখতে synchronous এর মতো হয়, `try/catch` দিয়ে error ধরা যায়।

```js
// .then দিয়ে
fetch(url).then(r => r.json()).then(console.log).catch(console.error);

// async/await দিয়ে
async function load() {
  try {
    const res = await fetch(url);
    console.log(await res.json());
  } catch (e) { console.error(e); }
}
```

`await` function কে pause করে, কিন্তু main thread কে block করে না।

### Promise কী? Promise কী return করে? এর state কয়টি?
Promise হলো এমন object যা ভবিষ্যতে শেষ হবে এমন একটি async কাজের ফলাফল (সফল বা ব্যর্থ) ধারণ করে।

তিনটি state:

- **pending**: কাজ চলছে
- **fulfilled**: সফল, value আছে
- **rejected**: ব্যর্থ, error আছে

একবার fulfilled বা rejected হলে আর বদলায় না (settled)। `.then()`, `.catch()`, `.finally()` প্রতিটিও নতুন Promise return করে, তাই chaining করা যায়।

```js
const p = new Promise((resolve, reject) => {
  setTimeout(() => resolve("done"), 1000);
});
p.then(v => console.log(v));
```

### `async` function কী return করে?
`async` function সবসময় একটি **Promise** return করে। ভেতরে সাধারণ value return করলে সেটা `Promise.resolve(value)` এ মোড়ানো হয়। Error throw করলে rejected Promise হয়।

```js
async function f() { return 5; }
f().then(console.log); // 5
```

### Event loop কী? Call stack, Web API আর queue কীভাবে কাজ করে?
JS single-threaded, তবু event loop এর কারণে async কাজ করতে পারে।

- **Call stack**: যেখানে function গুলো একে একে চলে।
- **Web API / Node API**: `setTimeout`, `fetch`, DOM event এর মতো কাজ browser/Node নিজে পেছনে সামলায়।
- **Queue**: কাজ শেষ হলে callback queue তে জমা হয়।
- **Event loop**: একটানা দেখে call stack খালি কিনা। খালি হলে queue থেকে পরের callback stack এ ঢোকায়।

ক্রম: stack এর sync code শেষ হয় → সব microtask চলে → একটি macrotask চলে → আবার microtask... এভাবে চলতে থাকে।

### Microtask আর macrotask কী? কোনটার priority বেশি?
**Microtask queue এর priority বেশি।** Call stack খালি হলেই আগে microtask queue পুরোটা খালি করা হয়, তারপর একটি macrotask চলে।

"কোনটা বড়" প্রশ্নে: microtask অগ্রাধিকার পায়, macrotask এর আগে চলে। তবে microtask এ অনবরত নতুন microtask যোগ হতে থাকলে macrotask (এবং UI render) না খেয়ে থেকে যেতে পারে।

### কোন কোন task macrotask queue তে আর কোনগুলো microtask queue তে যায়?
**Macrotask**:

- `setTimeout`, `setInterval`
- `setImmediate` (Node)
- I/O, UI event (click, scroll)
- `MessageChannel`

**Microtask**:

- `Promise.then/catch/finally`
- `async/await` এর `await` এর পরের অংশ
- `queueMicrotask()`
- `MutationObserver`
- `process.nextTick` (Node, এটা microtask এর চেয়েও আগে চলে)

```js
console.log("1");
setTimeout(() => console.log("2"), 0);   // macrotask
Promise.resolve().then(() => console.log("3")); // microtask
console.log("4");
// 1 4 3 2
```

### `setTimeout(fn, 0)` কি সাথে সাথে চলে?
না। এটা callback কে macrotask queue তে পাঠায়। Call stack এর সব sync code এবং সব microtask শেষ হওয়ার পরেই চলে। তাছাড়া browser এ ন্যূনতম কিছু ms delay থাকে। তাই `0` মানে "যত তাড়াতাড়ি সম্ভব, কিন্তু এখনই নয়"।

### `Promise.all`, `allSettled`, `race` আর `any` এর পার্থক্য কী?
- `Promise.all`: সবগুলো সফল হলে ফলের array দেয়। একটা fail করলেই সাথে সাথে reject।
- `Promise.allSettled`: কখনো reject করে না। প্রতিটির `{status, value/reason}` দেয়।
- `Promise.race`: যেটা আগে settle হয় (সফল বা ব্যর্থ) তার ফল দেয়।
- `Promise.any`: প্রথম **সফল** টা দেয়। সব fail করলে `AggregateError`।

```js
const [a, b] = await Promise.all([getA(), getB()]);
const results = await Promise.allSettled([p1, p2]);
```

### Unhandled promise rejection হলে কী হয়? Async/await এ error কীভাবে handle করবে?
Rejected Promise এ `.catch()` বা `try/catch` না থাকলে "unhandled rejection" হয়। Browser এ console এ error আসে। Node এর নতুন version এ process crash করে।

```js
async function load() {
  try {
    const r = await fetch(url);
    if (!r.ok) throw new Error("HTTP " + r.status); // fetch নিজে 404 এ reject করে না
    return await r.json();
  } catch (err) {
    console.error(err);
  } finally {
    console.log("সবসময় চলে");
  }
}
```

Global safety net হিসেবে `window.addEventListener("unhandledrejection", ...)` ব্যবহার করা যায়।

### Parallel আর sequential async call কীভাবে করবে?
```js
// Sequential: ধীর, একটার পর একটা
const a = await getA();
const b = await getB();

// Parallel: দ্রুত, একসাথে শুরু
const [a2, b2] = await Promise.all([getA(), getB()]);
```

একটার ফল অন্যটির input হলে sequential লাগবে। স্বাধীন call গুলো parallel চালান। Loop এ `await` দিলে sequential হয়, parallel চাইলে `Promise.all(arr.map(...))` ব্যবহার করুন।

### Concurrency limit (একবারে N টা request) কীভাবে করবে?
সব request একসাথে না পাঠিয়ে একটা pool বানাতে হয়, যেখানে একসাথে সর্বোচ্চ N টা চলে।

```js
async function pool(tasks, limit) {
  const results = [];
  let i = 0;
  async function worker() {
    while (i < tasks.length) {
      const idx = i++;
      results[idx] = await tasks[idx]();
    }
  }
  await Promise.all(Array.from({ length: limit }, worker));
  return results;
}
```

### Fetch request cancel কীভাবে করবে?
`AbortController` দিয়ে।

```js
const controller = new AbortController();
fetch(url, { signal: controller.signal })
  .then(r => r.json())
  .catch(e => { if (e.name === "AbortError") console.log("cancelled"); });

controller.abort(); // বাতিল
```

React এ search input এ আগের request বাতিল করতে এবং unmount এ cleanup করতে এটি খুব দরকারি।

## ৫. Object, Prototype, Class

### Prototype আর prototype chain কী?
JS এ প্রতিটি object এর একটি লুকানো link থাকে অন্য একটি object এর দিকে, যাকে তার prototype বলে। কোনো property না পেলে JS ওই prototype এ খোঁজে, সেখানেও না পেলে তার prototype এ, এভাবে `null` পর্যন্ত। এই শৃঙ্খলকে **prototype chain** বলে।

```js
const animal = { eats: true };
const dog = Object.create(animal);
dog.barks = true;
console.log(dog.eats); // true (animal থেকে পাওয়া)
```

`Array`, `Function` এর method (`map`, `bind`) ও এই chain থেকেই আসে।

### `__proto__` আর `prototype` এর পার্থক্য কী?
- `prototype`: শুধু **function** এর property। `new` দিয়ে object বানালে সেই object এর prototype হিসেবে এটা বসে।
- `__proto__`: প্রতিটি **object** এর property, যা তার prototype এর দিকে নির্দেশ করে (এখন `Object.getPrototypeOf()` ব্যবহার করা উচিত)।

```js
function Person() {}
const p = new Person();
console.log(p.__proto__ === Person.prototype); // true
```

### `Object.create()` কীভাবে কাজ করে?
এটি একটি নতুন object বানায় যার prototype হলো আর্গুমেন্ট হিসেবে দেওয়া object।

```js
const proto = { hi() { return "hi"; } };
const obj = Object.create(proto);
obj.hi(); // "hi", proto থেকে inherit
```

`Object.create(null)` দিলে কোনো prototype ছাড়া পরিষ্কার object পাওয়া যায় (dictionary হিসেবে কাজে লাগে)।

### ES6 class আর constructor function এর পার্থক্য কী?
`class` মূলত prototype inheritance এরই সুন্দর syntax (syntactic sugar)। ভেতরের কাজ একই। তবে কিছু পার্থক্য:

- Class hoist হয় না ঠিকভাবে (TDZ আছে)
- Class সবসময় strict mode এ চলে
- `new` ছাড়া call করলে error দেয়
- Class এর method গুলো non-enumerable

```js
class Person {
  constructor(name) { this.name = name; }
  greet() { return `Hi ${this.name}`; } // Person.prototype এ থাকে
}
```

### Inheritance, `super` আর method overriding কী?
`extends` দিয়ে এক class আরেক class এর property/method পায়। `super()` parent constructor কে call করে (child এর constructor এ `this` ব্যবহারের আগে অবশ্যই)। `super.method()` দিয়ে parent এর method call করা যায়। Child এ একই নামের method লিখলে সেটা parent এরটাকে override করে।

```js
class Animal {
  speak() { return "..."; }
}
class Dog extends Animal {
  speak() { return super.speak() + " Woof"; }
}
new Dog().speak(); // "... Woof"
```

### Getter, setter, static method আর private field কী?
```js
class User {
  #password = "secret";        // private field, বাইরে থেকে access নেই
  static count = 0;            // class এর নিজস্ব, instance এর নয়

  constructor(name) { this.name = name; User.count++; }

  get upper() { return this.name.toUpperCase(); }  // property এর মতো পড়া
  set upper(v) { this.name = v.toLowerCase(); }

  static create(n) { return new User(n); }         // User.create(...)
  check(p) { return p === this.#password; }
}
```

- getter/setter: property পড়া/লেখার সময় logic চালানো যায়।
- static: instance ছাড়াই class থেকে সরাসরি ডাকা যায়।
- `#field`: সত্যিকারের private, class এর বাইরে access করলে SyntaxError।

## ৬. Array ও Object Method

### `map`, `filter`, `reduce`, `forEach`, `find`, `some`, `every` কোথায় ব্যবহার হয়?
- `map`: প্রতিটি item রূপান্তর করে নতুন array দেয়।
- `filter`: শর্ত মেলা item দিয়ে নতুন array দেয়।
- `reduce`: পুরো array থেকে একটি value বানায় (sum, object ইত্যাদি)।
- `forEach`: শুধু প্রতিটির জন্য কিছু চালায়, কিছু return করে না।
- `find`: শর্ত মেলা প্রথম item দেয়।
- `some`: অন্তত একটি মিললে `true`।
- `every`: সবগুলো মিললে `true`।

```js
const nums = [1, 2, 3, 4];
nums.map(n => n * 2);              // [2,4,6,8]
nums.filter(n => n % 2 === 0);     // [2,4]
nums.reduce((s, n) => s + n, 0);   // 10
nums.find(n => n > 2);             // 3
nums.some(n => n > 3);             // true
nums.every(n => n > 0);            // true
```

### `map` আর `forEach` এর পার্থক্য কী?
- `map` নতুন array return করে, chain করা যায়।
- `forEach` কিছু return করে না (`undefined`), শুধু side effect এর জন্য।
- `forEach` এ `break`/`return` দিয়ে loop থামানো যায় না।

নতুন array লাগলে `map`, শুধু কিছু চালাতে চাইলে `forEach`।

### `slice` আর `splice` এর পার্থক্য কী?
- `slice(start, end)`: আসল array না বদলে নতুন array return করে (**immutable**)।
- `splice(start, count, ...items)`: আসল array কেই বদলায়, মোছা item গুলো return করে (**mutable**)।

```js
const a = [1, 2, 3, 4];
a.slice(1, 3);     // [2,3], a অপরিবর্তিত
a.splice(1, 2);    // [2,3], a এখন [1,4]
```

### Array থেকে duplicate সরানোর ৩টি উপায় কী?
```js
const arr = [1, 2, 2, 3, 3];

// ১. Set (সবচেয়ে সহজ)
[...new Set(arr)];

// ২. filter + indexOf
arr.filter((v, i) => arr.indexOf(v) === i);

// ৩. reduce
arr.reduce((acc, v) => acc.includes(v) ? acc : [...acc, v], []);
```

### `Object.keys`, `values`, `entries`, `fromEntries` কোথায় ব্যবহার হয়?
```js
const o = { a: 1, b: 2 };
Object.keys(o);     // ["a","b"]
Object.values(o);   // [1,2]
Object.entries(o);  // [["a",1],["b",2]]
Object.fromEntries([["a", 1], ["b", 2]]); // { a:1, b:2 }

// object এর সব value দ্বিগুণ করা
Object.fromEntries(Object.entries(o).map(([k, v]) => [k, v * 2]));
```

Object loop করা, রূপান্তর করা বা Map এর সাথে কাজে এগুলো লাগে।

### Shallow copy আর deep copy কী?
- **Shallow copy**: শুধু প্রথম স্তরের property কপি হয়। ভেতরের nested object/array এর reference একই থেকে যায়।
- **Deep copy**: সব স্তর পুরোপুরি আলাদা কপি হয়। মূলটার সাথে কোনো সম্পর্ক থাকে না।

```js
const orig = { a: 1, nested: { b: 2 } };
const shallow = { ...orig };
shallow.nested.b = 99;
console.log(orig.nested.b); // 99 (ভেতরের object শেয়ার হচ্ছে)
```

### Shallow ও deep copy কীভাবে করবে? প্রতিটির limitation কী?
**Shallow**: `{ ...obj }`, `Object.assign({}, obj)`, `[...arr]`, `arr.slice()`।

**Deep**:

- `structuredClone(obj)`: সবচেয়ে ভালো, `Date`, `Map`, `Set`, circular reference সামলায়। কিন্তু function ও class method কপি করতে পারে না।
- `JSON.parse(JSON.stringify(obj))`: সহজ, কিন্তু function, `undefined`, `Symbol` হারায়, `Date` string হয়ে যায়, `Map/Set` নষ্ট হয়, circular এ error দেয়।
- নিজে recursive function লেখা, অথবা lodash এর `cloneDeep`।

### `Map` আর `Object`, `Set` আর `Array` কখন কোনটা ব্যবহার করবে?
- `Map`: key যেকোনো type হতে পারে (object সহ), insertion order ঠিক থাকে, `size` আছে, বারবার add/delete এ ভালো। Object এর key শুধু string/symbol।
- `Object`: সাধারণ structured data, JSON এর জন্য, fixed key এর জন্য।
- `Set`: unique value এর collection, দ্রুত `has()` check।
- `Array`: ordered list, index দিয়ে access, duplicate চলে।

### `WeakMap` আর `WeakSet` কেন লাগে?
এদের key শুধু **object** হতে পারে এবং key টা "weak" reference। অন্য কোথাও ওই object এর reference না থাকলে garbage collector সেটা মুছে ফেলে, entry ও নিজে থেকে চলে যায়। তাই memory leak হয় না।

ব্যবহার: object এর সাথে private/extra data জুড়ে রাখা, DOM node এর metadata, cache। এদের iterate করা যায় না এবং `size` নেই।

## ৭. Memory ও Performance

### Garbage collection JS এ কীভাবে কাজ করে?
JS এ memory নিজে থেকে পরিষ্কার হয়। Engine যে value আর কোনোভাবে পৌঁছানো যায় না তাকে মুছে ফেলে।

প্রধান algorithm হলো **Mark and Sweep**:

- Root (global object, call stack) থেকে শুরু করে যা যা পৌঁছানো যায় সব "mark" করা হয়।
- Mark না হওয়া object গুলো "sweep" (মুছে ফেলা) হয়।

পুরোনো "reference counting" এ circular reference এ সমস্যা ছিল, mark and sweep এ সেটা নেই। আধুনিক engine (V8) generational GC ব্যবহার করে (young/old generation)।

### Memory leak কী? সাধারণ কারণ কী কী? কীভাবে খুঁজে বের করবে?
Memory leak মানে যে memory আর দরকার নেই কিন্তু GC তা মুক্ত করতে পারছে না।

সাধারণ কারণ:

- অনিচ্ছাকৃত global variable
- মুছে না ফেলা `setInterval`/`setTimeout`
- Remove না করা event listener
- Closure এ বড় data ধরে রাখা
- DOM element মুছে ফেললেও JS এ reference রেখে দেওয়া (detached DOM)
- অবিরাম বাড়তে থাকা cache/array

খোঁজার উপায়: Chrome DevTools এর **Memory** ট্যাব এ Heap Snapshot নিয়ে তুলনা করা, Performance monitor এ memory graph লক্ষ করা। React এ `useEffect` এর cleanup function এ interval/listener সরানো জরুরি।

### Debounce আর throttle এর পার্থক্য কী?
- **Debounce**: ব্যবহারকারী থামার পর নির্দিষ্ট সময় অপেক্ষা করে একবার চালায়। উদাহরণ: search box।
- **Throttle**: নির্দিষ্ট সময়ের ব্যবধানে সর্বোচ্চ একবার চালায়, যত ঘন ঘন event হোক। উদাহরণ: scroll, resize।

```js
function debounce(fn, delay) {
  let t;
  return (...args) => {
    clearTimeout(t);
    t = setTimeout(() => fn(...args), delay);
  };
}
function throttle(fn, limit) {
  let wait = false;
  return (...args) => {
    if (wait) return;
    fn(...args);
    wait = true;
    setTimeout(() => (wait = false), limit);
  };
}
```

### Memoization কী? কখন ভালো, কখন খারাপ?
একই input এ আগের হিসাব করা ফল cache করে রাখা, যাতে পরের বার আবার হিসাব না করতে হয়।

ভালো: ভারী pure computation, বারবার একই input আসে (fibonacci, expensive selector)।

খারাপ: input প্রতিবার আলাদা হলে (cache শুধু মেমরি খায়), function impure হলে, ফল ছোট ও সস্তা হলে। Cache অনির্দিষ্টকাল বাড়লে memory leak ও হতে পারে।

### Reflow আর repaint কী? Layout thrashing কীভাবে এড়াবে?
- **Reflow (layout)**: element এর আকার/অবস্থান বদলালে browser পুরো বা অংশের layout নতুন করে হিসাব করে। ব্যয়বহুল।
- **Repaint**: layout না বদলে শুধু রং/visibility বদলালে পিক্সেল আবার আঁকা। তুলনামূলক সস্তা।

**Layout thrashing**: loop এ বারবার DOM লেখা ও পড়া (যেমন `offsetHeight`) মিশিয়ে করলে প্রতিবার forced reflow হয়।

এড়াতে: সব read একসাথে, তারপর সব write একসাথে করুন। `requestAnimationFrame` ব্যবহার করুন। `transform`/`opacity` দিয়ে animation করুন (reflow হয় না)। `DocumentFragment` দিয়ে batch এ DOM যোগ করুন।

### `defer` আর `async` script tag এর পার্থক্য কী?
- সাধারণ `<script>`: HTML parsing থামিয়ে download ও execute করে।
- `async`: parsing এর সাথে সমান্তরালে download হয়, download শেষ হলেই execute হয় (ক্রম ঠিক থাকে না)। Analytics এর মতো স্বাধীন script এ ভালো।
- `defer`: parsing এর সাথে সমান্তরালে download হয়, HTML parse শেষ হওয়ার পর **ক্রম অনুযায়ী** execute হয়। DOM নির্ভর script এ ভালো।

## ৮. Advanced Topics

### Generator function আর `yield` কী?
Generator (`function*`) এমন function যা মাঝপথে থামতে (`yield`) এবং পরে আবার শুরু হতে পারে। এটি iterator return করে, `next()` call করলে পরের `yield` পর্যন্ত চলে।

```js
function* count() {
  yield 1;
  yield 2;
  return 3;
}
const g = count();
g.next(); // { value: 1, done: false }
g.next(); // { value: 2, done: false }
g.next(); // { value: 3, done: true }
```

ব্যবহার: lazy sequence, অসীম তালিকা, custom iteration, (আগে) async flow control (redux-saga)।

### Iterator আর iterable এর পার্থক্য কী?
- **Iterable**: যে object এ `[Symbol.iterator]()` method আছে (array, string, Map, Set)। `for...of` ও spread এর সাথে কাজ করে।
- **Iterator**: যে object এ `next()` method আছে এবং যা `{ value, done }` return করে।

Iterable এর `[Symbol.iterator]()` call করলে একটা iterator পাওয়া যায়।

### Symbol কী? কোথায় কাজে লাগে?
Symbol একটি primitive type, যার প্রতিটি value **অনন্য (unique)**। দুটি আলাদা `Symbol("id")` কখনো সমান হয় না।

```js
const id = Symbol("id");
const user = { name: "A", [id]: 123 };
```

ব্যবহার: object এ conflict ছাড়া hidden/unique property key, library এ meta property, well-known symbol যেমন `Symbol.iterator`। Symbol key `for...in` ও `Object.keys` এ আসে না।

### Proxy আর Reflect কী?
`Proxy` একটি object কে মুড়িয়ে তার মৌলিক কাজ (read, write, delete ইত্যাদি) আটকে নিজের মতো করে চালাতে দেয়। `Reflect` সেই default কাজগুলো করার সুবিধাজনক API।

```js
const user = { name: "A" };
const proxy = new Proxy(user, {
  get(target, key) { return key in target ? Reflect.get(target, key) : "N/A"; },
  set(target, key, val) {
    if (key === "age" && typeof val !== "number") throw new TypeError("age must be number");
    return Reflect.set(target, key, val);
  },
});
```

ব্যবহার: validation, logging, reactive system (Vue 3 এর reactivity এ ব্যবহৃত), default value।

### Event delegation, bubbling আর capturing কী?
- **Bubbling**: event টি যে element এ হয় সেখান থেকে উপরে parent গুলোতে ছড়িয়ে যায় (default)।
- **Capturing**: উল্টো, উপর থেকে নিচে target পর্যন্ত নামে। `addEventListener(..., true)` দিয়ে ধরা যায়।
- **Event delegation**: প্রতিটি child এ listener না বসিয়ে parent এ একটাই listener বসানো। Bubbling এর সুবিধা নিয়ে `event.target` দিয়ে বোঝা যায় কোন child এ click হলো।

```js
document.querySelector("ul").addEventListener("click", (e) => {
  if (e.target.matches("li")) console.log(e.target.textContent);
});
```

সুবিধা: কম memory, পরে যোগ হওয়া element ও কাজ করে। `e.stopPropagation()` দিয়ে bubbling থামানো যায়।

### ES modules আর CommonJS এর পার্থক্য কী?
- **CommonJS** (Node এর পুরোনো): `require()` / `module.exports`। Synchronous load, runtime এ resolve হয়।
- **ES Modules**: `import` / `export`। Static (compile time এ বিশ্লেষণ করা যায়), asynchronous, browser এ native, tree shaking সম্ভব।

```js
// CommonJS
const fs = require("fs");
module.exports = { a };

// ESM
import fs from "fs";
export const a = 1;
```

মনে রাখার মতো: ESM এ `import` সবসময় file এর উপরে hoist হয়, আর ESM এ `__dirname` নেই (`import.meta.url` ব্যবহার করতে হয়)। Node এ ESM চালাতে `.mjs` বা `package.json` এ `"type": "module"` লাগে।

### Tree shaking আর module bundler কী?
**Module bundler** (Webpack, Vite/Rollup, esbuild) অনেক module/file কে এক বা কয়েকটি optimized file এ জুড়ে দেয়, dependency সামলায়।

**Tree shaking** হলো যেসব export কোথাও ব্যবহার হয়নি সেগুলো final bundle থেকে বাদ দেওয়া ("dead code elimination")। এটা কাজ করে ES modules এর static structure এর কারণে। ফলে bundle ছোট হয় এবং page দ্রুত লোড হয়।

### Web Worker আর Service Worker কী?
- **Web Worker**: আলাদা thread এ ভারী JS কাজ (ছবি প্রক্রিয়া, বড় হিসাব) চালায়, যাতে UI আটকে না যায়। DOM access নেই, `postMessage` দিয়ে কথা বলে।
- **Service Worker**: browser ও network এর মাঝে proxy এর মতো কাজ করে। Offline support, caching, push notification, background sync দেয়। PWA এর ভিত্তি। HTTPS লাগে।

## ৯. Browser, Storage ও Security

### `localStorage`, `sessionStorage` আর cookie এর পার্থক্য কী?
- **localStorage**: ~5MB, browser বন্ধ করলেও থাকে, মুছতে না বললে চিরস্থায়ী। Request এর সাথে যায় না।
- **sessionStorage**: ~5MB, শুধু ওই tab এর জন্য, tab বন্ধ হলে মুছে যায়।
- **Cookie**: ~4KB, expiry দেওয়া যায়, **প্রতিটি HTTP request এর সাথে server এ যায়**। `HttpOnly`, `Secure`, `SameSite` flag আছে।

Storage এ সংবেদনশীল token রাখলে XSS এ চুরি হতে পারে। `HttpOnly` cookie এ JS এর access নেই।

### HTTPS ছাড়া cookie secure রাখার আর কী উপায় আছে?
সত্যি কথা: **HTTPS ছাড়া cookie পুরোপুরি নিরাপদ হয় না**, কারণ network এ কেউ traffic দেখতে (sniff) পারে। `Secure` flag ও শুধু HTTPS এ কাজ করে। তবে ঝুঁকি কমাতে এই flag/কৌশল ব্যবহার করা যায়:

- `HttpOnly`: JS (`document.cookie`) থেকে পড়া যায় না, XSS এ চুরি ঠেকায়।
- `SameSite=Strict` বা `Lax`: অন্য site থেকে request এ cookie যায় না, CSRF ঠেকায়।
- ছোট `Max-Age`/`Expires`: cookie র আয়ু কম রাখা।
- `Path` ও `Domain` সীমিত রাখা।
- Cookie তে আসল data না রেখে শুধু random **session id** রাখা, data server এ রাখা।
- Cookie value **signed/encrypted** করা (tamper ঠেকায়)।
- CSRF token ব্যবহার করা, login এর পর session id বদলানো (rotation)।
- `__Host-` prefix ব্যবহার করা (এতে `Secure` লাগে, তাই production এ HTTPS চাই)।

Production এ সবসময় HTTPS ব্যবহার করুন। `localhost` এ development এ `Secure` cookie চলে।

### XSS আর CSRF কী? Frontend থেকে কীভাবে প্রতিরোধ করবে?
**XSS (Cross-Site Scripting)**: আক্রমণকারী পেজে ক্ষতিকর script ঢুকিয়ে দেয়, যা ব্যবহারকারীর browser এ চলে (token চুরি ইত্যাদি)।

প্রতিরোধ:

- User input কখনো `innerHTML` এ বসাবেন না, `textContent` ব্যবহার করুন
- Output escape করুন, দরকারে `DOMPurify` দিয়ে sanitize করুন
- Content Security Policy (CSP) header
- Token `HttpOnly` cookie তে রাখুন
- React এ `dangerouslySetInnerHTML` এড়িয়ে চলুন

**CSRF (Cross-Site Request Forgery)**: ব্যবহারকারী লগইন থাকা অবস্থায় আক্রমণকারী অন্য site থেকে তার নামে request পাঠায়, browser cookie নিজে থেকে জুড়ে দেয়।

প্রতিরোধ: `SameSite` cookie, CSRF token, state-changing কাজে GET না ব্যবহার করা, `Origin`/`Referer` যাচাই।

### CORS কী? Preflight request কী?
**CORS (Cross-Origin Resource Sharing)**: browser এর নিরাপত্তা নিয়ম (Same-Origin Policy) অনুযায়ী এক origin (protocol+domain+port) এর JS অন্য origin এ request করলে server কে অনুমতি দিতে হয় `Access-Control-Allow-Origin` header দিয়ে।

**Preflight**: "non-simple" request (যেমন `PUT/DELETE`, custom header, `application/json`) এর আগে browser নিজে একটি `OPTIONS` request পাঠিয়ে জিজ্ঞেস করে "আমি কি এটা করতে পারি?"। Server `Access-Control-Allow-Methods`/`Headers` দিয়ে অনুমতি দিলে আসল request যায়।

CORS browser এর নিয়ম, server-to-server request এ প্রযোজ্য নয়। Server এ header ঠিক করতে হয়, frontend থেকে সমাধান হয় না।

## ১০. Output Predict

### Q1: এগুলোর output কী?
```js
console.log(typeof NaN);
console.log([] + []);
console.log([] + {});
console.log(1 + "2" - 1);
```
উত্তর:

- `typeof NaN` → `"number"`
- `[] + []` → `""` (খালি string, দুটো array string এ রূপান্তর হয়ে জুড়ে যায়)
- `[] + {}` → `"[object Object]"`
- `1 + "2" - 1` → `1 + "2"` = `"12"`, তারপর `"12" - 1` = `11` (`-` এ string number হয়ে যায়)

### Q2: object reference
```js
const a = { x: 1 };
const b = a;
b.x = 2;
console.log(a.x);
```
উত্তর: `2`। `b = a` এ reference কপি হয়েছে, দুটোই একই object কে নির্দেশ করে।

### Q3: `this` global এ
```js
function foo() { return this; }
console.log(foo() === globalThis);
```
উত্তর: Non-strict mode এ `true` (this = global)। Strict mode বা ES module এ `foo()` এর `this` হয় `undefined`, তাই `false`।

### Q4: `parseInt` এর সাথে `map`
```js
console.log([1, 2, 3].map(parseInt));
```
উত্তর: `[1, NaN, NaN]`

`map` callback এ (value, index) পাঠায়, তাই `parseInt(1, 0)`, `parseInt(2, 1)`, `parseInt(3, 2)` চলে। দ্বিতীয় argument radix (base)। Base 1 ও base 2 এ `2` ও `3` বৈধ digit নয়, তাই `NaN`।

### Q5: Event loop ক্রম
```js
setTimeout(() => console.log("A"), 0);
Promise.resolve().then(() => console.log("B"));
console.log("C");
```
উত্তর: `C`, `B`, `A`

আগে sync code (`C`), তারপর microtask (`B`), সবশেষে macrotask (`A`)।

### Q6: var বনাম let loop
```js
for (var i = 0; i < 3; i++) setTimeout(() => console.log(i), 0);
for (let j = 0; j < 3; j++) setTimeout(() => console.log(j), 0);
```
উত্তর: `3 3 3` তারপর `0 1 2`। `var` এর একটাই `i` শেয়ার হয়, `let` প্রতি iteration এ আলাদা binding দেয়।

### Q7: async/await ও event loop
```js
console.log("1");
setTimeout(() => console.log("2"), 0);
Promise.resolve().then(() => console.log("3"));
(async () => {
  console.log("4");
  await null;
  console.log("5");
})();
console.log("6");
```
উত্তর: `1 4 6 3 5 2`

- Sync: `1`, `4` (async function `await` পর্যন্ত sync চলে), `6`
- Microtask: `3`, `5` (`await` এর পরের অংশ)
- Macrotask: `2`

## ১১. Coding Challenge

### String reverse আর palindrome check
```js
const reverse = (s) => [...s].reverse().join("");

const isPalindrome = (s) => {
  const clean = s.toLowerCase().replace(/[^a-z0-9]/g, "");
  return clean === reverse(clean);
};

isPalindrome("A man, a plan, a canal: Panama"); // true
```
`[...s]` ব্যবহার করলে emoji/unicode ও ঠিকভাবে সামলায়।

### Array flatten (গভীরভাবে nested)
```js
// সহজ উপায়
const flat = (arr) => arr.flat(Infinity);

// Recursive
const flatten = (arr) =>
  arr.reduce((acc, x) => acc.concat(Array.isArray(x) ? flatten(x) : x), []);

flatten([1, [2, [3, [4]]]]); // [1,2,3,4]
```

### Two Sum
লক্ষ্য sum এর দুটি সংখ্যার index খুঁজে বের করা। `Map` দিয়ে O(n) এ হয়।
```js
function twoSum(nums, target) {
  const seen = new Map(); // value -> index
  for (let i = 0; i < nums.length; i++) {
    const need = target - nums[i];
    if (seen.has(need)) return [seen.get(need), i];
    seen.set(nums[i], i);
  }
  return [];
}
twoSum([2, 7, 11, 15], 9); // [0, 1]
```

### Anagram check
```js
const isAnagram = (a, b) => {
  const norm = (s) => [...s.toLowerCase().replace(/\s/g, "")].sort().join("");
  return norm(a) === norm(b);
};
isAnagram("listen", "silent"); // true
```
Frequency count (object/Map) দিয়ে করলে O(n) হয়, sort এ O(n log n)।

### Debounce আর throttle
```js
function debounce(fn, delay) {
  let timer;
  return function (...args) {
    clearTimeout(timer);
    timer = setTimeout(() => fn.apply(this, args), delay);
  };
}

function throttle(fn, limit) {
  let lastCall = 0;
  return function (...args) {
    const now = Date.now();
    if (now - lastCall >= limit) {
      lastCall = now;
      return fn.apply(this, args);
    }
  };
}
```

### Deep clone function
```js
function deepClone(value, seen = new WeakMap()) {
  if (value === null || typeof value !== "object") return value;
  if (seen.has(value)) return seen.get(value); // circular reference
  if (value instanceof Date) return new Date(value);
  if (value instanceof Map) {
    const m = new Map(); seen.set(value, m);
    value.forEach((v, k) => m.set(deepClone(k, seen), deepClone(v, seen)));
    return m;
  }
  if (value instanceof Set) {
    const s = new Set(); seen.set(value, s);
    value.forEach((v) => s.add(deepClone(v, seen)));
    return s;
  }
  const copy = Array.isArray(value) ? [] : {};
  seen.set(value, copy);
  for (const key of Reflect.ownKeys(value)) {
    copy[key] = deepClone(value[key], seen);
  }
  return copy;
}
```
বাস্তবে `structuredClone()` ব্যবহার করাই সহজ।

### `Promise.all` নিজের হাতে
```js
function promiseAll(promises) {
  return new Promise((resolve, reject) => {
    const results = [];
    let done = 0;
    if (promises.length === 0) return resolve(results);
    promises.forEach((p, i) => {
      Promise.resolve(p).then((v) => {
        results[i] = v;               // ক্রম ঠিক রাখতে index ব্যবহার
        if (++done === promises.length) resolve(results);
      }, reject);                     // একটা fail করলেই reject
    });
  });
}
```

### Event emitter
```js
class EventEmitter {
  constructor() { this.events = {}; }

  on(name, fn) {
    (this.events[name] ||= []).push(fn);
    return this;
  }
  off(name, fn) {
    this.events[name] = (this.events[name] || []).filter((f) => f !== fn);
    return this;
  }
  emit(name, ...args) {
    (this.events[name] || []).forEach((fn) => fn(...args));
    return this;
  }
  once(name, fn) {
    const wrapper = (...args) => { fn(...args); this.off(name, wrapper); };
    return this.on(name, wrapper);
  }
}
```

### `groupBy` function
```js
const groupBy = (arr, key) =>
  arr.reduce((acc, item) => {
    const k = typeof key === "function" ? key(item) : item[key];
    (acc[k] ||= []).push(item);
    return acc;
  }, {});

groupBy([{ t: "a", n: 1 }, { t: "b", n: 2 }, { t: "a", n: 3 }], "t");
// { a: [..2 items], b: [..1 item] }
```

### LRU cache
`Map` insertion order মনে রাখে, তাই সবচেয়ে পুরোনো key টা সহজে পাওয়া যায়।
```js
class LRUCache {
  constructor(capacity) {
    this.capacity = capacity;
    this.map = new Map();
  }
  get(key) {
    if (!this.map.has(key)) return -1;
    const val = this.map.get(key);
    this.map.delete(key);       // সরিয়ে আবার শেষে বসানো = সাম্প্রতিক
    this.map.set(key, val);
    return val;
  }
  put(key, val) {
    if (this.map.has(key)) this.map.delete(key);
    this.map.set(key, val);
    if (this.map.size > this.capacity) {
      this.map.delete(this.map.keys().next().value); // সবচেয়ে পুরোনো মোছা
    }
  }
}
```

### Generic `curry` function
```js
function curry(fn) {
  return function curried(...args) {
    if (args.length >= fn.length) return fn.apply(this, args);
    return (...next) => curried.apply(this, [...args, ...next]);
  };
}

const add = curry((a, b, c) => a + b + c);
add(1)(2)(3);   // 6
add(1, 2)(3);   // 6
```

### `map` আর `bind` polyfill
```js
Array.prototype.myMap = function (callback, thisArg) {
  const result = [];
  for (let i = 0; i < this.length; i++) {
    if (i in this) result.push(callback.call(thisArg, this[i], i, this));
  }
  return result;
};

Function.prototype.myBind = function (context, ...preset) {
  const fn = this;
  return function (...args) {
    return fn.apply(context, [...preset, ...args]);
  };
};
```

### `memoize` function
```js
function memoize(fn) {
  const cache = new Map();
  return function (...args) {
    const key = JSON.stringify(args);
    if (cache.has(key)) return cache.get(key);
    const result = fn.apply(this, args);
    cache.set(key, result);
    return result;
  };
}

const slowSquare = (n) => n * n;
const fast = memoize(slowSquare);
fast(9); // হিসাব
fast(9); // cache থেকে
```

### Promise pool (concurrency limit)
```js
async function promisePool(tasks, limit) {
  const results = new Array(tasks.length);
  let next = 0;

  async function worker() {
    while (next < tasks.length) {
      const i = next++;
      results[i] = await tasks[i]();   // tasks হলো () => Promise এর array
    }
  }

  await Promise.all(Array.from({ length: Math.min(limit, tasks.length) }, worker));
  return results;
}

// ব্যবহার: একসাথে সর্বোচ্চ ৩টি request
// promisePool(urls.map(u => () => fetch(u)), 3);
```

## ১. Basics

### React কী? কেন ব্যবহার করি? Library না framework?
React হলো UI বানানোর জন্য JavaScript **library** (Meta তৈরি করেছে)। এটা framework নয়, কারণ routing, data fetching, build setup নিজে দেয় না। এগুলোর জন্য আলাদা library বা Next.js এর মতো framework লাগে।

কেন ব্যবহার করি:

- Component-based, তাই UI ছোট ছোট reusable অংশে ভাগ করা যায়
- Declarative: state বদলালে UI নিজে আপডেট হয়
- Virtual DOM দিয়ে কম DOM update হয়
- বড় ecosystem ও community

### Virtual DOM কী? Real DOM থেকে কীভাবে আলাদা?
Virtual DOM হলো real DOM এর একটি হালকা JS object কপি।

- State বদলালে React নতুন virtual DOM বানায়
- আগেরটার সাথে তুলনা করে (**diffing**)
- শুধু যে অংশ বদলেছে সেটুকু real DOM এ বসায় (**reconciliation**)

Real DOM এ বারবার সরাসরি হাত দিলে reflow/repaint এর কারণে ধীর হয়। Virtual DOM সবসময় দ্রুত এমন নয়, মূল সুবিধা হলো declarative style এ লিখেও কম update হয়।

### Reconciliation ও diffing algorithm কীভাবে কাজ করে?
React দুটি heuristic ধরে O(n) এ কাজ করে:

- **ভিন্ন type** এর element (যেমন `div` থেকে `span`) হলে পুরো subtree ফেলে নতুন করে বানায়
- List এ **`key`** দিয়ে বোঝে কোন item কোনটা

একই type হলে শুধু বদলানো props/attribute update করে এবং state ধরে রাখে। React 16 থেকে **Fiber** architecture ব্যবহার হয়, যেখানে কাজ ছোট unit এ ভাগ হয় এবং দরকারে থামিয়ে অগ্রাধিকার দিয়ে চালানো যায়।

### JSX কী? Browser কি JSX বোঝে?
JSX হলো JS এর ভেতরে HTML এর মতো লেখার syntax। আসলে এটা `React.createElement` (নতুন transform এ `jsx()`) call এর সংক্ষিপ্ত রূপ।

Browser JSX বোঝে না। Babel/SWC/TypeScript এটা সাধারণ JS এ compile করে।

নিয়ম:

- একটাই root element (Fragment হলেও চলে)
- `class` এর বদলে `className`, `for` এর বদলে `htmlFor`
- Attribute camelCase
- `{}` এর ভেতরে JS expression (statement নয়)
- সব tag বন্ধ করতে হয় (`<img />`)

### `key` prop কেন লাগে? Index কে key দিলে কী সমস্যা?
`key` দিয়ে React বোঝে list এর কোন item কোনটা, তাই reorder/insert/delete এ সঠিক element reuse করে।

Index কে key দিলে item এর ক্রম বদলালে বা মুছলে ভুল item এর state/DOM reuse হয়। যেমন input এর টাইপ করা value ভুল row তে থেকে যায়।

```jsx
// খারাপ
items.map((item, i) => <Row key={i} item={item} />);
// ভালো (stable unique id)
items.map((item) => <Row key={item.id} item={item} />);
```

নিয়ম: key sibling এর মধ্যে unique হতে হবে, `Math.random()` কখনো না। Static list যা কখনো বদলায় না, তাতে index চলে। Key component এর props হিসেবে পৌঁছায় না।

### Functional component আর class component এর পার্থক্য কী?
- **Functional**: সাধারণ function, hooks দিয়ে state/lifecycle, `this` নেই, কম boilerplate।
- **Class**: `extends React.Component`, `this.state`, lifecycle method, `this` bind করতে হয়।

এখন functional + hooks ই recommended। Class শুধু Error Boundary এর জন্য এখনও দরকার হয়। (বিস্তারিত "React Class Component" ট্যাবে।)

### Props আর state এর পার্থক্য কী? Props immutable কেন? Props drilling কী?
- **Props**: parent থেকে আসে, child এ read-only।
- **State**: component এর নিজস্ব data, বদলালে re-render হয়।

Props immutable কারণ React এ data এক দিকে (parent থেকে child) বয়, যাতে data flow predictable থাকে। Child props বদলাতে পারলে parent এর data অজান্তে নষ্ট হতো।

**Props drilling**: মাঝের অনেক component এর ভেতর দিয়ে props পাঠানো, যেগুলো নিজে props ব্যবহারই করে না। সমাধান: Context, composition (`children`), state library।

### Fragment কী? কেন ব্যবহার করি?
Extra DOM node (যেমন বাড়তি `div`) না বানিয়ে একাধিক element return করতে Fragment ব্যবহার হয়।

```jsx
return (
  <>
    <h1>Title</h1>
    <p>Text</p>
  </>
);
// key দিতে হলে লম্বা রূপ: <React.Fragment key={id}>...</React.Fragment>
```

### Controlled আর uncontrolled component কী?
- **Controlled**: input এর value React state এ থাকে। `value` + `onChange` দিয়ে নিয়ন্ত্রণ হয়। Validation ও dynamic UI সহজ।
- **Uncontrolled**: DOM নিজেই value রাখে। `ref` দিয়ে পড়া হয়, `defaultValue` দিয়ে শুরুর মান দেওয়া হয়। কম re-render, `file` input এ এটাই চলে।

```jsx
const [name, setName] = useState("");
<input value={name} onChange={(e) => setName(e.target.value)} />;

const ref = useRef();
<input ref={ref} defaultValue="x" />; // ref.current.value
```

### Lifting state up কী?
দুটি sibling component এ একই data দরকার হলে state টা তাদের নিকটতম common parent এ তুলে নেওয়া হয় এবং props দিয়ে নিচে নামানো হয়। Child এর বদলাতে হলে parent থেকে callback props হিসেবে পায়।

### Conditional rendering এর উপায়গুলো কী কী?
```jsx
// ১. if / early return
if (loading) return <Spinner />;

// ২. ternary
{isLoggedIn ? <Dashboard /> : <Login />}

// ৩. && operator
{items.length > 0 && <List items={items} />}

// ৪. object map
const views = { a: <A />, b: <B /> };
return views[type];
```

সাবধান: `{count && <X />}` এ `count` `0` হলে পেজে `0` দেখায়। তাই `count > 0 && ...` লিখুন।

### List render করার সময় কী কী খেয়াল রাখবে?
- Stable unique `key` দিন
- `map` এর ভেতর থেকে JSX return করুন
- খালি list এর জন্য empty state দেখান
- বড় list এ virtualization/pagination ব্যবহার করুন
- Index key এড়িয়ে চলুন

### Composition vs inheritance কী? `children` prop কী?
React এ inheritance না, **composition** করতে বলা হয়, অর্থাৎ component কে অন্য component এর ভেতর বসিয়ে বানানো।

`children` হলো tag এর ভেতরে যা লেখা হয় সেটা। এটা slot এর মতো কাজ করে।

```jsx
function Card({ title, children }) {
  return <div className="card"><h3>{title}</h3>{children}</div>;
}
<Card title="Hi"><p>ভেতরের content</p></Card>
```

একাধিক slot লাগলে props এ JSX পাঠানো যায় (`<Layout header={<Nav />} />`)।

## ২. Rendering ও Performance

### React এ re-render কখন হয়?
- Component এর **state** বদলালে
- **Parent** re-render হলে (props একই থাকলেও)
- ব্যবহার করা **Context** এর value বদলালে
- Custom hook এর ভেতরের state বদলালে (hook যে component এ ব্যবহার হয় সেটা re-render হয়)

Re-render মানে component function আবার চলা। Real DOM তখনই update হয় যখন output আসলে বদলায়। শুধু re-render হলেই DOM বদলায় না।

### Parent re-render হলে child কেন re-render হয়? কীভাবে থামাবে?
এটা React এর default আচরণ। Props বদলেছে কিনা না দেখেই child আবার render হয়।

থামানোর উপায়:

- `React.memo` দিয়ে child কে wrap করা
- State যে component এ দরকার সেখানেই রাখা (**colocate**), উপরে না তোলা
- বদলানো অংশ `children` হিসেবে পাঠানো
- `useCallback`/`useMemo` দিয়ে props এর reference স্থির রাখা

### `React.memo` কী? কখন কাজ করে, কখন করে না?
`React.memo` component কে wrap করে এবং props **shallow compare** করে। Props একই হলে re-render বাদ দেয়।

কাজ করে না যখন:

- প্রতিবার নতুন object/array/inline function props হিসেবে যায় (reference বদলে যায়)
- `children` হিসেবে প্রতিবার নতুন JSX যায়

```jsx
const Child = React.memo(function Child({ onClick }) {
  return <button onClick={onClick}>go</button>;
});
```

দ্বিতীয় argument এ custom compare function দেওয়া যায়। Compare করার নিজেরও খরচ আছে, তাই সবখানে দেবেন না।

### `useMemo` আর `useCallback` এর পার্থক্য কী?
- `useMemo(() => compute(a), [a])`: হিসাব করা **value** cache করে।
- `useCallback(fn, [deps])`: **function** টাই cache করে। এটা `useMemo(() => fn, [deps])` এর সমান।

কাজে লাগে:

- ভারী হিসাব বারবার না করতে
- `React.memo` child এ stable props পাঠাতে
- অন্য hook এর dependency array তে stable value রাখতে

### Premature memoization এর সমস্যা কী?
সব জায়গায় `memo/useMemo/useCallback` দিলে code জটিল হয়, compare ও memory খরচ বাড়ে, কিন্তু আসল লাভ হয় না। আগে Profiler দিয়ে মেপে দেখুন কোথায় ধীর, তারপর দিন। React Compiler আসার পর এর অনেকটাই নিজে নিজে হয়।

### Code splitting, `React.lazy` আর `Suspense` কী?
Bundle ভেঙে দরকার হলে তবেই সেই অংশ load করা। ফলে প্রথম load দ্রুত হয়।

```jsx
const Settings = React.lazy(() => import("./Settings"));

<Suspense fallback={<Spinner />}>
  <Settings />
</Suspense>
```

Route-level splitting সবচেয়ে কার্যকর। বড় modal/chart এর জন্যও দেওয়া যায়।

### List virtualization কী?
হাজার হাজার row থাকলে সব DOM এ না রেখে শুধু screen এ যেটুকু দেখা যায় সেটুকু render করা হয়। Scroll করলে item বদলে বদলে দেখানো হয়। Library: `react-window`, `react-virtuoso`, TanStack Virtual।

### বড় list বা form এর performance কীভাবে বাড়াবে?
- Virtualization ও pagination
- `React.memo` দিয়ে row component ঠেকানো
- State কে ছোট component এ নামানো
- Form এ React Hook Form (uncontrolled) ব্যবহার
- Search এ debounce
- `useTransition`/`useDeferredValue` দিয়ে ভারী update কে কম অগ্রাধিকার দেওয়া
- ভারী হিসাবে `useMemo`

### React Profiler দিয়ে slow component কীভাবে খুঁজবে?
- Browser এ **React DevTools** এর Profiler ট্যাব খুলে record করুন, তারপর interaction করুন।
- Flamegraph এ কোন component কত সময় নিল ও কেন render হলো ("Why did this render") দেখুন।
- Code এ `<Profiler id onRender>` component দিয়েও মাপা যায়।
- পুরো পেজের জন্য Lighthouse ও Chrome Performance ট্যাব।

### Batching কী? React 18 এ কী বদলেছে?
একাধিক `setState` call কে একসাথে জুড়ে একটি render করাকে batching বলে।

- React 17: শুধু React event handler এর ভেতরে batching হতো
- React 18: সব জায়গায় automatic (setTimeout, promise, native event এও)

Batching বন্ধ করতে চাইলে `flushSync` ব্যবহার হয়।

### State update async কেন? `setCount(count + 1)` তিনবার দিলে কেন +1 হয়?
একটি render এর ভেতরে state এর value একটি **snapshot** এর মতো স্থির থাকে। `setState` শুধু পরের render schedule করে, এখনকার variable বদলায় না।

```jsx
setCount(count + 1); // count = 0, তাই 1
setCount(count + 1); // আবার 1
setCount(count + 1); // আবার 1
// ফলাফল: 1

setCount((c) => c + 1);
setCount((c) => c + 1);
setCount((c) => c + 1);
// ফলাফল: 3 (functional update সর্বশেষ value নেয়)
```

## ৩. Hooks

### Hooks কী? Rules of hooks কী? Conditional ভাবে hook call করা যায় না কেন?
Hooks হলো function component এ state, lifecycle ও অন্যান্য React feature ব্যবহার করার উপায়।

নিয়ম:

- শুধু **top level** এ call করুন (loop, condition, nested function এর ভেতরে নয়)
- শুধু React function component বা custom hook থেকে call করুন

কারণ: React hook গুলোকে call এর **ক্রম** ধরে মনে রাখে (ভেতরে linked list এর মতো)। Condition এ ক্রম বদলে গেলে state ভুল slot এর সাথে মিলে যাবে।

### `useState` এর functional update কখন লাগে?
নতুন state পুরোনো state এর উপর নির্ভর করলে বা একাধিক update একসাথে হলে।

```jsx
setCount((prev) => prev + 1);

// ভারী initial value এ lazy initializer (শুধু প্রথম render এ চলে)
const [data] = useState(() => expensiveCalc());
```

### Stale closure কী? কীভাবে হয়, কীভাবে ঠিক করবে?
Effect বা callback যে render এ তৈরি হয়েছে সেই render এর পুরোনো state/props ধরে রাখে। একে stale closure বলে।

```jsx
// সমস্যা: count সবসময় 0 ধরা থাকে
useEffect(() => {
  const id = setInterval(() => setCount(count + 1), 1000);
  return () => clearInterval(id);
}, []);

// সমাধান ১: functional update
setInterval(() => setCount((c) => c + 1), 1000);
```

অন্য সমাধান: ঠিকঠাক dependency দেওয়া, অথবা সর্বশেষ value `useRef` এ রাখা।

### `useEffect` কীভাবে কাজ করে? Dependency array এর ভূমিকা কী?
`useEffect` render এবং screen এ paint হওয়ার **পরে** চলে। Side effect এর জন্য এটা ব্যবহার হয়: API call, subscription, timer, DOM API।

Dependency array বলে দেয় কখন effect আবার চলবে। Effect এর ভেতরে যে props/state ব্যবহার হয় সব dependency তে দিতে হয় (`eslint-plugin-react-hooks` এটা মনে করিয়ে দেয়)।

### `useEffect` এর cleanup function কী? কেন দরকার?
Effect যে function return করে সেটাই cleanup। এটা চলে:

- পরের বার effect চলার আগে
- component unmount হলে

কাজ: timer clear, event listener সরানো, subscription বন্ধ, fetch abort। না করলে memory leak ও বাগ হয়।

```jsx
useEffect(() => {
  const onResize = () => console.log(window.innerWidth);
  window.addEventListener("resize", onResize);
  return () => window.removeEventListener("resize", onResize);
}, []);
```

### `[]`, কোনো array না দেওয়া, আর `[dep]` এর পার্থক্য কী?
- Array না দিলে: প্রতিটি render এর পর চলে
- `[]`: mount এর সময় একবার চলে (development এর Strict Mode এ দুইবার)
- `[dep]`: প্রথমবার এবং `dep` বদলালে চলে

### `useEffect` এ infinite loop কেন হয়?
কারণ:

- Effect এর ভেতরে state set হয় এবং সেই state ই dependency
- Dependency তে প্রতিবার নতুন object/array/function যায় (reference বদলে)
- Dependency array ছাড়া `setState` call

সমাধান: functional update, dependency তে primitive value দেওয়া, `useMemo/useCallback` দিয়ে reference স্থির রাখা, condition দিয়ে guard।

```jsx
// loop
useEffect(() => { setData([...data, 1]); }, [data]);
// ঠিক
useEffect(() => { setData((d) => [...d, 1]); }, []);
```

### API call এ race condition কীভাবে handle করবে?
Search এর মতো জায়গায় দ্রুত একাধিক request গেলে পুরোনো request এর response পরে এসে নতুনটাকে overwrite করতে পারে। সমাধান: cleanup এ আগের request বাতিল করা।

```jsx
useEffect(() => {
  const controller = new AbortController();
  fetch(`/api?q=${q}`, { signal: controller.signal })
    .then((r) => r.json())
    .then(setData)
    .catch((e) => { if (e.name !== "AbortError") setError(e); });
  return () => controller.abort();
}, [q]);
```

বিকল্প: `let ignore = false` flag রেখে cleanup এ `ignore = true` করা, অথবা React Query ব্যবহার।

### `useEffect` আর `useLayoutEffect` এর পার্থক্য কী?
- `useEffect`: paint এর **পরে**, asynchronously চলে।
- `useLayoutEffect`: DOM update হওয়ার পর কিন্তু paint এর **আগে** synchronously চলে।

`useLayoutEffect` লাগে DOM মাপতে (width/height) বা flicker এড়াতে। এটা paint আটকে রাখে, তাই কম ব্যবহার করুন। SSR এ এটা warning দেয়।

### Strict Mode এ effect দুইবার কেন চলে?
শুধু development এ Strict Mode component কে mount, unmount, আবার mount করে দেখে। উদ্দেশ্য cleanup ঠিকমতো লেখা হয়েছে কিনা ধরা (যেমন listener সরানো হয়নি)। Production এ এমন হয় না।

সমাধান hack করে নয়: cleanup ঠিক করুন, যাতে effect দুইবার চললেও সমস্যা না হয়।

### `useRef` এর use case গুলো কী?
- DOM element এ সরাসরি access (focus, scroll, measure)
- আগের value মনে রাখা
- যে value বদলালে re-render দরকার নেই তা রাখা (timer id, flag)
- সর্বশেষ callback/value রাখা (stale closure এড়াতে)

```jsx
const inputRef = useRef(null);
useEffect(() => inputRef.current.focus(), []);
<input ref={inputRef} />;
```

### `useRef` আর `useState` এর পার্থক্য কী?
- `ref.current` বদলালে **re-render হয় না**, state বদলালে হয়।
- Ref এর value render এর মধ্যে পড়া/লেখা করা উচিত নয়। এটা event handler ও effect এ করুন।
- UI তে যা দেখানো হবে সেটা state এ রাখুন।

### `useReducer` কখন `useState` এর চেয়ে ভালো?
- State জটিল (object, একাধিক সম্পর্কিত field)
- পরের state আগের state ও action এর উপর নির্ভর করে
- Update logic আলাদা করে test করতে চাইলে
- অনেক জায়গা থেকে একই ধরনের update হলে (`dispatch` stable থাকে)

```jsx
function reducer(state, action) {
  switch (action.type) {
    case "inc": return { count: state.count + 1 };
    case "reset": return { count: 0 };
    default: return state;
  }
}
const [state, dispatch] = useReducer(reducer, { count: 0 });
dispatch({ type: "inc" });
```

### `useContext` কীভাবে কাজ করে?
`useContext(MyContext)` নিকটতম `Provider` এর value পড়ে। Provider এর value বদলালে সেই context ব্যবহার করা সব component re-render হয়। Provider না থাকলে `createContext(defaultValue)` এর default পায়।

### `useId`, `useTransition` আর `useDeferredValue` কী?
- `useId`: SSR/client এ একই থাকা unique id বানায়। `label` ও `input` জোড়া লাগাতে কাজে লাগে।
- `useTransition`: কিছু update কে "জরুরি নয়" হিসেবে চিহ্নিত করে। `isPending` পাওয়া যায়, ফলে টাইপ করার মতো জরুরি কাজ আটকায় না।
- `useDeferredValue`: কোনো value এর একটি পিছিয়ে থাকা কপি দেয়, ভারী child এর জন্য কাজে লাগে।

```jsx
const [isPending, startTransition] = useTransition();
startTransition(() => setFilter(text)); // ভারী update
```

### `useImperativeHandle` আর `forwardRef` কী?
`forwardRef` দিয়ে parent এর `ref` child component এর ভেতরের DOM বা handle এ পাঠানো যায় (React 19 এ `ref` সরাসরি prop হিসেবে পাওয়া যায়)।

`useImperativeHandle` দিয়ে parent কে ঠিক কোন method গুলো দেখানো হবে সেটা নিয়ন্ত্রণ করা যায়, যেমন `focus()` বা `reset()`।

```jsx
const Input = forwardRef((props, ref) => {
  const inner = useRef();
  useImperativeHandle(ref, () => ({ focus: () => inner.current.focus() }));
  return <input ref={inner} />;
});
```

### `useSyncExternalStore` কী?
React এর বাইরের store (Redux, Zustand, browser API যেমন `online` status) এ subscribe করার hook। এটা concurrent rendering এ "tearing" (ভিন্ন অংশ ভিন্ন value দেখানো) ছাড়াই কাজ করে। সাধারণত library লেখকরা ব্যবহার করে।

### Custom hook কী? কেন বানায়?
যে function এর নাম `use` দিয়ে শুরু এবং ভেতরে অন্য hook ব্যবহার করে, সেটা custom hook। এটা stateful **logic** reuse করতে দেয়।

মনে রাখুন: custom hook state share করে না। প্রতিটি call এ নিজস্ব আলাদা state তৈরি হয়। (`useDebounce`, `useFetch`, `useLocalStorage` এর code নিচে "Live Coding" সেকশনে আছে।)

### "You Might Not Need an Effect" মানে কী? কোথায় effect লাগে না?
Effect শুধু **বাইরের system এর সাথে sync** করতে (network, DOM API, subscription)। এগুলোর জন্য effect লাগে না:

- Props/state থেকে বের করা data: render এর সময়ই হিসাব করুন
- User এর click এর কাজ: event handler এ করুন
- Prop বদলালে state reset: `key` ব্যবহার করুন
- Parent কে জানানো: event handler এ করুন

```jsx
// খারাপ
const [full, setFull] = useState("");
useEffect(() => setFull(first + " " + last), [first, last]);
// ভালো
const full = first + " " + last;
```

## ৪. Context API

### Context কী? কোন সমস্যা সমাধান করে?
Context props drilling এর সমাধান। কোনো data (theme, logged in user, language) গাছের যেকোনো গভীর component এ সরাসরি পৌঁছে দেয়, মাঝের component কে props পাঠাতে হয় না।

```jsx
const ThemeContext = createContext("light");

function App() {
  return (
    <ThemeContext.Provider value="dark">
      <Page />
    </ThemeContext.Provider>
  );
}
function Button() {
  const theme = useContext(ThemeContext);
  return <button className={theme}>OK</button>;
}
```

### Context এর value বদলালে কী হয়? কোন component re-render হয়?
Provider এর value এর **reference** বদলালেই সেই context পড়া সব consumer re-render হয়, এমনকি `React.memo` থাকলেও।

একটা সাধারণ ভুল: `value={{ user, setUser }}` লিখলে Provider এর parent re-render হলেই প্রতিবার নতুন object তৈরি হয়, ফলে সব consumer re-render হয়। `useMemo` দিয়ে value স্থির রাখুন।

### Context এর performance সমস্যা কীভাবে কমাবে?
- Context ছোট ছোট ভাগ করুন (বিষয় অনুযায়ী আলাদা)
- State আর dispatch আলাদা context এ রাখুন
- `value` কে `useMemo` তে রাখুন
- ঘন ঘন বদলানো data (যেমন mouse position) context এ রাখবেন না
- Selector লাগলে Zustand/Redux ব্যবহার করুন, কারণ Context এ selector নেই

### State আর dispatch আলাদা context এ রাখার কারণ কী?
`dispatch` function এর reference কখনো বদলায় না। তাই যে component শুধু action পাঠায় (state পড়ে না), সে state বদলালে re-render হয় না।

```jsx
const StateCtx = createContext();
const DispatchCtx = createContext();
// <StateCtx.Provider value={state}><DispatchCtx.Provider value={dispatch}>
```

### Context vs Redux/Zustand: কখন কোনটা?
Context আসলে state management tool নয়, এটা data **পৌঁছানোর** পথ। এতে selector, devtools, middleware নেই।

- কম বদলায় এমন data (theme, auth, locale): Context যথেষ্ট
- বড়, ঘন ঘন বদলায়, জটিল logic: Zustand বা Redux Toolkit
- Server data: React Query/SWR

### Auth provider বানাও (`useAuth` custom hook সহ)
```jsx
const AuthContext = createContext(null);

export function AuthProvider({ children }) {
  const [user, setUser] = useState(null);
  const login = useCallback((u) => setUser(u), []);
  const logout = useCallback(() => setUser(null), []);
  const value = useMemo(() => ({ user, login, logout }), [user, login, logout]);
  return <AuthContext.Provider value={value}>{children}</AuthContext.Provider>;
}

export function useAuth() {
  const ctx = useContext(AuthContext);
  if (!ctx) throw new Error("useAuth must be used inside AuthProvider");
  return ctx;
}
```

## ৫. Forms ও Events

### React এ form কীভাবে handle করবে?
Controlled input দিয়ে। সব field এর জন্য একটাই `handleChange` লেখা যায়।

```jsx
const [form, setForm] = useState({ name: "", email: "" });
const handleChange = (e) =>
  setForm((f) => ({ ...f, [e.target.name]: e.target.value }));
const handleSubmit = (e) => {
  e.preventDefault();
  console.log(form);
};
<form onSubmit={handleSubmit}>
  <input name="name" value={form.name} onChange={handleChange} />
  <input name="email" value={form.email} onChange={handleChange} />
</form>;
```

### React Hook Form আর controlled form এর পার্থক্য কী?
React Hook Form মূলত uncontrolled input ও `ref` ব্যবহার করে। তাই প্রতি key press এ re-render হয় না, বড় form এ দ্রুত। এতে validation, error, dirty/touched state আর `zod`/`yup` এর resolver built-in। Controlled form এ প্রতি টাইপে re-render হয়।

### Synthetic event কী?
React এর নিজস্ব event wrapper, যা সব browser এ একইভাবে কাজ করে। আসল browser event পেতে `e.nativeEvent`। React 17 থেকে event গুলো root এ delegate হয়। React 17 থেকে event pooling নেই, তাই `e.persist()` লাগে না।

### `preventDefault` কখন লাগে?
Browser এর default আচরণ আটকাতে: form submit এ পেজ reload, link এ click করলে navigate। `stopPropagation` আলাদা জিনিস, এটা event কে উপরের parent এ যেতে দেয় না।

### Form validation কীভাবে করবে?
- Schema দিয়ে (`zod`/`yup`) React Hook Form এর `resolver` এর মাধ্যমে
- Client এ validate করলেও server এ আবার করতে হবে
- কখন validate হবে ঠিক করুন (`onBlur`/`onChange`/`onSubmit`)
- Accessibility: error message এ `aria-invalid` ও `aria-describedby`

### File upload আর preview কীভাবে করবে?
```jsx
const [preview, setPreview] = useState(null);
function onFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  setPreview(URL.createObjectURL(file));
  const fd = new FormData();
  fd.append("file", file);
  // fetch("/upload", { method: "POST", body: fd });
}
useEffect(() => () => preview && URL.revokeObjectURL(preview), [preview]);
<input type="file" accept="image/*" onChange={onFile} />;
```

## ৬. Patterns ও Advanced Concepts

### Error Boundary কী? Function component দিয়ে কেন লেখা যায় না?
Error Boundary এমন component যে নিচের tree তে render এর সময় হওয়া error ধরে fallback UI দেখায়, পুরো app crash হয় না।

এর জন্য `getDerivedStateFromError` ও `componentDidCatch` লাগে, যেগুলো শুধু **class component** এ আছে। (সহজে ব্যবহার করতে `react-error-boundary` library আছে।)

যেগুলো ধরে না: event handler এর error, async code (`setTimeout`, promise), SSR, boundary নিজের error।

### Higher-Order Component (HOC) কী?
এমন function যা একটি component নেয় এবং বাড়তি কিছু যোগ করে নতুন component return করে। Auth, logging, loading এর মতো cross-cutting কাজে ব্যবহার হতো।

```jsx
const withAuth = (Component) => (props) => {
  const { user } = useAuth();
  return user ? <Component {...props} /> : <Navigate to="/login" />;
};
const Protected = withAuth(Dashboard);
```

সমস্যা: wrapper hell, props নামের conflict। এখন বেশিরভাগ জায়গায় custom hook ব্যবহার হয়।

### Render props pattern কী?
যে component এর prop (বা `children`) একটি function, যা দিয়ে সে নিজের logic/state অন্যকে দেখায়।

```jsx
function Mouse({ children }) {
  const [pos, setPos] = useState({ x: 0, y: 0 });
  return <div onMouseMove={(e) => setPos({ x: e.clientX, y: e.clientY })}>{children(pos)}</div>;
}
<Mouse>{({ x, y }) => <p>{x}, {y}</p>}</Mouse>;
```

এখন সাধারণত custom hook দিয়ে এই কাজ হয়।

### Compound component pattern কী?
কয়েকটি component মিলে একটি UI বানায় এবং ভেতরে Context দিয়ে state শেয়ার করে। ব্যবহারকারীর কাছে flexible API থাকে।

```jsx
<Tabs defaultValue="a">
  <Tabs.List>
    <Tabs.Tab value="a">A</Tabs.Tab>
    <Tabs.Tab value="b">B</Tabs.Tab>
  </Tabs.List>
  <Tabs.Panel value="a">Content A</Tabs.Panel>
</Tabs>
```

উদাহরণ: `<select>/<option>`, Radix UI, Headless UI।

### Portal কী? Modal এ কেন ব্যবহার করি?
`createPortal(child, domNode)` দিয়ে একটি component কে DOM এর অন্য জায়গায় (যেমন `document.body` এ) render করা যায়, কিন্তু React tree তে সে আগের জায়গাতেই থাকে। তাই context পায় এবং event bubble করে।

Modal, tooltip, dropdown এ কাজে লাগে, কারণ parent এর `overflow: hidden` বা `z-index` তাকে আটকাতে পারে না।

```jsx
createPortal(<div className="modal">...</div>, document.body);
```

### Refs দিয়ে DOM manipulate কখন করবে?
Declarative উপায়ে যা সম্ভব নয় শুধু তখনই: focus দেওয়া, scroll করা, element মাপা, video play/pause, third-party library integrate করা। React যে DOM manage করে সেটা ref দিয়ে হাতে বদলানো ঠিক নয়।

### Props থেকে state sync করা সমস্যা কেন? `key` দিয়ে reset কীভাবে?
Props কে state এ কপি করলে props বদলালে state পুরোনো থেকে যায় (sync হারায়)। সম্ভব হলে render এর সময় হিসাব করুন।

কোনো component এর state পুরো reset করতে চাইলে `key` বদলান। React নতুন key দেখলে component নতুন করে বানায়।

```jsx
<ProfileForm key={userId} userId={userId} />
```

## ৭. Data Fetching ও State Management

### React এ API call কীভাবে করবে? Loading, error, success কীভাবে সামলাবে?
```jsx
function Users() {
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);

  useEffect(() => {
    const c = new AbortController();
    fetch("/api/users", { signal: c.signal })
      .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(setData)
      .catch((e) => { if (e.name !== "AbortError") setError(e); })
      .finally(() => setLoading(false));
    return () => c.abort();
  }, []);

  if (loading) return <p>Loading...</p>;
  if (error) return <p>Error: {error.message}</p>;
  return <ul>{data.map((u) => <li key={u.id}>{u.name}</li>)}</ul>;
}
```

বাস্তবে caching ও retry এর জন্য React Query ব্যবহার করা ভালো।

### Server state আর client state এর পার্থক্য কী?
- **Server state**: server এ থাকা data। এটা async, অন্যরাও বদলাতে পারে, তাই stale হতে পারে। Caching, refetch, sync দরকার।
- **Client state**: শুধু UI এর state (modal খোলা, selected tab, form input)।

দুটোর জন্য আলাদা tool ব্যবহার করা ভালো। Server state এ React Query/SWR, client state এ `useState`/Zustand।

### React Query/SWR কেন ব্যবহার করে? কী কী সমস্যা সমাধান করে?
`useEffect` দিয়ে নিজে লিখলে এগুলো হাতে সামলাতে হয় এবং প্রায়ই ভুল হয়। React Query এগুলো দেয়:

- Caching ও একই request এর deduplication
- Background refetch (window focus এ, reconnect এ)
- Retry, polling
- Pagination, infinite query
- Mutation ও cache invalidation
- Loading/error state ও devtools

```jsx
const { data, isLoading, error } = useQuery({
  queryKey: ["users"],
  queryFn: () => fetch("/api/users").then((r) => r.json()),
});
```

### Optimistic update কী? কীভাবে করবে?
Server এর response এর অপেক্ষা না করে আগেই UI বদলে দেওয়া। Server fail করলে আগের অবস্থায় ফেরত নেওয়া (rollback)।

- React 19: `useOptimistic` hook
- React Query: `onMutate` এ cache আপডেট ও আগের মান সংরক্ষণ, `onError` এ rollback, `onSettled` এ `invalidateQueries`

### Caching, refetching আর `staleTime` কী?
- `staleTime`: data কতক্ষণ পর্যন্ত "fresh" ধরা হবে। Fresh থাকলে নতুন fetch হয় না।
- `gcTime` (আগে `cacheTime`): ব্যবহার না হলে cache কতক্ষণ memory তে থাকবে।
- Refetch triggers: window focus, reconnect, mount, `invalidateQueries`।

### Global state এর options কী কী? কখন কোনটা?
- `useState` + props: ছোট ও local state
- Context: কম বদলায়, যেমন theme/auth
- Zustand/Jotai: হালকা global state, কম boilerplate
- Redux Toolkit: বড় দল, জটিল logic, devtools ও middleware দরকার
- URL: filter, page, search (shareable state)
- React Query: server data

## ৮. React 18 ও 19

### Concurrent rendering কী?
React render কে থামিয়ে আবার শুরু করতে পারে এবং কাজকে অগ্রাধিকার (priority) দিতে পারে। তাই ভারী update চলার মধ্যেও টাইপ করার মতো জরুরি কাজ ঝুলে যায় না। `createRoot` ব্যবহার করলে এটা চালু হয়। এর উপরে নির্ভর করে `useTransition`, `useDeferredValue`, Suspense।

### Suspense data fetching এ কীভাবে কাজ করে?
কোনো child "এখনো তৈরি নয়" জানালে (lazy component বা data) React সবচেয়ে কাছের `<Suspense>` এর `fallback` দেখায়। তৈরি হলে আসল content দেখায়। React 19 এর `use(promise)`, React Query ও Next.js এর সাথে কাজ করে। Streaming SSR এও এটা ব্যবহার হয়।

### React 19 এ নতুন কী কী এসেছে?
- **Actions**: async function দিয়ে transition, pending/error সামলানো সহজ
- `useActionState`: form action এর state
- `useOptimistic`: optimistic UI
- `use`: promise বা context পড়া (condition এর ভেতরেও চলে)
- `ref` সরাসরি prop হিসেবে (`forwardRef` আর লাগে না)
- `<form action={fn}>`
- Component এর ভেতরে `<title>`/`<meta>` লেখা যায়
- Server Components stable

### React Compiler কী?
Build এর সময় চলা compiler, যা automatically memoization যোগ করে। ফলে অনেক ক্ষেত্রে `useMemo`, `useCallback`, `React.memo` নিজে লিখতে হয় না। শর্ত: code কে "Rules of React" মেনে চলতে হবে (pure render, state mutate না করা)।

### Server Component আর Client Component কী?
- **Server Component** (default): server এ চলে, তাদের JS browser এ যায় না (bundle ছোট), DB/secret সরাসরি ব্যবহার করা যায়। Hooks ও event handler নেই।
- **Client Component** (`"use client"`): browser এ চলে, state, effect, event ব্যবহার করে।

Interactive অংশ শুধু client component এ রাখুন, বাকিটা server এ।

## ৯. Testing, Accessibility ও Project Structure

### React component কীভাবে test করবে?
Vitest/Jest এর সাথে **React Testing Library**। User যেভাবে ব্যবহার করে সেভাবে test করুন, ভেতরের implementation নয়।

```jsx
test("counter increments", async () => {
  render(<Counter />);
  await userEvent.click(screen.getByRole("button", { name: /add/i }));
  expect(screen.getByText("1")).toBeInTheDocument();
});
```

API mock এ MSW, পুরো flow এর জন্য Playwright/Cypress।

### Unit, integration আর e2e test এর পার্থক্য কী?
- **Unit**: একটি function/component আলাদা করে। দ্রুত, অনেক সংখ্যায়।
- **Integration**: কয়েকটি component/module একসাথে (form + API mock)।
- **E2E**: আসল browser এ পুরো user flow। ধীর, কম সংখ্যায় কিন্তু সবচেয়ে বাস্তব।

### Accessibility (a11y) এর জন্য কী কী করবে?
- Semantic HTML (`button`, `nav`, `main`, heading ক্রম)
- Form এ `label`, image এ `alt`
- ARIA শুধু দরকার হলে, আগে সঠিক HTML ট্যাগ
- Keyboard দিয়ে সব কাজ করা ও দৃশ্যমান focus
- Modal এ focus trap ও বন্ধ হলে আগের জায়গায় focus ফেরত
- Color contrast ঠিক রাখা
- Tools: `eslint-plugin-jsx-a11y`, axe, Lighthouse

### বড় React project এর folder structure কেমন করবে?
Feature অনুযায়ী ভাগ করা ভালো, যাতে সম্পর্কিত file একসাথে থাকে।

```
src/
  features/
    auth/      (components, hooks, api, types)
    cart/
  components/  (shared UI: Button, Modal)
  hooks/       (shared hooks)
  lib/         (api client, utils)
  pages/ বা app/
```

নিয়ম: যা একসাথে বদলায় তা একসাথে রাখুন (colocation), feature গুলো পরস্পরের ভেতরে না ঢুকিয়ে `index` দিয়ে public API দিন।

## ১০. Output ও Bug খুঁজে বের করা

### Q1: Counter এ কী সমস্যা?
```jsx
function Counter() {
  const [count, setCount] = useState(0);
  const add3 = () => {
    setCount(count + 1);
    setCount(count + 1);
    setCount(count + 1);
  };
  return <button onClick={add3}>{count}</button>;
}
```
উত্তর: click এ count `1` হয়, `3` নয়। তিনটি call এ একই snapshot (`count = 0`) পড়ে, তাই তিনবারই `1` set হয়।

ঠিক করতে functional update: `setCount((c) => c + 1)` তিনবার দিলে `3` হবে।

### Q2: এই effect এ সমস্যা কী?
```jsx
useEffect(() => {
  const id = setInterval(() => setCount(count + 1), 1000);
}, []);
```
উত্তর: দুটি সমস্যা।

- Stale closure: `count` সবসময় `0` ধরা থাকে, তাই UI `1` এ আটকে যায়
- Cleanup নেই: unmount হলেও interval চলতে থাকে (memory leak)

ঠিক রূপ:
```jsx
useEffect(() => {
  const id = setInterval(() => setCount((c) => c + 1), 1000);
  return () => clearInterval(id);
}, []);
```

### Q3: Index key দিলে delete এ কী হবে?
```jsx
{items.map((item, index) => <Row key={index} item={item} />)}
```
উত্তর: মাঝের item মুছলে বা ক্রম বদলালে React key (index) দেখে আগের element reuse করে। ফলে Row এর ভেতরের state (যেমন input এর টাইপ করা মান) ভুল item এ থেকে যায়। ঠিক করতে `key={item.id}` ব্যবহার করুন।

### Q4: Infinite loop কেন?
```jsx
const [data, setData] = useState([]);
useEffect(() => { setData([...data, 1]); }, [data]);
```
উত্তর: effect `data` বদলায়, `data` বদলালে effect আবার চলে, এভাবে অনন্ত loop। সমাধান: `setData((d) => [...d, 1])` এবং dependency থেকে `data` সরানো, অথবা condition দিয়ে guard করা।

### Q5: `React.memo` কাজ করছে না কেন?
```jsx
const Child = React.memo(({ onClick }) => <button onClick={onClick}>go</button>);
function Parent() {
  return <Child onClick={() => console.log("hi")} />;
}
```
উত্তর: `Parent` এর প্রতি render এ inline arrow function নতুন reference পায়, তাই `memo` এর shallow compare এ props আলাদা মনে হয়। ঠিক করতে `useCallback`:
```jsx
const handle = useCallback(() => console.log("hi"), []);
<Child onClick={handle} />;
```

### Todo app (add, delete, toggle)
```jsx
function Todo() {
  const [todos, setTodos] = useState([]);
  const [text, setText] = useState("");

  const add = (e) => {
    e.preventDefault();
    if (!text.trim()) return;
    setTodos((t) => [...t, { id: crypto.randomUUID(), text, done: false }]);
    setText("");
  };
  const toggle = (id) =>
    setTodos((t) => t.map((x) => (x.id === id ? { ...x, done: !x.done } : x)));
  const remove = (id) => setTodos((t) => t.filter((x) => x.id !== id));

  return (
    <>
      <form onSubmit={add}>
        <input value={text} onChange={(e) => setText(e.target.value)} />
        <button>Add</button>
      </form>
      <ul>
        {todos.map((t) => (
          <li key={t.id}>
            <input type="checkbox" checked={t.done} onChange={() => toggle(t.id)} />
            <span style={{ textDecoration: t.done ? "line-through" : "none" }}>{t.text}</span>
            <button onClick={() => remove(t.id)}>x</button>
          </li>
        ))}
      </ul>
    </>
  );
}
```

### `useDebounce` hook
```jsx
function useDebounce(value, delay = 400) {
  const [debounced, setDebounced] = useState(value);
  useEffect(() => {
    const id = setTimeout(() => setDebounced(value), delay);
    return () => clearTimeout(id);
  }, [value, delay]);
  return debounced;
}

// Search input এ ব্যবহার

### `useFetch` hook (abort সহ)
```jsx
function useFetch(url) {
  const [state, setState] = useState({ data: null, loading: true, error: null });
  useEffect(() => {
    const c = new AbortController();
    setState({ data: null, loading: true, error: null });
    fetch(url, { signal: c.signal })
      .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then((data) => setState({ data, loading: false, error: null }))
      .catch((error) => {
        if (error.name !== "AbortError") setState({ data: null, loading: false, error });
      });
    return () => c.abort();
  }, [url]);
  return state;
}
```

### `useLocalStorage` hook
```jsx
function useLocalStorage(key, initial) {
  const [value, setValue] = useState(() => {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : initial;
    } catch { return initial; }
  });
  useEffect(() => {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
  }, [key, value]);
  return [value, setValue];
}
```

### Infinite scroll (`IntersectionObserver`)
```jsx
function InfiniteList() {
  const [items, setItems] = useState([]);
  const [page, setPage] = useState(1);
  const sentinel = useRef(null);

  useEffect(() => {
    fetch(`/api/items?page=${page}`).then((r) => r.json()).then((d) => setItems((p) => [...p, ...d]));
  }, [page]);

  useEffect(() => {
    const io = new IntersectionObserver(([e]) => {
      if (e.isIntersecting) setPage((p) => p + 1);
    });
    if (sentinel.current) io.observe(sentinel.current);
    return () => io.disconnect();
  }, []);

  return (
    <>
      {items.map((i) => <div key={i.id}>{i.title}</div>)}
      <div ref={sentinel} />
    </>
  );
}
```

    const onKey = (e) => e.key === "Escape" && onClose();

  );
}
