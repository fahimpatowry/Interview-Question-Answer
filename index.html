## ১৩. Interview Q&A (নিজের নোট থেকে)

### When would you choose SSR over SSG?
যখন page এর content ঘন ঘন বদলায় এবং **প্রতিটি request এ সর্বশেষ data** দেখাতে হয়, অথবা content ব্যবহারকারী অনুযায়ী আলাদা (personalized) হয়।

- **সুবিধা**: সবসময় fresh data, CSR এর চেয়ে ভালো SEO, server-side resource (DB, secret) এ নিরাপদ access
- **অসুবিধা**: SSG এর চেয়ে ধীর, প্রতি request এ server কে কাজ করতে হয়

**Interview answer:** "I choose SSR when the page requires fresh, request-time data or personalized content, such as dashboards, booking systems, or mortgage applications. I choose SSG when the content is mostly static and SEO is important, such as blogs, landing pages, or documentation sites. If the content changes occasionally, I would use ISR to get the benefits of both SSR and SSG."

### Difference between App Router and Pages Router?
**Pages Router (পুরোনো পদ্ধতি):**

- `pages/` directory ব্যবহার করে
- File-based routing (`pages/about.js` → `/about`)
- Data fetching: `getServerSideProps`, `getStaticProps`, `getInitialProps`
- Built-in layout system নেই (`_app.tsx` দিয়ে সামলাতে হয়)
- Server ও client এর স্পষ্ট ভাগ নেই

**App Router (নতুন পদ্ধতি, Next.js 13+):**

- `app/` directory ব্যবহার করে
- default এ **React Server Components**
- Nested layout (`layout.tsx`)
- `loading.tsx`, `error.tsx` দিয়ে loading/error UI
- সরাসরি `fetch` দিয়ে data আনা (`getServerSideProps` লাগে না)
- Server Actions built-in
- Streaming ও Suspense সাপোর্ট
- Server ও Client component এর স্পষ্ট ভাগ, ভালো performance

### Can Server Components use `useState`?
না। Server Component server এ চলে, browser এ নয়। তাই এতে browser এর memory নেই, user interaction এ re-render হয় না এবং client-side state সাপোর্ট করে না।

**Interview answer:** "No, Server Components cannot use useState because they run on the server and don't support client-side interactivity. State and hooks like useState are only available in Client Components marked with `use client`."

### How does ISR work in App Router?
Route level এ `export const revalidate = 60` দিয়ে অথবা `fetch` এর ভেতরে `next: { revalidate: 60 }` দিয়ে। Next.js cache করা static page পরিবেশন করে এবং revalidation সময় পার হলে **background এ** নতুন করে তৈরি করে। ফলে page দ্রুত থাকে আবার নির্দিষ্ট সময় পর আপডেটও হয়।

```tsx
export const revalidate = 60; // route level

await fetch(url, { next: { revalidate: 60 } }); // fetch level
```

**Interview answer:** "In App Router, ISR works by using revalidate either at the route level or inside fetch. Next.js serves a cached static page and regenerates it in the background after the revalidation period, allowing pages to stay fast while updating periodically."

### What are Server Actions?
Server এ চলা async function, `"use server"` দিয়ে চিহ্নিত। Form submit, data create/update/delete এর মতো কাজ React component থেকে সরাসরি করা যায়, অনেক ক্ষেত্রে আলাদা API route না লিখেই।

**Interview answer:** "Server Actions are server-side functions in Next.js that run on the server using `use server`. They allow us to handle operations like form submissions, data creation, updates, and deletions directly from React components without creating separate API routes."

**বাংলায়:** Server Actions হলো Next.js এর server-side function, যা `"use server"` ব্যবহার করে server এ execute হয়। এগুলোর মাধ্যমে React Component থেকে সরাসরি form submission, data create, update, delete এবং অন্যান্য server-side operation করা যায়, অনেক ক্ষেত্রে আলাদা API Route তৈরি না করেই।

**১. সরাসরি Database call (full-stack Next.js):**
```tsx
"use server";
export async function createProduct(data) {
  await db.product.create({ data });
}
```

**২. বাইরের backend API call (.NET, Node.js, Java):**
```tsx
"use server";
export async function createProduct(data) {
  await fetch("https://api.company.com/products", {
    method: "POST",
    body: JSON.stringify(data),
  });
}
```

**৩. Server-side business logic:**
```tsx
"use server";
export async function calculateDiscount(price: number) {
  return price * 0.9;
}
```

**Server Actions এর নিরাপত্তা সুবিধা:**

- Server এর code (secret, DB logic) client এ যায় না
- আলাদা করে API route বানিয়ে URL ছড়িয়ে দিতে হয় না
- অভ্যন্তরীণ কাজের জন্য সহজ ও কম boilerplate
- Server context (cookies, headers, session) সরাসরি পাওয়া যায়

**একটি গুরুত্বপূর্ণ সংশোধন:** আগের নোটে "No public endpoint exposure" লেখা ছিল, সেটা **সঠিক নয়**। Server Action আসলে পর্দার আড়ালে একটি **public POST endpoint** হয়ে যায়, যা বাইরে থেকে ডাকা সম্ভব। তাই এর ভেতরে সবসময় **authentication, authorization ও input validation** করতে হবে। Interview এ বলুন: "code client এ যায় না, কিন্তু endpoint public, তাই auth check লাগে।"

**Interview answer:** "Server Actions are server-side functions in Next.js App Router that can be called directly from components or forms without creating API routes. They reduce boilerplate and simplify data mutations. Although the code isn't shipped to the client, each action is still a public endpoint, so I always validate input and check authentication inside it. Compared to API routes, they are easier for internal application logic, while API routes are better for public or external APIs."

### How do you protect a route?
স্তরে স্তরে সুরক্ষা (layered protection):

- **Middleware**: unauthorized request কে অনেক আগেই আটকে `/login` এ redirect করে
- **Server Component**: session না থাকলে `redirect()` করে
- **Server Action/Route Handler এর ভেতরে**: আসল authorization যাচাই (এটাই চূড়ান্ত)

শুধু middleware এর উপর নির্ভর করবেন না, কারণ আসল সুরক্ষা data এর কাছেই হওয়া উচিত।

**Interview answer:** "Route protection in Next.js can be done using middleware to block unauthorized access early, server components to redirect unauthenticated users, and server-side checks in actions or API routes. The best practice is layered protection: middleware plus server-side validation to ensure security."

### Where do you store tokens?
**HTTP-only cookie** তে। এটা JavaScript দিয়ে পড়া যায় না, তাই XSS আক্রমণ থেকে সুরক্ষিত। `localStorage`/`sessionStorage` সহজ কিন্তু কম নিরাপদ, সংবেদনশীল token এর জন্য এড়িয়ে চলুন। সাথে `Secure` ও `SameSite` flag দিন (CSRF এর জন্য)।

**Interview answer:** "The best place to store authentication tokens is in HTTP-only cookies because they are not accessible via JavaScript, making them secure against XSS attacks. localStorage and sessionStorage are easier but less secure and should generally be avoided for sensitive tokens."

### Difference between Middleware and API Routes?
- **Middleware**: request page বা API route এ পৌঁছানোর **আগে** আটকায়। Authentication, redirect, rewrite, request validation এ ব্যবহার হয়। হালকা ও দ্রুত হতে হয়।
- **API Routes (Route Handlers)**: backend endpoint, যেখানে server-side logic চলে। Database operation, তৃতীয় পক্ষের API integration, CRUD, JSON response ফেরত দেওয়া।

**Interview answer:** "Middleware is used to intercept requests before they reach pages or API routes. It is commonly used for authentication, redirects, rewrites, and request validation. API Routes are backend endpoints used to execute server-side logic such as database operations, third-party API integrations, and CRUD functionality. They return data like JSON to the client."

### What happens during Next.js build?
`next build` এ ধাপগুলো:

- Configuration load (`next.config.js`, env)
- Code compile (SWC দিয়ে TypeScript/JavaScript)
- Type checking
- Linting (ESLint)। কিছু নতুন version এ build এর সাথে lint আর চলে না, version অনুযায়ী দেখে নিন
- Route analysis (কোনটা static, কোনটা dynamic)
- Static Site Generation (যেসব page static হতে পারে সেগুলো আগে থেকে তৈরি)
- Server bundle তৈরি (dynamic page এর জন্য)
- Optimization: code splitting, tree shaking, minification
- Build output `.next` ফোল্ডারে, যা `next start` চালায়

**Interview answer:** "When we run next build, Next.js creates an optimized production build of the application. It compiles TypeScript and JavaScript using SWC, performs type checking and linting, analyzes routes, generates static pages where possible, creates server-side bundles for dynamic pages, performs code splitting and tree shaking, minifies assets, and stores the final production output in the .next folder. This build is then served by next start in production."

### How do you optimize images in Next.js?
- সাধারণ `<img>` এর বদলে **`next/image`** ব্যবহার করি
- Automatic lazy loading, responsive image, আধুনিক format (WebP, AVIF)
- **`sizes`** attribute দিই যাতে browser উপযুক্ত আকারের ছবি নামায়
- Above-the-fold ছবিতে **`priority`** দিই
- বাইরের ছবির জন্য `remotePatterns` config করি
- Upload এর আগে ছবি compress করি
- Lighthouse ও Core Web Vitals দিয়ে মাপি

### Next.js Image Loading Performance Optimization
- LCP ছবিতে `priority` (নতুন version এ `preload` আসছে, docs দেখুন), বাকিগুলো lazy
- `width`/`height` বা `fill` দিন, layout shift (CLS) এড়াতে
- `sizes` দিন, ছোট screen এ বড় ছবি এড়াতে
- `placeholder="blur"` দিন, load এর আগে blur দেখাতে
- Icon এর জন্য SVG
- CDN ও `minimumCacheTTL` দিয়ে cache
- Lighthouse এ LCP/CLS মাপুন

```tsx
<Image
  src="/hero.jpg"
  alt="Hero"
  width={1200}
  height={600}
  sizes="(max-width: 768px) 100vw, 50vw"
  priority
  placeholder="blur"
/>
```

### When would you choose Next.js over React + Vite?
যখন app এ এমন production feature লাগে যা শুধু client-side SPA দেয় না:

- **SEO** দরকার
- SSR, SSG বা ISR দরকার
- দ্রুত initial load ও ভালো Core Web Vitals দরকার
- Built-in routing
- Middleware (auth, redirect, request handling)
- Image optimization ও caching
- বড় scale এর app যেখানে framework এর নিয়ম ও কাঠামো সাহায্য করে
- Backend feature দরকার (API routes, Server Actions)

**Interview answer:** "I choose Next.js over React + Vite when the application needs production-level features beyond a client-side SPA, such as SEO, SSR/SSG/ISR, fast initial load, built-in routing, middleware, image optimization, caching, and backend features like API routes or server actions."

### Why choose React for an admin panel?
Admin panel সাধারণত ভেতরের ব্যবহারের জন্য, data-heavy SPA। এতে SSR বা SEO লাগে না।

- হালকা ও সহজ
- SEO দরকার নেই
- Data-heavy UI (table, chart, form)
- Rendering এর ভিন্ন ভিন্ন কৌশল লাগে না
- Caching এর বিশেষ চাহিদা নেই (React Query দিয়েই চলে)
- System এর উপর পূর্ণ নিয়ন্ত্রণ

**Interview answer:** "I choose React (with Vite) for admin panels because admin applications are typically internal, data-driven SPAs where we don't need server-side rendering or SEO. Vite keeps the setup light, and we keep full control of the architecture."

### Explain SSR, CSR, SSG, and ISR.
**CSR (Client-Side Rendering):** Browser প্রায় ফাঁকা HTML পায়, তারপর JavaScript client এ UI বানায়।

- Rendering browser এ হয়, প্রথম load ধীর, পরে navigation দ্রুত
- React SPA তে প্রচলিত
- SEO এর জন্য ভালো নয়

**SSR (Server-Side Rendering):** প্রতি request এ server এ page render হয়ে পূর্ণ HTML browser এ যায়।

- প্রতি request এ HTML তৈরি
- দ্রুত প্রথম দেখা, ভালো SEO
- Server load বেশি
- ব্যবহার: dynamic page

**SSG (Static Site Generation):** Build এর সময় page আগে থেকে তৈরি হয়ে static HTML হিসেবে পরিবেশিত হয়।

- অত্যন্ত দ্রুত, খুব ভালো SEO
- Runtime এ server rendering নেই
- ব্যবহার: blog, documentation, marketing page

**ISR (Incremental Static Regeneration):** SSG এর মতো static page, কিন্তু পুরো app আবার build না করেই deploy এর পর background এ আপডেট করা যায়।

- আগে থেকে তৈরি, background এ পুনরায় তৈরি হতে পারে
- SSG এর গতি আর SSR এর তাজা data দুটোই
- ব্যবহার: e-commerce product page, dynamic content site

### What are React Server Components?
RSC হলো এমন component যা **শুধু server এ চলে** এবং তার আউটপুট (পূর্ব-তৈরি UI) client এ পাঠায়, ভারী JavaScript নয়।

**Server Components:**

- শুধু server এ চলে
- Browser এ JavaScript পাঠায় না
- `useState`, `useEffect` ব্যবহার করা যায় না
- Browser API (`window`, `localStorage`) নেই
- সরাসরি database/backend service এ access করা যায়
- Bundle ছোট, performance ভালো
- Next.js App Router এ default

**Client Components:**

- Browser এ চলে, JavaScript bundle client এ যায়
- `useState`, `useEffect` ব্যবহার করা যায়
- Browser API ব্যবহার করা যায়
- Interactivity (click, form, animation) দেয়
- Next.js এ `"use client"` লিখতে হয়

### What can and cannot be used inside a Server Component?
**ব্যবহার করতে পারবেন:**

- `async/await` (data fetching)
- সরাসরি database query (Prisma, Sequelize ইত্যাদি)
- Backend API (`fetch`)
- Server-side library (`fs`, `path` ইত্যাদি)
- Environment variable (`process.env`)
- অন্য Server Component
- সাধারণ JS/TS logic ও JSX

**ব্যবহার করতে পারবেন না:**

- `useState`, `useEffect`, `useReducer`
- Event handler (`onClick`, `onChange` ইত্যাদি)
- Browser API (`window`, `document`, `localStorage`)
- Browser runtime লাগে এমন hook
- DOM নির্ভর client-only library (যেমন কিছু chart library)
- Stateful UI logic

### How does Next.js improve SEO?
Next.js এ clean routing, image optimization ও metadata support আছে। এছাড়া এটি SSR ও SSG ব্যবহার করে, ফলে browser ও search engine দুটোই আগে থেকে সম্পূর্ণ HTML পেয়ে যায়। এতে page দ্রুত load হয়, সহজে crawl করা যায় এবং ভালোভাবে index হয়।

**Interview answer:** "Next.js improves SEO with server-rendered and statically generated HTML, a metadata API, clean file-based routing, image optimization, and good Core Web Vitals, so search engines can crawl and index the full content easily."

### How would you structure a large Next.js application?
বড় application এ file এর ধরন অনুযায়ী না, **feature-based modular architecture** অনুসরণ করি।

- `features/`: business logic (auth, products, dashboard)
- `shared/`: পুনঃব্যবহারযোগ্য UI (button, input, modal)
- `services/`: API call ও backend যোগাযোগ
- `hooks/`: পুনঃব্যবহারযোগ্য logic
- `store/`: state management (Redux, Zustand)
- `lib/`: utility (helper, auth logic, DB config)

```
src/
  app/            (routes, layouts)
  features/
    auth/         (components, hooks, actions, types)
    products/
  shared/ui/
  services/
  hooks/
  store/
  lib/
```

### How would you optimize a slow Next.js page?
প্রথমে bottleneck কোথায় তা বিশ্লেষণ করি (Lighthouse, React Profiler, Network tab, bundle analyzer)। তারপর:

- Rendering strategy উন্নত করা (SSR, SSG ঠিকভাবে ব্যবহার)
- Data fetching ও caching optimize করা
- Client-side JavaScript কমানো, client code যতটা সম্ভব server এ সরানো
- Code splitting ও image optimization
- Re-render কমানো (`useCallback`, `useMemo`, `React.memo`)
- অপ্রয়োজনীয় package সরানো
- বড় list এ pagination/virtualization
- শুধু প্রয়োজনীয় data ও component লোড করা
- Pages Router হলে App Router এ migrate করা

### What is Streaming in Next.js?
Server পুরো page তৈরি হওয়ার অপেক্ষা না করে ছোট ছোট অংশে (chunk) HTML browser এ পাঠায়। ধীর অংশ `<Suspense fallback>` এ মুড়ে দিলে বাকি page আগে দেখা যায় এবং ধীর অংশ তৈরি হলে পরে জুড়ে যায়। `loading.tsx` আসলে automatic Suspense boundary।

**Interview answer:** "Streaming in Next.js is a rendering technique where the server sends the page to the browser in small chunks instead of waiting for the entire page to be ready. Slow parts are wrapped in Suspense, so users see the rest of the page sooner."

### How do you prevent duplicate API calls?
পরিস্থিতি অনুযায়ী বিভিন্ন কৌশল:

- **TanStack Query বা SWR**: built-in request deduplication ও caching
- **Button disable** (request চলার সময়): form submit এ বারবার click আটকাতে
- **Debouncing**: search এর API তে
- **AbortController**: পুরোনো request বাতিল করতে, race condition এড়াতে
- **Server Component এ data fetch**: client এ duplicate request কমে, এবং একই render এ একই `fetch` একবারই চলে (request memoization)
- **`useEffect` ও callback ঠিকমতো memoize**: অপ্রয়োজনীয় re-render বা refetch আটকাতে

**Interview answer:** "I prevent duplicate API calls using different strategies depending on the situation. For data fetching I use TanStack Query or SWR, which provide request deduplication and caching. For user actions like form submission, I disable the button while the request is in flight. For search I use debouncing and AbortController to cancel stale requests. In the Next.js App Router, I fetch in Server Components where possible, and I memoize callbacks and effects correctly to avoid unnecessary re-renders and refetches. These reduce server load and avoid race conditions."

### How do you optimize API requests?
- Pagination / Infinite scrolling
- Lazy loading
- Prefetching
- Request batching (অনেক ছোট request কে একসাথে)
- Payload ছোট করা (দরকারি field ই আনা, compression)
- স্বাধীন request parallel চালানো (`Promise.all`)
- TanStack Query বা SWR (caching ও deduplication)
- Loading এর সময় button disable
- Search এ debounce
- `AbortController` দিয়ে চলমান request বাতিল
- Server Component এ API call
- অপ্রয়োজনীয় re-render বা refetch আটকাতে `useEffect` ও callback ঠিক রাখা

### Explain caching strategies in frontend applications.
Next.js এ কয়েকটি caching স্তর আছে: Request Memoization, Data Cache, Full Route Cache, Router Cache, এবং CDN caching।

- আধা-static content (product list, blog): `revalidate` ব্যবহার
- Dynamic content (user dashboard): `cache: "no-store"`
- Mutation এর পর পুরোনো cache মুছতে: `revalidatePath` / `revalidateTag`

এতে performance ও data freshness এর ভারসাম্য থাকে এবং অপ্রয়োজনীয় API call ও server load কমে।

**Interview answer:** "Next.js provides several caching layers including Request Memoization, Data Cache, Full Route Cache, Router Cache, and CDN caching. For data fetching, I typically use revalidate for semi-static content such as product listings or blogs, and cache: 'no-store' for dynamic content like user dashboards. When data changes due to mutations, I use revalidatePath or revalidateTag to invalidate stale cache. This allows me to balance performance and data freshness while minimizing unnecessary API calls and server load."

(Version সতর্কতা: Next.js 15 থেকে `fetch` default এ cache হয় না। আপনার version এর আচরণ docs এ দেখে নিন।)

### Next.js এ page এর ধরন কী কী? (Static, Dynamic, Partial)
**Static page**: build এর সময় একবার তৈরি, সবার জন্য একই HTML, CDN থেকে যায়। সবচেয়ে দ্রুত। Blog, landing page।

**Dynamic page**: প্রতি request এ server এ তৈরি (SSR)। `cookies()`, `headers()`, `searchParams`, বা `cache: "no-store"` ব্যবহার করলে হয়। Dashboard, cart।

**Partial page (Partial Prerendering, PPR)**: একই page এ static shell আর dynamic অংশ। Static অংশ সাথে সাথে যায়, dynamic অংশ `<Suspense>` এর ভেতরে পরে stream হয়।

```tsx
export default function Product() {
  return (
    <>
      <ProductInfo />                     {/* static, সাথে সাথে দেখা যায় */}
      <Suspense fallback={<p>Loading...</p>}>
        <CartButton />                    {/* dynamic, cookies() ব্যবহার করে */}
      </Suspense>
    </>
  );
}
```

**Interview answer:** "A static page is generated at build time and served from a CDN. A dynamic page is rendered on every request. With partial prerendering, a single page has a static shell that arrives instantly, while dynamic parts are streamed in through Suspense, so we get SSG's speed and SSR's freshness." (PPR setup Next.js version অনুযায়ী আলাদা, docs দেখে নিন।)

## ১. State Management Basics

### What is the state? (State কী?)
State হলো এমন data যা **সময়ের সাথে পরিবর্তিত হয়** এবং UI তে কী দেখানো হবে তা প্রভাবিত করে।

উদাহরণ: modal খোলা আছে কিনা, input এর মান, cart এর item, logged in user, API থেকে আসা তালিকা।

**Interview answer:** "State is data that can change over time and affects what is displayed in the UI."

### Why do we need state management? (State management কেন লাগে?)
State Management ব্যবহার করা হয় application এর data কে efficiently manage এবং বিভিন্ন component এর মধ্যে share করার জন্য, যাতে UI সবসময় application এর বর্তমান state এর সাথে synchronized থাকে।

Application বড় হলে শুধু local component state এর উপর নির্ভর করলে হয়:

- **Prop drilling** (অনেক স্তর পার করে props পাঠানো)
- **Duplicated state** (একই data একাধিক জায়গায়)
- Code maintain করার জটিলতা

Context API, Redux Toolkit ও Zustand এর মতো সমাধান shared data কে একটি centralized ও predictable উপায়ে সামলাতে সাহায্য করে। ফলে application scalable হয়, debugging সহজ হয় এবং data flow পরিষ্কার থাকে।

**কোনটা কখন (আমার সাধারণ নিয়ম):**

- Component এর নিজস্ব data: local state (`useState`)
- Theme, language, authentication এর মতো সহজ global state: Context API
- বড় application এ জটিল shared state: Redux Toolkit বা Zustand

### Can we use state without React? (React ছাড়া কি state থাকতে পারে?)
হ্যাঁ। State একটি সাধারণ **programming concept**। React state এর ধারণা তৈরি করেনি, বরং তা সামলানোর একটি সহজ ও কার্যকর উপায় দিয়েছে।

সাধারণ JavaScript এ আমরা variable এ state রাখতে পারি এবং state বদলালে DOM নিজে হাতে update করতে হয়।

```js
// vanilla JS
let count = 0;
const el = document.getElementById("count");
document.getElementById("btn").addEventListener("click", () => {
  count++;
  el.textContent = count;   // DOM নিজে হাতে আপডেট
});
```

React এই কাজ সহজ করে: state পরিবর্তন detect করে, component re-render করে এবং UI কে স্বয়ংক্রিয়ভাবে সর্বশেষ data এর সাথে sync রাখে।

### State এর ধরন কী কী? (UI, client, server, URL, form state)
- **UI state (local)**: modal খোলা/বন্ধ, toggle, tab। `useState`/`useReducer`
- **Client (app/global) state**: একাধিক component এ শেয়ার হওয়া data যা server এর নয়: filter, cart, theme, auth। Context, Redux Toolkit, Zustand
- **Server state**: API থেকে আসা data (product, booking, search result)। এটা server এ থাকে, আমরা শুধু কপি রাখি, তাই পুরোনো (stale) হতে পারে। React Query, RTK Query, SWR
- **URL state**: filter, page, search query (`?page=2&q=abc`)। শেয়ারযোগ্য, reload এ থাকে
- **Form state**: input মান, validation, error। React Hook Form, Formik

প্রতিটি ধরনের জন্য আলাদা উপযুক্ত tool ব্যবহার করা ভালো।

### Local state আর global state এর পার্থক্য কী? কখন কোনটা?
- **Local**: একটি component (বা তার কয়েকটি child) এর ভেতরেই দরকার। `useState`।
- **Global**: অনেক দূরের component এ দরকার, বা পেজ বদলালেও থাকতে হবে।

নিয়ম: **যতটা সম্ভব local রাখুন**, শুধু সত্যিই শেয়ার দরকার হলে উপরে তুলুন (lifting state up), তারপর Context/store। সবকিছু global store এ ঢোকানো অতিরিক্ত জটিলতা।

### Derived state কী? কেন আলাদা state এ রাখা উচিত নয়?
যে মান অন্য state/props থেকে হিসাব করে পাওয়া যায় তা derived state। এটা আলাদা state এ রাখলে দুটোর sync ভেঙে (stale) যেতে পারে।

```jsx
// খারাপ
const [items, setItems] = useState([]);
const [total, setTotal] = useState(0);   // items বদলালে আলাদা করে আপডেট করতে হবে

// ভালো
const total = items.reduce((s, i) => s + i.price * i.qty, 0);   // সবসময় হিসাব করা
// ভারী হলে useMemo
```

### State immutable কেন রাখতে হয়?
React ও Redux পরিবর্তন ধরে **reference তুলনা** (`===`) করে। সরাসরি বদলালে (mutate) reference একই থাকে, তাই "কিছু বদলায়নি" মনে হয় এবং re-render হয় না। নতুন object/array বানালে reference বদলায়। এছাড়া history/time-travel debugging ও সহজ হয়।

```js
state.items.push(x);                  // mutate: ভুল
setItems([...items, x]);              // নতুন array: ঠিক
setUser({ ...user, name: "A" });      // নতুন object: ঠিক
```

### One-way data flow (unidirectional) কী? Flux architecture কী?
Data এক দিকে বয়: state → UI → (user action) → state আপডেট → UI। কে কখন data বদলাল বোঝা সহজ হয়। **Flux** (থেকে Redux) এর ধারণা: `Action → Dispatcher/Reducer → Store → View`, আর View থেকে আবার Action।

### Prop drilling কী? কীভাবে সমাধান করবে?
মাঝের component গুলোর নিজের দরকার নেই, তবুও অনেক স্তর পার করে props পাঠানো। সমাধান:

- **Composition** (`children`, প্রয়োজনীয় অংশ নিচে নামানো)
- **Context API**
- State library (Zustand/Redux)
- State যেখানে দরকার তার কাছাকাছি রাখা (colocation)

### State management এ library কী কী আছে?
- Built-in: `useState`, `useReducer`, Context
- **Redux Toolkit**: structured, devtools, বড় app
- **Zustand**: হালকা, কম boilerplate
- **Jotai**: atom ভিত্তিক, ছোট ছোট state
- **MobX**: observable, reactive
- **Valtio**: proxy ভিত্তিক
- **XState**: state machine
- Recoil: একসময় জনপ্রিয় ছিল, কিন্তু এখন maintenance বন্ধ প্রায়, নতুন project এ এড়িয়ে চলুন
- Server state: React Query (TanStack Query), SWR, RTK Query

### `useState` আর `useReducer` এর পার্থক্য কী? কখন কোনটা?
- `useState`: সহজ ও স্বাধীন মান (toggle, input)
- `useReducer`: জটিল বা সম্পর্কিত একাধিক state, পরের state আগের উপর নির্ভর, update logic আলাদা করে test করতে চাইলে। Redux এর মতো `(state, action) => newState`।

## ২. Context API

### Context API কী? কী সমস্যা সমাধান করে?
Context হলো React এর built-in উপায় যাতে data গাছের যেকোনো স্তরে সরাসরি পৌঁছে যায়, মাঝের component কে props পাঠাতে হয় না। এটা **prop drilling** এর সমাধান।

```jsx
const ThemeContext = createContext("light");

function App() {
  const [theme, setTheme] = useState("light");
  return (
    <ThemeContext.Provider value={{ theme, setTheme }}>
      <Page />
    </ThemeContext.Provider>
  );
}
const { theme } = useContext(ThemeContext);   // গভীর কোনো component এ
```

### When would you use Context API? (কখন Context API ব্যবহার করবে?)
আমি Context API ব্যবহার করি যখন application এর কিছু global data, যেমন authentication, theme, language বা user preference, অনেক component এর মধ্যে share করতে হয় এবং state management এর complexity কম থাকে। Context prop drilling দূর করতে সাহায্য করে এবং implementation তুলনামূলকভাবে সহজ।

তবে যদি state frequently update হয়, state size বড় হয় বা complex business logic থাকে, তাহলে Redux Toolkit বা Zustand ব্যবহার করি, কারণ সেগুলো performance ও scalability এর জন্য বেশি উপযুক্ত।

### When would Context API become a bad choice? (কখন Context API খারাপ পছন্দ?)
Context API উপযুক্ত যখন state তুলনামূলক সহজ (theme, language, authentication)। কিন্তু যখন state এর business logic জটিল হয়ে যায় এবং application এর একাধিক feature একই state এর উপর নির্ভর করে, তখন Context manage করা কঠিন হয়।

**উদাহরণ (নিজের project এর গল্প):** আমার OTA project এ search filter, hotel listing, sorting, pagination ও booking information একে অপরের সাথে সম্পর্কিত ছিল। Context দিয়ে করা সম্ভব ছিল, কিন্তু state update logic, debugging ও feature scaling ধীরে ধীরে জটিল হয়ে যেত। তাই আমরা Redux Toolkit ব্যবহার করেছি, কারণ এটি state management এর জন্য structured architecture দেয় এবং application বড় হওয়ার পরও code maintain করা সহজ থাকে।

(নিজের আসল project এর উদাহরণ দিন। উদাহরণ নিজের অভিজ্ঞতা থেকে হলে interviewer এর follow-up এ আটকাবেন না।)

### Context এর value বদলালে কী হয়? Performance সমস্যা কী?
Provider এর `value` এর **reference** বদলালেই ওই context পড়া **সব consumer re-render** হয়, এমনকি তারা শুধু value র একটি অংশ ব্যবহার করলেও এবং `React.memo` থাকলেও। Context এ selector নেই।

একটি সাধারণ ভুল: `value={{ user, setUser }}` লিখলে Provider এর parent re-render হলেই প্রতিবার নতুন object তৈরি হয়, ফলে সব consumer re-render হয়।

### Context এর performance সমস্যা কীভাবে কমাবে?
- **`value` কে `useMemo` তে** রাখুন
- **Context ভাগ করুন** (state আর dispatch আলাদা, বিষয় অনুযায়ী আলাদা)
- ঘন ঘন বদলানো data (mouse position, timer) Context এ রাখবেন না
- Provider কে যতটা সম্ভব নিচে (ছোট subtree তে) রাখুন
- `children` pattern ব্যবহার করুন, যাতে Provider এর state বদলালে `children` (আগে থেকে তৈরি element) re-render না হয়
- Selector লাগলে Zustand/Redux ব্যবহার করুন

```jsx
const value = useMemo(() => ({ user, login, logout }), [user, login, logout]);
return <AuthContext.Provider value={value}>{children}</AuthContext.Provider>;
```

### State আর dispatch আলাদা Context এ রাখা কেন ভালো?
`dispatch` (বা stable function) এর reference বদলায় না। তাই যে component শুধু action পাঠায় (state পড়ে না) সে state বদলালে re-render হয় না।

```jsx
const CartStateContext = createContext();
const CartDispatchContext = createContext();
// <CartStateContext.Provider value={state}>
//   <CartDispatchContext.Provider value={dispatch}>
```

### Context + `useReducer` কি Redux এর বিকল্প হতে পারে?
ছোট থেকে মাঝারি app এ হ্যাঁ। কিন্তু এতে নেই: selector (re-render নিয়ন্ত্রণ), devtools/time travel, middleware, caching, তৈরি করা structure। বড় ও জটিল state এ Redux Toolkit/Zustand ভালো।

### Context কে global state management library বলা যায় কি?
সঠিকভাবে বললে না। Context আসলে data **পৌঁছানোর (dependency injection)** উপায়। State রাখা ও আপডেট করার কাজ করে `useState`/`useReducer`। Context শুধু সেটা গাছের নিচে ছড়িয়ে দেয়।

### Context এ `use` hook (React 19) কী?
React 19 এ `use(MyContext)` দিয়ে context পড়া যায়, এবং `useContext` এর বিপরীতে এটি **condition বা loop এর ভেতরে** ও ব্যবহার করা যায়। কাজ একই, তবে বেশি নমনীয়।

### Context এ default value কখন কাজে লাগে?
`useContext` এ Provider না পেলে `createContext(defaultValue)` এর default ফেরত আসে। প্রায়ই Provider ভুলে যাওয়ার বাগ ধরতে default `null` রেখে custom hook এ error throw করা ভালো।

```jsx
const AuthContext = createContext(null);
export function useAuth() {
  const ctx = useContext(AuthContext);
  if (!ctx) throw new Error("useAuth must be used inside AuthProvider");
  return ctx;
}
```

## ৩. Redux ও Redux Toolkit

### Redux কী? এর তিনটি মূল নীতি কী?
Redux হলো JavaScript app এর জন্য predictable state container। তিনটি নীতি:

- **Single source of truth**: পুরো app এর state একটি store এ
- **State is read-only**: state বদলানোর একমাত্র উপায় action পাঠানো
- **Changes with pure functions**: reducer (pure function) পুরোনো state ও action নিয়ে নতুন state বানায়

### Redux এর data flow বর্ণনা করো
```
UI (user click)
   ↓ dispatch(action)
Store → Reducer (পুরোনো state + action → নতুন state)
   ↓
Store এর state আপডেট
   ↓ subscribe
UI re-render (useSelector)
```

### Redux Toolkit (RTK) কী? কেন Redux এর চেয়ে ভালো?
RTK হলো Redux লেখার **অফিসিয়াল ও প্রস্তাবিত** উপায়। পুরোনো Redux এ boilerplate (action type, action creator, switch reducer, immutable update) অনেক ছিল। RTK দেয়:

- `configureStore`: store setup, thunk ও devtools স্বয়ংক্রিয়
- `createSlice`: reducer ও action এক জায়গায়
- **Immer** built-in: "mutate" এর মতো লিখলেও ভেতরে immutable update
- `createAsyncThunk`: async কাজ
- `createEntityAdapter`, RTK Query

### `createSlice`, `configureStore` ও Provider কীভাবে লিখবে?
```js
// cartSlice.js
import { createSlice } from "@reduxjs/toolkit";

const cartSlice = createSlice({
  name: "cart",
  initialState: { items: [] },
  reducers: {
    addItem(state, action) {
      const item = state.items.find((i) => i.id === action.payload.id);
      if (item) item.qty += 1;                 // Immer এর কারণে "mutate" চলে
      else state.items.push({ ...action.payload, qty: 1 });
    },
    removeItem(state, action) {
      state.items = state.items.filter((i) => i.id !== action.payload);
    },
    clear: () => ({ items: [] }),
  },
});
export const { addItem, removeItem, clear } = cartSlice.actions;
export default cartSlice.reducer;

// store.js
import { configureStore } from "@reduxjs/toolkit";
export const store = configureStore({ reducer: { cart: cartReducer } });

// main.jsx
<Provider store={store}><App /></Provider>

// component
const items = useSelector((s) => s.cart.items);
const dispatch = useDispatch();
dispatch(addItem({ id: 1, name: "Shirt", price: 500 }));
```

### Reducer কেন pure হতে হয়? Immer কীভাবে "mutate" করার সুযোগ দেয়?
Pure মানে একই input এ একই output, বাইরের কিছু বদলায় না (API call, random, `Date.now()` নেই)। এতে state পরিবর্তন predictable ও time-travel সম্ভব।

RTK এর `createSlice` ভেতরে **Immer** ব্যবহার করে। আপনি draft state এ "সরাসরি বদলান", Immer সেই পরিবর্তন থেকে নতুন immutable state তৈরি করে। (একই reducer এ হয় draft mutate করুন, নয় নতুন মান return করুন, দুটো একসাথে নয়।)

### `createAsyncThunk` কী? পুরো উদাহরণ দাও
Async কাজ (API call) এর জন্য। এটি তিনটি action স্বয়ংক্রিয়ভাবে তৈরি করে: `pending`, `fulfilled`, `rejected`।

```js
export const fetchUsers = createAsyncThunk("users/fetch", async (_, { rejectWithValue }) => {
  try {
    const res = await fetch("/api/users");
    if (!res.ok) throw new Error("Failed");
    return await res.json();
  } catch (e) {
    return rejectWithValue(e.message);
  }
});

const usersSlice = createSlice({
  name: "users",
  initialState: { list: [], status: "idle", error: null },
  reducers: {},
  extraReducers: (builder) => {
    builder
      .addCase(fetchUsers.pending, (s) => { s.status = "loading"; })
      .addCase(fetchUsers.fulfilled, (s, a) => { s.status = "succeeded"; s.list = a.payload; })
      .addCase(fetchUsers.rejected, (s, a) => { s.status = "failed"; s.error = a.payload; });
  },
});
```

### Middleware কী? Redux Thunk, Saga আর Listener middleware এর পার্থক্য কী?
Middleware হলো action dispatch ও reducer এর মাঝখানের স্তর, যেখানে async কাজ, logging, analytics ইত্যাদি করা যায়।

- **Thunk**: action এর বদলে function dispatch করা যায়, সহজ। RTK এ ডিফল্ট।
- **Saga**: generator function দিয়ে জটিল async flow (race, debounce, cancel)। শেখা কঠিন।
- **Listener middleware** (RTK): action ঘটলে প্রতিক্রিয়া দেখানোর হালকা উপায়। অনেক saga এর কাজ এখানে চলে।

### Selector কী? `createSelector` (memoization) কেন লাগে?
Selector হলো store থেকে data বের করার function। `createSelector` (Reselect) ফলাফল **memoize** করে: input selector এর ফল না বদলালে আগের ফলই ফেরত দেয়, ভারী হিসাব বা নতুন array/object বানানো এড়ায়।

```js
import { createSelector } from "@reduxjs/toolkit";

const selectItems = (s) => s.cart.items;
export const selectTotal = createSelector([selectItems], (items) =>
  items.reduce((sum, i) => sum + i.price * i.qty, 0)
);
```

### `useSelector` কীভাবে re-render ঠিক করে? কোন ভুলে অকারণ re-render হয়?
`useSelector` প্রতিবার state বদলালে selector চালায় এবং ফলকে **`===` strict equality** দিয়ে তুলনা করে। আগের মান ও নতুন মান একই হলে re-render হয় না।

ভুল: selector এ প্রতিবার **নতুন object/array** return করা (`s => ({ a: s.a, b: s.b })`)। এতে প্রতিবার নতুন reference, তাই প্রতি state পরিবর্তনে re-render। সমাধান: আলাদা আলাদা `useSelector`, `createSelector`, বা `shallowEqual`।

```js
// খারাপ
const data = useSelector((s) => ({ a: s.a, b: s.b }));
// ভালো
const a = useSelector((s) => s.a);
const b = useSelector((s) => s.b);
```

### Typed hooks (`useAppSelector`/`useAppDispatch`) কেন বানায়? (TypeScript)
```ts
import { useDispatch, useSelector } from "react-redux";
import type { TypedUseSelectorHook } from "react-redux";

export type RootState = ReturnType<typeof store.getState>;
export type AppDispatch = typeof store.dispatch;
export const useAppDispatch = () => useDispatch<AppDispatch>();
export const useAppSelector: TypedUseSelectorHook<RootState> = useSelector;
```
এতে প্রতিবার type লিখতে হয় না এবং autocomplete পাওয়া যায়।

### State normalization কী? `createEntityAdapter` কী?
Nested/duplicate data না রেখে id দিয়ে সমতল করে রাখা: `{ ids: [1,2], entities: { 1: {...}, 2: {...} } }`। আপডেট ও খোঁজা দ্রুত, duplicate কমে। `createEntityAdapter` এর `addOne`, `updateOne`, `removeOne`, `selectAll` ইত্যাদি তৈরি করা সুবিধা দেয়।

### Redux DevTools কী কাজে লাগে?
প্রতিটি action ও state এর আগে/পরে দেখা, **time-travel** (আগের অবস্থায় ফেরা), action replay, state diff। Debugging এ Redux এর বড় শক্তি।

### Redux এ state persist (`redux-persist`) কীভাবে করবে? SSR এ সমস্যা কী?
`redux-persist` store এর অংশ `localStorage` এ রাখে ও reload এ ফেরত আনে। `whitelist` দিয়ে শুধু দরকারি slice (যেমন auth, cart)।

SSR (Next.js) এ সমস্যা: server এ `localStorage` নেই, তাই প্রথম render আর client এর rehydrate করা মান আলাদা হলে **hydration mismatch** হয়। সমাধান: `PersistGate`, client এ mount হওয়ার পর rehydrate, বা সংবেদনশীল নয় এমন অংশ cookie তে।

### Redux এ কী রাখবে আর কী রাখবে না?
রাখবেন: একাধিক জায়গায় লাগে এমন client state, জটিল business logic ও আপডেট নিয়ম।

রাখবেন না: form এর প্রতিটি key press (React Hook Form), শুধু একটি component এ লাগা UI state, **server data** (React Query/RTK Query ভালো), serializable নয় এমন জিনিস (class, function, Promise, Date)। RTK serializability check এ warning দেয়।

### Redux vs Redux Toolkit (পুরোনো Redux ও RTK এর পার্থক্য)
- পুরোনো Redux: action type, action creator, switch reducer, নিজে immutable update, store setup এ অনেক boilerplate
- RTK: `createSlice` এ সব একসাথে, Immer, thunk ও devtools ডিফল্ট, সহজ setup, RTK Query

আজ নতুন কাজে সরাসরি পুরোনো Redux লেখা অফিসিয়ালি নিরুৎসাহিত।

### Redux এ async data load এর আদর্শ উপায় কী?
আগে সরাসরি thunk দিয়ে (`createAsyncThunk`) করা হতো। এখন server data এর জন্য **RTK Query** (বা React Query) ভালো, কারণ caching, refetch, loading/error state সব built-in। `createAsyncThunk` এখনও কাজের যখন API ছাড়া অন্য কোনো async logic আছে।

### Redux এ একাধিক slice কীভাবে একসাথে সংযুক্ত হয়?
`configureStore({ reducer: { cart, auth, users } })`। প্রতিটি slice নিজের অংশের reducer। একটি slice অন্য slice এর action শুনতে চাইলে `extraReducers` এ। Slice গুলো স্বাধীন রাখাই ভালো।

## ৪. Zustand

### Zustand কী? কেন জনপ্রিয়?
Zustand হলো ছোট, দ্রুত ও সহজ state management library। এটি **hook ভিত্তিক**, Provider লাগে না, actions/reducers/dispatch লিখতে হয় না। Store হলো একটি hook।

**আমার পছন্দের কারণ simplicity।** আমি feature-specific store তৈরি করতে পারি এবং state সরাসরি update করতে পারি, ফলে code অনেক পরিষ্কার হয় ও development speed বাড়ে।

### Zustand এ store কীভাবে বানাবে ও ব্যবহার করবে?
```js
import { create } from "zustand";

const useCartStore = create((set, get) => ({
  items: [],
  addItem: (item) =>
    set((state) => {
      const found = state.items.find((i) => i.id === item.id);
      return found
        ? { items: state.items.map((i) => (i.id === item.id ? { ...i, qty: i.qty + 1 } : i)) }
        : { items: [...state.items, { ...item, qty: 1 }] };
    }),
  removeItem: (id) => set((s) => ({ items: s.items.filter((i) => i.id !== id) })),
  clear: () => set({ items: [] }),
  total: () => get().items.reduce((sum, i) => sum + i.price * i.qty, 0),
}));

// component (Provider লাগে না)
const items = useCartStore((s) => s.items);          // selector
const addItem = useCartStore((s) => s.addItem);
```

### Zustand এ selector কেন গুরুত্বপূর্ণ? অকারণ re-render কীভাবে আটকায়?
`useStore()` selector ছাড়া ডাকলে পুরো store এর যেকোনো পরিবর্তনে re-render হয়। `useStore((s) => s.count)` দিলে শুধু ওই মান বদলালে re-render হয়। (Context এ এই সুবিধা নেই।)

একসাথে একাধিক মান নিতে নতুন object return করলে প্রতিবার নতুন reference হয়। সমাধান: **`useShallow`** (Zustand v5 এ নতুন object/array selector এ এটা না দিলে অনন্ত re-render এর ঝুঁকি)।

```js
import { useShallow } from "zustand/react/shallow";
const { items, total } = useCartStore(useShallow((s) => ({ items: s.items, total: s.total })));
```

### Zustand এ `set` কীভাবে কাজ করে? Merge নাকি replace?
`set` ডিফল্টে top-level এ **shallow merge** করে (Redux এর মতো পুরো replace নয়)। তাই শুধু বদলানো key দিলেই হয়। Nested object বদলাতে নিজে spread করতে হয় (বা `immer` middleware)। দ্বিতীয় argument `true` দিলে পুরো state replace হয়।

### Zustand এর middleware গুলো কী কী?
- **`persist`**: `localStorage`/`sessionStorage` এ সংরক্ষণ
- **`devtools`**: Redux DevTools এ দেখা
- **`immer`**: "mutate" এর মতো লেখা
- **`subscribeWithSelector`**: নির্দিষ্ট অংশ বদলালে subscribe

```js
import { create } from "zustand";
import { persist, devtools } from "zustand/middleware";

const useAuth = create(
  devtools(
    persist(
      (set) => ({
        user: null,
        login: (user) => set({ user }),
        logout: () => set({ user: null }),
      }),
      { name: "auth-storage", partialize: (s) => ({ user: s.user }) }
    )
  )
);
```

### Zustand এ async action কীভাবে লিখবে?
Action এর ভেতরে সরাসরি `async` function, আলাদা thunk ছাড়া।

```js
const useUsers = create((set) => ({
  users: [], loading: false, error: null,
  fetchUsers: async () => {
    set({ loading: true, error: null });
    try {
      const res = await fetch("/api/users");
      set({ users: await res.json(), loading: false });
    } catch (e) {
      set({ error: e.message, loading: false });
    }
  },
}));
```
Server data এর জন্য React Query ভালো, Zustand এ শুধু client state রাখা সুবিধাজনক।

### React এর বাইরে Zustand store কীভাবে ব্যবহার করবে?
Store এর নিজস্ব API আছে: `useStore.getState()`, `useStore.setState()`, `useStore.subscribe()`। Axios interceptor বা অন্য non-React code থেকে token পড়তে খুব কাজে লাগে।

```js
axios.interceptors.request.use((config) => {
  const token = useAuth.getState().token;     // hook ছাড়াই
  if (token) config.headers.Authorization = `Bearer ${token}`;
  return config;
});
```

### Zustand এ store কীভাবে ভাগ করবে? (slices pattern)
বড় store কে ছোট ছোট slice function এ ভাগ করে একটিতে জোড়া যায়, অথবা feature অনুযায়ী আলাদা আলাদা store বানানো যায় (প্রতিটি `create`)।

```js
const createCartSlice = (set) => ({ items: [], add: (i) => set((s) => ({ items: [...s.items, i] })) });
const createUiSlice = (set) => ({ open: false, toggle: () => set((s) => ({ open: !s.open })) });
const useStore = create((...a) => ({ ...createCartSlice(...a), ...createUiSlice(...a) }));
```

### Next.js এ Zustand ব্যবহারে কী সতর্কতা?
Server এ module-level global store **একাধিক user এর request এর মধ্যে শেয়ার** হয়ে state মিশে যেতে পারে (cross-request pollution)। সমাধান: প্রতি request/provider এ নতুন store তৈরি (`createStore` + Context Provider), শুধু Client Component এ ব্যবহার, আর `persist` এর hydration mismatch এড়ানো।

### Zustand এ অন্য store এর state পড়া/আপডেট কীভাবে?
এক store এর ভেতর থেকে অন্যটির `useOtherStore.getState()` ডাকা যায়। তবে store গুলোর মধ্যে বেশি নির্ভরতা এড়ানো ভালো।

### Zustand এ derived state/computed value কীভাবে করবে?
Selector এর ভেতরে হিসাব (`useStore((s) => s.items.length)`), বা store এ getter function (`total: () => get().items...`)। ভারী ও বারবার লাগলে `useMemo` বা আলাদা selector hook।

## ৫. তুলনা ও সিদ্ধান্ত

### Redux Toolkit vs Context API (তুলনা)
- **Context**: React এ built-in। Prop drilling সমাধান করে। সহজ global state (theme, language, auth) এর জন্য ভালো। Boilerplate কম। Debugging tool সীমিত। Selector নেই।
- **Redux Toolkit**: external library। জটিল state management সমাধান করে। বড় scale এর application এর জন্য। বেশি structure ও predictability। চমৎকার DevTools। জটিল business logic এর জন্য সেরা।

### Redux Toolkit vs Zustand (তুলনা)
- Redux Toolkit: একটি কেন্দ্রীয় (single) store, Actions + Reducers, `dispatch()` লাগে, বেশি boilerplate, structured architecture, বড় enterprise app এ ভালো
- Zustand: একাধিক ছোট store (multi-store), সরাসরি state আপডেটের function, `dispatch()` নেই, minimal boilerplate, নমনীয় architecture, সহজ থেকে মাঝারি জটিলতার app এ ভালো

Zustand আমার পছন্দ তার simplicity র জন্য: hook-based ও lightweight, actions/reducers/dispatch লিখতে হয় না, আর feature-specific store বানিয়ে সরাসরি state আপডেট করা যায়।

### Zustand vs Context API
- Zustand এ selector আছে (শুধু প্রয়োজনীয় অংশ বদলালে re-render), Provider লাগে না, React এর বাইরেও ব্যবহারযোগ্য, devtools/persist middleware আছে
- Context এ built-in, কোনো বাড়তি dependency নেই, কিন্তু value বদলালে সব consumer re-render হয়

ঘন ঘন বদলানো বা বড় state এ Zustand ভালো, কম বদলানো ও সরল (theme, auth) এ Context।

### কোন সিদ্ধান্ত ফ্রেমওয়ার্ক দিয়ে state tool বেছে নেবে?
- শুধু এক component: `useState`
- কয়েকটি কাছাকাছি component: state উপরে তোলা (lifting)
- সহজ ও কম বদলায় এমন global (theme, auth, locale): **Context**
- মাঝারি client state, কম boilerplate চাই: **Zustand**
- বড় দল, জটিল logic, devtools/time-travel, কঠোর structure: **Redux Toolkit**
- API data: **React Query / RTK Query** (আলাদা, server state)
- Filter/page/search: **URL**
- Form: **React Hook Form**

### Redux ও Zustand কোনটি বেশি performance দেয়?
দুটোই selector দিয়ে অকারণ re-render আটকাতে পারে, তাই বাস্তবে পার্থক্য কম। Context এর তুলনায় দুটোই ভালো। আসল পার্থক্য developer experience ও structure এ।

### Server state ও client state আলাদা করে ভাবা কেন গুরুত্বপূর্ণ?
Server state server এর data এর একটি কপি, তাই stale হতে পারে ও caching, refetch, sync দরকার। Redux/Zustand এ API data রাখলে এসব নিজে লিখতে হয় এবং ভুল হয়। তাই server data এর জন্য React Query/RTK Query আর client state এর জন্য Zustand/Redux আলাদা ব্যবহার করা ভালো।

### State management library ছাড়া কি বড় app বানানো যায়?
হ্যাঁ, যদি state সঠিকভাবে ভাগ করা হয়: server data এর জন্য React Query, form এর জন্য React Hook Form, filter এর জন্য URL, আর বাকি ছোট UI state `useState` এ। তখন সত্যিকারের "global client state" অনেক কম হয়, এবং Context বা সামান্য Zustand ই যথেষ্ট হয়ে যায়।

## ৬. Server State: Axios, Fetch, React Query, RTK Query

### What is Axios and what makes it different? (Axios কী? কী আলাদা?)
Axios হলো একটি JavaScript HTTP client, browser ও Node.js থেকে API request পাঠাতে ব্যবহার হয়। মূল পার্থক্য: Axios এ built-in সুবিধা আছে যেমন automatic JSON parsing, **interceptors**, ভালো error handling, সহজ global configuration। অন্যদিকে native Fetch API তুলনামূলক basic এবং আরও manual কাজ করতে হয়।

**Interview answer:** "Axios is a JavaScript HTTP client used to make API requests from the browser or Node.js. The main difference is that Axios provides extra built-in features like automatic JSON parsing, interceptors, better error handling, and easy global configuration, whereas the native Fetch API is more basic and requires more manual handling."

### Axios আর Fetch এর মধ্যে পার্থক্য (বিস্তারিত)
- **JSON**: Axios নিজে parse করে (`res.data`), Fetch এ `res.json()` ডাকতে হয়
- **Error**: Axios 4xx/5xx এ error throw করে, Fetch **শুধু network failure এ** reject করে (HTTP 404/500 এ resolve), তাই `res.ok` হাতে দেখতে হয়
- **Interceptor**: Axios এ আছে (token যোগ, global error), Fetch এ নেই (wrapper লিখতে হয়)
- **Timeout/cancel**: Axios এ `timeout` option, Fetch এ `AbortController` লাগে (Axios ও এখন এটা সাপোর্ট করে)
- **Upload progress**: Axios এ সহজ
- **Bundle**: Fetch built-in (কোনো বাড়তি size নেই), Axios একটি dependency
- Next.js এ server side এ Next এর patch করা `fetch` ব্যবহার করলে caching/revalidate পাওয়া যায়, Axios এ সেটা আসে না

### When would you still use Axios? (কখন এখনও Axios ব্যবহার করবে?)
আমি Axios ব্যবহার করি যখন একটি centralized API layer লাগে যেখানে authentication এর জন্য interceptors, global error handling, request/response transformation এবং app জুড়ে consistent configuration দরকার। মাঝারি থেকে বড় application এ যেখানে অনেক API call পরিষ্কার ও maintainable ভাবে সামলাতে হয়।

```js
import axios from "axios";

export const api = axios.create({
  baseURL: import.meta.env.VITE_API_URL,
  timeout: 10000,
});

api.interceptors.request.use((config) => {
  const token = localStorage.getItem("token");       // বা store/cookie
  if (token) config.headers.Authorization = `Bearer ${token}`;
  return config;
});

api.interceptors.response.use(
  (res) => res,
  async (error) => {
    if (error.response?.status === 401) {
      // token refresh বা logout
    }
    return Promise.reject(error);
  }
);
```

### Why use React Query instead of Axios? (Axios থাকতে useQuery কেন?)
Axios আর React Query তুলনীয় নয়, কারণ কাজ আলাদা। Axios হলো শুধু **HTTP client** (request পাঠানোর), আর React Query হলো **server state management** library।

আমি React Query (TanStack Query) ব্যবহার করি যখন শুধু data আনা নয়, **server state manage করা** দরকার। React Query দেয় built-in caching, background refetching, automatic loading ও error state, data synchronization। Axios এ এগুলো সবই নিজে হাতে করতে হয়।

বাস্তবে দুটো একসাথেই ব্যবহার করা হয়: `queryFn` এর ভেতরে Axios দিয়ে request পাঠানো হয়, আর React Query সেই data সামলায়।

```jsx
const { data, isPending, error } = useQuery({
  queryKey: ["products", page],
  queryFn: () => api.get("/products", { params: { page } }).then((r) => r.data),
  staleTime: 60_000,
});
```

### React Query (TanStack Query) এর মূল ধারণা গুলো কী কী?
- **Query**: data পড়া (`useQuery`), **Mutation**: data বদলানো (`useMutation`)
- **`queryKey`**: cache এর identity, key বদলালে নতুন করে আনে
- **`staleTime`**: কতক্ষণ data "fresh" (ডিফল্ট 0)। Fresh থাকলে refetch হয় না
- **`gcTime`** (আগে `cacheTime`): অব্যবহৃত data কতক্ষণ memory তে থাকবে (ডিফল্ট ৫ মিনিট)
- **Background refetch**: window focus, reconnect, mount এ (ডিফল্ট চালু)
- **Retry**: ব্যর্থ হলে ডিফল্টে ৩ বার
- **Deduplication**: একই key এর একাধিক request একটি হয়ে চলে
- **`invalidateQueries`**: mutation এর পর cache পুরোনো ঘোষণা করে refetch
- `enabled`, `select`, `placeholderData`, `useInfiniteQuery`, DevTools

### React Query তে mutation ও cache invalidation কীভাবে করবে?
```jsx
const queryClient = useQueryClient();

const addTodo = useMutation({
  mutationFn: (todo) => api.post("/todos", todo),
  onSuccess: () => {
    queryClient.invalidateQueries({ queryKey: ["todos"] });   // তালিকা আবার আনো
  },
});
addTodo.mutate({ title: "Learn" });
```

### React Query তে optimistic update কীভাবে করবে?
```jsx
useMutation({
  mutationFn: toggleTodo,
  onMutate: async (id) => {
    await queryClient.cancelQueries({ queryKey: ["todos"] });
    const prev = queryClient.getQueryData(["todos"]);              // rollback এর জন্য
    queryClient.setQueryData(["todos"], (old) =>
      old.map((t) => (t.id === id ? { ...t, done: !t.done } : t))
    );
    return { prev };
  },
  onError: (_e, _id, ctx) => queryClient.setQueryData(["todos"], ctx.prev),   // rollback
  onSettled: () => queryClient.invalidateQueries({ queryKey: ["todos"] }),
});
```

### `isLoading`, `isFetching` আর `isPending` এর পার্থক্য কী? (React Query)
- `isPending` (v5): data এখনো নেই (প্রথমবার লোড বা mutation চলছে)
- `isFetching`: যেকোনো fetch চলছে (background refetch সহ)
- `isLoading` (v5): `isPending && isFetching`, অর্থাৎ প্রথমবার আনা চলছে

প্রথম লোডে spinner, background refetch এ ছোট indicator, এমন UI সাজানো যায়।

### React Query vs RTK Query
React Query (TanStack Query) ও RTK Query দুটোই **server state** সামলায়। React Query **framework-agnostic** (Redux লাগে না) ও অনেক নমনীয়, caching, refetch ও background update built-in। RTK Query Redux Toolkit এর সাথে গভীরভাবে যুক্ত, তাই app এ ইতিমধ্যে Redux থাকলে এবং state ও API management এক জায়গায় চাইলে ভালো পছন্দ।

**Interview answer:** "React Query (TanStack Query) and RTK Query both solve server-state management, but React Query is framework-agnostic and very flexible with built-in caching, refetching, and background updates, while RTK Query is tightly integrated with Redux Toolkit, making it a better choice when the app already uses Redux and you want a unified state + API management system."

### When should we choose RTK Query? (কখন RTK Query বেছে নেবে?)
আমি RTK Query বেছে নিই যখন application এ ইতিমধ্যে Redux Toolkit ব্যবহার হচ্ছে এবং server state manage করার একটি scalable সমাধান দরকার। এটি built-in caching, auto-refetching, loading/error handling দেয় এবং API logic সরাসরি Redux এর সাথে integrate করে। অনেক component একই API data শেয়ার করে এমন বড় application (e-commerce, OTA system) এর জন্য আদর্শ।

### RTK Query কীভাবে লিখবে? (`createApi`, tags)
```js
import { createApi, fetchBaseQuery } from "@reduxjs/toolkit/query/react";

export const api = createApi({
  reducerPath: "api",
  baseQuery: fetchBaseQuery({
    baseUrl: "/api",
    prepareHeaders: (headers, { getState }) => {
      const token = getState().auth.token;
      if (token) headers.set("authorization", `Bearer ${token}`);
      return headers;
    },
  }),
  tagTypes: ["Post"],
  endpoints: (build) => ({
    getPosts: build.query({
      query: () => "/posts",
      providesTags: ["Post"],
    }),
    addPost: build.mutation({
      query: (body) => ({ url: "/posts", method: "POST", body }),
      invalidatesTags: ["Post"],          // নতুন post হলে getPosts নিজে refetch হবে
    }),
  }),
});
export const { useGetPostsQuery, useAddPostMutation } = api;

// store এ: reducer: { [api.reducerPath]: api.reducer }, middleware: (g) => g().concat(api.middleware)
// component: const { data, isLoading, error } = useGetPostsQuery();
```

### SWR কী? React Query এর সাথে পার্থক্য কী?
SWR (Vercel) এর নাম "stale-while-revalidate" থেকে: আগে cache এর পুরোনো data দেখায়, পিছনে নতুন আনে। হালকা ও সহজ, `useSWR(key, fetcher)`। React Query তে বেশি feature (mutation, devtools, infinite query, বিস্তারিত নিয়ন্ত্রণ)। ছোট কাজে SWR, বড় কাজে React Query।

### Server state এর জন্য `useEffect + useState` এর সমস্যা কী?
নিজে হাতে লিখলে caching, deduplication, retry, race condition, refetch, loading/error, pagination সব নিজেকে সামলাতে হয়। Strict Mode এ দুইবার call ও আসে। React Query/RTK Query এগুলো সমাধান করে দেয়।

## ৭. বড় Application এ State পরিচালনা

### How do you manage global state in a large application? (বড় application এ global state কীভাবে সামলাবে?)
বড় application এ আমি state কে তিন ভাগে ভাগ করি: **UI state, client state, server state।**

- **UI state**: component এর নিজস্ব, যেমন modal খোলা/বন্ধ, form input, toggle। আমি `useState` বা `useReducer` ব্যবহার করি।
- **Client state**: একাধিক component এ শেয়ার হওয়া, যেমন filter, cart data, user information, authentication state। এর জন্য আমি **Redux Toolkit (বা Zustand)** ব্যবহার করি, কারণ এটি shared application state সামলানোর একটি কেন্দ্রীভূত ও predictable উপায় দেয়।
- **Server state**: API থেকে আসা data, যেমন product, booking, search result। এর জন্য আমি **RTK Query** পছন্দ করি, কারণ এটি API call, caching, synchronization ও automatic refetching সামলায়, ফলে manual কাজ কমে এবং data consistent থাকে।

এই ভাগ করলে application scalable, maintainable ও debug করা সহজ থাকে।

### একটি e-commerce বা OTA app এ state কীভাবে ভাগ করবে? (উদাহরণ)
- **Server state** (RTK Query/React Query): product list, hotel search result, booking history, order
- **Client state** (Redux Toolkit/Zustand): cart, selected filter, logged in user, checkout এর ধাপ
- **UI state** (`useState`): filter panel খোলা, image gallery এর সক্রিয় ছবি, modal
- **URL state**: search query, page, sort (শেয়ারযোগ্য)
- **Form state** (React Hook Form): booking form এর ফিল্ড

### Search filter, pagination ও sorting এর state কোথায় রাখবে?
সবচেয়ে ভালো হলো **URL এ** (`?q=dhaka&page=2&sort=price`)। এতে share করা যায়, reload ও back button কাজ করে, আর server state (`queryKey`) এ সেটা ঢোকানো যায়। Redux/Zustand এ রাখলে URL এর সাথে sync রাখার বাড়তি কাজ থাকে। জটিল, বহু-ধাপ filter এ store ও ব্যবহার করা যায়।

### State management এর সাধারণ ভুলগুলো কী কী?
- সবকিছু global store এ ঢোকানো
- API data Redux/Zustand এ নিজে হাতে রাখা (React Query/RTK Query থাকতে)
- Derived data আলাদা state এ রাখা (sync ভাঙে)
- Context এ ঘন ঘন বদলানো বড় state রাখা
- State mutate করা
- Selector ছাড়া পুরো store subscribe করা (অকারণ re-render)
- Non-serializable মান Redux এ রাখা

## ৮. Output ও Bug খুঁজে বের করা

### Q1: Redux এ UI আপডেট হচ্ছে না। কেন?
```js
// reducer (পুরোনো Redux, Immer ছাড়া)
case "add":
  state.items.push(action.payload);
  return state;
```
উত্তর: state mutate করা হয়েছে এবং একই reference return হয়েছে, তাই Redux/React কোনো পরিবর্তন ধরতে পারে না। নতুন object/array return করুন:
```js
return { ...state, items: [...state.items, action.payload] };
```
(RTK এর `createSlice` এ Immer থাকায় `state.items.push(...)` ঠিক আছে।)

### Q2: `useSelector` এ অকারণ re-render হচ্ছে। কেন?
```js
const { a, b } = useSelector((s) => ({ a: s.a, b: s.b }));
```
উত্তর: selector প্রতিবার নতুন object return করে, তাই `===` তুলনায় সবসময় আলাদা। আলাদা আলাদা selector দিন (`useSelector(s => s.a)`) বা `shallowEqual`/`createSelector` ব্যবহার করুন।

### Q3: Context এর একটি value বদলালে সব component re-render হয়। কেন, কীভাবে ঠিক করবে?
```jsx
<AppContext.Provider value={{ user, theme, cart }}>
```
উত্তর: কোনো একটি বদলালে নতুন object হয়ে সব consumer re-render হয়, এমনকি যারা শুধু `theme` ব্যবহার করে তারাও। সমাধান: বিষয় অনুযায়ী আলাদা context (`UserContext`, `ThemeContext`, `CartContext`), `value` `useMemo` তে, অথবা Zustand/Redux (selector সহ)।

### Q4: Zustand v5 এ "Maximum update depth exceeded" error কেন?
```js
const { a, b } = useStore((s) => ({ a: s.a, b: s.b }));
```
উত্তর: selector প্রতিবার নতুন object return করে, যা Zustand v5 এ অনন্ত re-render ঘটায়। `useShallow` দিয়ে মুড়ে দিন, বা আলাদা selector ব্যবহার করুন।

### Q5: Redux এ async thunk এর পর loading কখনো শেষ হচ্ছে না। কেন হতে পারে?
```js
extraReducers: (b) => b.addCase(fetchUsers.fulfilled, (s, a) => { s.list = a.payload; })
// pending/rejected handle করা নেই
```
উত্তর: `pending`/`rejected` case নেই, তাই `status` কখনো `loading` বা `failed` হয় না; error হলে loading আটকে থাকে। তিনটি case ই handle করুন, আর thunk এ `rejectWithValue` ব্যবহার করুন।

### Q6: React Query তে mutation এর পরও তালিকা পুরোনো দেখাচ্ছে। কেন?
```js
useMutation({ mutationFn: addTodo })   // onSuccess এ কিছু নেই
```
উত্তর: cache ঝাড়া হয়নি। `onSuccess` এ `queryClient.invalidateQueries({ queryKey: ["todos"] })` দিন (RTK Query তে `invalidatesTags`), অথবা `setQueryData` দিয়ে সরাসরি আপডেট করুন।

## ৯. Live Coding

### Context + `useReducer` দিয়ে Cart বানাও
```jsx
const CartContext = createContext(null);

function cartReducer(state, action) {
  switch (action.type) {
    case "add": {
      const found = state.find((i) => i.id === action.item.id);
      return found
        ? state.map((i) => (i.id === found.id ? { ...i, qty: i.qty + 1 } : i))
        : [...state, { ...action.item, qty: 1 }];
    }
    case "remove": return state.filter((i) => i.id !== action.id);
    case "clear": return [];
    default: return state;
  }
}

export function CartProvider({ children }) {
  const [items, dispatch] = useReducer(cartReducer, []);
  const total = useMemo(() => items.reduce((s, i) => s + i.price * i.qty, 0), [items]);
  const value = useMemo(() => ({ items, total, dispatch }), [items, total]);
  return <CartContext.Provider value={value}>{children}</CartContext.Provider>;
}
export const useCart = () => {
  const ctx = useContext(CartContext);
  if (!ctx) throw new Error("useCart must be inside CartProvider");
  return ctx;
};
```

const cartSlice = createSlice({
  name: "cart",
  initialState: { items: [] },
  reducers: {
    addItem(state, { payload }) {
      const found = state.items.find((i) => i.id === payload.id);
      found ? (found.qty += 1) : state.items.push({ ...payload, qty: 1 });
    },
    removeItem(state, { payload: id }) {
      state.items = state.items.filter((i) => i.id !== id);

    clearCart: (state) => { state.items = []; },

});
export const { addItem, removeItem, clearCart } = cartSlice.actions;

export default cartSlice.reducer;

export const store = configureStore({ reducer: { cart: cartReducer } });

### Zustand দিয়ে Cart বানাও (persist সহ)
```js
import { create } from "zustand";
import { persist } from "zustand/middleware";

export const useCart = create(
  persist(
    (set, get) => ({
      items: [],
      add: (p) => set((s) => {
        const f = s.items.find((i) => i.id === p.id);
        return { items: f ? s.items.map((i) => (i.id === p.id ? { ...i, qty: i.qty + 1 } : i)) : [...s.items, { ...p, qty: 1 }] };
      }),
      remove: (id) => set((s) => ({ items: s.items.filter((i) => i.id !== id) })),
      clear: () => set({ items: [] }),
      total: () => get().items.reduce((sum, i) => sum + i.price * i.qty, 0),
    }),
    { name: "cart" }
  )
);

// component (Provider নেই)
const items = useCart((s) => s.items);
const add = useCart((s) => s.add);
```

### Auth store (Zustand) ও Axios interceptor এ token ব্যবহার

export const useAuth = create(
  persist(
    (set) => ({
      user: null,
      token: null,
      login: (user, token) => set({ user, token }),
      logout: () => set({ user: null, token: null }),
    }),

);

api.interceptors.request.use((config) => {

  if (token) config.headers.Authorization = `Bearer ${token}`;

});

});

### Custom hook: `useLocalStorage` ও `useDebounce`
```jsx
function useLocalStorage(key, initial) {
  const [value, setValue] = useState(() => {
    try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : initial; }
    catch { return initial; }
  });
  useEffect(() => {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
  }, [key, value]);
  return [value, setValue];
}

function useDebounce(value, delay = 400) {
  const [debounced, setDebounced] = useState(value);
  useEffect(() => {
    const id = setTimeout(() => setDebounced(value), delay);
    return () => clearTimeout(id);
  }, [value, delay]);
  return debounced;
}
```
