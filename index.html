## ১২. Interview Q&A (নিজের নোট থেকে)

### What is build time?
Build time হলো সেই সময় যখন application এর source code কে **production-ready ও optimized file** এ রূপান্তর করা হয়, user application ব্যবহার করার **আগেই**। Deploy করার আগে যেসব কাজ হয় (code compile, bundle, minify, static page generate) সবই build time এ ঘটে।

গুরুত্বপূর্ণ কারণ: ভারী কাজ আগেই শেষ হয়ে যায়, ফলে user দ্রুত optimized page পায়, performance ভালো হয় ও SEO improve হয়।

Build time এ Next.js/React যা করে:

- JSX কে JavaScript এ convert করে
- TypeScript compile করে (ব্যবহার করলে)
- সব module bundle করে
- Unused code সরায় (tree shaking)
- File minify করে
- Image optimize করে
- Static page generate করে (SSG)

### What is runtime?
Runtime হলো সেই সময় যখন application **user এর জন্য চলতে থাকে** এবং user interaction অনুযায়ী code execute হয়। Website open করা, button click, API call, form submit, page navigate সবই runtime এ ঘটে।

উদাহরণ:

- User website open করল: runtime
- Button click করল: runtime
- `setCount()` execute হলো: runtime
- Component re-render হলো: runtime
- Next.js এ `getServerSideProps` প্রতি request এ চলে, তাই এটাও runtime এর উদাহরণ (আর `getStaticProps` build time এ চলে)

### What is React?
React হলো **User Interface (UI)** বানানোর জন্য একটি JavaScript library।

- Jordan Walke তৈরি করেছেন
- Meta (আগের Facebook) maintain করে
- Reusable component দিয়ে application বানানো হয়

### Why is it called React? এটা কি দুটি শব্দের মিশ্রণ (Re + Act)?
UI যেভাবে data/state এর পরিবর্তনে **প্রতিক্রিয়া (react)** দেখায়, সেই ধারণা থেকেই নাম। State বদলালে React নিজে UI আপডেট করে।

"Re + Act", "Render + Act", "Response + Action" এই ব্যাখ্যাগুলো জনপ্রিয় ধারণা, কিন্তু React টিম এগুলোকে আনুষ্ঠানিকভাবে নামের উৎস বলেনি। তাই interview এ বলুন: "নামটি এসেছে এই ধারণা থেকে যে UI, data পরিবর্তনে react করে।" কোনো "full form" দাবি করবেন না।

### When does a React component re-render?
Component re-render হয় যখন:

- তার **state** বদলায়
- তার **props** বদলায়
- তার **parent** re-render হয়
- Force re-render হয় (`forceUpdate`, বা `key` বদলে)
- সে যে **context** ব্যবহার করে তার value বদলায়

**Interview answer:** "A React component re-renders when its state changes, props change, its parent re-renders, a re-render is forced, or when a context value it consumes changes."

### How do you identify unnecessary re-renders in a large application?
- **React DevTools Profiler** দিয়ে কোন component ঘন ঘন render হচ্ছে দেখা, "Why did this render?" চালু করা
- Render logging (`console.log`, `useRef` দিয়ে render count)
- `why-did-you-render` library
- Performance monitoring tools

তারপর কারণ খোঁজা (props, state, নাকি context বদলাচ্ছে) এবং ঠিক করা: `React.memo`, `useMemo`/`useCallback`, state নিচে নামানো (colocation), component tree নতুন করে সাজানো।

**Interview answer:** "I identify unnecessary re-renders using React DevTools Profiler, render logging, and performance monitoring. I first detect which components re-render frequently, then trace why (props, state, context), and finally optimize using memoization, state colocation, or restructuring the component tree."

### What happens when a component renders?
React component function টি চালায়, নতুন **Virtual DOM tree** তৈরি করে, আগেরটার সাথে তুলনা করে (**reconciliation**), এবং শুধু দরকার হলে real DOM আপডেট করে।

### What is the difference between Virtual DOM and Real DOM?
Real DOM হলো browser এ পেজের আসল রূপ। Virtual DOM হলো real DOM এর হালকা JS object কপি, যা React আপডেট optimize করতে ব্যবহার করে। React আগে Virtual DOM আপডেট করে, আগের version এর সাথে তুলনা করে (diffing), তারপর শুধু বদলানো অংশ real DOM এ বসায়।

- **Location**: Real DOM browser এ, Virtual DOM memory তে (JavaScript)
- **Speed**: Real DOM এ সরাসরি বারবার আপডেট ধীর, Virtual DOM আপডেট দ্রুত
- **Update type**: Real DOM এ সরাসরি আপডেট, Virtual DOM এ diffing দিয়ে ন্যূনতম আপডেট
- **Cost**: Real DOM এ reflow/repaint এর খরচ বেশি, Virtual DOM এ কম
- **Usage**: Real DOM আসল UI দেখায়, Virtual DOM একটি optimization technique

### Why is Virtual DOM faster?
Virtual DOM memory তে কাজ করে, diffing করে ন্যূনতম পরিবর্তন খুঁজে বের করে এবং batch আকারে real DOM আপডেট করে। ফলে ব্যয়বহুল DOM operation কমে যায়।

- এটা JavaScript object (memory তে থাকে)
- Browser এর DOM সরাসরি ধরে না
- আগে সব পরিবর্তন তুলনা করে (diffing)
- তারপর একবারে আপডেট করে (batching)

**একটি সতর্কতা:** "Virtual DOM সবসময় দ্রুত" কথাটা পুরোপুরি সত্য নয়। হাতে লেখা সরাসরি DOM update কখনো কখনো আরও দ্রুত হতে পারে। Virtual DOM এর আসল সুবিধা হলো আপনি declarative style এ লিখতে পারেন, আর React ন্যূনতম আপডেট বের করে দেয়। Interview এ বললে ভালো: "দ্রুত নয়, বরং **যথেষ্ট দ্রুত এবং predictable**।"

### Explain React reconciliation
Reconciliation হলো একটি algorithm। React নতুন Virtual DOM কে আগেরটার সাথে তুলনা করে real DOM আপডেটের জন্য সবচেয়ে কম পরিবর্তনের সেট বের করে।

```
State / Props পরিবর্তন
        ↓
নতুন Virtual DOM তৈরি
        ↓
React পুরোনো vs নতুন Virtual DOM তুলনা করে
        ↓
পার্থক্য খুঁজে পায় (Diffing)
        ↓
শুধু বদলানো অংশ real DOM এ আপডেট
```

দুটি heuristic: ভিন্ন type এর element হলে subtree নতুন করে বানায়, list এ `key` দিয়ে item চেনে।

### What is React Fiber and why was it introduced?
React Fiber হলো React এর reconciliation engine (React 16 এ এসেছে), যা **incremental ও interruptible rendering** সম্ভব করে। এটি rendering এর কাজকে ছোট ছোট unit (fiber) এ ভাগ করে, ফলে React কাজ **pause, resume ও অগ্রাধিকার (priority)** দিতে পারে।

পুরোনো synchronous stack reconciler এর সমস্যা:

- Rendering ছিল synchronous (blocking)
- বড় update এ UI freeze হতো
- Update গুলোর মধ্যে অগ্রাধিকার ঠিক করা যেত না
- জটিল app এ responsiveness খারাপ (animation, typing lag)

Fiber হলো React এর concurrent rendering এর ভিত্তি।

### What happens when `setState()` is called?
React একটি state update **schedule** করে, component কে re-render ট্রিগার করে, তারপর reconciliation চালিয়ে ন্যূনতম পরিবর্তন বের করে। শেষে শুধু দরকার হলে real DOM আপডেট করে। এই প্রক্রিয়া **asynchronous ও batched**, যাতে performance ভালো থাকে।

### Explain the React rendering lifecycle from user interaction to UI update
```
User click করল
   ↓
Event handler চলে
   ↓
setState call হয়
   ↓
Update schedule হয় (batched)
   ↓
Render phase (re-render + reconciliation)
   ↓
Fiber processing (pause/resume হতে পারে)
   ↓
Commit phase (DOM আপডেট)
   ↓
Browser paint
   ↓
useEffect চলে
```

মূল কথা: **Render phase** pure ও interrupt হতে পারে (DOM ছোঁয় না)। **Commit phase** এ DOM বদলায়, এবং `useLayoutEffect` এখানে চলে। `useEffect` সাধারণত paint এর পরে চলে।

**Interview answer:** "When a user interacts with the UI, React schedules a state update, triggers a re-render, runs reconciliation by diffing Virtual DOMs, and finally applies the minimal changes to the real DOM in the commit phase, followed by running effects like useEffect."

### When would you use `useMemo` and when would you avoid it?
ভারী/ব্যয়বহুল হিসাব cache করতে `useMemo` ব্যবহার করি, যাতে component re-render হলে প্রতিবার একই হিসাব আবার করতে না হয়। হিসাব সহজ হলে বা performance সমস্যা না থাকলে ব্যবহার করি না, কারণ এতে বাড়তি overhead ও জটিলতা আসে।

**কখন ব্যবহার করবেন:**

- ভারী হিসাব (expensive calculation)
- বড় array filter করা
- বড় array sort করা
- জটিল data transformation
- Re-render এর সময় ভারী computation
- Derived value memoize করা (যা `React.memo` child এ props হিসেবে যায়)

**কখন এড়াবেন:** সহজ হিসাব, primitive value, আর যেখানে মেপে দেখা হয়নি যে আসলেই ধীর।

### When would you use `useCallback`?
Function কে memoize করে যাতে re-render এর মধ্যে তার **reference স্থির** থাকে। প্রধানত `React.memo` child এর অকারণ re-render এড়াতে এবং অন্য hook এর dependency array তে function থাকলে কাজে লাগে।

**Interview answer:** "useCallback is used to memoize functions so their reference stays stable between renders, mainly to optimize child re-renders and dependency-based hooks."

### What are common mistakes developers make with hooks?
- `useEffect` এ dependency ভুলভাবে সামলানো
- State সরাসরি mutate করা (immutable হিসেবে না দেখা)
- Rules of Hooks ভাঙা (condition/loop এ hook call)
- প্রয়োজন ছাড়াই `useMemo`/`useCallback` এর অতিরিক্ত ব্যবহার
- অস্থির (unstable) reference পাঠানো, যা অকারণে re-render ঘটায়
- Effect এ cleanup না লেখা
- Derived data কে state এ রাখা

এর ফলে performance সমস্যা, stale state বাগ বা infinite render loop হয়।

### Explain stale closures in React
Stale closure হলো এমন সমস্যা যেখানে React এর কোনো function **পুরোনো state বা props** ধরে রাখে এবং পরে সেই outdated value ব্যবহার করে। JavaScript closure এর কারণে হয়, সাধারণত `useEffect` বা async callback এ dependency ঠিক না থাকলে।

ঠিক করার উপায়:

- Dependency array ঠিক করা
- Functional state update (`setCount((c) => c + 1)`) ব্যবহার করা
- `useRef` দিয়ে সর্বশেষ value ধরে রাখা

```jsx
// সমস্যা: count সবসময় 0
useEffect(() => {
  const id = setInterval(() => setCount(count + 1), 1000);
  return () => clearInterval(id);
}, []);

// সমাধান
useEffect(() => {
  const id = setInterval(() => setCount((c) => c + 1), 1000);
  return () => clearInterval(id);
}, []);
```

### When would you use `useRef`?
যখন কোনো value কে **re-render না ঘটিয়ে** render এর মধ্যে ধরে রাখতে হয়, অথবা সরাসরি DOM element এ access লাগে। উপযোগী: timer id, আগের state, DOM reference, সর্বশেষ callback।

**Interview answer:** "I use useRef when I need to persist a value across renders without causing a re-render, or when I need to directly access a DOM element. It is useful for storing mutable values like timers, previous state, or DOM references."

### What is React Concurrent Rendering?
React এর একটি feature যেখানে rendering এর কাজ **interruptible ও অগ্রাধিকারভিত্তিক**। React কাজ pause, resume ও ক্রম বদল করতে পারে। ফলে ভারী কাজ চললেও UI responsive থাকে।

এটি Fiber architecture ও Scheduler এর উপর ভিত্তি করে কাজ করে এবং `startTransition`, `useTransition`, `useDeferredValue` ও Suspense এর ভিত্তি।

**Interview answer:** "React Concurrent Rendering is a feature of React that allows rendering work to be interruptible and prioritized, so React can pause, resume, and reorder rendering tasks. This helps keep the UI responsive even when the application is doing heavy work."

**বাংলায়:** React Concurrent Rendering হলো React এর একটি feature যেখানে rendering কাজকে pause, resume এবং priority অনুযায়ী manage করা যায়। এর ফলে বড় বা heavy কাজ চললেও UI responsive থাকে। এটা React এর Fiber architecture এবং Scheduler এর মাধ্যমে কাজ করে।

### What is Suspense and where have you used it?
React Suspense হলো এমন একটি feature যা component বা data লোড হতে সময় লাগলে **fallback UI** দেখায় এবং content ready হলে আসল UI স্বয়ংক্রিয়ভাবে render করে।

ব্যবহার:

- Code splitting (`React.lazy`)
- Next.js এ streaming ও server rendering (`loading.tsx` আসলে Suspense boundary)
- Data fetching library (React Query, `use` hook)

```jsx
<Suspense fallback={<Spinner />}>
  <LazyDashboard />
</Suspense>
```

### How does React handle event delegation?
Event delegation মানে প্রতিটি child এ আলাদা listener না বসিয়ে একটি common parent এ **একটি মাত্র listener** বসানো এবং event bubbling ব্যবহার করে বোঝা কোন child এ event ঘটেছে। React ভেতরে এটাই করে: সব event handler কে root container এ (React 17 থেকে root element এ, আগে `document` এ) delegate করে এবং synthetic event এর মাধ্যমে সঠিক handler চালায়।

সুবিধা: কম memory, কম listener, পরে যোগ হওয়া element ও কাজ করে। বড় list, table, menu ও dynamic UI এ বিশেষভাবে উপযোগী।

**Interview answer:** "We use event delegation to improve performance, reduce memory consumption, and handle dynamically created elements efficiently. Instead of attaching listeners to every child element, we attach a single listener to a common parent and use event bubbling to determine which child triggered the event. React itself delegates events at the root container."

### How do you optimize React application performance?
- Profiler দিয়ে bottleneck খোঁজা
- অপ্রয়োজনীয় re-render আটকানো (`React.memo`, `useMemo`, `useCallback`)
- বড় data list এ pagination বা virtualization
- State management optimize (state colocation, ছোট context)
- Code splitting
- Lazy loading
- List rendering optimize (stable `key`)
- Bundle size কমানো (অপ্রয়োজনীয় package সরানো, tree shaking)
- API call optimize (caching, dedupe, debounce)
- সঠিক rendering strategy (Next.js এ SSR/SSG/ISR)
- Image ও asset optimize

### How do you prevent duplicate API calls? (React ও Next.js, বিস্তারিত)
**প্রথমে বুঝুন duplicate call কেন হয়:**

- Development এ **Strict Mode** `useEffect` দুইবার চালায় (শুধু dev, production এ নয়)
- `useEffect` এর dependency তে প্রতিবার নতুন object/function যাওয়া
- একাধিক component একই data আলাদা আলাদা করে আনছে
- User দুইবার click/submit করছে
- Search এ প্রতি key press এ request
- Route এ যাওয়া-আসায় বারবার refetch
- Race condition (পুরোনো response নতুনকে overwrite করছে)

**React এ সমাধান:**

**১. TanStack Query / SWR (সবচেয়ে ভালো)।** একই `queryKey` এর একাধিক request একটি হিসেবেই চলে (in-flight deduplication), ফল cache হয়। `staleTime` দিলে নির্দিষ্ট সময় refetch ও হয় না।

```jsx
const { data } = useQuery({
  queryKey: ["users"],            // একই key = একটাই request, সবাই ফল শেয়ার করে
  queryFn: fetchUsers,
  staleTime: 60_000,              // ১ মিনিট fresh, refetch নয়
});
// UserList ও Header দুই component এ useQuery(["users"]) দিলেও request একটাই
```

**২. Submit এ button disable ও double-click guard।**

```jsx
const [saving, setSaving] = useState(false);
async function submit() {
  if (saving) return;             // guard
  setSaving(true);
  try { await api.save(); } finally { setSaving(false); }
}
<button disabled={saving} onClick={submit}>Save</button>
```

State update async বলে খুব দ্রুত double click এ guard ফাঁক গলতে পারে। তখন `useRef` দিয়ে lock রাখুন (`if (lock.current) return; lock.current = true;`)।

**৩. Search এ Debounce + AbortController।**

```jsx
useEffect(() => {
  const controller = new AbortController();
  const t = setTimeout(() => {
    fetch(`/api/search?q=${q}`, { signal: controller.signal })
      .then((r) => r.json()).then(setResults)
      .catch((e) => { if (e.name !== "AbortError") setError(e); });
  }, 400);
  return () => { clearTimeout(t); controller.abort(); };
}, [q]);
```

**৪. `useEffect` এর dependency ঠিক রাখা।** Object/array/function dependency তে সরাসরি না দিয়ে primitive value বা `useMemo`/`useCallback` ব্যবহার করুন, যাতে অকারণে effect আবার না চলে। "Derived data" হিসাবের জন্য effect লাগবে না।

**৫. Strict Mode এর double call এ ভয় নেই।** এটা শুধু development এ cleanup ঠিক আছে কিনা পরীক্ষা করার জন্য। Strict Mode বন্ধ না করে effect এ cleanup (`AbortController`) লিখুন। React Query থাকলে এটা নিজেই সামলায়।

**৬. Data এক জায়গায় আনা ও share করা।** Parent বা Context/store এ একবার fetch করে props/context দিয়ে নিচে পাঠান।

**৭. নিজের in-flight cache (library ছাড়া)।**

```js
const inflight = new Map();
export function fetchOnce(url) {
  if (inflight.has(url)) return inflight.get(url);   // চলমান request ই ফেরত দাও
  const p = fetch(url).then((r) => r.json()).finally(() => inflight.delete(url));
  inflight.set(url, p);
  return p;
}
```

**৮. POST/payment এর জন্য server এ idempotency key।** Client এর guard ছাড়াও server এ `Idempotency-Key` header যাচাই করুন, যাতে network retry বা double submit এ একই কাজ দুইবার না হয়।

**Next.js এ সমাধান:**

**১. Server Component এ fetch (সবচেয়ে ভালো শুরু)।** Client এ আলাদা request লাগে না। একই render এর ভেতরে একই URL ও option এর `fetch` গুলো **Request Memoization** এর কারণে স্বয়ংক্রিয়ভাবে একবারই চলে। তাই layout, page ও component সবাই আলাদা করে `fetch` করলেও duplicate হয় না।

**২. `fetch` ছাড়া data (Database/ORM) এ React `cache()`।** Request memoization শুধু `fetch` এ কাজ করে, তাই DB query এ `cache` দিয়ে মুড়ে দিন:

```tsx
import { cache } from "react";

export const getUser = cache(async (id: string) => {
  return db.user.findUnique({ where: { id } });
});
// layout, page ও আলাদা component সবাই getUser(id) call করলেও query একবারই চলে
```

**৩. Caching ও revalidate।** `fetch(url, { next: { revalidate: 60 } })` বা `cache: "force-cache"` দিয়ে request এর মধ্যেও ফল cache করা। (Next.js 15 থেকে `fetch` default এ cache হয় না, তাই দরকার হলে নিজে দিন। Version অনুযায়ী দেখে নিন।)

**৪. Server এ prefetch ও client এ hydrate (React Query)।** Server এ `prefetchQuery` করে `HydrationBoundary` দিয়ে client এ পাঠালে client component এ আবার প্রথম fetch হয় না। সাথে `staleTime > 0` দিন।

**৫. Server Action এর pending state।** `useActionState`/`useFormStatus`/`useTransition` এর `pending` দিয়ে submit button disable করুন, যাতে দুইবার submit না হয়।

**৬. Client Component এ data আনা সরান।** সম্ভব হলে Server Component এ আনুন এবং props হিসেবে Client Component এ পাঠান। এতে client এ `useEffect` fetch ও duplicate দুটোই কমে।

**৭. Waterfall এড়ানো।** স্বাধীন call গুলো `Promise.all` বা আলাদা `<Suspense>` এ চালান (এটা duplicate না হলেও অকারণ ধীরতা কমায়)।

**Interview answer:** "I prevent duplicate API calls using different strategies depending on the situation. For data fetching I use TanStack Query or SWR, which provide request deduplication and caching. For user actions like form submission, I disable the button while the request is pending, and for critical writes I also use idempotency keys on the server. For search I use debouncing and AbortController to cancel stale requests. In the Next.js App Router, I fetch in Server Components where possible, where identical fetch calls in the same render are memoized automatically, and I wrap database queries with React cache. I also keep effect dependencies stable so effects don't re-run unnecessarily. These approaches reduce server load, improve performance, and avoid race conditions."
</script>

## ১. Basics

### Class component কী? কীভাবে লিখতে হয়?
ES6 class দিয়ে লেখা React component, যা `React.Component` কে extend করে। এতে `render()` method থাকতে হবে, যা JSX return করে।

```jsx
import React from "react";

class Hello extends React.Component {
  render() {
    return <h1>Hello, {this.props.name}</h1>;
  }
}
```

### Class component আর functional component এর পার্থক্য কী?
- Class: `this.state` ও `this.setState`, lifecycle method, `this` bind করতে হয়, বেশি boilerplate
- Functional: hooks (`useState`, `useEffect`), `this` নেই, কম code, logic reuse সহজ (custom hook)
- আগে শুধু class এ state ও lifecycle ছিল, hooks (React 16.8) আসার পর functional এ সবই সম্ভব
- এখন নতুন code এ functional recommended

### `render()` method কেন লাগে?
এটাই class component এর একমাত্র **বাধ্যতামূলক** method। এটা JSX, string, number, array, `null`, portal return করতে পারে। `render()` pure হতে হবে: এর ভেতরে `setState` call করা যাবে না এবং side effect (API call, DOM বদলানো) করা যাবে না।

### `constructor` কেন লাগে? `super(props)` কেন দিতে হয়?
Constructor এ সাধারণত state শুরু করা হয় ও method bind করা হয়।

`super(props)` parent (`React.Component`) এর constructor চালায়। এটা না দিলে `this` ব্যবহার করলে `ReferenceError` আসে। `props` না পাঠালে constructor এর ভেতরে `this.props` `undefined` থাকে (যদিও `render` এ ঠিকই পাওয়া যায়)।

```jsx
constructor(props) {
  super(props);
  this.state = { count: 0 };
  this.handleClick = this.handleClick.bind(this);
}
```

### `React.Component` আর `React.PureComponent` এর পার্থক্য কী?
`PureComponent` নিজে থেকে `shouldComponentUpdate` চালায়, যেখানে props ও state **shallow compare** হয়। কিছু না বদলালে re-render হয় না।

`Component` প্রতিবার parent বা state বদলালে re-render হয়। `PureComponent` এ ভুল হয় যখন state/props mutate করা হয় (reference একই থাকে)।

### Props ও state কীভাবে access করে?
`this.props` ও `this.state`। Props read-only, কখনো `this.props.x = 1` করা যাবে না।

```jsx
render() {
  const { name } = this.props;
  const { count } = this.state;
  return <p>{name}: {count}</p>;
}
```

### কখন class component ব্যবহার করবে, কখন functional?
- নতুন code: functional + hooks
- Error Boundary: এখনও class লাগে
- পুরোনো project বা legacy code: class বুঝতে ও maintain করতে হয়
- এক project এ দুটো মিশিয়েও চলে, একটি আরেকটির ভেতরে ব্যবহার করা যায়

## ২. State

### State কীভাবে initialize করে? Constructor ছাড়া আর কী উপায়?
```jsx
// ১. constructor এ
constructor(props) {
  super(props);
  this.state = { count: 0 };
}

// ২. class property (constructor ছাড়া, সংক্ষিপ্ত)
class Counter extends React.Component {
  state = { count: 0 };
}
```

### `this.setState()` কী? সরাসরি `this.state.x = 1` কেন করা যায় না?
`setState` React কে জানায় যে state বদলাচ্ছে, তাই React re-render schedule করে। সরাসরি `this.state.x = 1` লিখলে state বদলে যায় কিন্তু React জানে না, তাই **re-render হয় না**, এবং batching ও lifecycle ঠিকভাবে কাজ করে না। শুধু constructor এ সরাসরি assign করা যায়।

### `setState` async কেন? Batching কীভাবে হয়?
Performance এর জন্য React একাধিক `setState` কে জুড়ে একটি re-render করে (batching)। তাই `setState` call এর ঠিক পরের লাইনে `this.state` এ পুরোনো value ই থাকে।

```jsx
this.setState({ count: this.state.count + 1 });
console.log(this.state.count); // পুরোনো value
```

আপডেটের পরের value পেতে `setState` এর callback বা `componentDidUpdate` ব্যবহার করুন।

### `setState` এ object আর function কখন কোনটা?
নতুন state পুরোনো state বা props এর উপর নির্ভর করলে **function** ব্যবহার করুন, কারণ batching এর কারণে `this.state` stale হতে পারে।

```jsx
// ভুল (batching এ শুধু +1)
this.setState({ count: this.state.count + 1 });
this.setState({ count: this.state.count + 1 });

// ঠিক (+2)
this.setState((prev) => ({ count: prev.count + 1 }));
this.setState((prev) => ({ count: prev.count + 1 }));
```

### `setState` এর দ্বিতীয় argument (callback) কী?
State update ও re-render শেষ হওয়ার পরে এই callback চলে।

```jsx
this.setState({ open: true }, () => {
  console.log("update শেষ:", this.state.open);
});
```

### State merge কীভাবে হয়? Hooks এর `useState` এ তা হয় না কেন?
Class এ `setState` **shallow merge** করে। অর্থাৎ শুধু যে key দেওয়া হলো সেটা বদলায়, বাকি key ঠিক থাকে।

```jsx
state = { a: 1, b: 2 };
this.setState({ a: 5 }); // { a: 5, b: 2 }
```

Hooks এর `useState` এর setter value কে সম্পূর্ণ **replace** করে। তাই object state এ spread (`{ ...prev, a: 5 }`) করতে হয়। Nested object এ class এও deep merge হয় না, নিজে spread করতে হয়।

### Nested state কীভাবে update করবে?
Mutate না করে নতুন object বানাতে হয় (spread দিয়ে)।

```jsx
this.setState((prev) => ({
  user: { ...prev.user, address: { ...prev.user.address, city: "Dhaka" } },
}));
```

### `setState` কখন re-render trigger করে না?
- `shouldComponentUpdate` যদি `false` return করে
- `PureComponent` এ আগের মতো একই reference পাঠালে (যেমন mutate করা array)
- `setState(null)` দিলে (updater function `null` return করলে)

## ৩. Lifecycle Methods (সবচেয়ে গুরুত্বপূর্ণ)

### Class component এর lifecycle এর ৩টি phase কী কী?
- **Mounting**: component প্রথমবার DOM এ বসে
- **Updating**: props বা state বদলায়
- **Unmounting**: component DOM থেকে সরে যায়
- (এছাড়া **Error handling** phase আছে)

### Mounting phase এর method গুলো কী কী এবং কোন ক্রমে চলে?
ক্রম:

- `constructor()`
- `static getDerivedStateFromProps()`
- `render()`
- `componentDidMount()`

### Updating phase এর method গুলো কী কী?
Props বদলালে, `setState` হলে বা `forceUpdate` হলে এই ক্রমে চলে:

- `static getDerivedStateFromProps()`
- `shouldComponentUpdate()`
- `render()`
- `getSnapshotBeforeUpdate()`
- `componentDidUpdate()`

### `componentDidMount` এ কী কাজ করা হয়? API call কোথায় দেবে?
Component DOM এ বসার পর একবার চলে। এখানে করা হয়:

- API call (data fetch)
- Subscription, WebSocket, event listener যোগ
- Timer শুরু (`setInterval`)
- DOM measure বা third-party library init

API call `constructor` বা `render` এ দেবেন না, `componentDidMount` এ দিন।

```jsx
componentDidMount() {
  fetch("/api/users")
    .then((r) => r.json())
    .then((users) => this.setState({ users, loading: false }));
}
```

### `componentDidUpdate(prevProps, prevState)` এ condition কেন দিতে হয়? না দিলে কী হয়?
এই method প্রতিটি update এর পর চলে। ভেতরে condition ছাড়া `setState` দিলে সেই `setState` আবার update ঘটায়, আবার `componentDidUpdate` চলে, এভাবে **infinite loop** হয়।

```jsx
componentDidUpdate(prevProps) {
  if (prevProps.userId !== this.props.userId) {
    this.fetchUser(this.props.userId);
  }
}
```

### `componentWillUnmount` এ কী cleanup করবে?
Component সরে যাওয়ার ঠিক আগে চলে। এখানে পরিষ্কার করুন:

- `clearInterval`/`clearTimeout`
- `removeEventListener`
- Subscription/WebSocket বন্ধ
- চলমান request abort

এখানে `setState` call করবেন না, কারণ component আর render হবে না।

```jsx
componentDidMount() { this.timer = setInterval(this.tick, 1000); }
componentWillUnmount() { clearInterval(this.timer); }
```

### `shouldComponentUpdate` কী? Performance এ কীভাবে সাহায্য করে?
Re-render এর আগে চলে। `true` return করলে render হয়, `false` করলে skip হয়।

```jsx
shouldComponentUpdate(nextProps, nextState) {
  return nextProps.value !== this.props.value;
}
```

অপ্রয়োজনীয় re-render আটকায়। সাধারণত `PureComponent` এটা নিজে থেকেই করে। এটা ভুল লিখলে UI আপডেট না হওয়ার বাগ আসে।

### `getDerivedStateFromProps` কী? কখন ব্যবহার করে? কেন এড়াতে বলা হয়?
এটা `static` method, যা প্রতিটি render এর আগে (mount ও update দুইবারই) চলে। Props থেকে state বের করতে ব্যবহার হয়। এটা `this` পায় না, শুধু `(props, state)` পায় এবং নতুন state object বা `null` return করে।

```jsx
static getDerivedStateFromProps(props, state) {
  if (props.userId !== state.prevUserId) {
    return { prevUserId: props.userId, draft: "" };
  }
  return null;
}
```

এড়াতে বলা হয় কারণ props কে state এ কপি করলে sync এর বাগ হয়। বেশিরভাগ ক্ষেত্রে props সরাসরি ব্যবহার করুন বা `key` দিয়ে reset করুন।

### `getSnapshotBeforeUpdate` কী? উদাহরণ দাও।
DOM update হওয়ার ঠিক আগে চলে এবং এর return value `componentDidUpdate` এর তৃতীয় argument হয়। DOM এর আগের অবস্থা (scroll position) ধরে রাখতে লাগে। যেমন chat এ নতুন message এলে scroll position ধরে রাখা।

```jsx
getSnapshotBeforeUpdate(prevProps) {
  if (prevProps.list.length < this.props.list.length) {
    return this.listRef.current.scrollHeight;
  }
  return null;
}
componentDidUpdate(prevProps, prevState, snapshot) {
  if (snapshot !== null) {
    this.listRef.current.scrollTop += this.listRef.current.scrollHeight - snapshot;
  }
}
```

### `componentDidCatch` আর `getDerivedStateFromError` কী?
Error Boundary তৈরির দুটি method:

- `static getDerivedStateFromError(error)`: error এর পর state বদলে fallback UI দেখানোর জন্য (render phase)
- `componentDidCatch(error, info)`: error log করার জন্য (commit phase, side effect এখানে)

### Deprecated lifecycle method গুলো কী কী? কেন deprecate হলো?
`componentWillMount`, `componentWillReceiveProps`, `componentWillUpdate`। এখন `UNSAFE_` prefix ছাড়া এগুলো ব্যবহার করা হয় না।

কারণ: concurrent rendering এ render phase এর method বারবার call হতে পারে বা বাতিল হতে পারে। এগুলোতে side effect ও `setState` করলে বাগ ও leak হতো। বদলে `componentDidMount`, `componentDidUpdate`, `getDerivedStateFromProps` ব্যবহার করুন।

### Lifecycle method গুলোর hooks equivalent কী?
- `componentDidMount` → `useEffect(() => { ... }, [])`
- `componentDidUpdate` → `useEffect(() => { ... }, [dep])` (প্রথম render এও চলে)
- `componentWillUnmount` → `useEffect` এর cleanup function (return করা function)
- `shouldComponentUpdate` → `React.memo`
- `getDerivedStateFromProps` → render এর সময় হিসাব করা বা `key` দিয়ে reset
- `getSnapshotBeforeUpdate` ও `componentDidCatch`: সরাসরি hook নেই (`useLayoutEffect` কিছুটা কাছাকাছি, Error Boundary এখনও class)

### Parent আর child এ lifecycle এর ক্রম কেমন?
**Mount:**
Parent constructor → Parent render → Child constructor → Child render → Child `componentDidMount` → Parent `componentDidMount`

**Update (parent re-render):**
Parent render → Child render → Child `componentDidUpdate` → Parent `componentDidUpdate`

**Unmount:**
Parent `componentWillUnmount` → Child `componentWillUnmount`

মনে রাখার নিয়ম: render নিচের দিকে (parent থেকে child), কিন্তু `DidMount`/`DidUpdate` ভেতর থেকে বাইরে (child আগে)।

### Lifecycle diagram নিজে বুঝিয়ে বলো
```
Mounting:   constructor -> getDerivedStateFromProps -> render -> componentDidMount
Updating:   getDerivedStateFromProps -> shouldComponentUpdate -> render
            -> getSnapshotBeforeUpdate -> componentDidUpdate
Unmounting: componentWillUnmount
Error:      getDerivedStateFromError -> componentDidCatch
```

Render phase (pure, interrupt হতে পারে): constructor, `getDerivedStateFromProps`, `shouldComponentUpdate`, `render`।
Commit phase (DOM এ বসে, side effect এখানে): `componentDidMount`, `componentDidUpdate`, `componentWillUnmount`, `getSnapshotBeforeUpdate`।

## ৪. `this` ও Event Handling

### Class method এ `this` কেন `undefined` হয়?
Method কে callback হিসেবে (যেমন `onClick={this.handleClick}`) পাঠালে সেটা object থেকে আলাদা হয়ে যায়। তখন call হয় সাধারণ function হিসেবে, আর class এর ভেতরের code strict mode এ চলে, তাই `this` হয় `undefined`।

```jsx
class A extends React.Component {
  handleClick() {
    this.setState({}); // TypeError: Cannot read properties of undefined
  }
  render() { return <button onClick={this.handleClick}>x</button>; }
}
```

### `this` bind করার উপায়গুলো কী কী?
```jsx
// ১. constructor এ bind
constructor(props) {
  super(props);
  this.handleClick = this.handleClick.bind(this);
}

// ২. arrow function class property (সবচেয়ে প্রচলিত)
handleClick = () => { this.setState({ on: true }); };

// ৩. JSX এ inline arrow
<button onClick={() => this.handleClick()}>x</button>

// ৪. JSX এ bind (এড়িয়ে চলুন)
<button onClick={this.handleClick.bind(this)}>x</button>
```

### `render` এ arrow/bind করলে performance এ কী সমস্যা?
প্রতিটি render এ নতুন function তৈরি হয়। `PureComponent` বা `React.memo` child এ সেটা props হিসেবে গেলে প্রতিবার আলাদা reference ধরে child **অকারণে re-render** হয়। ছোট app এ সমস্যা বোঝা যায় না, তবে বড় list এ এড়িয়ে চলা ভালো।

### Constructor এ bind আর arrow class property এর মধ্যে কোনটা ভালো?
- Arrow class property: লেখা সহজ, পড়া সহজ, বেশি প্রচলিত। প্রতিটি instance এ আলাদা function কপি তৈরি হয়।
- Constructor bind: method prototype এ থাকে (মেমোরি কম), কিন্তু বেশি code।

দুটোর কোনোটিই ব্যবহারে সমস্যা নেই। Team এর convention অনুযায়ী বেছে নিন।

### Event handler এ parameter কীভাবে পাঠাবে?
```jsx
// arrow function দিয়ে
<button onClick={() => this.remove(item.id)}>Delete</button>

// event ও param একসাথে
<button onClick={(e) => this.remove(e, item.id)}>Delete</button>

// bind দিয়ে (event শেষ argument হয়ে আসে)
<button onClick={this.remove.bind(this, item.id)}>Delete</button>
```

### Synthetic event কী? `e.persist()` কী ছিল?
React এর cross-browser event wrapper। React 16 পর্যন্ত event object pool করে reuse করা হতো, তাই async code এ (যেমন `setTimeout` এর ভেতরে) `e` এর property `null` হয়ে যেত। সেটা ধরে রাখতে `e.persist()` লাগত। React 17 থেকে pooling তুলে দেওয়া হয়েছে, তাই আর লাগে না।

## ৫. Props, Refs ও Children

### `defaultProps` আর `propTypes` কী?
```jsx
class Button extends React.Component {
  static defaultProps = { size: "md" };
  static propTypes = {
    size: PropTypes.oneOf(["sm", "md", "lg"]),
    onClick: PropTypes.func.isRequired,
  };
}
```

- `defaultProps`: props না দিলে ডিফল্ট মান
- `propTypes`: development এ props এর type যাচাই করে warning দেয়

TypeScript থাকলে `propTypes` সাধারণত দরকার হয় না। Function component এ `defaultProps` React 19 এ বাদ, বদলে default parameter ব্যবহার হয়।

### Props বদলালে component কী করে?
Parent নতুন props পাঠালে component re-render হয়। এই সময় `getDerivedStateFromProps`, `shouldComponentUpdate`, `render`, `getSnapshotBeforeUpdate`, `componentDidUpdate` চলে। Props বদলানোর প্রতিক্রিয়ায় কিছু করতে চাইলে `componentDidUpdate` এ `prevProps` এর সাথে তুলনা করুন।

### Props কে state এ কপি করা anti-pattern কেন?
```jsx
// খারাপ
constructor(props) {
  super(props);
  this.state = { name: props.name }; // props বদলালে state বদলাবে না
}
```
Props পরে বদলালেও state পুরোনো মান ধরে রাখে (দুটোর sync থাকে না)। বিকল্প: props সরাসরি ব্যবহার করা, render এ হিসাব করা, অথবা `key` দিয়ে component reset করা।

### Ref কী? `createRef`, callback ref আর string ref এর পার্থক্য কী?
Ref দিয়ে সরাসরি DOM element বা child component instance এ access পাওয়া যায়।

```jsx
// createRef (প্রচলিত)
this.inputRef = React.createRef();
<input ref={this.inputRef} />;
this.inputRef.current.focus();

// callback ref
<input ref={(el) => (this.input = el)} />;

// string ref (deprecated, ব্যবহার করবেন না)
<input ref="myInput" />;
```

### DOM element এ focus কীভাবে দেবে?
```jsx
class Form extends React.Component {
  inputRef = React.createRef();
  componentDidMount() {
    this.inputRef.current.focus();
  }
  render() {
    return <input ref={this.inputRef} />;
  }
}
```

### Parent থেকে child component এর method কীভাবে call করবে?
Child class component এ `ref` দিলে সেই instance এর method call করা যায়।

```jsx
class Child extends React.Component {
  reset = () => this.setState({ value: "" });
  render() { /* ... */ }
}
class Parent extends React.Component {
  childRef = React.createRef();
  render() {
    return (
      <>
        <Child ref={this.childRef} />
        <button onClick={() => this.childRef.current.reset()}>Reset</button>
      </>
    );
  }
}
```

এটা ব্যতিক্রমী কাজে ব্যবহার করুন। সাধারণত props ও state দিয়ে করা ভালো।

### `children` prop আর `React.Children` utility কী?
`this.props.children` হলো tag এর ভেতরে লেখা content। `React.Children` এর `map`, `count`, `toArray`, `only` দিয়ে এটা নিরাপদে ঘোরানো যায় (কারণ `children` একটি element, array বা `undefined` হতে পারে)।

```jsx
render() {
  return <div>{React.Children.map(this.props.children, (c) => <li>{c}</li>)}</div>;
}
```

## ৬. Context ও Patterns (Class এ)

### Class component এ Context কীভাবে ব্যবহার করবে?
দুটি উপায়:

```jsx
// ১. static contextType (একটি context এর জন্য, this.context এ পাওয়া যায়)
class Btn extends React.Component {
  static contextType = ThemeContext;
  render() { return <button className={this.context}>x</button>; }
}

// ২. Consumer
<ThemeContext.Consumer>
  {(theme) => <button className={theme}>x</button>}
</ThemeContext.Consumer>
```

`static contextType` শুধু একটি context নিতে পারে।

### Class এ একাধিক context কীভাবে পাবে?
`Consumer` গুলো nest করতে হয়, অথবা wrapper function component দিয়ে hooks এর `useContext` ব্যবহার করে props হিসেবে পাঠানো যায়।

```jsx
<ThemeContext.Consumer>
  {(theme) => (
    <UserContext.Consumer>
      {(user) => <Page theme={theme} user={user} />}
    </UserContext.Consumer>
  )}
</ThemeContext.Consumer>
```

### Higher-Order Component (HOC) কী? Class এ কীভাবে ব্যবহার করে?
HOC হলো এমন function যা component নেয় এবং নতুন component return করে। Class component এ hooks চলে না, তাই hooks এর কাজও HOC দিয়ে করানো হতো।

```jsx
function withLoading(Component) {
  return class extends React.Component {
    render() {
      const { loading, ...rest } = this.props;
      return loading ? <p>Loading...</p> : <Component {...rest} />;
    }
  };
}
const UserListWithLoading = withLoading(UserList);
```

HOC এ `ref` পাস হয় না (`forwardRef` লাগে) এবং static method কপি করতে হয় (`hoist-non-react-statics`)।

### Render props pattern কী?
Component এর prop হিসেবে function পাঠানো, যা দিয়ে সে নিজের state/logic অন্যকে দেখায়।

```jsx
class Toggle extends React.Component {
  state = { on: false };
  toggle = () => this.setState((s) => ({ on: !s.on }));
  render() {
    return this.props.children({ on: this.state.on, toggle: this.toggle });
  }
}
<Toggle>{({ on, toggle }) => <button onClick={toggle}>{on ? "ON" : "OFF"}</button>}</Toggle>;
```

### HOC, render props আর hooks এর তুলনা করো
- HOC: wrapper component, props conflict ও "wrapper hell" হতে পারে
- Render props: নমনীয়, কিন্তু nesting বেড়ে যায় ("callback hell" এর মতো)
- Hooks: সবচেয়ে সহজ ও পরিষ্কার, কিন্তু শুধু function component এ

### Error Boundary কীভাবে বানায়? শুধু class দিয়ে কেন হয়?
কারণ `getDerivedStateFromError` ও `componentDidCatch` এর কোনো hook equivalent নেই।

```jsx
class ErrorBoundary extends React.Component {
  state = { hasError: false };

  static getDerivedStateFromError() {
    return { hasError: true };
  }
  componentDidCatch(error, info) {
    console.error(error, info.componentStack);
  }
  render() {
    if (this.state.hasError) return <h2>কিছু একটা ভুল হয়েছে।</h2>;
    return this.props.children;
  }
}
<ErrorBoundary><App /></ErrorBoundary>;
```

ধরে না: event handler, async code, SSR, boundary নিজের error।

### Portal class component এ কীভাবে ব্যবহার করে?
`ReactDOM.createPortal(child, container)` যেকোনো component এর `render` থেকে return করা যায়।

```jsx
import ReactDOM from "react-dom";

class Modal extends React.Component {
  render() {
    return ReactDOM.createPortal(
      <div className="modal">{this.props.children}</div>,
      document.body
    );
  }
}
```

## ৭. Performance

### `PureComponent` এর shallow comparison কীভাবে কাজ করে? কোথায় ভুল করে?
এটা props ও state এর প্রতিটি key কে `===` দিয়ে তুলনা করে। Primitive এর জন্য ঠিক, কিন্তু object/array এর ক্ষেত্রে শুধু **reference** দেখে। তাই state mutate করলে (reference একই থাকে) re-render হয় না।

### Class component এ অপ্রয়োজনীয় re-render কীভাবে বন্ধ করবে?
- `PureComponent` ব্যবহার
- `shouldComponentUpdate` নিজে লেখা
- State mutate না করে সবসময় নতুন object/array বানানো
- Render এ inline object/function props না পাঠানো
- State কে ছোট component এ নামিয়ে আনা

### `shouldComponentUpdate`, `PureComponent` আর `React.memo` এর তুলনা
- `shouldComponentUpdate`: হাতে লেখা logic, সবচেয়ে নমনীয়
- `PureComponent`: class এ automatic shallow compare
- `React.memo`: function component এর জন্য, শুধু props compare করে (state এর জন্য নয়, state বদলালে re-render হয়)

### Mutate করা state দিয়ে `PureComponent` এ কী হয়?
```jsx
this.state.items.push(4);
this.setState({ items: this.state.items });
```
Array এর reference একই থাকে, তাই `PureComponent` মনে করে কিছু বদলায়নি এবং re-render করে না। UI আপডেট হয় না।

ঠিক রূপ:
```jsx
this.setState((s) => ({ items: [...s.items, 4] }));
```

## ৮. Migration ও তুলনা

### Class থেকে hooks এ migrate করার কারণ কী?
- Logic reuse কঠিন ছিল (HOC/render props এর nesting)
- সম্পর্কিত logic ভাগ হয়ে যেত বিভিন্ন lifecycle এ (যেমন listener যোগ `componentDidMount` এ, সরানো `componentWillUnmount` এ)
- `this` নিয়ে ঝামেলা (bind)
- Code লম্বা ও boilerplate বেশি
- Compiler/optimization functional এ সহজ

### Hooks কেন এলো? Class এর কোন সমস্যা সমাধান করে?
Hooks এর মূল সমাধান: (১) wrapper hell ছাড়াই stateful logic reuse (custom hook), (২) এক জায়গার সম্পর্কিত logic একসাথে রাখা (`useEffect` এ setup ও cleanup পাশাপাশি), (৩) `this` এর জটিলতা দূর, (৪) ছোট ও সহজে বোঝা code।

### Class component কি এখনও React এ support করে?
হ্যাঁ। React টিমের তরফ থেকে class component সরানোর কোনো পরিকল্পনা নেই এবং পুরোনো code চলে। তবে নতুন feature (hooks, React Compiler এর সুবিধা) functional এর জন্য। Error Boundary এ এখনও class লাগে।

### একটি class component কে functional এ convert করে দেখাও
```jsx
// Class
class Counter extends React.Component {
  state = { count: 0 };
  componentDidMount() { document.title = `Count: ${this.state.count}`; }
  componentDidUpdate() { document.title = `Count: ${this.state.count}`; }
  inc = () => this.setState((s) => ({ count: s.count + 1 }));
  render() { return <button onClick={this.inc}>{this.state.count}</button>; }
}

// Functional
function Counter() {
  const [count, setCount] = useState(0);
  useEffect(() => { document.title = `Count: ${count}`; }, [count]);
  return <button onClick={() => setCount((c) => c + 1)}>{count}</button>;
}
```

### এক project এ class আর function component মেশানো যায়?
হ্যাঁ। দুই ধরনের component একে অপরকে render করতে পারে, props পাঠাতে পারে। শুধু নিয়ম: class এর ভেতরে hooks ব্যবহার করা যাবে না। Class এ hooks এর কাজ লাগলে wrapper function component বা HOC দিয়ে করুন।

## ৯. Output ও Bug খুঁজে বের করা

### Q1: Button এ click করলে কী হবে?
```jsx
class Counter extends React.Component {
  state = { count: 0 };
  handleClick() {
    this.setState({ count: this.state.count + 1 });
  }
  render() {
    return <button onClick={this.handleClick}>{this.state.count}</button>;
  }
}
```
উত্তর: click করলে `TypeError: Cannot read properties of undefined (reading 'setState')` আসে, কারণ `this` হারিয়ে গেছে। ঠিক করতে `handleClick = () => {...}` (arrow property) বা constructor এ bind করুন।

### Q2: Count কত হবে?
```jsx
handleClick = () => {
  this.setState({ count: this.state.count + 1 });
  this.setState({ count: this.state.count + 1 });
  this.setState({ count: this.state.count + 1 });
};
```
উত্তর: `1` (batching এ তিনবারই পুরোনো `this.state.count` পড়া হয়)। Function form ব্যবহার করলে (`prev => ({ count: prev.count + 1 })`) `3` হবে।

### Q3: Infinite loop কেন?
```jsx
componentDidUpdate() {
  this.setState({ value: Math.random() });
}
```
উত্তর: `setState` update ঘটায়, update এ আবার `componentDidUpdate` চলে, আবার `setState`, এভাবে অনন্ত loop। ঠিক করতে `prevProps/prevState` এর সাথে তুলনা করে condition দিন।

### Q4: Memory leak কেন?
```jsx
componentDidMount() {
  this.timer = setInterval(() => this.setState({ t: Date.now() }), 1000);
}
// componentWillUnmount নেই
```
উত্তর: Component সরে গেলেও interval চলতে থাকে এবং unmounted component এ `setState` করার চেষ্টা করে (React 17 এ warning)। ঠিক করতে `componentWillUnmount` এ `clearInterval(this.timer)`।

### Q5: Lifecycle এর output ক্রম কী?
```jsx
// Parent এর ভেতরে <Child /> আছে। দুটোতেই constructor, render, componentDidMount এ console.log আছে।
```
উত্তর (mount এ):

- Parent constructor
- Parent render
- Child constructor
- Child render
- Child componentDidMount
- Parent componentDidMount

### Q6: `PureComponent` এ UI আপডেট হচ্ছে না কেন?
```jsx
this.state.items.push(4);
this.setState({ items: this.state.items });
```
উত্তর: Array mutate করা হয়েছে, reference একই, তাই `PureComponent` এর shallow compare এ কোনো পরিবর্তন ধরা পড়ে না। নতুন array দিন: `this.setState({ items: [...this.state.items, 4] })`।

### Timer / stopwatch (cleanup সহ)
```jsx
class Stopwatch extends React.Component {
  state = { seconds: 0, running: false };

  componentWillUnmount() { clearInterval(this.timer); }

  start = () => {
    if (this.state.running) return;
    this.setState({ running: true });
    this.timer = setInterval(
      () => this.setState((s) => ({ seconds: s.seconds + 1 })),
      1000
    );
  };
  stop = () => {
    clearInterval(this.timer);
    this.setState({ running: false });
  };
  reset = () => {
    clearInterval(this.timer);
    this.setState({ seconds: 0, running: false });
  };

  render() {
    return (
      <div>
        <h2>{this.state.seconds}s</h2>
        <button onClick={this.start}>Start</button>
        <button onClick={this.stop}>Stop</button>
        <button onClick={this.reset}>Reset</button>
      </div>
    );
  }
}
```

### API থেকে data এনে list দেখানো (loading ও error সহ)
```jsx
class Users extends React.Component {
  state = { users: [], loading: true, error: null };

  componentDidMount() {
    this.controller = new AbortController();
    fetch("/api/users", { signal: this.controller.signal })
      .then((r) => {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then((users) => this.setState({ users, loading: false }))
      .catch((error) => {
        if (error.name !== "AbortError") this.setState({ error, loading: false });
      });
  }
  componentWillUnmount() { this.controller.abort(); }

  render() {
    const { users, loading, error } = this.state;
    if (loading) return <p>Loading...</p>;
    if (error) return <p>Error: {error.message}</p>;
    return <ul>{users.map((u) => <li key={u.id}>{u.name}</li>)}</ul>;
  }
}

### Debounced search input
```jsx
class Search extends React.Component {
  state = { query: "", results: [] };

  componentWillUnmount() { clearTimeout(this.timer); }

  handleChange = (e) => {
    const query = e.target.value;
    this.setState({ query });
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.search(query), 400);
  };

  search(q) {
    if (!q) return this.setState({ results: [] });
    fetch(`/api/search?q=${encodeURIComponent(q)}`)
      .then((r) => r.json())
      .then((results) => this.setState({ results }));
  }

  render() {
    return (
      <div>
        <input value={this.state.query} onChange={this.handleChange} />
        <ul>{this.state.results.map((r) => <li key={r.id}>{r.name}</li>)}</ul>
      </div>
    );
  }
}
```

### Error Boundary (fallback ও retry সহ)

class ErrorBoundary extends React.Component {
  state = { error: null };

  static getDerivedStateFromError(error) {
    return { error };
  }
  componentDidCatch(error, info) {
    console.error("Caught:", error, info.componentStack);
  }
  retry = () => this.setState({ error: null });

    if (this.state.error) {
      return (
        <div>
          <h3>কিছু ভুল হয়েছে</h3>
          <button onClick={this.retry}>আবার চেষ্টা করুন</button>
        </div>
      );
    }
    return this.props.children;
  }
}

## ১. Next.js Basics

### Next.js কী? React এর চেয়ে বাড়তি কী দেয়?
Next.js হলো React এর উপর তৈরি **full-stack framework** (Vercel তৈরি করেছে)। React শুধু UI library, আর Next.js দেয়:

- File-based **routing** (folder ও file দিয়ে route)
- **Rendering** এর ধরন বেছে নেওয়া (SSR, SSG, ISR, CSR)
- Built-in **optimization** (image, font, script, code splitting)
- **API/backend** (Route Handlers, Server Actions)
- Server Components, streaming, caching
- SEO এর জন্য metadata API
- TypeScript, CSS, env variable এর built-in সাপোর্ট

### Next.js কেন ব্যবহার করব? Plain React (CRA/Vite) এর সাথে পার্থক্য কী?
Plain React সাধারণত শুধু **client-side rendering**। প্রথমে প্রায় ফাঁকা HTML আসে, তারপর JS চলে UI বানায়। এতে SEO ও প্রথম load দুর্বল হতে পারে।

Next.js এ server এ HTML তৈরি হয়ে আসে, তাই:

- SEO ভালো (crawler পূর্ণ content পায়)
- প্রথম load দ্রুত (First Contentful Paint)
- Routing, API, optimization আলাদা library ছাড়াই পাওয়া যায়
- Page অনুযায়ী ভিন্ন rendering strategy বেছে নেওয়া যায়

প্রশ্ন: যেখানে SEO লাগে না (admin dashboard, ভেতরের tool) সেখানে Vite + React ই যথেষ্ট হতে পারে।

### Next.js এ App Router আর Pages Router এর মূল পার্থক্য কী?
- **Pages Router** (`pages/` ফোল্ডার): পুরোনো ও স্থিতিশীল পদ্ধতি। প্রতিটি file একটি page। Data আনতে `getStaticProps`/`getServerSideProps`। সব component default এ client এ hydrate হয়।
- **App Router** (`app/` ফোল্ডার, Next.js 13+): নতুন পদ্ধতি, React Server Components এর উপর। Nested layout, `loading.tsx`, `error.tsx`, streaming, Server Actions। Component default এ **Server Component**।

দুটো একই project এ একসাথে থাকতে পারে (ধাপে ধাপে migrate করার জন্য)। নতুন project এ App Router recommended।

### Next.js এ project structure কেমন? গুরুত্বপূর্ণ file ও folder গুলো কী কী?
```
app/                 (App Router)
  layout.tsx         root layout (html, body)
  page.tsx           / route
  loading.tsx  error.tsx  not-found.tsx
  blog/
    page.tsx         /blog
    [slug]/page.tsx  /blog/hello
  api/users/route.ts API endpoint
public/              static file (/logo.png)
next.config.js       config
middleware.ts        (বা নতুন version এ proxy.ts)
.env.local           environment variable
```

### Next.js কীভাবে চালায় ও build করে? `next dev`, `next build`, `next start`
- `next dev`: development server (hot reload)
- `next build`: production build, page গুলো pre-render করে ও optimize করে
- `next start`: build করা app এর production server চালায়

`next build` এর output এ প্রতিটি route static (○), dynamic (ƒ) ইত্যাদি চিহ্নিত দেখায়, যা rendering strategy বুঝতে কাজে লাগে।

### Next.js এ Turbopack কী?
Rust এ লেখা নতুন bundler, Webpack এর উত্তরসূরি হিসেবে তৈরি। Development এ অনেক দ্রুত build ও HMR (hot reload) দেয়। নতুন Next.js version এ এটি default হচ্ছে (version অনুযায়ী `--turbopack` flag লাগতে পারে)।

### `next/link` আর সাধারণ `<a>` ট্যাগের পার্থক্য কী?
`next/link` এর `<Link>` client-side navigation করে, পুরো page reload হয় না। এটি viewport এ আসা link এর page আগে থেকে **prefetch** করে (production এ), তাই navigation দ্রুত।

```tsx
import Link from "next/link";
<Link href="/blog/hello" prefetch={false}>Read</Link>
```

বাইরের site এর জন্য সাধারণ `<a>` চলে।

## ২. Rendering Strategies

### CSR, SSR, SSG, ISR কী? পার্থক্য কী?
- **CSR (Client-Side Rendering)**: browser এ JS চলে UI বানায়। প্রথমে ফাঁকা HTML। SEO দুর্বল, dashboard এ চলে।
- **SSR (Server-Side Rendering)**: **প্রতি request এ** server এ HTML তৈরি হয়। সবসময় নতুন data, কিন্তু প্রতিবার server এর কাজ লাগে।
- **SSG (Static Site Generation)**: **build এর সময়** HTML তৈরি, CDN থেকে পরিবেশন। সবচেয়ে দ্রুত। Blog/docs এর জন্য ভালো, কিন্তু data পুরোনো হতে পারে।
- **ISR (Incremental Static Regeneration)**: static page কিন্তু নির্দিষ্ট সময় পর (বা চাহিদা অনুযায়ী) background এ পুনরায় তৈরি হয়। SSG এর গতি আর কিছুটা তাজা data দুটোই।

### কোন page এর জন্য কোন strategy বেছে নেবে?
- Marketing/blog/docs (কম বদলায়): **SSG**
- Product list/news (মাঝে মাঝে বদলায়): **ISR**
- Personalized/ঘন ঘন বদলানো/request নির্ভর (cart, user feed): **SSR**
- Login এর পিছনের dashboard, SEO দরকার নেই: **CSR**
- একই page এ static shell ও dynamic অংশ: **PPR / Suspense streaming**

### ISR কীভাবে কাজ করে?
Page একবার তৈরি হয়ে cache হয়। `revalidate` সময় পার হলে পরের request পুরোনো (stale) page ই পায়, আর ওই request এ background এ নতুন page তৈরি হয়। পরের request নতুনটা পায় (**stale-while-revalidate**)। **On-demand revalidation** এ `revalidatePath`/`revalidateTag` দিয়ে সময়ের আগেই ঝেড়ে ফেলা যায়।

```tsx
// App Router
export const revalidate = 60; // প্রতি ৬০ সেকেন্ডে পুনরায় তৈরির সুযোগ
```

### PPR (Partial Prerendering) কী?
একই route এ **static shell** ও **dynamic অংশ** একসাথে। Static অংশ build এ তৈরি হয়ে CDN থেকে সাথে সাথে যায়, আর dynamic অংশ (`<Suspense>` এর ভেতরে) streaming এ পরে আসে। নতুন Next.js version এ এটি "Cache Components" মডেলের মাধ্যমে আসছে (version অনুযায়ী আলাদা, তাই docs দেখে নিন)।

### Hydration কী? Hydration mismatch error কেন হয়?
Server থেকে আসা static HTML কে browser এ React এর interactive অংশে পরিণত করার প্রক্রিয়া (event handler বসানো)।

**Mismatch** হয় যখন server এর HTML আর client এর প্রথম render আলাদা হয়। সাধারণ কারণ:

- `Date.now()`, `Math.random()`, সময়/locale নির্ভর মান render এ
- `window`/`localStorage` এর উপর নির্ভর করা (server এ নেই)
- অবৈধ HTML nesting (`<p>` এর ভেতরে `<div>`)
- Browser extension এর DOM বদলানো

সমাধান: browser-only মান `useEffect` এ বসানো, `suppressHydrationWarning` (সামান্য ক্ষেত্রে), client-only component কে `dynamic(..., { ssr: false })` দিয়ে লোড করা।

### Streaming আর Suspense Next.js এ কীভাবে কাজ করে?
সার্ভার পুরো page তৈরি হওয়ার অপেক্ষা না করে ধাপে ধাপে HTML browser এ পাঠায়। ধীর অংশকে `<Suspense fallback>` দিয়ে মুড়ে দিলে বাকি page আগে দেখা যায় এবং ধীর অংশ তৈরি হলে পরে জুড়ে যায়। App Router এ `loading.tsx` আসলে একটি automatic Suspense boundary।

```tsx
<Suspense fallback={<Skeleton />}>
  <SlowComments />
</Suspense>
```

## ৩. App Router

### App Router এ বিশেষ file গুলো কী কী?
- `page.tsx`: route এর UI, route কে publicly accessible করে
- `layout.tsx`: shared UI যা navigate করলেও re-render হয় না (state ধরে রাখে)
- `template.tsx`: layout এর মতো কিন্তু প্রতি navigation এ নতুন করে mount হয়
- `loading.tsx`: loading UI (automatic Suspense)
- `error.tsx`: error boundary UI (অবশ্যই Client Component)
- `not-found.tsx`: 404 UI (`notFound()` call করলে)
- `route.ts`: API endpoint (Route Handler)
- `global-error.tsx`: root layout এর error ধরে
- `default.tsx`: parallel route এর fallback

### Layout আর template এর পার্থক্য কী?
- **Layout**: route পরিবর্তনেও **state ও DOM ধরে রাখে**, re-render হয় না। Navbar/sidebar এর জন্য।
- **Template**: প্রতি navigation এ নতুন instance বানায় (state reset, effect আবার চলে)। Page enter animation বা প্রতি page এ log করার মতো কাজে।

### Nested layout কীভাবে কাজ করে? Root layout এ কী থাকতে হয়?
Folder এর গভীরে গেলে layout গুলো একটির ভেতর আরেকটি জড়ানো (nested) থাকে। Root layout (`app/layout.tsx`) বাধ্যতামূলক এবং এতে `<html>` ও `<body>` থাকতে হবে।

```tsx
export default function RootLayout({ children }: { children: React.ReactNode }) {
  return (
    <html lang="bn">
      <body>
        <Navbar />
        {children}
      </body>
    </html>
  );
}
```

### Dynamic route, catch-all আর optional catch-all কী?
- `[id]` → `app/blog/[id]/page.tsx` → `/blog/10`
- `[...slug]` → catch-all → `/docs/a/b/c` (কমপক্ষে একটি segment লাগে)
- `[[...slug]]` → optional catch-all → `/docs` ও `/docs/a/b` দুটোই মেলে

```tsx
// Next.js 15+ এ params একটি Promise
export default async function Page({ params }: { params: Promise<{ id: string }> }) {
  const { id } = await params;
  return <h1>Post {id}</h1>;
}
```

### Route groups আর private folder কী?
- **Route group** `(marketing)`: folder এর নাম URL এ আসে না। Route কে সংগঠিত করতে এবং আলাদা layout দিতে কাজে লাগে।
- **Private folder** `_components`: `_` দিয়ে শুরু folder routing থেকে বাদ যায়। Helper file রাখার জন্য।

```
app/
  (shop)/layout.tsx     shop এর layout
  (shop)/cart/page.tsx  -> /cart
  (auth)/login/page.tsx -> /login
```

### Parallel routes আর intercepting routes কী?
- **Parallel routes** (`@slot`): একই layout এ একসাথে একাধিক page আলাদাভাবে render করা (dashboard এর পাশাপাশি panel)। Layout এ `props` হিসেবে slot আসে।
- **Intercepting routes** (`(.)`, `(..)`, `(...)`): অন্য route এর UI নিজের context এর ভেতরে "ছিনিয়ে" দেখানো। যেমন feed এ ছবিতে click করলে modal এ photo খোলা, কিন্তু URL share করলে/reload করলে পূর্ণ page।

### `generateStaticParams` কী?
Dynamic route এর কোন কোন path **build এর সময় আগে থেকে** তৈরি (SSG) হবে সেটা বলে দেয়। Pages Router এর `getStaticPaths` এর সমতুল্য।

```tsx
export async function generateStaticParams() {
  const posts = await getPosts();
  return posts.map((p) => ({ slug: p.slug }));
}
export const dynamicParams = true; // তালিকার বাইরের path চাহিদা অনুযায়ী তৈরি হবে
```

### `useRouter`, `usePathname`, `useSearchParams` কোথা থেকে import হয়? Pages Router এর `next/router` থেকে পার্থক্য কী?
App Router এ `next/navigation` থেকে (Client Component এ):

```tsx
"use client";
import { useRouter, usePathname, useSearchParams } from "next/navigation";

const router = useRouter();       // push, replace, back, refresh, prefetch
const pathname = usePathname();   // "/blog"
const params = useSearchParams(); // ?q=abc
```

Pages Router এ `next/router` এর `useRouter` ছিল, যেখানে `router.query`, `router.pathname` সব একসাথে পাওয়া যেত। App Router এর `useRouter` এ `query`/`pathname` নেই।

### Server এ redirect ও 404 কীভাবে করবে?
`next/navigation` এর `redirect()` ও `notFound()`। দুটো error throw করে কাজ করে, তাই `try/catch` এর ভেতরে ডাকলে সাবধান।

```tsx
import { redirect, notFound } from "next/navigation";

const post = await getPost(slug);
if (!post) notFound();
if (!session) redirect("/login");
```

### `loading.tsx` আর `error.tsx` কীভাবে কাজ করে? `error.tsx` কেন Client Component হতে হয়?
- `loading.tsx` সেই segment কে স্বয়ংক্রিয়ভাবে `<Suspense>` এ মুড়ে দেয়। Data আসার আগে সাথে সাথে loading UI দেখায়।
- `error.tsx` সেই segment কে error boundary তে মুড়ে দেয়। এতে `error` ও `reset` props থাকে।

`error.tsx` Client Component হতে হয় কারণ error boundary ও retry (`reset`) interactivity ও state এর উপর নির্ভর করে, যা শুধু client এ সম্ভব।

```tsx
"use client";
export default function Error({ error, reset }: { error: Error; reset: () => void }) {
  return <button onClick={reset}>আবার চেষ্টা করুন</button>;
}
```

### `metadata` আর `generateMetadata` কী?
SEO এর জন্য page এর `<title>`, description, Open Graph তৈরির API।

```tsx
// static
export const metadata = { title: "Blog", description: "..." };

// dynamic (data নির্ভর)
export async function generateMetadata({ params }: { params: Promise<{ slug: string }> }) {
  const { slug } = await params;
  const post = await getPost(slug);
  return { title: post.title, openGraph: { images: [post.cover] } };
}
```

## ৪. Server Components, Client Components ও Server Actions

### Server Component আর Client Component কী? পার্থক্য কী?
App Router এ সব component **default এ Server Component**।

- **Server Component**: শুধু server এ চলে। JS browser এ যায় না (bundle ছোট)। সরাসরি database/ফাইল/secret ব্যবহার করা যায়। `async/await` চলে। কিন্তু hooks (`useState`, `useEffect`), event handler (`onClick`), browser API নেই।
- **Client Component** (`"use client"`): browser এ hydrate হয়। State, effect, event, browser API ব্যবহার করে।

### `"use client"` কী করে? কোথায় বসাবে?
ফাইলের একদম উপরে লিখলে সেই file ও তার import করা সব কিছু client bundle এর অংশ হয়ে যায় (client boundary)। তাই boundary যতটা সম্ভব **নিচের দিকে (ছোট component এ)** রাখুন, যাতে বাকি tree server এ থাকে।

```tsx
// LikeButton.tsx
"use client";
import { useState } from "react";
export default function LikeButton() {
  const [n, setN] = useState(0);
  return <button onClick={() => setN(n + 1)}>{n}</button>;
}
```

### Server Component কে Client Component এর ভেতরে রাখা যায়? উল্টোটা?
- Server Component এর ভেতরে Client Component: **হ্যাঁ**, স্বাভাবিক।
- Client Component এর ভেতরে Server Component **সরাসরি import** করা যায় না (import করলে সেটা client এ গিয়ে client component হয়ে যায়)। তবে `children` বা props হিসেবে পাঠানো যায়:

```tsx
// Server Component
<ClientModal>
  <ServerContent />   {/* children হিসেবে পাঠানো, server এই থাকে */}
</ClientModal>
```

### Server থেকে Client Component এ props পাঠানোর নিয়ম কী?
Props অবশ্যই **serializable** হতে হবে: string, number, boolean, array, plain object, Date, Map/Set, Promise (React 19)। Function (Server Action ছাড়া), class instance, Symbol পাঠানো যায় না।

### Server Component এ data কীভাবে আনে?
Component কে `async` বানিয়ে সরাসরি `await` করা যায়। `useEffect` ও আলাদা API লাগে না।

```tsx
export default async function Users() {
  const users = await db.user.findMany(); // সরাসরি DB
  return <ul>{users.map((u) => <li key={u.id}>{u.name}</li>)}</ul>;
}
```

### Server Actions কী?
Server এ চলা async function যা form বা client থেকে সরাসরি ডাকা যায়, আলাদা API route না লিখেই। `"use server"` দিয়ে চিহ্নিত।

```tsx
// actions.ts
"use server";
import { revalidatePath } from "next/cache";

export async function addTodo(formData: FormData) {
  const title = formData.get("title") as string;
  await db.todo.create({ data: { title } });
  revalidatePath("/todos");
}

// page
<form action={addTodo}>
  <input name="title" />
  <button>Add</button>
</form>
```

### Server Actions এ security কীভাবে নিশ্চিত করবে?
Server Action আসলে একটি **public HTTP endpoint**। তাই:

- ভেতরে সবসময় authentication ও authorization যাচাই করুন
- Input validate করুন (`zod`) এবং কখনো client এর কথায় বিশ্বাস করবেন না
- সংবেদনশীল data ফেরত পাঠাবেন না
- CSRF সুরক্ষা built-in (Origin যাচাই), তবু সতর্ক থাকুন

### `useActionState` আর `useFormStatus` কী?
- `useActionState`: Server Action এর ফলাফল (error বার্তা, state) form এ দেখানোর hook
- `useFormStatus`: form এর ভেতরের child component থেকে submit চলছে কিনা (`pending`) জানার hook, যেমন button disable করতে

### `server-only` ও `client-only` package কী?
`import "server-only"` দিলে সেই module ভুল করে client component এ import হলে build error আসে। Secret/DB code কে client bundle এ যাওয়া থেকে বাঁচায়।

## ৫. Data Fetching ও Caching

### App Router এ data fetching এর উপায়গুলো কী?
- **Server Component এ `fetch`/database সরাসরি** (সবচেয়ে প্রচলিত ও প্রস্তাবিত)
- **Client Component এ** React Query/SWR বা `use` hook
- **Server Actions** (mutation এর জন্য)
- **Route Handlers** (বাইরের client এর জন্য API)

### Pages Router এ `getStaticProps`, `getServerSideProps`, `getStaticPaths` কী?
- `getStaticProps`: build এর সময় চলে, data দিয়ে page তৈরি (SSG)। `revalidate` দিলে ISR।
- `getServerSideProps`: **প্রতি request এ** server এ চলে (SSR)।
- `getStaticPaths`: dynamic route এর কোন path গুলো build এ তৈরি হবে। `fallback: false | true | "blocking"` দিয়ে বাকিগুলোর আচরণ ঠিক হয়।
- `getInitialProps`: পুরোনো, দুই দিকেই চলে, এখন এড়িয়ে চলা হয়।

```tsx
// pages/blog/[id].tsx
export async function getStaticProps({ params }) {
  const post = await getPost(params.id);
  return { props: { post }, revalidate: 60 };
}
export async function getStaticPaths() {
  return { paths: [{ params: { id: "1" } }], fallback: "blocking" };
}
```

### Pages Router এর data fetching আর App Router এর পার্থক্য কী?
Pages Router এ page level এ আলাদা বিশেষ function (`getStaticProps` ইত্যাদি) এবং data props এ আসে। App Router এ এগুলো নেই। যেকোনো Server Component এই `async` function দিয়ে data আনা যায় এবং caching ও rendering strategy `fetch` এর option ও route segment config দিয়ে ঠিক হয়।

### `fetch` এর caching option গুলো কী কী?
```tsx
await fetch(url, { cache: "force-cache" });          // cache করে রাখো
await fetch(url, { cache: "no-store" });             // কখনো cache নয় (SSR এর মতো)
await fetch(url, { next: { revalidate: 60 } });      // ৬০ সেকেন্ড পর পুনরায় (ISR)
await fetch(url, { next: { tags: ["posts"] } });     // tag দিয়ে on-demand ঝাড়ার জন্য
```

গুরুত্বপূর্ণ: Next.js 14 এ `fetch` default এ cache হতো। **Next.js 15 থেকে default বদলে গেছে**, এখন default এ cache হয় না (আপনাকে `force-cache` দিতে হয়)। Version অনুযায়ী আচরণ আলাদা, তাই project এর version দেখে নিন।

### Next.js এ caching এর স্তর গুলো কী কী? (App Router)
চারটি স্তর (বিশেষত Next.js 14 এর মডেল):

- **Request Memoization**: একই render এর ভেতরে একই `fetch` একবারই হয় (React এর কাজ)
- **Data Cache**: `fetch` এর ফল server এ স্থায়ীভাবে cache (request এর মধ্যেও টিকে থাকে)
- **Full Route Cache**: static route এর পুরো HTML ও RSC payload build এ cache
- **Router Cache**: client এ visited/prefetch করা route এর RSC payload memory তে cache

Version 15 ও 16 এ এই মডেল সহজ করা হয়েছে (বিশেষত default caching কমানো ও "use cache" এর দিকে যাওয়া), তাই docs মিলিয়ে নিন।

### `revalidatePath` আর `revalidateTag` কী? কখন ব্যবহার করে?
Mutation (create/update/delete) এর পর পুরোনো cache ঝেড়ে ফেলতে। Server Action বা Route Handler এ ব্যবহার করুন।

```tsx
import { revalidatePath, revalidateTag } from "next/cache";

revalidatePath("/blog");           // নির্দিষ্ট path
revalidatePath("/blog/[slug]", "page");
revalidateTag("posts");            // tag ওয়ালা সব fetch
```

### কোন কোন কারণে একটি route dynamic (SSR) হয়ে যায়?
- `cookies()`, `headers()`, `searchParams` ব্যবহার করলে
- `fetch` এ `cache: "no-store"` দিলে
- `export const dynamic = "force-dynamic"` দিলে
- Route Handler এ request object ব্যবহার করলে

এগুলো request এর উপর নির্ভর করে বলে build এ আগে থেকে তৈরি করা যায় না।

### `unstable_cache` ও `"use cache"` কী?
Database query বা যেকোনো function এর ফল cache করার উপায়, যেখানে `fetch` ব্যবহার হয় না। পুরোনো পদ্ধতি `unstable_cache`। নতুন Next.js version এ `"use cache"` directive এর মাধ্যমে function/component কে cache করার সহজ উপায় আসছে (Cache Components)। Version অনুযায়ী পরিবর্তনশীল, তাই docs দেখে নিন।

### Parallel ও sequential data fetching কীভাবে করবে?
```tsx
// sequential (waterfall, ধীর)
const user = await getUser();
const posts = await getPosts(user.id);

// parallel (দ্রুত)
const [user2, posts2] = await Promise.all([getUser(), getPosts()]);
```

একটার ফল অন্যটির input হলে sequential লাগবে। স্বাধীন হলে `Promise.all`। অথবা component ভাগ করে `<Suspense>` দিলে প্রতিটি স্বাধীনভাবে stream হয়।

## ৬. Routing, Middleware ও API

### Pages Router এ routing কীভাবে কাজ করে?
`pages/` ফোল্ডারের file ই route। `pages/about.tsx` → `/about`, `pages/index.tsx` → `/`, `pages/blog/[id].tsx` → `/blog/10`, `pages/api/users.ts` → API route। বিশেষ file: `_app.tsx` (সব page এর wrapper), `_document.tsx` (HTML structure), `404.tsx`, `500.tsx`।

### Pages Router এ `_app.tsx` আর `_document.tsx` এর কাজ কী?
- `_app.tsx`: প্রতিটি page কে wrap করে। Global layout, global CSS, Context/Redux Provider এখানে।
- `_document.tsx`: server এ একবার চলে, `<html>`, `<head>`, `<body>` কাস্টমাইজ করে (font, lang attribute)। এখানে event handler বা browser-code চলে না।

### Pages Router এ layout কীভাবে করে?
`_app.tsx` এ সবার জন্য, অথবা per-page layout pattern:

```tsx
// page এ
Page.getLayout = (page) => <DashboardLayout>{page}</DashboardLayout>;

// _app.tsx
const getLayout = Component.getLayout ?? ((p) => p);
return getLayout(<Component {...pageProps} />);
```

App Router এ nested `layout.tsx` দিয়ে এটা অনেক সহজ।

### Middleware কী? কী কাজে ব্যবহার হয়?
Request শেষ হওয়ার আগে (route এ পৌঁছানোর আগে) চলা code। কাজ: authentication check, redirect/rewrite, i18n (ভাষা অনুযায়ী route), A/B test, header বসানো, bot আটকানো।

```ts
// middleware.ts (root এ)
import { NextResponse } from "next/server";
import type { NextRequest } from "next/server";

export function middleware(req: NextRequest) {
  const token = req.cookies.get("token");
  if (!token) return NextResponse.redirect(new URL("/login", req.url));
  return NextResponse.next();
}
export const config = { matcher: ["/dashboard/:path*"] };
```

নতুন Next.js version এ `middleware` এর নাম `proxy` করা হচ্ছে (`proxy.ts`), আপনার version এর docs দেখে নিন। Middleware এ ভারী কাজ ও পূর্ণ Node API (Edge runtime এ সীমিত) এড়ান।

### Route Handlers (App Router) কী? Pages Router এর API Routes থেকে পার্থক্য কী?
App Router এ `app/api/users/route.ts` এ HTTP method অনুযায়ী function export করে API বানানো হয় (Web `Request`/`Response` API ভিত্তিক)।

```ts
import { NextResponse } from "next/server";

export async function GET() {
  return NextResponse.json({ users: [] });
}
export async function POST(req: Request) {
  const body = await req.json();
  return NextResponse.json(body, { status: 201 });
}
```

Pages Router এ `pages/api/users.ts` এ একটি `handler(req, res)` function থাকত, যেখানে `req.method` দিয়ে ভাগ করতে হতো (Express এর মতো)।

### কখন Route Handler আর কখন Server Action ব্যবহার করবে?
- **Server Action**: নিজের app এর form/mutation, কম boilerplate
- **Route Handler**: বাইরের client (mobile app, webhook, তৃতীয় পক্ষ) ডাকবে, REST API দরকার, ফাইল stream/স্ট্রিমিং response

### Redirects, rewrites আর headers `next.config.js` এ কীভাবে করে?
```js
module.exports = {
  async redirects() {
    return [{ source: "/old", destination: "/new", permanent: true }];
  },
  async rewrites() {
    return [{ source: "/api/:path*", destination: "https://api.example.com/:path*" }];
  },
  async headers() {
    return [{ source: "/(.*)", headers: [{ key: "X-Frame-Options", value: "DENY" }] }];
  },
};
```

- Redirect: URL বদলে যায় (browser এ নতুন URL)
- Rewrite: URL একই থাকে কিন্তু ভেতরে অন্য জায়গা থেকে content আসে (proxy, CORS এড়াতে কাজে লাগে)

### Internationalization (i18n) কীভাবে করবে?
Pages Router এ built-in `i18n` config ছিল। App Router এ built-in নেই, সাধারণত `[locale]` dynamic segment ও middleware দিয়ে ভাষা শনাক্ত করে `next-intl` বা `next-i18next` এর মতো library ব্যবহার হয়।

## ৭. Performance ও Optimization

### `next/image` কী? কেন ব্যবহার করব?
সাধারণ `<img>` এর উন্নত রূপ। ফলাফল:

- স্বয়ংক্রিয়ভাবে সঠিক আকার ও আধুনিক format (WebP/AVIF) এ রূপান্তর
- **Lazy loading** (default)
- Layout shift (CLS) আটকায় (`width/height` বা `fill` দিলে)
- `priority` দিয়ে above-the-fold ছবি (LCP) আগে load

```tsx
import Image from "next/image";
<Image src="/hero.jpg" alt="Hero" width={800} height={400} priority />
```

বাইরের URL এর ছবি আনতে `next.config.js` এ `images.remotePatterns` এ domain অনুমোদন দিতে হয়।

### `next/font` কী? কী সুবিধা?
Font self-host করে build এর সময় download করে, তাই runtime এ বাইরের request নেই, privacy ভালো এবং layout shift কমে।

```tsx
import { Inter } from "next/font/google";
const inter = Inter({ subsets: ["latin"] });
<body className={inter.className}>
```

### `next/script` কী? `strategy` গুলো কী?
তৃতীয় পক্ষের script (analytics, chat widget) নিয়ন্ত্রিতভাবে load করার component।

- `beforeInteractive`: page interactive হওয়ার আগে
- `afterInteractive` (default): page interactive হওয়ার পর
- `lazyOnload`: browser idle থাকলে পরে
- `worker`: web worker এ (পরীক্ষামূলক)

### `next/dynamic` কী? কখন লাগে?
Component কে lazy load (code splitting) করে। বড় বা শুরুতে দরকার নেই এমন component এর জন্য। `ssr: false` দিয়ে শুধু client এ লোড করা যায় (`window` নির্ভর library এর জন্য)।

```tsx
import dynamic from "next/dynamic";
const Chart = dynamic(() => import("./Chart"), { ssr: false, loading: () => <p>Loading...</p> });
```

`ssr: false` শুধু Client Component এ চলে।

### Next.js এ app এর performance কীভাবে বাড়াবে?
- যতটা সম্ভব Server Component, `"use client"` ছোট রাখা
- `next/image`, `next/font`
- Static/ISR ব্যবহার, CDN
- `dynamic` import, বড় library এড়ানো, bundle analyzer (`@next/bundle-analyzer`)
- Suspense ও streaming
- Data parallel fetch ও waterfall এড়ানো
- তৃতীয় পক্ষের script `next/script` দিয়ে
- Core Web Vitals (LCP, CLS, INP) মাপা

### Core Web Vitals কী? Next.js কীভাবে সাহায্য করে?
Google এর user experience মাপার মেট্রিক: **LCP** (সবচেয়ে বড় content কখন দেখা গেল), **INP** (interaction এর সাড়া), **CLS** (layout লাফানো)। Next.js এ `next/image`, `next/font`, SSR/SSG, streaming এগুলো উন্নত করে। `useReportWebVitals` দিয়ে মাপা যায়।

## ৮. Authentication, SEO, Environment ও Deployment

### Next.js এ authentication কীভাবে করবে?
- Library: **Auth.js (NextAuth)**, Clerk, Better Auth, Lucia ইত্যাদি
- Session cookie (`HttpOnly`, `Secure`, `SameSite`) বা JWT
- Route সুরক্ষা: middleware এ দ্রুত check, কিন্তু **আসল authorization data এর কাছেই** (Server Component, Server Action, Route Handler এর ভেতরে) করুন
- Middleware এর উপরেই সম্পূর্ণ নির্ভর করবেন না, কারণ এটা একমাত্র সুরক্ষা স্তর হওয়া উচিত নয়

### JWT আর session এর পার্থক্য কী? Next.js এ কোনটা?
- **Session (server-side)**: session id cookie তে, data server/database এ। সহজে বাতিল করা যায়।
- **JWT**: data token এর ভেতরেই, server এ কিছু রাখতে হয় না। বাতিল করা কঠিন, token এ বেশি data রাখা উচিত নয়।

Token কে `localStorage` এ না রেখে `HttpOnly` cookie তে রাখা নিরাপদ (XSS থেকে সুরক্ষা)।

### Environment variable কীভাবে কাজ করে? `NEXT_PUBLIC_` কী?
`.env.local` এ রাখা হয়। শুধু `NEXT_PUBLIC_` দিয়ে শুরু variable **browser bundle এ যায়** এবং সবাই দেখতে পারে। বাকিগুলো শুধু server এ থাকে। তাই secret (DB password, API key) কখনো `NEXT_PUBLIC_` দিয়ে শুরু করবেন না। `NEXT_PUBLIC_` এর মান **build এর সময় inline** হয়, তাই পরে বদলাতে rebuild লাগে।

### SEO এর জন্য Next.js এ কী কী করবে?
- `metadata`/`generateMetadata` (title, description, canonical, Open Graph, Twitter card)
- Server rendering/SSG (crawler পূর্ণ content পায়)
- `sitemap.ts` ও `robots.ts`
- Semantic HTML, heading ক্রম
- `next/image` এ `alt`, দ্রুত load (Core Web Vitals)
- Structured data (JSON-LD)

### Edge runtime আর Node.js runtime এর পার্থক্য কী?
- **Node.js runtime** (default): পূর্ণ Node API, সব npm package।
- **Edge runtime**: হালকা, ব্যবহারকারীর কাছের জায়গা থেকে চলে (কম latency, দ্রুত cold start), কিন্তু Node API সীমিত (`fs`, কিছু package চলে না)।

```ts
export const runtime = "edge"; // বা "nodejs"
```

### Next.js app কোথায় ও কীভাবে deploy করা যায়?
- **Vercel** (সবচেয়ে সহজ, Next.js এর নির্মাতা)
- **Self-host**: `next build` ও `next start` (Node server), বা **Docker** (`output: "standalone"`)
- অন্যান্য: Netlify, AWS (Amplify/ECS), Cloudflare, Railway, VPS

Static site চাইলে `output: "export"` দিয়ে শুধু static file বানানো যায় (তখন server feature যেমন SSR, Server Action কাজ করে না)।

### `next.config.js` এ কী কী কনফিগার হয়?
`images` (domain), `redirects/rewrites/headers`, `env`, `output` (standalone/export), `experimental` feature, `reactStrictMode`, `basePath`, `i18n` (Pages Router), webpack/turbopack customization।

## ৯. State Management ও React এর সাথে সম্পর্ক

### App Router এ Context, Redux, Zustand কীভাবে ব্যবহার করবে?
Context/Redux/Zustand সব **Client Component** এ চলে (hooks ব্যবহার করে)। তাই:

- `Providers.tsx` নামে একটি `"use client"` component বানান
- Root layout (Server Component) এ `children` কে সেটা দিয়ে মুড়ে দিন

```tsx
// providers.tsx
"use client";
export function Providers({ children }: { children: React.ReactNode }) {
  return <ThemeProvider><Provider store={store}>{children}</Provider></ThemeProvider>;
}

// layout.tsx (Server Component)
<body><Providers>{children}</Providers></body>
```

Provider কে যতটা সম্ভব ছোট রাখুন, যাতে `children` (Server Component) server এই থাকে।

### Server এ global store (Redux/Zustand) ব্যবহারে কী সমস্যা?
Server এ module-level একটি global store থাকলে **একাধিক user এর request এ state মিশে যেতে পারে** (cross-request state pollution), কারণ সার্ভার process অনেক request একসাথে সামলায়। সমাধান: প্রতি request এ (বা প্রতি client provider এ) নতুন store instance বানানো। Redux Toolkit এ `makeStore` function ও `useRef` দিয়ে একবার তৈরি।

### Server state আর client state আলাদা করে ভাববে কেন?
App Router এ Server Component এই data আনা যায়, তাই অনেক data আর client state এ রাখা লাগে না। Client state শুধু UI interaction (modal, form, filter) এর জন্য। Client এ সরাসরি live data/cache লাগলে React Query ব্যবহার করুন।

### URL কে state হিসেবে ব্যবহার (search params) কেন ভালো?
Filter, sort, page, search এর মতো state URL এ (`?page=2&q=abc`) রাখলে সেটা share করা যায়, reload এ থাকে, back button কাজ করে, এবং Server Component সরাসরি `searchParams` পড়ে data আনতে পারে। State library লাগে না।

## ১০. Tricky ও তুলনামূলক প্রশ্ন

### Next.js এ `useEffect` দিয়ে fetch করা কি ভালো? কখন করবে?
Server Component এ সরাসরি `await fetch` সাধারণত ভালো (SEO, কম JS, waterfall কম)। Client এ `useEffect` বা React Query লাগে যখন: data শুধু user interaction এর পর দরকার, ঘন ঘন polling/refetch, user-specific live data, SEO দরকার নেই।

### SSR আর SSG এর মধ্যে performance ও SEO তুলনা করো
- **SSG**: সবচেয়ে দ্রুত (CDN থেকে ready HTML), SEO ভালো, কিন্তু data পুরোনো হতে পারে ও build সময় বাড়ে
- **SSR**: সবসময় নতুন data, SEO ভালো, কিন্তু প্রতি request এ server কাজ ও TTFB তুলনামূলক বেশি

### App Router এ কি `window`/`localStorage` সরাসরি ব্যবহার করা যায়?
Server Component এ না, কারণ server এ `window` নেই। Client Component এও render এর সময় নয়, কারণ প্রথম render server এও হয়। `useEffect` এর ভেতরে বা event handler এ ব্যবহার করুন, অথবা `typeof window !== "undefined"` guard দিন, অথবা `dynamic(..., { ssr: false })`।

### Pages Router থেকে App Router এ migrate কীভাবে করবে?
ধাপে ধাপে, কারণ দুটো একসাথে চলে:

- `app/` ফোল্ডার যোগ করে একটি একটি route সরান
- `_app`/`_document` এর বদলে root `layout.tsx`
- `getStaticProps`/`getServerSideProps` এর বদলে Server Component এ `fetch` ও caching option
- `next/router` এর বদলে `next/navigation`
- `pages/api` এর বদলে Route Handler
- `Head` এর বদলে `metadata`
- Interactive অংশে `"use client"` দিন

### Next.js কেন কখনো কখনো ভুল সিদ্ধান্ত হতে পারে?
- ছোট client-only app/internal tool এ Vite যথেষ্ট, Next.js অতিরিক্ত জটিলতা আনে
- App Router এর caching ও Server/Client boundary শিখতে সময় লাগে
- Vercel এর বাইরে কিছু feature (ISR, image optimization, middleware) নিজে সেটআপ করতে হয়
- Version এর মধ্যে বড় আচরণ বদল আসে (যেমন caching default), তাই upgrade সতর্কভাবে

## ১১. Output ও Bug খুঁজে বের করা

### Q1: এই code এ error কেন?
```tsx
// app/page.tsx (কোনো "use client" নেই)
import { useState } from "react";
export default function Page() {
  const [n, setN] = useState(0);
  return <button onClick={() => setN(n + 1)}>{n}</button>;
}
```
উত্তর: Server Component এ hook (`useState`) ও event handler (`onClick`) ব্যবহার করা যায় না। ফাইলের শুরুতে `"use client"` দিন বা interactive অংশ আলাদা Client Component এ সরান।

### Q2: Hydration error কেন?
```tsx
export default function Time() {
  return <p>{new Date().toLocaleTimeString()}</p>;
}
```
উত্তর: Server ও client এ ভিন্ন সময়ে render হওয়ায় text আলাদা হয়ে যায়, ফলে hydration mismatch। সমাধান: `useEffect` এ সময় set করা (প্রথম render এ খালি/স্থির মান), বা `suppressHydrationWarning`।

### Q3: Page কেন প্রতিবার dynamic হয়ে যাচ্ছে, static হচ্ছে না?
```tsx
import { cookies } from "next/headers";
export default async function Page() {
  const c = await cookies();
  // ...
}
```
উত্তর: `cookies()` request এর উপর নির্ভর করে, তাই route টি dynamic (SSR) হয়ে যায়। Static রাখতে চাইলে cookie ব্যবহার করা অংশ আলাদা component এ নিয়ে `<Suspense>` এ মুড়ে দিন (PPR/streaming), বা cookie নির্ভরতা সরান।

### Q4: Mutation এর পরেও UI পুরোনো data দেখাচ্ছে কেন?
```tsx
"use server";
export async function addPost(data: FormData) {
  await db.post.create({ data: { title: data.get("title") as string } });
  // কিছু ঝাড়া হয়নি
}
```
উত্তর: Cache ঝাড়া হয়নি। `revalidatePath("/posts")` বা `revalidateTag("posts")` call করুন, অথবা `redirect()` ব্যবহার করুন।

## ১২. Live Coding

### Dynamic blog route ও `generateStaticParams`/`generateMetadata` সহ
```tsx
// app/blog/[slug]/page.tsx
import { notFound } from "next/navigation";

type Props = { params: Promise<{ slug: string }> };

export async function generateStaticParams() {
  const posts = await fetch("https://api.example.com/posts").then((r) => r.json());
  return posts.map((p: { slug: string }) => ({ slug: p.slug }));
}

export async function generateMetadata({ params }: Props) {
  const { slug } = await params;
  const post = await getPost(slug);
  return { title: post?.title ?? "Not found" };
}

export default async function BlogPost({ params }: Props) {
  const { slug } = await params;
  const post = await getPost(slug);
  if (!post) notFound();
  return <article><h1>{post.title}</h1><p>{post.body}</p></article>;
}

async function getPost(slug: string) {
  const r = await fetch(`https://api.example.com/posts/${slug}`, { next: { revalidate: 60 } });
  return r.ok ? r.json() : null;
}
```

### Server Action দিয়ে form (validation ও revalidate সহ)
```tsx
// app/todos/actions.ts
"use server";
import { z } from "zod";
import { revalidatePath } from "next/cache";

const schema = z.object({ title: z.string().min(1) });

export async function addTodo(prev: unknown, formData: FormData) {
  const parsed = schema.safeParse({ title: formData.get("title") });
  if (!parsed.success) return { error: "Title দিন" };
  await db.todo.create({ data: parsed.data });
  revalidatePath("/todos");
  return { error: null };
}

// app/todos/form.tsx
"use client";
import { useActionState } from "react";
import { addTodo } from "./actions";

export function TodoForm() {
  const [state, action, pending] = useActionState(addTodo, { error: null });
  return (
    <form action={action}>
      <input name="title" />
      <button disabled={pending}>{pending ? "Saving..." : "Add"}</button>
      {state.error && <p>{state.error}</p>}
    </form>
  );
}
```

### Route Handler (GET ও POST) সহ API
```ts
// app/api/todos/route.ts
import { NextResponse } from "next/server";

export async function GET(req: Request) {
  const { searchParams } = new URL(req.url);
  const done = searchParams.get("done");
  const todos = await db.todo.findMany({ where: done ? { done: done === "true" } : {} });
  return NextResponse.json(todos);
}

export async function POST(req: Request) {
  const body = await req.json();
  if (!body.title) return NextResponse.json({ error: "title required" }, { status: 400 });
  const todo = await db.todo.create({ data: { title: body.title } });
  return NextResponse.json(todo, { status: 201 });
}
```

// middleware.ts
import { NextResponse, type NextRequest } from "next/server";

export function middleware(req: NextRequest) {
  const token = req.cookies.get("session")?.value;
  if (!token && req.nextUrl.pathname.startsWith("/dashboard")) {
    const url = new URL("/login", req.url);
    url.searchParams.set("from", req.nextUrl.pathname);

}

### Search page (URL এর search params দিয়ে, debounce সহ client input)
```tsx
// app/products/page.tsx (Server Component)
export default async function Products({ searchParams }: { searchParams: Promise<{ q?: string }> }) {
  const { q = "" } = await searchParams;
  const items = await searchProducts(q);
  return (
    <>
      <SearchBox />

    </>

// SearchBox.tsx
"use client";
import { useRouter, useSearchParams, usePathname } from "next/navigation";
import { useDebouncedCallback } from "use-debounce";

export function SearchBox() {
  const router = useRouter();
  const pathname = usePathname();
  const params = useSearchParams();
  const onChange = useDebouncedCallback((term: string) => {
    const p = new URLSearchParams(params);
    term ? p.set("q", term) : p.delete("q");
    router.replace(`${pathname}?${p.toString()}`);
  }, 300);
  return <input defaultValue={params.get("q") ?? ""} onChange={(e) => onChange(e.target.value)} />;
}
```
